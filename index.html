  container.querySelector('#coaNewEquity').addEventListener('click', () => coaOpenNewEquityModal());
}

const coaChartRevenueAccounts = [
  { code: '4000', name: 'Export Sales Revenue', controlType: null },
  { code: '4100', name: 'Local Sales Revenue', controlType: null },
  { code: '4200', name: 'Sample & Other Income', controlType: null },

];

const COA_REV_CHART_CONTROL_TYPES = ['All Control Types', 'General'];

const coaRevChartState = { q: '', type: 'All Types', controlType: 'All Control Types', page: 1 };

function coaRevChartFilteredAccounts() {
  const q = coaRevChartState.q.trim().toLowerCase();

    if (coaRevChartState.controlType !== 'All Control Types' && coaRevChartState.controlType !== 'General') return false;

}

function coaRevChartFilterBar() {
  const optionsHtml = (list, selected) => list.map(v => `<option value="${escapeHtml(v)}" ${v === selected ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>

}

function coaRevChartParentLabel(a) {
  if (!a.parent) return 'Root';

  return p ? `${p.code} — ${p.name}` : 'Root';

function coaRevChartAccountRow(a, n) {

      <td class="px-3 py-2 whitespace-nowrap"><span class="inline-flex items-center px-2 py-0.5 rounded-full fs-small font-semibold bg-side-active text-side-accent whitespace-nowrap">Posting</span></td>
      <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap">Credit</td>

function coaRevChartAccountsResultsHtml() {
  const all = coaRevChartFilteredAccounts();

  coaRevChartState.page = Math.min(Math.max(1, coaRevChartState.page), totalPages);
  const start = (coaRevChartState.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Code', 'Account Name', 'Type', 'Normal Balance', 'Control Type', 'Parent', 'Actions'];

  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[940px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, idx) => `<th class="${idx === 0 ? 'pl-4 pr-2' : idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((a, i) => coaRevChartAccountRow(a, start + i + 1)).join('') : `<tr><td colspan="8" class="px-4 py-10 text-center"><p class="text-body text-muted">No accounts match your search.</p></td></tr>`}</tbody>

    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      <div class="flex items-center gap-1.5">
        <button data-coarevchartpage="prev" ${coaRevChartState.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coarevchartpage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === coaRevChartState.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coarevchartpage="next" ${coaRevChartState.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
      </div>
    </div>`;
}

function coaRevChartAccountsCard() {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex flex-wrap items-start justify-between gap-3 p-4">
        <div>
          <h3 class="text-section-title text-primary">Revenue — Chart of Accounts</h3>
          <p id="coaRevChartCounter" class="text-helper text-muted mt-0.5">${coaRevChartFilteredAccounts().length} of ${coaChartRevenueAccounts.length} GL accounts · normal balance: credit</p>
        </div>
        <button type="button" id="coaRevChartAddAccount" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Account</button>
      </div>
      <div id="coaRevChartAccountsResults">${coaRevChartAccountsResultsHtml()}</div>
    </section>`;
}

function coaRevChartAccountsRefreshResults() {
  const results = document.getElementById('coaRevChartAccountsResults');
  if (results) results.innerHTML = coaRevChartAccountsResultsHtml();
  const counter = document.getElementById('coaRevChartCounter');
  if (counter) counter.textContent = `${coaRevChartFilteredAccounts().length} of ${coaChartRevenueAccounts.length} GL accounts · normal balance: credit`;
}

function coaRevChartAccountsBindEvents(container) {
  const input = container.querySelector('#coaRevChartSearch');
  if (!input) return;
  input.addEventListener('input', (e) => {
    coaRevChartState.q = e.target.value;
    coaRevChartState.page = 1;
    coaRevChartAccountsRefreshResults();
  });

  container.querySelector('#coaRevChartType').addEventListener('change', (e) => {
    coaRevChartState.type = e.target.value;
    coaRevChartState.page = 1;
    coaRevChartAccountsRefreshResults();
  });

  container.querySelector('#coaRevChartControlType').addEventListener('change', (e) => {
    coaRevChartState.controlType = e.target.value;
    coaRevChartState.page = 1;
    coaRevChartAccountsRefreshResults();
  });

  container.querySelector('#coaRevChartAddAccount').addEventListener('click', () => coaOpenNewRevenueAccountModal());

  container.querySelector('#coaRevChartAccountsResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coarevchartpage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaRevChartFilteredAccounts().length / COA_PAGE_SIZE));
    if (btn.dataset.coarevchartpage === 'prev') coaRevChartState.page = Math.max(1, coaRevChartState.page - 1);
    else if (btn.dataset.coarevchartpage === 'next') coaRevChartState.page = Math.min(totalPages, coaRevChartState.page + 1);
    else coaRevChartState.page = +btn.dataset.coarevchartpage;
    coaRevChartAccountsRefreshResults();
  });
}

function coaRevChartNextCode() {
  const max = coaChartRevenueAccounts.reduce((m, a) => Math.max(m, parseInt(a.code, 10) || 0), 0);
  return String(max + 10);
}

function coaOpenNewRevenueAccountModal() {
  if (document.getElementById('coaRevAccountModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const nextCode = coaRevChartNextCode();

  const wrap = document.createElement('div');
  wrap.id = 'coaRevAccountModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new account');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[560px] px-4">
      <form id="coaRevAccountForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">New Account</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0 sm:col-span-2">${biLabel('Parent Account')}
            <select name="parent" class="${COA_INPUT}">
              <option value="">— None / Root (top-level Revenue head) —</option>
              ${coaChartRevenueAccounts.map(a => `<option value="${escapeHtml(a.code)}">${escapeHtml(a.code)} — ${escapeHtml(a.name)}</option>`).join('')}
            </select></label>
          <label class="block min-w-0">${biLabel('Account Code', { req: true })}
            <input name="code" type="text" autocomplete="off" value="${escapeHtml(nextCode)}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Account Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Royalty Income" class="${COA_INPUT}" /></label>
          <p id="coaRevAccountModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaRevAccountForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaRevAccountModalMsg');
    if (!val('code') || !val('name')) {
      msg.textContent = 'Account Code and Account Name are required.';
      return;
    }
    if (coaChartRevenueAccounts.some(a => a.code === val('code'))) {
      msg.textContent = 'An account with this code already exists.';
      return;
    }
    coaChartRevenueAccounts.push({ code: val('code'), name: val('name'), controlType: null, parent: val('parent') || null });
    coaChartRevenueAccounts.sort((a, b) => a.code.localeCompare(b.code));
    done();
    coaRevChartAccountsRefreshResults();
  });

  const first = form.querySelector('input[name="code"]');
  if (first) first.focus();
}

const COA_REVENUE_CATEGORIES = ['All Categories', 'Export Sales', 'Local Sales', 'Sample Income', 'Other Income'];
const COA_REVENUE_PARTIES = ['All Buyers', 'Everest Apparels Ltd.', 'Metro Fashion House', 'Northline Buying House'];
const COA_REVENUE_STATUSES = ['All Statuses', 'Recognized', 'Pending', 'Cancelled'];
const COA_REVENUE_PERIODS = ['Current Period', 'Last Month', 'Last Quarter', 'Last Year'];

const coaRevenueItems = [
  { code: 'REV-0001', name: 'Export Shipment — SHP-2201', category: 'Export Sales', party: 'Everest Apparels Ltd.', date: '18-May-2023', amount: 4500000, status: 'Recognized' },
  { code: 'REV-0002', name: 'Local Sale — Invoice 118', category: 'Local Sales', party: 'Metro Fashion House', date: '02-Jun-2023', amount: 620000, status: 'Recognized' },
  { code: 'REV-0003', name: 'Sample Order Income', category: 'Sample Income', party: 'Northline Buying House', date: '20-Jun-2023', amount: 85000, status: 'Pending' },
];

const coaRevenueFilter = { q: '', category: 'All Categories', party: 'All Buyers', status: 'All Statuses', page: 1 };

function coaRevenueStatusPill(status) {
  const map = {
    Recognized: ['successSoft', 'success'], Pending: ['warningSoft', 'warning'], Cancelled: ['dangerSoft', 'danger'],
  };
  const [bg, fg] = map[status] || map.Recognized;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaFilteredRevenue() {
  const f = coaRevenueFilter;
  const q = f.q.trim().toLowerCase();
  return coaRevenueItems.filter(it => {
    if (q && !(it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && it.category !== f.category) return false;
    if (f.party !== 'All Buyers' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && it.status !== f.status) return false;
    return true;
  });
}

function coaExpenseResultsHtml() {
  const all = coaFilteredExpenses();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  coaExpenseFilter.page = Math.min(Math.max(1, coaExpenseFilter.page), totalPages);
  const start = (coaExpenseFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Code', 'Name', 'Expense Category', 'Vendor / Department', 'Date', 'Amount (BDT)', 'Status', 'Actions'];

  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[1000px]">
        <thead><tr class="border-b border-side-line">
          <th class="pl-4 pr-2 py-2.5"><input id="coaExpenseSelectAll" type="checkbox" class="w-3.5 h-3.5 rounded border-side-border" /></th>
          ${headers.map((h, idx) => `<th class="${idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${idx === 6 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((it, i) => coaExpenseRow(it, start + i + 1)).join('') : `<tr><td colspan="10" class="px-4 py-10 text-center"><p class="text-body text-muted">No expense entries match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      <div class="flex items-center gap-1.5">
        <button data-coapage="prev" ${coaExpenseFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === coaExpenseFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coapage="next" ${coaExpenseFilter.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
      </div>
    </div>`;
}

function coaExpenseListCard() {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex items-center justify-between gap-3 p-4">
        <h3 class="text-section-title text-primary">Expenses List</h3>
        <button type="button" id="coaNewExpense" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Expense Entry</button>
      </div>
      <div id="coaExpenseResults">${coaExpenseResultsHtml()}</div>
    </section>`;
}

function coaRenderExpenses(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${coaExpChartFilterBar()}
      ${coaExpChartAccountsCard()}
      ${coaExpenseFilterBar()}
      ${coaExpenseListCard()}
    </div>`;
  coaExpChartAccountsBindEvents(container);
  coaExpenseBindEvents(container);
}

function coaExpenseRefreshResults() {
  const el = document.getElementById('coaExpenseResults');
  if (el) el.innerHTML = coaExpenseResultsHtml();
}

function coaExpenseBindEvents(container) {
  container.querySelector('#coaExpenseSearch').addEventListener('input', (e) => {
    coaExpenseFilter.q = e.target.value;
    coaExpenseFilter.page = 1;
    coaExpenseRefreshResults();
  });
  ['coaExpenseCategory', 'coaExpenseParty', 'coaExpenseStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaExpenseCategory' ? 'category' : id === 'coaExpenseParty' ? 'party' : 'status';
      coaExpenseFilter[key] = e.target.value;
      coaExpenseFilter.page = 1;
      coaExpenseRefreshResults();
    });
  });

  container.querySelector('#coaExpenseResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredExpenses().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaExpenseFilter.page = Math.max(1, coaExpenseFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaExpenseFilter.page = Math.min(totalPages, coaExpenseFilter.page + 1);
    else coaExpenseFilter.page = +btn.dataset.coapage;
    coaExpenseRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaExpenseSelectAll') return;
    container.querySelectorAll('#coaExpenseResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewExpense').addEventListener('click', () => coaOpenNewExpenseModal());
}

function coaExpenseNextCode() {
  const max = coaExpenseItems.reduce((m, it) => Math.max(m, parseInt((it.code.split('-')[1] || '0'), 10) || 0), 0);
  return `EXP-${String(max + 1).padStart(4, '0')}`;
}

function coaOpenNewExpenseModal() {
  if (document.getElementById('coaExpenseModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const nextCode = coaExpenseNextCode();
  const today = new Date().toISOString().slice(0, 10);

  const wrap = document.createElement('div');
  wrap.id = 'coaExpenseModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new expense entry');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[620px] px-4">
      <form id="coaExpenseForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">New Expense Entry</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0">${biLabel('Code')}
            <input name="code" type="text" value="${escapeHtml(nextCode)}" readonly class="${COA_INPUT} tabular bg-side-bg/60 text-muted" /></label>
          <label class="block min-w-0">${biLabel('Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Office Rent — July" class="${COA_INPUT}" /></label>
          <label class="block min-w-0">${biLabel('Expense Category')}
            <select name="category" class="${COA_INPUT}">${COA_EXPENSE_CATEGORIES.slice(1).map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></label>
          <label class="block min-w-0">${biLabel('Vendor / Department')}
            <select name="party" class="${COA_INPUT}">${COA_EXPENSE_PARTIES.slice(1).map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select></label>
          <label class="block min-w-0">${biLabel('Date')}
            <input name="date" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Amount (BDT)', { req: true })}
            <input name="amount" type="number" min="0" step="1" placeholder="0" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Status')}
            <select name="status" class="${COA_INPUT}">${COA_EXPENSE_STATUSES.slice(1).map(s => `<option value="${escapeHtml(s)}" ${s === 'Pending' ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select></label>
          <p id="coaExpenseModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Expense Entry</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaExpenseForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaExpenseModalMsg');
    if (!val('name') || !val('amount')) {
      msg.textContent = 'Name and Amount are required.';
      return;
    }
    coaExpenseItems.push({
      code: val('code'),
      name: val('name'),
      category: val('category'),
      party: val('party'),
      date: coaFormatDateDisplay(val('date')),
      amount: Number(val('amount')) || 0,
      status: val('status'),
    });
    done();
    coaExpenseFilter.page = 1;
    coaExpenseRefreshResults();
  });

  const first = form.querySelector('input[name="name"]');
  if (first) first.focus();
}

const COA_CASHBANK_TYPES = ['All Types', 'Cash', 'Bank'];
const COA_CASHBANK_CURRENCIES = ['All Currencies', 'BDT', 'USD', 'EUR', 'GBP'];
const COA_CASHBANK_STATUSES = ['All Statuses', 'Active', 'Inactive'];

const coaCashBankFilter = { q: '', type: 'All Types', currency: 'All Currencies', status: 'All Statuses', page: 1 };

function coaCashBankNextCode() {
  const max = coaCashBankAccounts.reduce((m, a) => Math.max(m, parseInt((a.code.split('-')[1] || '0'), 10) || 0), 0);
  return `CB-${String(max + 1).padStart(4, '0')}`;
}

function coaFilteredCashBank() {
  const f = coaCashBankFilter;
  const q = f.q.trim().toLowerCase();
  return coaCashBankAccounts.filter(a => {
    if (q && !(a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q) || (a.bankName || '').toLowerCase().includes(q) || (a.accountNo || '').toLowerCase().includes(q))) return false;
    if (f.type !== 'All Types' && a.type !== f.type) return false;
    if (f.currency !== 'All Currencies' && a.currency !== f.currency) return false;
    if (f.status !== 'All Statuses' && a.status !== f.status) return false;
    return true;
  });
}

function coaCashBankStatusPill(status) {
  const map = { Active: ['successSoft', 'success'], Inactive: ['neutralSoft', 'neutral'] };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaCashBankTypeBadge(type) {
  const map = { Cash: ['warningSoft', 'warning'], Bank: ['infoSoft', 'info'] };
  const [bg, fg] = map[type] || map.Cash;
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg} whitespace-nowrap">${escapeHtml(type)}</span>`;
}

const COA_CASHBANK_STAT_CASH_ICON = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M16 13h.01M3 10h18"/></svg>';
const COA_CASHBANK_STAT_BANK_ICON = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M4 10v9M20 10v9M8 10v9M16 10v9M2 21h20"/></svg>';

function coaCashBankStatCard(iconHtml, value, label) {

function coaCashBankSummaryCards() {
  let cashTotal = 0, bankTotal = 0, activeCount = 0;

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaInt(cashTotal), 'Total Cash-in-Hand')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_BANK_ICON, coaInt(bankTotal), 'Total Bank Balance')}

function coaCashBankRefreshResults() {
  const el = document.getElementById('coaCashBankResults');
  if (el) el.innerHTML = coaCashBankResultsHtml();
}

function coaCashBankBindEvents(container) {
  container.querySelector('#coaCashBankSearch').addEventListener('input', (e) => {
    coaCashBankFilter.q = e.target.value;
    coaCashBankFilter.page = 1;
    coaCashBankRefreshResults();
  });
  ['coaCashBankType', 'coaCashBankCurrency', 'coaCashBankStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaCashBankType' ? 'type' : id === 'coaCashBankCurrency' ? 'currency' : 'status';
      coaCashBankFilter[key] = e.target.value;
      coaCashBankFilter.page = 1;
      coaCashBankRefreshResults();
    });
  });

  container.querySelector('#coaCashBankResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredCashBank().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaCashBankFilter.page = Math.max(1, coaCashBankFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaCashBankFilter.page = Math.min(totalPages, coaCashBankFilter.page + 1);
    else coaCashBankFilter.page = +btn.dataset.coapage;
    coaCashBankRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaCashBankSelectAll') return;
    container.querySelectorAll('#coaCashBankResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewCashBank').addEventListener('click', () => coaOpenNewCashBankModal());
}

            <label class="block min-w-0">${biLabel('Account Number')}

          </div>
          <label class="block min-w-0">${biLabel('Currency')}

          <label class="block min-w-0">${biLabel('Opening Balance', { req: true })}
            <input name="openingBalance" type="number" min="0" step="1" placeholder="0" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Opening Date')}
            <input name="openedDate" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Status')}
            <select name="status" class="${COA_INPUT}">${COA_CASHBANK_STATUSES.slice(1).map(s => `<option value="${escapeHtml(s)}" ${s === 'Active' ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select></label>

    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaCashBankForm');
  const bankFields = wrap.querySelector('#coaCashBankBankFields');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  wrap.querySelector('#coaCashBankFormType').addEventListener('change', (e) => {
    bankFields.classList.toggle('hidden', e.target.value !== 'Bank');
  });

  form.addEventListener('submit', (e) => {

    const val = (n) => (form.elements[n].value || '').trim();

    if (!val('name') || !val('openingBalance')) {
      msg.textContent = 'Account Name and Opening Balance are required.';

    const isBank = val('type') === 'Bank';
    const opening = Number(val('openingBalance')) || 0;
    coaCashBankAccounts.push({

      name: val('name'),

      currentBalance: opening,
      openedDate: coaFormatDateDisplay(val('openedDate')),
      status: val('status'),
    });
    done();
    coaCashBankFilter.page = 1;
    coaCashBankRefreshResults();
  });

  const first = form.querySelector('input[name="name"]');
  if (first) first.focus();
}

  const debit = vmForm.lines.reduce((s, l) => s + coaNum(l.debit), 0);

  return { debit, credit, balanced: debit > 0 && Math.abs(debit - credit) < 0.005 };
}

function renderVoucherManagement(tabsEl, container) {
  tabsEl.classList.remove('hidden');
  tabsEl.innerHTML = `
    <div class="flex items-center gap-1 -mb-px pb-px overflow-x-auto overflow-y-hidden">
      ${VM_TABS.map((t, i) => `

    </div>`;
  tabsEl.querySelectorAll('[data-vmtab]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tabIndex = +btn.dataset.vmtab;
      renderVoucherManagement(tabsEl, container);
    });
  });

  document.getElementById('page-actions').innerHTML = '';

  const key = VM_ORDER[state.tabIndex];
  const cfg = VM_TYPES[key];
  if (key === 'payable' || key === 'receivable') { vmActiveKey = null; vmRenderApAr(container, key); return; }
  if (!cfg) { vmActiveKey = null; coaRenderComingSoon(container, VM_TABS[state.tabIndex]); return; }
  if (key !== vmActiveKey) { vmResetForm(); vmActiveKey = key; }
  vmRenderForm(container, key, cfg);
}

function vmFooterButtons() {

function vmSetMsg(text, tone) {

function vmRecentCard(key, cfg) {

function vmRenderForm(container, key, cfg) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${vmHeaderCard(key, cfg)}
      ${vmEntriesCard(cfg)}
      ${vmFooterButtons()}
      ${vmRecentCard(key, cfg)}
    </div>`;
  vmBindFormEvents(container, key, cfg);
}

function vmBindFormEvents(container, key, cfg) {
  container.querySelectorAll('[data-vmf]').forEach(el => {
    el.addEventListener('input', () => { vmForm[el.dataset.vmf] = el.value; });
    el.addEventListener('change', () => { vmForm[el.dataset.vmf] = el.value; });
  });
  container.querySelectorAll('[data-vmfx]').forEach(el => {
    el.addEventListener('input', () => { vmForm.extra[el.dataset.vmfx] = el.value; });
    el.addEventListener('change', () => { vmForm.extra[el.dataset.vmfx] = el.value; });
  });

  const body = container.querySelector('#vmLinesBody');

  function refreshTotals() {
    const bar = container.querySelector('#vmTotalsBar');
    if (bar) bar.innerHTML = vmTotalsInner(cfg);
  }

  body.addEventListener('input', (e) => {
    const row = e.target.closest('[data-vline]');
    if (!row || !e.target.dataset.vmline) return;
    vmForm.lines[+row.dataset.vline][e.target.dataset.vmline] = e.target.value;
    if (e.target.dataset.vmline === 'debit' || e.target.dataset.vmline === 'credit') refreshTotals();
  });
  body.addEventListener('change', (e) => {
    const row = e.target.closest('[data-vline]');
    if (!row || !e.target.dataset.vmline) return;
    vmForm.lines[+row.dataset.vline][e.target.dataset.vmline] = e.target.value;
  });

  body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-vmdel]');
    if (!btn) return;
    if (vmForm.lines.length <= 1) return;
    vmForm.lines.splice(+btn.dataset.vmdel, 1);
    body.innerHTML = vmForm.lines.map(vmLineRow).join('');
    refreshTotals();
  });

  container.querySelector('#vmAddLine').addEventListener('click', () => {
    vmForm.lines.push({ account: '', debit: '0.00', credit: '0.00', description: '' });
    body.innerHTML = vmForm.lines.map(vmLineRow).join('');
    refreshTotals();
  });

  container.querySelector('#vmResetBtn').addEventListener('click', () => {
    vmResetForm();
    vmRenderForm(container, key, cfg);
  });

  container.querySelector('#vmPostBtn').addEventListener('click', () => {
    const validLines = vmForm.lines.filter(l => l.account && (coaNum(l.debit) > 0 || coaNum(l.credit) > 0));
    // Balance is checked on the lines that will actually be posted, so a line with an amount but
    // no account can't leave the ledger out of balance.
    const t = {
      debit: validLines.reduce((sum, l) => sum + coaNum(l.debit), 0),
      credit: validLines.reduce((sum, l) => sum + coaNum(l.credit), 0),
    };
    t.balanced = t.debit > 0 && Math.abs(t.debit - t.credit) < 0.005;
    if (validLines.length < 2) {
      vmSetMsg('Add at least two lines, each with an account and an amount.', 'danger');
      return;
    }
    if (!t.balanced) {
      vmSetMsg('Total debit must equal total credit before posting.', 'danger');
      return;
    }
    const voucherNo = vmNextVoucherNo(key, cfg);
    coaPostToLedger({ date: vmForm.date, ref: voucherNo, memo: vmForm.memo || (vmForm.party ? `${cfg.title} — ${vmForm.party}` : cfg.title), lines: validLines });
    vmEntries[key].push({
      date: biFromISO(vmForm.date) || vmForm.date,
      voucherNo,
      party: vmForm.party || '',
      memo: vmForm.memo || (vmForm.party ? `${cfg.title} — ${vmForm.party}` : cfg.title),
      amount: t.debit,
      status: 'Posted',
    });
    vmResetForm();
    vmRenderForm(container, key, cfg);
    vmSetMsg(`${voucherNo} posted successfully.`, 'success');
  });
}

// ---------- Accounts Payable / Accounts Receivable ----------
// Content ported from the Finance reference build's combined Payable/Receivable register
// (the last two tabs of Voucher Management). Styled with the same summary-card / filter-bar /
// paginated-table / modal conventions Chart of Accounts > Cash & Bank already established,
// rather than the voucher-posting form used by the other Voucher Management tabs.
const AP_AR_TYPES = {
  payable: { noun: 'Bill', docLabel: 'Bill No.', dateLabel: 'Bill Date', partyLabel: 'Supplier / Vendor', prefix: 'BILL', actionLabel: 'Pay', actionVerb: 'Record Payment', paidLabel: 'Total Paid' },
  receivable: { noun: 'Invoice', docLabel: 'Invoice No.', dateLabel: 'Invoice Date', partyLabel: 'Customer / Buyer', prefix: 'INV', actionLabel: 'Receive', actionVerb: 'Record Receipt', paidLabel: 'Total Received' },
};

const apArItems = {
  payable: [
    { code: 'BILL-0001', party: 'ABC Textiles Ltd.', docDate: '2026-08-02', dueDate: '2026-09-01', ref: 'PO-2031', amount: 875000, paid: 0, memo: 'Fabric supply — August shipment' },
    { code: 'BILL-0002', party: 'Prime Dyeing & Finishing', docDate: '2026-08-10', dueDate: '2026-08-25', ref: 'PO-2044', amount: 412500, paid: 150000, memo: 'Dyeing charges — Style STY-118' },
    { code: 'BILL-0003', party: 'City Bank PLC', docDate: '2026-07-15', dueDate: '2026-08-15', ref: 'LOAN-INT-08', amount: 65000, paid: 0, memo: 'Loan interest — August' },
  ],
  receivable: [
    { code: 'INV-0001', party: 'Everest Apparels Ltd.', docDate: '2026-08-05', dueDate: '2026-09-04', ref: 'SC-4471', amount: 4500000, paid: 2000000, memo: 'Export shipment SHP-2201' },
    { code: 'INV-0002', party: 'Metro Fashion House', docDate: '2026-08-20', dueDate: '2026-09-05', ref: 'SO-118', amount: 620000, paid: 620000, memo: 'Local sale — Invoice 118' },
    { code: 'INV-0003', party: 'Northline Buying House', docDate: '2026-07-10', dueDate: '2026-07-25', ref: 'SMP-77', amount: 85000, paid: 0, memo: 'Sample order income' },
  ],
};

const apArFilter = {
  payable: { q: '', party: 'All Parties', status: 'All Statuses', period: 'All', page: 1 },
  receivable: { q: '', party: 'All Parties', status: 'All Statuses', period: 'All', page: 1 },
};

const AP_AR_ICON_OUTSTANDING = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
const AP_AR_ICON_OVERDUE = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v4M12 15h.01"/></svg>';
const AP_AR_ICON_DUESOON = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';

function apArBalance(it) {
  return Math.max(0, (it.amount || 0) - (it.paid || 0));
}

function apArStatus(it) {
  const bal = apArBalance(it);
  if (bal <= 0) return 'Paid';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(it.dueDate + 'T00:00:00');
  if (due < today) return 'Overdue';
  if (it.paid > 0) return 'Partially Paid';
  return 'Unpaid';
}

function apArStatusPill(status) {
  const map = { Paid: ['successSoft', 'success'], 'Partially Paid': ['infoSoft', 'info'], Unpaid: ['warningSoft', 'warning'], Overdue: ['dangerSoft', 'danger'] };
  const [bg, fg] = map[status] || map.Unpaid;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function apArNextCode(key) {
  const cfg = AP_AR_TYPES[key];
  const max = apArItems[key].reduce((m, it) => Math.max(m, parseInt((it.code.split('-')[1] || '0'), 10) || 0), 0);
  return `${cfg.prefix}-${String(max + 1).padStart(4, '0')}`;
}

function apArPartyOptions(key) {
  return Array.from(new Set(apArItems[key].map(i => i.party))).sort();
}

function apArFiltered(key) {
  const f = apArFilter[key];
  const q = f.q.trim().toLowerCase();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return apArItems[key].filter(it => {
    const status = apArStatus(it);
    if (q && !(it.code.toLowerCase().includes(q) || it.party.toLowerCase().includes(q) || (it.ref || '').toLowerCase().includes(q))) return false;
    if (f.party !== 'All Parties' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && status !== f.status) return false;
    if (f.period !== 'All') {
      const due = new Date(it.dueDate + 'T00:00:00');
      const diffDays = (due - today) / 86400000;
      const bal = apArBalance(it);
      if (f.period === 'Overdue' && !(diffDays < 0 && bal > 0)) return false;
      if (f.period === 'Due in 7 Days' && !(diffDays >= 0 && diffDays <= 7 && bal > 0)) return false;
      if (f.period === 'Due in 30 Days' && !(diffDays >= 0 && diffDays <= 30 && bal > 0)) return false;
    }
    return true;
  });
}

function apArSummaryCards(key) {
  const cfg = AP_AR_TYPES[key];
  const items = apArItems[key];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let outstanding = 0, overdue = 0, dueSoon = 0, paidTotal = 0;
  items.forEach(it => {
    const bal = apArBalance(it);
    paidTotal += (it.paid || 0);
    if (bal > 0) {
      outstanding += bal;
      const due = new Date(it.dueDate + 'T00:00:00');
      const diffDays = (due - today) / 86400000;
      if (diffDays < 0) overdue += bal;
      else if (diffDays <= 7) dueSoon += bal;
    }
  });
  const label = key === 'payable' ? 'Payable' : 'Receivable';
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(AP_AR_ICON_OUTSTANDING, coaInt(outstanding), `Total Outstanding ${label}`)}
      ${coaCashBankStatCard(AP_AR_ICON_OVERDUE, coaInt(overdue), 'Overdue Amount')}
      ${coaCashBankStatCard(AP_AR_ICON_DUESOON, coaInt(dueSoon), 'Due in Next 7 Days')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, coaInt(paidTotal), cfg.paidLabel)}
    </div>`;
}

function apArFilterBar(key) {
  const cfg = AP_AR_TYPES[key];
  const f = apArFilter[key];
  const parties = ['All Parties', ...apArPartyOptions(key)];
  const statuses = ['All Statuses', 'Unpaid', 'Partially Paid', 'Paid', 'Overdue'];
  const periods = ['All', 'Overdue', 'Due in 7 Days', 'Due in 30 Days'];
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="apArSearch" type="text" value="${escapeHtml(f.q)}" placeholder="Search ${cfg.noun.toLowerCase()} no. or party…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField(cfg.partyLabel, `<select id="apArParty" class="${COA_INPUT}">${parties.map(p => `<option value="${escapeHtml(p)}" ${p === f.party ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}</select>`)}
        ${coaField('Status', `<select id="apArStatus" class="${COA_INPUT}">${statuses.map(s => `<option value="${escapeHtml(s)}" ${s === f.status ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select>`)}
        ${coaField('Due', `<select id="apArPeriod" class="${COA_INPUT}">${periods.map(p => `<option value="${escapeHtml(p)}" ${p === f.period ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}</select>`)}
      </div>
    </section>`;
}

function apArRow(key, it, n) {
  const cfg = AP_AR_TYPES[key];
  const bal = apArBalance(it);
  const status = apArStatus(it);
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base font-medium text-primary tabular">${escapeHtml(it.code)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(it.ref || '—')}</p>
      </td>
      <td class="px-3 py-2.5 min-w-[190px]">
        <p class="fs-base text-primary">${escapeHtml(it.party)}</p>
        <div class="mt-1.5">${apArStatusPill(status)}</div>
      </td>
      <td class="px-3 py-2.5 whitespace-nowrap tabular">
        <p class="fs-base text-secondary">${coaFormatDateDisplay(it.docDate)}</p>
        <p class="text-helper text-muted mt-0.5">Due ${coaFormatDateDisplay(it.dueDate)}</p>
      </td>
      <td class="px-3 py-2.5 fs-base text-primary font-semibold whitespace-nowrap tabular text-right">${coaInt(it.amount)}</td>
      <td class="px-3 py-2.5 whitespace-nowrap text-right tabular">
        <p class="fs-base text-secondary">${coaInt(it.paid)} <span class="text-helper text-muted">paid</span></p>
        <p class="fs-base font-semibold mt-0.5 ${bal > 0 ? 'text-danger' : 'text-success'}">${coaInt(bal)} <span class="text-helper font-normal text-muted">due</span></p>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        ${bal > 0 ? `<button type="button" data-apar-pay="${escapeHtml(it.code)}" class="h-7 px-2.5 rounded border border-side-accent/40 text-side-accent fs-small font-semibold hover:bg-side-active mr-1.5">${escapeHtml(cfg.actionLabel)}</button>` : ''}
        <button type="button" data-apar-remove="${escapeHtml(it.code)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>
      </td>
    </tr>`;
}

function apArResultsHtml(key) {
  const cfg = AP_AR_TYPES[key];
  const f = apArFilter[key];
  const all = apArFiltered(key);
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  f.page = Math.min(Math.max(1, f.page), totalPages);
  const start = (f.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', `${cfg.docLabel} / Reference`, `${cfg.partyLabel} / Status`, `${cfg.dateLabel} / Due`, 'Amount (BDT)', 'Paid / Balance (BDT)', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, idx) => `<th class="${idx === 0 ? 'pl-4 pr-2' : idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${idx >= 4 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((it, i) => apArRow(key, it, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No ${cfg.noun.toLowerCase()}s match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>

        <button data-aparpage="prev" ${f.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-aparpage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === f.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-aparpage="next" ${f.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
      </div>
    </div>`;
}

function apArListCard(key) {
  const cfg = AP_AR_TYPES[key];

  apArBindEvents(container, key);
}

function apArRefresh(container, key) {
  const results = container.querySelector('#apArResults');
  if (results) results.innerHTML = apArResultsHtml(key);
  const counter = container.querySelector('#apArCounter');
  if (counter) {
    const cfg = AP_AR_TYPES[key];
    const all = apArFiltered(key);
    counter.textContent = `${all.length} of ${apArItems[key].length} ${cfg.noun.toLowerCase()}${apArItems[key].length === 1 ? '' : 's'}`;
  }
}

function apArBindEvents(container, key) {
  const f = apArFilter[key];

  container.querySelector('#apArSearch').addEventListener('input', (e) => {
    f.q = e.target.value; f.page = 1; apArRefresh(container, key);
  });
  container.querySelector('#apArParty').addEventListener('change', (e) => {
    f.party = e.target.value; f.page = 1; apArRefresh(container, key);
  });
  container.querySelector('#apArStatus').addEventListener('change', (e) => {
    f.status = e.target.value; f.page = 1; apArRefresh(container, key);
  });
  container.querySelector('#apArPeriod').addEventListener('change', (e) => {
    f.period = e.target.value; f.page = 1; apArRefresh(container, key);
  });

  container.querySelector('#apArResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-aparpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(apArFiltered(key).length / COA_PAGE_SIZE));
      if (pageBtn.dataset.aparpage === 'prev') f.page = Math.max(1, f.page - 1);
      else if (pageBtn.dataset.aparpage === 'next') f.page = Math.min(totalPages, f.page + 1);
      else f.page = +pageBtn.dataset.aparpage;
      apArRefresh(container, key);
      return;
    }
    const payBtn = e.target.closest('[data-apar-pay]');
    if (payBtn) { apArOpenPayModal(key, payBtn.dataset.aparPay, container); return; }
    const removeBtn = e.target.closest('[data-apar-remove]');
    if (removeBtn) {
      apArItems[key] = apArItems[key].filter(it => it.code !== removeBtn.dataset.aparRemove);
      apArRefresh(container, key);
    }
  });

  container.querySelector('#apArNew').addEventListener('click', () => apArOpenNewModal(key, container));
}

// ---------- General Entry ----------
// Content ported from the Finance reference build's General Entry page: a single-sided cash /
// bank transaction (Payment or Receive) posted against one Chart of Accounts head, with an
// optional party when that head's control type calls for one. Accounts are read live from the
// Chart of Accounts and Cash & Bank tabs rather than duplicated here.
const GE_DIRECTIONS = ['Payment', 'Receive'];

const GE_CHART_GROUPS = () => coaCategoryDefs().map(c => [c.label, c.list]);

// Which accounts need a party picker is read from the control type stored on the account, never
// guessed from its name. Receivable/payable parties come from the AP/AR registers; the rest
// have no register yet, so they use the same fallback lists as the reference build.
const GE_PARTY_CONFIG = {
  receivable: { label: 'Customer / Buyer', parties: () => apArPartyOptions('receivable') },
  payable: { label: 'Supplier / Vendor', parties: () => apArPartyOptions('payable') },
  loan_receivable: { label: 'Borrower', parties: () => ['Everest Apparels Ltd.', 'Northline Buying House'] },
  loan_payable: { label: 'Lender', parties: () => ['City Bank PLC', 'HSBC Bangladesh'] },
  investor: { label: 'Investor', parties: () => ['Mr. Karim Rahman'] },
};

const generalEntries = [];

const geForm = {
  date: new Date().toISOString().slice(0, 10),
  direction: '', bank: '', coa: '', party: '', amount: '', desc: '',
  msg: '', msgTone: 'muted',
};

function geResetForm() {
  geForm.date = new Date().toISOString().slice(0, 10);
  geForm.direction = ''; geForm.bank = ''; geForm.coa = ''; geForm.party = '';
  geForm.amount = ''; geForm.desc = '';
  geForm.msg = ''; geForm.msgTone = 'muted';
}

function geNextNo() {
  const year = new Date().getFullYear();
  const max = generalEntries
    .filter(e => e.entryNo.startsWith(`DE-${year}-`))
    .reduce((m, e) => Math.max(m, parseInt(e.entryNo.split('-')[2], 10) || 0), 0);
  return `DE-${year}-${String(max + 1).padStart(4, '0')}`;
}

function geFindAccount(value) {
  const code = String(value || '').split(' — ')[0].trim();
  for (const [, list] of GE_CHART_GROUPS()) {
    const acc = list.find(a => a.code === code);
    if (acc) return acc;
  }
  return null;
}

function gePartyConfig(coaValue) {
  const acc = geFindAccount(coaValue);
  return (acc && acc.controlType && GE_PARTY_CONFIG[acc.controlType]) || null;
}

function geSetMsg(text, tone) {
  geForm.msg = text || '';
  geForm.msgTone = tone || 'muted';
  const el = document.getElementById('geFormMsg');
  if (el) {
    el.textContent = geForm.msg;
    el.className = `${geForm.msg ? '' : 'hidden '}text-helper text-${geForm.msgTone} mr-auto`;
  }
}

function geDailyEntryCard() {

function geFooterButtons() {

function geRecentCard() {
  const headers = ['Entry No.', 'Date', 'Type', 'Cash / Bank', 'Account (CoA)', 'Amount (BDT)', 'Description'];

        <td class="pr-4 pl-3 py-2 fs-base text-secondary">${escapeHtml(e.description || '')}</td>
      </tr>`).join('')
    : `<tr><td colspan="${headers.length}" class="px-4 py-8 text-center fs-base text-muted">No general entries posted yet.</td></tr>`;
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex items-center gap-2.5 p-4">
        <span class="text-side-accent shrink-0">${COA_HISTORY_ICON}</span>
        <h3 class="text-section-title text-primary">Recent General Entries</h3>
      </div>
      <div class="overflow-x-auto border-t border-side-line">
        <table class="w-full min-w-[860px]">
          <thead><tr class="border-b border-side-line">
            ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i === 5 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
}

function renderGeneralEntry(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${geDailyEntryCard()}
      ${geAccountingCard()}
      ${geFooterButtons()}
      ${geRecentCard()}
    </div>`;
  geRefreshParty(container);
  geBindEvents(container);
}

// Enables the party picker only when the chosen account's control type defines one, and keeps
// the previously chosen party if it's still valid for that account.
function geRefreshParty(container) {
  const sel = container.querySelector('#gePartySelect');
  if (!sel) return;
  const cfg = gePartyConfig(geForm.coa);
  const parties = cfg ? cfg.parties() : [];
  if (cfg && parties.length) {
    if (!parties.includes(geForm.party)) geForm.party = '';
    sel.innerHTML = `<option value="">Select ${escapeHtml(cfg.label)}</option>${parties.map(p => `<option value="${escapeHtml(p)}" ${p === geForm.party ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}`;
    sel.disabled = false;
  } else {
    geForm.party = '';
    sel.innerHTML = '<option value="">Select Supplier / Customer</option>';
    sel.disabled = true;
  }
  sel.classList.toggle('opacity-60', sel.disabled);
  sel.classList.toggle('cursor-not-allowed', sel.disabled);
  geRefreshDue(container);
}

// Quick context before typing the amount: what is currently outstanding for the picked party
// (or the whole ledger until one is picked). Display only — not an editable value.
function geRefreshDue(container) {
  const acc = geFindAccount(geForm.coa);
  const type = acc ? acc.controlType : null;
  const due = (key) => apArItems[key]
    .filter(b => !geForm.party || b.party === geForm.party)
    .reduce((s, b) => s + apArBalance(b), 0);
  [['gePayableDue', 'payable'], ['geReceivableDue', 'receivable']].forEach(([id, key]) => {
    const el = container.querySelector('#' + id);
    if (!el) return;
    const active = type === key;
    el.textContent = active ? coaMoney(due(key)) : '—';
    el.classList.toggle('text-muted', !active);
    el.classList.toggle('text-primary', active);
    el.classList.toggle('font-semibold', active);
  });
}

function geBindEvents(container) {
  container.querySelectorAll('[data-gef]').forEach(el => {
    const handler = () => {
      geForm[el.dataset.gef] = el.value;
      if (el.dataset.gef === 'coa') { geForm.party = ''; geRefreshParty(container); }
      else if (el.dataset.gef === 'party') geRefreshDue(container);
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { geForm[el.dataset.gef] = el.value; });
  });

  container.querySelector('#geResetBtn').addEventListener('click', () => {
    geResetForm();
    renderGeneralEntry(container);
  });

  container.querySelector('#geSaveBtn').addEventListener('click', () => {
    const cfg = gePartyConfig(geForm.coa);
    const amount = coaNum(geForm.amount);
    if (!geForm.direction) return geSetMsg('Select Payment or Receive before saving.', 'danger');
    if (!geForm.bank) return geSetMsg('Select a Cash / Bank account before saving.', 'danger');
    if (!geForm.coa) return geSetMsg('Select an account from the Chart of Accounts before saving.', 'danger');
    if (cfg && !geForm.party) return geSetMsg(`Select a ${cfg.label} before saving.`, 'danger');
    if (amount <= 0) return geSetMsg('Enter a valid amount before saving.', 'danger');

    const entryNo = geNextNo();
    generalEntries.unshift({
      entryNo,
      type: geForm.direction,
      date: geForm.date,
      bankAccount: geForm.bank,
      coaAccount: geForm.coa + (geForm.party ? ` — ${geForm.party}` : ''),
      amount,
      description: geForm.desc.trim(),
    });
    geResetForm();
    renderGeneralEntry(container);
    geSetMsg(`General entry ${entryNo} posted successfully.`, 'success');
  });
}

// Taka amount in words, using the crore / lakh / thousand grouping Mushak forms use.
function vatNumberToWords(n) {
  n = Math.floor(Math.abs(n));
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
    'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (v) => v < 20 ? ones[v] : tens[Math.floor(v / 10)] + (v % 10 ? ' ' + ones[v % 10] : '');
  const three = (v) => {
    const h = Math.floor(v / 100), r = v % 100;
    return (h ? ones[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? two(r) : '');
  };
  if (n === 0) return 'Zero';
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const parts = [];
  if (crore) parts.push(three(crore) + ' Crore');
  if (lakh) parts.push(two(lakh) + ' Lakh');
  if (thousand) parts.push(two(thousand) + ' Thousand');
  if (n) parts.push(three(n));
  return parts.join(' ').trim();
}

function vatAmountInWords(amount) {
  const taka = Math.floor(amount);
  const poisha = Math.round((amount - taka) * 100);
  return 'Taka ' + vatNumberToWords(taka) + (poisha > 0 ? ' and ' + vatNumberToWords(poisha) + ' Poisha' : '') + ' Only';
}

function vatLineValue(it) { return (Number(it.quantity) || 0) * (Number(it.unitPrice) || 0); }
function vatItemsValue(items) { return (items || []).reduce((s, it) => s + vatLineValue(it), 0); }
function vatCalcFor(items, rate) {
  const taxable = vatItemsValue(items);
  const vatAmount = Math.round(taxable * (rate / 100) * 100) / 100;
  return { taxable, vatAmount, total: taxable + vatAmount };
}
function vatCalc(inv) { return vatCalcFor(inv.items, inv.vatRate); }

function vatNextChallanNo() {

}

function vatStatusPill(status) {

}

function vatFiltered() {

    if (vatFilter.rate !== 'All Rates' && `${v.vatRate}%` !== vatFilter.rate) return false;
    if (vatFilter.status !== 'All Statuses' && v.status !== vatFilter.status) return false;
