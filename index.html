          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0 sm:col-span-2">${biLabel('Parent Account')}
            <select name="parent" class="${COA_INPUT}">
              <option value="">— None / Root (top-level Assets head) —</option>
              ${coaChartAssetAccounts.map(a => `<option value="${escapeHtml(a.code)}">${escapeHtml(a.code)} — ${escapeHtml(a.name)}</option>`).join('')}
            </select></label>
          <label class="block min-w-0">${biLabel('Account Code', { req: true })}
            <input name="code" type="text" autocomplete="off" value="${escapeHtml(nextCode)}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Account Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Debtors — Retail" class="${COA_INPUT}" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Control Type')}
            <select name="controlType" class="${COA_INPUT}">
              ${COA_CHART_CONTROL_TYPES.slice(1).map(v => `<option value="${escapeHtml(v)}" ${v === 'General' ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}
            </select></label>
          <p id="coaAccountModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaAccountForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaAccountModalMsg');
    if (!val('code') || !val('name')) {
      msg.textContent = 'Account Code and Account Name are required.';
      return;
    }
    if (coaChartAssetAccounts.some(a => a.code === val('code'))) {
      msg.textContent = 'An account with this code already exists.';
      return;
    }
    const controlTypeLabel = val('controlType');
    const controlType = controlTypeLabel === 'Bank' ? 'bank'
      : controlTypeLabel === 'Accounts Receivable' ? 'receivable'
      : controlTypeLabel === 'Loan Receivable' ? 'loan_receivable'
      : null;
    coaChartAssetAccounts.push({ code: val('code'), name: val('name'), controlType, parent: val('parent') || null });
    coaChartAssetAccounts.sort((a, b) => a.code.localeCompare(b.code));
    done();
    coaChartAccountsRefreshResults();
  });

  const first = form.querySelector('input[name="code"]');
  if (first) first.focus();
}

function coaAssetNextCode() {
  const max = coaAssets.reduce((m, a) => Math.max(m, parseInt((a.code.split('-')[1] || '0'), 10) || 0), 0);

}

function coaFormatDateDisplay(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${String(d.getDate()).padStart(2, '0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
}

function coaLiabChartFilteredAccounts() {
  const q = coaLiabChartState.q.trim().toLowerCase();
  return coaChartLiabilityAccounts.filter(a => {
    if (q && !(a.code.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))) return false;
    if (coaLiabChartState.type !== 'All Types' && coaLiabChartState.type !== 'Posting') return false;

      const label = a.controlType ? COA_LIAB_CONTROL_TYPE_LABEL[a.controlType] : 'General';

  });
}

function coaLiabChartAccountsBindEvents(container) {
  const input = container.querySelector('#coaLiabChartSearch');
  if (!input) return;
  input.addEventListener('input', (e) => {
    coaLiabChartState.q = e.target.value;
    coaLiabChartState.page = 1;
    coaLiabChartAccountsRefreshResults();
  });

  container.querySelector('#coaLiabChartType').addEventListener('change', (e) => {
    coaLiabChartState.type = e.target.value;
    coaLiabChartState.page = 1;
    coaLiabChartAccountsRefreshResults();
  });

  container.querySelector('#coaLiabChartControlType').addEventListener('change', (e) => {
    coaLiabChartState.controlType = e.target.value;
    coaLiabChartState.page = 1;
    coaLiabChartAccountsRefreshResults();
  });

  container.querySelector('#coaLiabChartAddAccount').addEventListener('click', () => coaOpenNewLiabilityAccountModal());

  container.querySelector('#coaLiabChartAccountsResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coaliabchartpage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaLiabChartFilteredAccounts().length / COA_PAGE_SIZE));
    if (btn.dataset.coaliabchartpage === 'prev') coaLiabChartState.page = Math.max(1, coaLiabChartState.page - 1);
    else if (btn.dataset.coaliabchartpage === 'next') coaLiabChartState.page = Math.min(totalPages, coaLiabChartState.page + 1);
    else coaLiabChartState.page = +btn.dataset.coaliabchartpage;
    coaLiabChartAccountsRefreshResults();
  });
}

    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaLiabilityModalMsg');
    if (!val('name') || !val('balance')) {
      msg.textContent = 'Account Name and Balance are required.';
      return;
    }
    coaLiabilities.push({
      code: val('code'),
      name: val('name'),
      category: val('category'),
      location: val('location'),
      date: coaFormatDateDisplay(val('date')),
      due: coaFormatDateDisplay(val('due')),
      balance: Number(val('balance')) || 0,
      status: val('status'),
    });
    done();
    coaLiabilityFilter.page = 1;
    coaLiabilityRefreshResults();
  });

  const first = form.querySelector('input[name="name"]');
  if (first) first.focus();
}

function coaLiabilityStatusPill(status) {
  const map = {

  };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[12px] font-semibold bg-${bg} text-${fg}">${COA_LOCK_ICON}${escapeHtml(status)}</span>`;
}

function coaFilteredLiabilities() {
  const f = coaLiabilityFilter;
  const q = f.q.trim().toLowerCase();
  return coaLiabilities.filter(l => {
    if (q && !(l.name.toLowerCase().includes(q) || l.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && l.category !== f.category) return false;
    if (f.location !== 'All Locations' && l.location !== f.location) return false;
    if (f.status !== 'All Statuses' && l.status !== f.status) return false;
    return true;
  });
}

function coaLiabilityBindEvents(container) {
  container.querySelector('#coaLiabSearch').addEventListener('input', (e) => {
    coaLiabilityFilter.q = e.target.value;
    coaLiabilityFilter.page = 1;
    coaLiabilityRefreshResults();
  });
  ['coaLiabCategory', 'coaLiabLocation', 'coaLiabStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaLiabCategory' ? 'category' : id === 'coaLiabLocation' ? 'location' : 'status';
      coaLiabilityFilter[key] = e.target.value;
      coaLiabilityFilter.page = 1;
      coaLiabilityRefreshResults();
    });
  });

  container.querySelector('#coaLiabResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredLiabilities().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaLiabilityFilter.page = Math.max(1, coaLiabilityFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaLiabilityFilter.page = Math.min(totalPages, coaLiabilityFilter.page + 1);
    else coaLiabilityFilter.page = +btn.dataset.coapage;
    coaLiabilityRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaLiabSelectAll') return;
    container.querySelectorAll('#coaLiabResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewLiability').addEventListener('click', () => coaOpenNewLiabilityModal());
}

const COA_EQUITY_STATUSES = ['All Statuses', 'Active', 'Closed'];
const COA_EQUITY_PERIODS = ['Current Period', 'Last Month', 'Last Quarter', 'Last Year'];

const coaEquityItems = [

  { code: 'EQT-0003', name: 'Owner Drawings — Q2', category: 'Drawings', party: 'Mr. Karim Rahman', date: '15-Jun-2023', amount: 250000, status: 'Closed' },

function coaEquityStatusPill(status) {
  const map = { Active: ['successSoft', 'success'], Closed: ['neutralSoft', 'neutral'] };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[12px] font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaFilteredEquity() {
  const f = coaEquityFilter;
  const q = f.q.trim().toLowerCase();
  return coaEquityItems.filter(it => {
    if (q && !(it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && it.category !== f.category) return false;
    if (f.party !== 'All Holders' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && it.status !== f.status) return false;
    return true;
  });
}

          <th class="pl-4 pr-2 py-2.5"><input id="coaEquitySelectAll" type="checkbox" class="w-3.5 h-3.5 rounded border-side-border" /></th>
          ${headers.map((h, idx) => `<th class="${idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 text-[13px] font-semibold text-muted text-${idx === 6 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((it, i) => coaEquityRow(it, start + i + 1)).join('') : `<tr><td colspan="10" class="px-4 py-10 text-center"><p class="text-body text-muted">No equity items match your filters.</p></td></tr>`}</tbody>

      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      <div class="flex items-center gap-1.5">
        <button data-coapage="prev" ${coaEquityFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded text-[12px] font-semibold ${p === coaEquityFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}

}

  container.innerHTML = `

}

function coaEquityRefreshResults() {
  const el = document.getElementById('coaEquityResults');
  if (el) el.innerHTML = coaEquityResultsHtml();
}

function coaEquityBindEvents(container) {
  container.querySelector('#coaEquitySearch').addEventListener('input', (e) => {
    coaEquityFilter.q = e.target.value;
    coaEquityFilter.page = 1;
    coaEquityRefreshResults();
  });
  ['coaEquityCategory', 'coaEquityParty', 'coaEquityStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaEquityCategory' ? 'category' : id === 'coaEquityParty' ? 'party' : 'status';
      coaEquityFilter[key] = e.target.value;
      coaEquityFilter.page = 1;
      coaEquityRefreshResults();
    });
  });

  container.querySelector('#coaEquityResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredEquity().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaEquityFilter.page = Math.max(1, coaEquityFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaEquityFilter.page = Math.min(totalPages, coaEquityFilter.page + 1);
    else coaEquityFilter.page = +btn.dataset.coapage;
    coaEquityRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaEquitySelectAll') return;
    container.querySelectorAll('#coaEquityResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewEquity').addEventListener('click', () => coaOpenNewEquityModal());
}

}

        <thead><tr class="border-b border-side-line">

        </tr></thead>
        <tbody>${rows.length ? rows.map((a, i) => coaRevChartAccountRow(a, start + i + 1)).join('') : `<tr><td colspan="8" class="px-4 py-10 text-center"><p class="text-body text-muted">No accounts match your search.</p></td></tr>`}</tbody>

        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coarevchartpage="${p}" class="w-7 h-7 rounded text-[12px] font-semibold ${p === coaRevChartState.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coarevchartpage="next" ${coaRevChartState.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
      </div>

function coaRevChartAccountsCard() {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex flex-wrap items-start justify-between gap-3 p-4">
        <div>
          <h3 class="text-section-title text-primary">Revenue — Chart of Accounts</h3>
          <p id="coaRevChartCounter" class="text-helper text-muted mt-0.5">${coaRevChartFilteredAccounts().length} of ${coaChartRevenueAccounts.length} GL accounts · normal balance: credit</p>

}

function coaRevChartAccountsRefreshResults() {
  const results = document.getElementById('coaRevChartAccountsResults');
  if (results) results.innerHTML = coaRevChartAccountsResultsHtml();
  const counter = document.getElementById('coaRevChartCounter');
  if (counter) counter.textContent = `${coaRevChartFilteredAccounts().length} of ${coaChartRevenueAccounts.length} GL accounts · normal balance: credit`;
}

function coaRevChartAccountsBindEvents(container) {
  const input = container.querySelector('#coaRevChartSearch');
  if (!input) return;
  input.addEventListener('input', (e) => {
    coaRevChartState.q = e.target.value;
    coaRevChartState.page = 1;
    coaRevChartAccountsRefreshResults();
  });

  container.querySelector('#coaRevChartType').addEventListener('change', (e) => {
    coaRevChartState.type = e.target.value;
    coaRevChartState.page = 1;
    coaRevChartAccountsRefreshResults();
  });

  container.querySelector('#coaRevChartControlType').addEventListener('change', (e) => {
    coaRevChartState.controlType = e.target.value;
    coaRevChartState.page = 1;
    coaRevChartAccountsRefreshResults();
  });

  container.querySelector('#coaRevChartAddAccount').addEventListener('click', () => coaOpenNewRevenueAccountModal());

  container.querySelector('#coaRevChartAccountsResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coarevchartpage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaRevChartFilteredAccounts().length / COA_PAGE_SIZE));
    if (btn.dataset.coarevchartpage === 'prev') coaRevChartState.page = Math.max(1, coaRevChartState.page - 1);
    else if (btn.dataset.coarevchartpage === 'next') coaRevChartState.page = Math.min(totalPages, coaRevChartState.page + 1);
    else coaRevChartState.page = +btn.dataset.coarevchartpage;
    coaRevChartAccountsRefreshResults();
  });
}

function coaRevChartNextCode() {
  const max = coaChartRevenueAccounts.reduce((m, a) => Math.max(m, parseInt(a.code, 10) || 0), 0);
  return String(max + 10);
}

function coaOpenNewRevenueAccountModal() {
  if (document.getElementById('coaRevAccountModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const nextCode = coaRevChartNextCode();

  const wrap = document.createElement('div');
  wrap.id = 'coaRevAccountModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new account');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[560px] px-4">
      <form id="coaRevAccountForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="text-[14.5px] font-semibold text-primary">New Account</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0 sm:col-span-2">${biLabel('Parent Account')}
            <select name="parent" class="${COA_INPUT}">
              <option value="">— None / Root (top-level Revenue head) —</option>
              ${coaChartRevenueAccounts.map(a => `<option value="${escapeHtml(a.code)}">${escapeHtml(a.code)} — ${escapeHtml(a.name)}</option>`).join('')}
            </select></label>
          <label class="block min-w-0">${biLabel('Account Code', { req: true })}
            <input name="code" type="text" autocomplete="off" value="${escapeHtml(nextCode)}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Account Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Royalty Income" class="${COA_INPUT}" /></label>
          <p id="coaRevAccountModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaRevAccountForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaRevAccountModalMsg');
    if (!val('code') || !val('name')) {
      msg.textContent = 'Account Code and Account Name are required.';
      return;
    }
    if (coaChartRevenueAccounts.some(a => a.code === val('code'))) {
      msg.textContent = 'An account with this code already exists.';
      return;
    }
    coaChartRevenueAccounts.push({ code: val('code'), name: val('name'), controlType: null, parent: val('parent') || null });
    coaChartRevenueAccounts.sort((a, b) => a.code.localeCompare(b.code));
    done();
    coaRevChartAccountsRefreshResults();
  });

  const first = form.querySelector('input[name="code"]');
  if (first) first.focus();
}

const COA_REVENUE_CATEGORIES = ['All Categories', 'Export Sales', 'Local Sales', 'Sample Income', 'Other Income'];
const COA_REVENUE_PARTIES = ['All Buyers', 'Everest Apparels Ltd.', 'Metro Fashion House', 'Northline Buying House'];
const COA_REVENUE_STATUSES = ['All Statuses', 'Recognized', 'Pending', 'Cancelled'];
const COA_REVENUE_PERIODS = ['Current Period', 'Last Month', 'Last Quarter', 'Last Year'];

const coaRevenueItems = [
  { code: 'REV-0001', name: 'Export Shipment — SHP-2201', category: 'Export Sales', party: 'Everest Apparels Ltd.', date: '18-May-2023', amount: 4500000, status: 'Recognized' },
  { code: 'REV-0002', name: 'Local Sale — Invoice 118', category: 'Local Sales', party: 'Metro Fashion House', date: '02-Jun-2023', amount: 620000, status: 'Recognized' },
  { code: 'REV-0003', name: 'Sample Order Income', category: 'Sample Income', party: 'Northline Buying House', date: '20-Jun-2023', amount: 85000, status: 'Pending' },
];

const coaRevenueFilter = { q: '', category: 'All Categories', party: 'All Buyers', status: 'All Statuses', page: 1 };

function coaRevenueStatusPill(status) {
  const map = {
    Recognized: ['successSoft', 'success'], Pending: ['warningSoft', 'warning'], Cancelled: ['dangerSoft', 'danger'],
  };
  const [bg, fg] = map[status] || map.Recognized;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[12px] font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaFilteredRevenue() {
  const f = coaRevenueFilter;
  const q = f.q.trim().toLowerCase();
  return coaRevenueItems.filter(it => {
    if (q && !(it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && it.category !== f.category) return false;
    if (f.party !== 'All Buyers' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && it.status !== f.status) return false;
    return true;
  });
}

  return `

            <input id="coaRevenueSearch" type="text" value="${escapeHtml(coaRevenueFilter.q)}" placeholder="Search revenue entry name, code or tag..."

function coaRevenueRow(it, n) {

  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Code', 'Name', 'Revenue Category', 'Customer / Buyer', 'Date', 'Amount (BDT)', 'Status', 'Actions'];

          ${headers.map((h, idx) => `<th class="${idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 text-[13px] font-semibold text-muted text-${idx === 6 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((it, i) => coaRevenueRow(it, start + i + 1)).join('') : `<tr><td colspan="10" class="px-4 py-10 text-center"><p class="text-body text-muted">No revenue entries match your filters.</p></td></tr>`}</tbody>

      <div class="flex items-center gap-1.5">
        <button data-coapage="prev" ${coaRevenueFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded text-[12px] font-semibold ${p === coaRevenueFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coapage="next" ${coaRevenueFilter.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>

}

function coaRevenueBindEvents(container) {
  container.querySelector('#coaRevenueSearch').addEventListener('input', (e) => {

  ['coaRevenueCategory', 'coaRevenueParty', 'coaRevenueStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaRevenueCategory' ? 'category' : id === 'coaRevenueParty' ? 'party' : 'status';
      coaRevenueFilter[key] = e.target.value;
      coaRevenueFilter.page = 1;
      coaRevenueRefreshResults();

  container.querySelector('#coaRevenueResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');

    const totalPages = Math.max(1, Math.ceil(coaFilteredRevenue().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaRevenueFilter.page = Math.max(1, coaRevenueFilter.page - 1);

    e.preventDefault();

    const msg = form.querySelector('#coaRevenueModalMsg');
    if (!val('name') || !val('amount')) {

      amount: Number(val('amount')) || 0,

        <button data-coaexpchartpage="next" ${coaExpChartState.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>

function coaExpChartAccountsCard() {

function coaExpChartAccountsRefreshResults() {
  const results = document.getElementById('coaExpChartAccountsResults');
  if (results) results.innerHTML = coaExpChartAccountsResultsHtml();
  const counter = document.getElementById('coaExpChartCounter');
  if (counter) counter.textContent = `${coaExpChartFilteredAccounts().length} of ${coaChartExpenseAccounts.length} GL accounts · normal balance: debit`;
}

function coaExpChartAccountsBindEvents(container) {
  const input = container.querySelector('#coaExpChartSearch');
  if (!input) return;
  input.addEventListener('input', (e) => {
    coaExpChartState.q = e.target.value;
    coaExpChartState.page = 1;
    coaExpChartAccountsRefreshResults();
  });

  container.querySelector('#coaExpChartType').addEventListener('change', (e) => {
    coaExpChartState.type = e.target.value;
    coaExpChartState.page = 1;
    coaExpChartAccountsRefreshResults();
  });

  container.querySelector('#coaExpChartControlType').addEventListener('change', (e) => {
    coaExpChartState.controlType = e.target.value;
    coaExpChartState.page = 1;
    coaExpChartAccountsRefreshResults();
  });

  container.querySelector('#coaExpChartAddAccount').addEventListener('click', () => coaOpenNewExpenseAccountModal());

  container.querySelector('#coaExpChartAccountsResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coaexpchartpage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaExpChartFilteredAccounts().length / COA_PAGE_SIZE));
    if (btn.dataset.coaexpchartpage === 'prev') coaExpChartState.page = Math.max(1, coaExpChartState.page - 1);
    else if (btn.dataset.coaexpchartpage === 'next') coaExpChartState.page = Math.min(totalPages, coaExpChartState.page + 1);
    else coaExpChartState.page = +btn.dataset.coaexpchartpage;
    coaExpChartAccountsRefreshResults();
  });
}

function coaExpChartNextCode() {
  const max = coaChartExpenseAccounts.reduce((m, a) => Math.max(m, parseInt(a.code, 10) || 0), 0);

  const nextCode = coaExpChartNextCode();

          <label class="block min-w-0 sm:col-span-2">${biLabel('Parent Account')}

              <option value="">— None / Root (top-level Expenses head) —</option>

            </select></label>
          <label class="block min-w-0">${biLabel('Account Code', { req: true })}
            <input name="code" type="text" autocomplete="off" value="${escapeHtml(nextCode)}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Account Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Travel Expense" class="${COA_INPUT}" /></label>
          <p id="coaExpAccountModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaExpAccountForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaExpAccountModalMsg');
    if (!val('code') || !val('name')) {
      msg.textContent = 'Account Code and Account Name are required.';
      return;
    }
    if (coaChartExpenseAccounts.some(a => a.code === val('code'))) {
      msg.textContent = 'An account with this code already exists.';
      return;
    }
    coaChartExpenseAccounts.push({ code: val('code'), name: val('name'), controlType: null, parent: val('parent') || null });
    coaChartExpenseAccounts.sort((a, b) => a.code.localeCompare(b.code));
    done();
    coaExpChartAccountsRefreshResults();
  });

const COA_EXPENSE_STATUSES = ['All Statuses', 'Paid', 'Pending', 'Approved'];

const coaExpenseItems = [

  { code: 'EXP-0003', name: 'Factory Utilities — June', category: 'Factory Overhead', party: 'Main Factory', date: '30-Jun-2023', amount: 95000, status: 'Pending' },
];

const coaExpenseFilter = { q: '', category: 'All Categories', party: 'All Vendors', status: 'All Statuses', page: 1 };

function coaExpenseStatusPill(status) {
  const map = { Paid: ['successSoft', 'success'], Pending: ['warningSoft', 'warning'], Approved: ['infoSoft', 'info'] };
  const [bg, fg] = map[status] || map.Paid;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[12px] font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaFilteredExpenses() {
  const f = coaExpenseFilter;
  const q = f.q.trim().toLowerCase();
  return coaExpenseItems.filter(it => {
    if (q && !(it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && it.category !== f.category) return false;
    if (f.party !== 'All Vendors' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && it.status !== f.status) return false;
    return true;
  });
}

        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded text-[12px] font-semibold ${p === coaExpenseFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coapage="next" ${coaExpenseFilter.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>

}

function coaExpenseListCard() {

      <div class="flex items-center justify-between gap-3 p-4">
        <h3 class="text-section-title text-primary">Expenses List</h3>
        <button type="button" id="coaNewExpense" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Expense Entry</button>
      </div>
      <div id="coaExpenseResults">${coaExpenseResultsHtml()}</div>

}

function coaRenderExpenses(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${coaExpChartFilterBar()}
      ${coaExpChartAccountsCard()}
      ${coaExpenseFilterBar()}
      ${coaExpenseListCard()}
    </div>`;
  coaExpChartAccountsBindEvents(container);
  coaExpenseBindEvents(container);
}

function coaExpenseRefreshResults() {
  const el = document.getElementById('coaExpenseResults');
  if (el) el.innerHTML = coaExpenseResultsHtml();
}

function coaExpenseBindEvents(container) {
  container.querySelector('#coaExpenseSearch').addEventListener('input', (e) => {
    coaExpenseFilter.q = e.target.value;
    coaExpenseFilter.page = 1;
    coaExpenseRefreshResults();
  });
  ['coaExpenseCategory', 'coaExpenseParty', 'coaExpenseStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaExpenseCategory' ? 'category' : id === 'coaExpenseParty' ? 'party' : 'status';
      coaExpenseFilter[key] = e.target.value;
      coaExpenseFilter.page = 1;
      coaExpenseRefreshResults();
    });
  });

  container.querySelector('#coaExpenseResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredExpenses().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaExpenseFilter.page = Math.max(1, coaExpenseFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaExpenseFilter.page = Math.min(totalPages, coaExpenseFilter.page + 1);
    else coaExpenseFilter.page = +btn.dataset.coapage;
    coaExpenseRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaExpenseSelectAll') return;
    container.querySelectorAll('#coaExpenseResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewExpense').addEventListener('click', () => coaOpenNewExpenseModal());
}

function coaExpenseNextCode() {
  const max = coaExpenseItems.reduce((m, it) => Math.max(m, parseInt((it.code.split('-')[1] || '0'), 10) || 0), 0);
  return `EXP-${String(max + 1).padStart(4, '0')}`;
}

function coaOpenNewExpenseModal() {
  if (document.getElementById('coaExpenseModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const nextCode = coaExpenseNextCode();
  const today = new Date().toISOString().slice(0, 10);

  const wrap = document.createElement('div');
  wrap.id = 'coaExpenseModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new expense entry');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[620px] px-4">
      <form id="coaExpenseForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="text-[14.5px] font-semibold text-primary">New Expense Entry</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0">${biLabel('Code')}
            <input name="code" type="text" value="${escapeHtml(nextCode)}" readonly class="${COA_INPUT} tabular bg-side-bg/60 text-muted" /></label>
          <label class="block min-w-0">${biLabel('Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Office Rent — July" class="${COA_INPUT}" /></label>
          <label class="block min-w-0">${biLabel('Expense Category')}
            <select name="category" class="${COA_INPUT}">${COA_EXPENSE_CATEGORIES.slice(1).map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></label>
          <label class="block min-w-0">${biLabel('Vendor / Department')}
            <select name="party" class="${COA_INPUT}">${COA_EXPENSE_PARTIES.slice(1).map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select></label>
          <label class="block min-w-0">${biLabel('Date')}
            <input name="date" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Amount (BDT)', { req: true })}
            <input name="amount" type="number" min="0" step="1" placeholder="0" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Status')}
            <select name="status" class="${COA_INPUT}">${COA_EXPENSE_STATUSES.slice(1).map(s => `<option value="${escapeHtml(s)}" ${s === 'Pending' ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select></label>
          <p id="coaExpenseModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Expense Entry</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaExpenseForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaExpenseModalMsg');
    if (!val('name') || !val('amount')) {
      msg.textContent = 'Name and Amount are required.';
      return;
    }
    coaExpenseItems.push({
      code: val('code'),
      name: val('name'),
      category: val('category'),
      party: val('party'),
      date: coaFormatDateDisplay(val('date')),
      amount: Number(val('amount')) || 0,
      status: val('status'),
    });
    done();
    coaExpenseFilter.page = 1;
    coaExpenseRefreshResults();
  });

  const first = form.querySelector('input[name="name"]');
  if (first) first.focus();
}

const coaCashBankFilter = { q: '', type: 'All Types', currency: 'All Currencies', status: 'All Statuses', page: 1 };

function coaCashBankNextCode() {
  const max = coaCashBankAccounts.reduce((m, a) => Math.max(m, parseInt((a.code.split('-')[1] || '0'), 10) || 0), 0);
  return `CB-${String(max + 1).padStart(4, '0')}`;
}

function coaFilteredCashBank() {
  const f = coaCashBankFilter;
  const q = f.q.trim().toLowerCase();
  return coaCashBankAccounts.filter(a => {
    if (q && !(a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q) || (a.bankName || '').toLowerCase().includes(q) || (a.accountNo || '').toLowerCase().includes(q))) return false;
    if (f.type !== 'All Types' && a.type !== f.type) return false;
    if (f.currency !== 'All Currencies' && a.currency !== f.currency) return false;
    if (f.status !== 'All Statuses' && a.status !== f.status) return false;
    return true;
  });
}

function coaCashBankStatusPill(status) {
  const map = { Active: ['successSoft', 'success'], Inactive: ['neutralSoft', 'neutral'] };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[12px] font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaCashBankTypeBadge(type) {
  const map = { Cash: ['warningSoft', 'warning'], Bank: ['infoSoft', 'info'] };
  const [bg, fg] = map[type] || map.Cash;
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[12px] font-semibold bg-${bg} text-${fg} whitespace-nowrap">${escapeHtml(type)}</span>`;
}

const COA_CASHBANK_STAT_CASH_ICON = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M16 13h.01M3 10h18"/></svg>';
const COA_CASHBANK_STAT_BANK_ICON = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M4 10v9M20 10v9M8 10v9M16 10v9M2 21h20"/></svg>';

function coaCashBankStatCard(iconHtml, value, label) {
  return `
    <div class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4 flex items-start justify-between gap-3">
      <div>
        <p class="text-2xl font-bold text-primary tabular leading-tight">${value}</p>

      <div class="w-10 h-10 rounded-lg bg-side-active flex items-center justify-center shrink-0 text-side-accent">
        ${iconHtml}

}

function coaCashBankSummaryCards() {
  let cashTotal = 0, bankTotal = 0, activeCount = 0;
  coaCashBankAccounts.forEach(a => {
    if (a.type === 'Cash') cashTotal += (a.currentBalance || 0);

    if (a.status === 'Active') activeCount += 1;
  });
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaInt(cashTotal), 'Total Cash-in-Hand')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_BANK_ICON, coaInt(bankTotal), 'Total Bank Balance')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, String(activeCount), 'Active Accounts')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, String(coaCashBankAccounts.length), 'Total Accounts')}
    </div>`;
}

  const headers = ['SL', 'Code', 'Account Name', 'Type', 'Bank / Branch', 'A/C No.', 'Currency', 'Opening Bal.', 'Current Bal.', 'Opened', 'Status', 'Actions'];

          ${headers.map((h, idx) => `<th class="${idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 text-[13px] font-semibold text-muted text-${idx === 6 || idx === 7 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}

      <div class="flex items-center gap-1.5">
        <button data-coapage="prev" ${coaCashBankFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded text-[12px] font-semibold ${p === coaCashBankFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coapage="next" ${coaCashBankFilter.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>

function coaCashBankBindEvents(container) {

  container.querySelector('#coaCashBankResults').addEventListener('click', (e) => {

    container.querySelectorAll('#coaCashBankResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewCashBank').addEventListener('click', () => coaOpenNewCashBankModal());
}

function coaOpenNewCashBankModal() {
  if (document.getElementById('coaCashBankModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const nextCode = coaCashBankNextCode();
  const today = new Date().toISOString().slice(0, 10);

  const wrap = document.createElement('div');
  wrap.id = 'coaCashBankModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new cash or bank account');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[640px] px-4">
      <form id="coaCashBankForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="text-[14.5px] font-semibold text-primary">New Cash / Bank Account</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0">${biLabel('Account Code')}
            <input name="code" type="text" value="${escapeHtml(nextCode)}" readonly class="${COA_INPUT} tabular bg-side-bg/60 text-muted" /></label>
          <label class="block min-w-0">${biLabel('Account Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. City Bank - Current A/C" class="${COA_INPUT}" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Account Type')}
            <select name="type" id="coaCashBankFormType" class="${COA_INPUT}">
              <option value="Cash">Cash</option>
              <option value="Bank">Bank</option>
            </select></label>
          <div id="coaCashBankBankFields" class="hidden sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5">
            <label class="block min-w-0">${biLabel('Bank Name')}
              <input name="bankName" type="text" autocomplete="off" placeholder="e.g. City Bank PLC" class="${COA_INPUT}" /></label>
            <label class="block min-w-0">${biLabel('Branch')}
              <input name="branch" type="text" autocomplete="off" placeholder="e.g. Gulshan Branch" class="${COA_INPUT}" /></label>
            <label class="block min-w-0">${biLabel('Account Number')}
              <input name="accountNo" type="text" autocomplete="off" placeholder="e.g. 1012345678901" class="${COA_INPUT}" /></label>
            <label class="block min-w-0">${biLabel('Routing / Swift No.')}
              <input name="routingNo" type="text" autocomplete="off" placeholder="e.g. 225270123" class="${COA_INPUT}" /></label>
          </div>
          <label class="block min-w-0">${biLabel('Currency')}
            <select name="currency" class="${COA_INPUT}">${COA_CASHBANK_CURRENCIES.slice(1).map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></label>
          <label class="block min-w-0">${biLabel('Opening Balance', { req: true })}
            <input name="openingBalance" type="number" min="0" step="1" placeholder="0" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Opening Date')}
            <input name="openedDate" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Status')}
            <select name="status" class="${COA_INPUT}">${COA_CASHBANK_STATUSES.slice(1).map(s => `<option value="${escapeHtml(s)}" ${s === 'Active' ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select></label>
          <p id="coaCashBankModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaCashBankForm');
  const bankFields = wrap.querySelector('#coaCashBankBankFields');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  wrap.querySelector('#coaCashBankFormType').addEventListener('change', (e) => {
    bankFields.classList.toggle('hidden', e.target.value !== 'Bank');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaCashBankModalMsg');
    if (!val('name') || !val('openingBalance')) {
      msg.textContent = 'Account Name and Opening Balance are required.';
      return;
    }
    const isBank = val('type') === 'Bank';
    const opening = Number(val('openingBalance')) || 0;
    coaCashBankAccounts.push({
      code: val('code'),
      name: val('name'),
      type: val('type'),
      bankName: isBank ? val('bankName') : '',
      branch: isBank ? val('branch') : '',
      accountNo: isBank ? val('accountNo') : '',
      routingNo: isBank ? val('routingNo') : '',
      currency: val('currency'),
      openingBalance: opening,
      currentBalance: opening,
      openedDate: coaFormatDateDisplay(val('openedDate')),
      status: val('status'),
    });
    done();
    coaCashBankFilter.page = 1;
    coaCashBankRefreshResults();
  });

  const first = form.querySelector('input[name="name"]');
  if (first) first.focus();
}

// ---------- Command palette ----------
const cmdk = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const cmdkCount = document.getElementById('cmdkCount');
let cmdkResults = [];
let cmdkCursor = 0;
let lastFocused = null;

function scoreEntry(e, q) {
  const i = e.hay.indexOf(q);
  if (i !== -1) return (i === 0 ? 1000 : e.hay[i - 1] === ' ' ? 800 : 500) - i;
  let qi = 0;                                   // subsequence fallback: "pom" -> "PrOduction Management"
  for (let c = 0; c < e.hay.length && qi < q.length; c++) if (e.hay[c] === q[qi]) qi++;
  return qi === q.length ? 100 - e.hay.length / 10 : -1;
}

function renderCmdkList() {
  if (!cmdkResults.length) {
    cmdkList.innerHTML = `<p class="px-4 py-6 text-center text-body text-muted">No screens match that search.</p>`;
    cmdkCount.textContent = '';
    return;
  }
  cmdkList.innerHTML = cmdkResults.map((e, i) => `
    <button role="option" aria-selected="${i === cmdkCursor}" data-i="${i}"
      class="cmdk-row w-full flex items-center gap-2.5 px-3.5 py-2 text-left ${i === cmdkCursor ? 'bg-side-hover' : ''}">
      ${iconSvg(e.icon, 'w-4 h-4 shrink-0 ' + (i === cmdkCursor ? 'text-side-accent' : 'text-muted'))}
      <span class="text-body-medium text-primary truncate">${escapeHtml(e.title)}</span>
      ${e.context ? `<span class="text-helper text-disabled truncate ml-auto shrink-0">${escapeHtml(e.context)}</span>` : ''}
    </button>
  `).join('');
  cmdkCount.textContent = `${cmdkResults.length} of ${pageIndex.length}`;
  cmdkList.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

function updateCmdk() {
  const q = cmdkInput.value.trim().toLowerCase();
  cmdkResults = !q
    ? pageIndex.slice(0, 40)
    : pageIndex.map(e => ({ e, s: scoreEntry(e, q) })).filter(x => x.s >= 0)
        .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.e);
  cmdkCursor = 0;
  renderCmdkList();
}

function openCmdk() {
  lastFocused = document.activeElement;
  cmdk.classList.remove('hidden');
  cmdkInput.value = '';
  updateCmdk();
  cmdkInput.focus();
}

function closeCmdk() {
  cmdk.classList.add('hidden');
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

function commitCmdk() {
  const pick = cmdkResults[cmdkCursor];
  if (!pick) return;
  closeCmdk();
  goTo(pick.moduleKey, pick.subIndex);
}

cmdkInput.addEventListener('input', updateCmdk);
document.getElementById('cmdkBackdrop').addEventListener('click', closeCmdk);
document.getElementById('searchTrigger').addEventListener('click', openCmdk);

cmdkList.addEventListener('mousemove', (e) => {
  const row = e.target.closest('[data-i]');
  if (row && +row.dataset.i !== cmdkCursor) { cmdkCursor = +row.dataset.i; renderCmdkList(); }
});
cmdkList.addEventListener('click', (e) => {
  const row = e.target.closest('[data-i]');
  if (row) { cmdkCursor = +row.dataset.i; commitCmdk(); }
});

cmdk.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdkCursor = Math.min(cmdkCursor + 1, cmdkResults.length - 1); renderCmdkList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkCursor = Math.max(cmdkCursor - 1, 0); renderCmdkList(); }
  else if (e.key === 'Enter') { e.preventDefault(); commitCmdk(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
});

// ---------- Theme ----------
function applyThemeIcon(theme) {
  document.getElementById('themeIconSun').classList.toggle('hidden', theme === 'dark');
  document.getElementById('themeIconMoon').classList.toggle('hidden', theme !== 'dark');
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('erp-theme'); } catch (e) { /* ignore */ }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeIcon(theme);
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  applyThemeIcon(next);
  try { localStorage.setItem('erp-theme', next); } catch (e) { /* ignore */ }
});

if (/Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
  document.getElementById('searchKbd').textContent = '⌘K';
}

renderNav();
renderContent();
</script>
