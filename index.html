const lcFilter = { q: '', lcType: 'All Types', bank: 'All Banks', status: 'All Statuses', page: 1 };

function lcBalance(l) { return Math.max(0, (l.amount || 0) - (l.utilized || 0)); }

function lcDaysToExpiry(l) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return (new Date(l.expiryDate + 'T00:00:00') - today) / 86400000;
}

function lcStatus(l) {
  if (lcBalance(l) <= 0) return 'Utilized';
  if (lcDaysToExpiry(l) < 0) return 'Expired';
  return l.utilized > 0 ? 'Partially Utilized' : 'Active';
}

function lcStatusPill(status) {
  return finPill(status, { Active: 'success', 'Partially Utilized': 'info', Utilized: 'neutral', Expired: 'danger' }[status], true);
}

// LCs can be in different currencies, so totals are summed per currency, never across them.
function lcTotalsText(valueOf, records) {
  const by = {};
  (records || lcRecords).forEach(l => { by[l.currency] = (by[l.currency] || 0) + valueOf(l); });
  const keys = Object.keys(by);
  return keys.length ? keys.map(c => `${c} ${coaInt(Math.round(by[c]))}`).join(' · ') : '0';
}

function lcBankOptions() {
  return Array.from(new Set(lcRecords.map(l => l.issuingBank).filter(Boolean))).sort();
}

function lcFiltered() {
  const q = lcFilter.q.trim().toLowerCase();
  return lcRecords.filter(l => {
    if (q && !(l.lcNo.toLowerCase().includes(q) || l.buyer.toLowerCase().includes(q) || l.issuingBank.toLowerCase().includes(q) || (l.contractRef || '').toLowerCase().includes(q))) return false;
    if (lcFilter.lcType !== 'All Types' && l.lcType !== lcFilter.lcType) return false;
    if (lcFilter.bank !== 'All Banks' && l.issuingBank !== lcFilter.bank) return false;
    if (lcFilter.status !== 'All Statuses' && lcStatus(l) !== lcFilter.status) return false;
    return true;
  });
}

// Card version of the per-currency totals: the currency is a small label so long figures stay on one line.
function lcTotalsCard(valueOf) {
  const by = {};
  lcRecords.forEach(l => { by[l.currency] = (by[l.currency] || 0) + valueOf(l); });
  const keys = Object.keys(by);
  return keys.length ? keys.map(c => `<span class="block whitespace-nowrap"><span class="fs-small font-medium text-muted mr-1.5">${escapeHtml(c)}</span>${coaInt(Math.round(by[c]))}</span>`).join('') : '0';
}

function lcSummaryCards() {
  const expiring = lcRecords.filter(l => lcBalance(l) > 0 && lcDaysToExpiry(l) >= 0 && lcDaysToExpiry(l) <= 30).length;
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, lcTotalsCard(l => l.amount || 0), 'Total LC Value')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, lcTotalsCard(l => l.utilized || 0), 'Total Utilized')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, lcTotalsCard(lcBalance), 'Available Balance')}
      ${coaCashBankStatCard(AP_AR_ICON_DUESOON, expiring, 'Expiring in 30 Days')}
    </div>`;
}

function lcFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="lcSearch" type="text" value="${escapeHtml(lcFilter.q)}" placeholder="Search LC no. or buyer…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField('LC Type', `<select id="lcTypeFilter" class="${COA_INPUT}">${opt(['All Types', ...LC_TYPES], lcFilter.lcType)}</select>`)}
        ${coaField('Issuing Bank', `<select id="lcBankFilter" class="${COA_INPUT}">${opt(['All Banks', ...lcBankOptions()], lcFilter.bank)}</select>`)}
        ${coaField('Status', `<select id="lcStatusFilter" class="${COA_INPUT}">${opt(['All Statuses', ...LC_STATUSES], lcFilter.status)}</select>`)}
      </div>
    </section>`;
}

function lcRow(l, n) {
  const balance = lcBalance(l);
  const status = lcStatus(l);
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base font-medium text-primary tabular">${escapeHtml(l.lcNo)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(l.lcType)}</p>
      </td>
      <td class="px-3 py-2.5 min-w-[180px]">
        <p class="fs-base text-primary">${escapeHtml(l.buyer)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(l.issuingBank)}</p>
      </td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base text-secondary tabular">${coaFormatDateDisplay(l.expiryDate)}</p>
        <div class="mt-1.5">${lcStatusPill(status)}</div>
      </td>
      <td class="px-3 py-2.5 fs-base text-primary font-semibold whitespace-nowrap tabular text-right">${coaInt(l.amount)} ${escapeHtml(l.currency)}</td>
      <td class="px-3 py-2.5 whitespace-nowrap text-right tabular">
        <p class="fs-base text-secondary">${coaInt(l.utilized)} <span class="text-helper text-muted">used</span></p>
        <p class="fs-base font-semibold mt-0.5 ${balance > 0 ? 'text-success' : 'text-secondary'}">${coaInt(balance)} <span class="text-helper font-normal text-muted">left</span></p>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        ${balance > 0 && status !== 'Expired' ? `<button type="button" data-lc-utilize="${escapeHtml(l.lcNo)}" class="h-7 px-2.5 rounded border border-side-accent/40 text-side-accent fs-small font-semibold hover:bg-side-active mr-1.5">Utilize</button>` : ''}
        <button type="button" data-lc-remove="${escapeHtml(l.lcNo)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>
      </td>
    </tr>`;
}

function lcResultsHtml() {
  const all = lcFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  lcFilter.page = Math.min(Math.max(1, lcFilter.page), totalPages);
  const start = (lcFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'LC No. / Type', 'Buyer / Issuing Bank', 'Expiry / Status', 'LC Value', 'Utilized / Balance', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i >= 4 || i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((l, i) => lcRow(l, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No LC records match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      ${finPager('lcpage', lcFilter.page, totalPages)}
    </div>`;
}

function lcCounterText() {
  return `${lcFiltered().length} of ${lcRecords.length} record${lcRecords.length === 1 ? '' : 's'}`;
}

function renderLcExportFinance(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="lcSummary">${lcSummaryCards()}</div>
      ${lcFilterBar()}
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
        <div class="flex flex-wrap items-start justify-between gap-3 p-4">
          <div>
            <h3 class="text-section-title text-primary">LC &amp; Export Finance Register</h3>
            <p id="lcCounter" class="text-helper text-muted mt-0.5">${lcCounterText()}</p>
          </div>
          <button type="button" id="lcNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New LC Record</button>
        </div>
        <div id="lcResults">${lcResultsHtml()}</div>
      </section>
    </div>`;
  lcBindEvents(container);
}

function lcRefresh(container, withSummary) {
  container.querySelector('#lcResults').innerHTML = lcResultsHtml();
  container.querySelector('#lcCounter').textContent = lcCounterText();
  if (withSummary) {
    container.querySelector('#lcSummary').innerHTML = lcSummaryCards();
    // A new issuing bank may have appeared, or the last LC for one may be gone.
    const bankSel = container.querySelector('#lcBankFilter');
    const banks = lcBankOptions();
    if (lcFilter.bank !== 'All Banks' && !banks.includes(lcFilter.bank)) lcFilter.bank = 'All Banks';
    bankSel.innerHTML = ['All Banks', ...banks].map(v => `<option value="${escapeHtml(v)}" ${v === lcFilter.bank ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  }
}

function lcBindEvents(container) {
  const bind = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { lcFilter[key] = e.target.value; lcFilter.page = 1; lcRefresh(container); });
  bind('lcSearch', 'q', 'input');
  bind('lcTypeFilter', 'lcType', 'change');
  bind('lcBankFilter', 'bank', 'change');
  bind('lcStatusFilter', 'status', 'change');

  container.querySelector('#lcNew').addEventListener('click', () => lcOpenNewModal(container));

  container.querySelector('#lcResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-lcpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(lcFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.lcpage;
      lcFilter.page = p === 'prev' ? Math.max(1, lcFilter.page - 1) : p === 'next' ? Math.min(totalPages, lcFilter.page + 1) : +p;
      lcRefresh(container);
      return;
    }
    const utilBtn = e.target.closest('[data-lc-utilize]');
    if (utilBtn) { lcOpenUtilizeModal(utilBtn.dataset.lcUtilize, container); return; }
    const removeBtn = e.target.closest('[data-lc-remove]');
    if (removeBtn) {
      const i = lcRecords.findIndex(l => l.lcNo === removeBtn.dataset.lcRemove);
      if (i > -1) lcRecords.splice(i, 1);
      lcRefresh(container, true);
    }
  });
}

// LC no., type, issuing bank, buyer, value, currency and the three dates are what a bank or
// auditor expects on file; advising bank, contract ref and ports are supporting detail.
function lcOpenNewModal(container) {
  const today = new Date().toISOString().slice(0, 10);
  finOpenModal({
    id: 'lcNewModal', title: 'New LC / Export Finance Record', icon: 'doc', wide: true, submitLabel: 'Save Record',
    body: [
      finFormField('LC Number', 'lcNo', { req: true, placeholder: 'e.g. 0123456789012006' }),
      finFormField('LC Type', 'lcType', { options: LC_TYPES }),
      finFormField('Issuing Bank', 'issuingBank', { req: true, placeholder: 'e.g. HSBC Bangladesh' }),
      finFormField('Advising Bank (optional)', 'advisingBank', { placeholder: 'e.g. City Bank PLC' }),
      finFormField('Buyer / Applicant', 'buyer', { req: true, placeholder: 'e.g. Everest Apparels Ltd.' }),
      finFormField('Sales Contract / PO Ref. (optional)', 'contractRef', { placeholder: 'e.g. SC-4471' }),
      finFormField('LC Amount', 'amount', { type: 'number', req: true, placeholder: '0.00' }),
      finFormField('Currency', 'currency', { options: LC_CURRENCIES, value: 'USD' }),
      finFormField('Partial Shipment', 'partialShipment', { options: LC_SHIPMENT_OPTIONS }),
      finFormField('Issue Date', 'issueDate', { type: 'date', value: today }),
      finFormField('Expiry Date', 'expiryDate', { type: 'date', value: today }),
      finFormField('Latest Shipment Date', 'latestShipmentDate', { type: 'date', value: today }),
      finFormField('Port of Loading (optional)', 'portOfLoading', { placeholder: 'e.g. Chattogram' }),
      finFormField('Port of Discharge (optional)', 'portOfDischarge', { placeholder: 'e.g. Rotterdam' }),
    ].join(''),
    onSubmit(form) {
      const v = (n) => finFormVal(form, n);
      const amount = Number(v('amount')) || 0;
      if (!v('lcNo')) return 'Enter the LC number.';
      if (lcRecords.some(l => l.lcNo === v('lcNo'))) return `LC ${v('lcNo')} is already on file.`;
      if (!v('issuingBank')) return 'Enter the issuing bank.';
      if (!v('buyer')) return 'Enter the buyer / applicant.';
      if (amount <= 0) return 'Enter an LC amount greater than zero.';
      if (!v('issueDate') || !v('expiryDate') || !v('latestShipmentDate')) return 'Enter the issue, expiry and latest shipment dates.';
      if (v('expiryDate') < v('issueDate')) return 'Expiry date cannot be before the issue date.';
      if (v('latestShipmentDate') > v('expiryDate')) return 'Latest shipment date cannot be after the expiry date.';
      lcRecords.push({
        lcNo: v('lcNo'), lcType: v('lcType'), issuingBank: v('issuingBank'), advisingBank: v('advisingBank'),
        buyer: v('buyer'), contractRef: v('contractRef'), amount, currency: v('currency'),
        issueDate: v('issueDate'), expiryDate: v('expiryDate'), latestShipmentDate: v('latestShipmentDate'),
        portOfLoading: v('portOfLoading'), portOfDischarge: v('portOfDischarge'), partialShipment: v('partialShipment'), utilized: 0,
      });
      lcFilter.page = Math.ceil(lcFiltered().length / COA_PAGE_SIZE);
      lcRefresh(container, true);
    },
  });
}

function lcOpenUtilizeModal(lcNo, container) {
  const l = lcRecords.find(x => x.lcNo === lcNo);
  if (!l) return;
  const balance = lcBalance(l);
  finOpenModal({
    id: 'lcUtilizeModal', title: `Record Utilization — ${l.lcNo}`, icon: 'doc', submitLabel: 'Record Utilization',
    intro: `${escapeHtml(l.buyer)} — available balance <span class="text-primary font-semibold tabular">${escapeHtml(l.currency)} ${coaMoney(balance)}</span>`,
    body: finFormField(`Utilization Amount (${l.currency})`, 'amount', { type: 'number', req: true, value: balance }),
    onSubmit(form) {
      const amount = Number(finFormVal(form, 'amount')) || 0;
      if (amount <= 0 || amount > balance + 0.005) return `Enter an amount between 0 and ${l.currency} ${coaMoney(balance)}.`;
      l.utilized = (l.utilized || 0) + amount;
      lcRefresh(container, true);
    },
  });
}

// ---------- Audit ----------
// Content ported from the Finance reference build: one home for audit findings raised against any
// Finance area (internal, external, statutory, VAT or tax audits), plus an on-demand report
// generator that summarises the live data already on file in VAT & Tax, Budget Management,
// Cash & Bank and LC & Export Finance.
const AUDIT_AREAS = ['Chart of Accounts', 'Voucher Management', 'Accounts Payable & Receivable', 'Cash & Bank', 'VAT & Tax', 'LC & Export Finance', 'Budget Management', 'Financial Statements'];
const AUDIT_TYPES = ['Internal Audit', 'External Audit', 'Statutory Audit', 'VAT Audit', 'Tax Audit'];
const AUDIT_RISK_LEVELS = ['Low', 'Medium', 'High'];
const AUDIT_STATUSES = ['Open', 'In Progress', 'Resolved', 'Closed'];
const AUDIT_REPORT_TYPES = [
  { key: 'vat', label: 'VAT & Tax Summary' },
  { key: 'budget', label: 'Budget Variance Summary' },
  { key: 'cashbank', label: 'Cash & Bank Position' },
  { key: 'lc', label: 'LC & Export Finance Summary' },
  { key: 'findings', label: 'Audit Findings Summary' },
];

const auditFindings = [
  { auditRef: 'AUD-0001', area: 'VAT & Tax', auditType: 'VAT Audit', auditorName: 'NBR VAT Circle Team', date: '2026-06-20', observation: 'Two Mushak 6.3 tax invoices were on file without the buyer’s BIN recorded.', riskLevel: 'Medium', status: 'In Progress', recommendation: 'Make the buyer BIN field mandatory before a Mushak 6.3 can be saved, with an explicit unregistered-buyer override.', followUpDate: '2026-07-15' },
  { auditRef: 'AUD-0002', area: 'Cash & Bank', auditType: 'Internal Audit', auditorName: 'Internal Audit Dept.', date: '2026-05-10', observation: 'Factory Floor Petty Cash account has shown a nil balance for over a month with no replenishment entry.', riskLevel: 'Low', status: 'Resolved', recommendation: 'Replenish the petty cash float and set a minimum-balance alert.', followUpDate: '2026-05-25' },
  { auditRef: 'AUD-0003', area: 'Budget Management', auditType: 'Internal Audit', auditorName: 'Internal Audit Dept.', date: '2026-07-05', observation: 'Sample & Development budget line was exceeded without a prior approval addendum on file.', riskLevel: 'High', status: 'Open', recommendation: 'Require an approval addendum before actual spend can exceed the budgeted amount on a line.', followUpDate: '2026-07-20' },
];

const auditFilter = { q: '', area: 'All Areas', risk: 'All Risk Levels', status: 'All Statuses', page: 1 };
const auditReport = { type: 'vat', from: '', to: '', generated: false };

function auditNextRef() {
  const max = auditFindings.reduce((m, a) => Math.max(m, parseInt((a.auditRef.split('-')[1] || '0'), 10) || 0), 0);
  return `AUD-${String(max + 1).padStart(4, '0')}`;
}

function auditInRange(dateStr, from, to) {
  if (!dateStr) return true;
  if (from && dateStr < from) return false;
  if (to && dateStr > to) return false;
  return true;
}

function auditFiltered() {
  const q = auditFilter.q.trim().toLowerCase();
  return auditFindings.filter(a => {
    if (q && !(a.auditRef.toLowerCase().includes(q) || a.observation.toLowerCase().includes(q) || a.area.toLowerCase().includes(q))) return false;
    if (auditFilter.area !== 'All Areas' && a.area !== auditFilter.area) return false;
    if (auditFilter.risk !== 'All Risk Levels' && a.riskLevel !== auditFilter.risk) return false;
    if (auditFilter.status !== 'All Statuses' && a.status !== auditFilter.status) return false;
    return true;
  });
}

function auditRiskPill(risk) {
  return finPill(risk, { Low: 'success', Medium: 'warning', High: 'danger' }[risk], true);
}

const AUDIT_STATUS_TEXT = { Open: 'text-danger', 'In Progress': 'text-warning', Resolved: 'text-info', Closed: 'text-secondary' };

function auditSummaryCards() {
  const unresolved = (a) => a.status === 'Open' || a.status === 'In Progress';
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(AP_AR_ICON_OUTSTANDING, auditFindings.length, 'Total Findings Logged')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, auditFindings.filter(unresolved).length, 'Open / In Progress')}
      ${coaCashBankStatCard(AP_AR_ICON_OVERDUE, auditFindings.filter(a => a.riskLevel === 'High' && unresolved(a)).length, 'Unresolved High Risk')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, auditFindings.filter(a => !unresolved(a)).length, 'Resolved / Closed')}
    </div>`;
}

// ---- Report Generator: a point-in-time summary computed from each area's live data ----
function auditReportRow(label, value) {
  return `<tr class="border-b border-side-line last:border-b-0"><td class="py-1.5 pr-6 fs-base text-secondary">${escapeHtml(label)}</td><td class="py-1.5 fs-base text-primary font-semibold text-right tabular whitespace-nowrap">${escapeHtml(String(value))}</td></tr>`;
}

function auditReportHtml() {
  const r = auditReport;
  const rangeNote = (r.from || r.to) ? ` for ${r.from ? coaFormatDateDisplay(r.from) : 'the start'} to ${r.to ? coaFormatDateDisplay(r.to) : 'today'}` : ' (all dates on file)';
  const bdt = (n) => `BDT ${coaInt(Math.round(n))}`;
  let title, note, rows;

  if (r.type === 'vat') {
    const list = vatInvoices.filter(v => v.status === 'Issued' && auditInRange(v.issueDate, r.from, r.to));
    let taxable = 0, vat = 0;
    list.forEach(v => { const c = vatCalc(v); taxable += c.taxable; vat += c.vatAmount; });
    title = 'VAT & Tax Summary'; note = `Mushak 6.3 invoices issued${rangeNote}`;
    rows = [['Mushak 6.3 Invoices Issued', list.length], ['Total Taxable Value', bdt(taxable)], ['Total Output VAT', bdt(vat)], ['Total Invoice Value', bdt(taxable + vat)]];
  } else if (r.type === 'budget') {
    const list = budgetRecords.filter(b => (!r.to || b.startDate <= r.to) && (!r.from || b.endDate >= r.from));
    let budgeted = 0, spent = 0, over = 0;
    list.forEach(b => { budgeted += b.budgetedAmount || 0; spent += b.actualSpent || 0; if (budgetSpendStatus(b) === 'Over Budget') over += 1; });
    title = 'Budget Variance Summary'; note = `Budget lines active${rangeNote}`;
    rows = [['Budget Lines', list.length], ['Total Budgeted', bdt(budgeted)], ['Total Actual Spend', bdt(spent)], ['Remaining Balance', bdt(budgeted - spent)], ['Lines Over Budget', over]];
  } else if (r.type === 'cashbank') {
    const by = {};
    coaCashBankAccounts.forEach(c => { by[c.currency] = (by[c.currency] || 0) + (c.currentBalance || 0); });
    title = 'Cash & Bank Position'; note = 'Snapshot as of today — not affected by the date range';
    rows = [['Accounts on File', coaCashBankAccounts.length], ['Active Accounts', coaCashBankAccounts.filter(c => c.status === 'Active').length], ...Object.keys(by).map(cur => [`Balance (${cur})`, coaInt(by[cur])])];
  } else if (r.type === 'lc') {
    const list = lcRecords.filter(l => auditInRange(l.issueDate, r.from, r.to));
    title = 'LC & Export Finance Summary'; note = `Letters of Credit issued${rangeNote}`;
    rows = [['LCs on File', list.length], ['Total LC Value', lcTotalsText(l => l.amount || 0, list)], ['Total Utilized', lcTotalsText(l => l.utilized || 0, list)], ['Available Balance', lcTotalsText(lcBalance, list)], ['Expiring in 30 Days', list.filter(l => lcBalance(l) > 0 && lcDaysToExpiry(l) >= 0 && lcDaysToExpiry(l) <= 30).length]];
  } else {
    const list = auditFindings.filter(a => auditInRange(a.date, r.from, r.to));
    title = 'Audit Findings Summary'; note = `Findings logged${rangeNote}`;
    rows = [['Total Findings', list.length], ...AUDIT_STATUSES.map(s => [s, list.filter(a => a.status === s).length]), ...AUDIT_RISK_LEVELS.map(s => [`${s} Risk`, list.filter(a => a.riskLevel === s).length])];
  }
  return `
    <div class="p-4 border-t border-side-line">
      <h4 class="text-body-medium text-primary">Report: ${escapeHtml(title)}</h4>
      <p class="text-helper text-muted mt-0.5 mb-2.5">${escapeHtml(note)}</p>
      <table class="w-full max-w-md">${rows.map(([l, v]) => auditReportRow(l, v)).join('')}</table>
    </div>`;
}

function auditReportCard() {
  const r = auditReport;
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="p-4"><h3 class="text-section-title text-primary">Report Generator</h3></div>
      <div class="px-4 pb-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">

          ${coaField('From (optional)', `<input id="auditReportFrom" type="date" value="${escapeHtml(r.from)}" class="${COA_INPUT} tabular" />`)}

}

function auditFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="auditSearch" type="text" value="${escapeHtml(auditFilter.q)}" placeholder="Search findings…" class="${COA_INPUT} pl-9" />

        ${coaField('Area', `<select id="auditAreaFilter" class="${COA_INPUT}">${opt(['All Areas', ...AUDIT_AREAS], auditFilter.area)}</select>`)}
        ${coaField('Risk Level', `<select id="auditRiskFilter" class="${COA_INPUT}">${opt(['All Risk Levels', ...AUDIT_RISK_LEVELS], auditFilter.risk)}</select>`)}
        ${coaField('Status', `<select id="auditStatusFilter" class="${COA_INPUT}">${opt(['All Statuses', ...AUDIT_STATUSES], auditFilter.status)}</select>`)}
      </div>
    </section>`;
}

function auditRow(a, n) {
  const followUpOverdue = (a.status === 'Open' || a.status === 'In Progress') && a.followUpDate && a.followUpDate < new Date().toISOString().slice(0, 10);
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base font-medium text-primary tabular">${escapeHtml(a.auditRef)}</p>
        <p class="text-helper text-muted mt-0.5 tabular">${coaFormatDateDisplay(a.date)}</p>
      </td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base text-secondary">${escapeHtml(a.area)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(a.auditType)}</p>
      </td>
      <td class="px-3 py-2.5 fs-base text-primary min-w-[240px] max-w-[340px]">
        <p>${escapeHtml(a.observation)}</p>
        ${a.recommendation ? `<p class="text-helper text-muted mt-1"><span class="font-semibold text-secondary">Recommendation:</span> ${escapeHtml(a.recommendation)}</p>` : ''}
      </td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        ${auditRiskPill(a.riskLevel)}
        <p class="text-helper mt-1.5 tabular ${followUpOverdue ? 'text-danger font-semibold' : 'text-muted'}">${a.followUpDate ? `Follow-up ${coaFormatDateDisplay(a.followUpDate)}` : 'No follow-up'}</p>
      </td>
      <td class="px-3 py-2">
        <select data-audit-status="${escapeHtml(a.auditRef)}" aria-label="Status of ${escapeHtml(a.auditRef)}" class="h-7 px-2 rounded border border-side-border bg-canvas fs-small font-semibold ${AUDIT_STATUS_TEXT[a.status]} focus:outline-none focus:ring-2 focus:ring-[var(--accent-ring)] focus:border-side-accent">
          ${AUDIT_STATUSES.map(s => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        <button type="button" data-audit-remove="${escapeHtml(a.auditRef)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>

}

function auditResultsHtml() {
  const all = auditFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  auditFilter.page = Math.min(Math.max(1, auditFilter.page), totalPages);
  const start = (auditFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Audit Ref. / Date', 'Area / Type', 'Observation', 'Risk / Follow-up', 'Status', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((a, i) => auditRow(a, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No audit findings match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      ${finPager('auditpage', auditFilter.page, totalPages)}
    </div>`;
}

function auditCounterText() {
  return `${auditFiltered().length} of ${auditFindings.length} finding${auditFindings.length === 1 ? '' : 's'}`;
}

function renderFinanceAudit(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="auditSummary">${auditSummaryCards()}</div>
      ${auditReportCard()}
      ${auditFilterBar()}
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
        <div class="flex flex-wrap items-start justify-between gap-3 p-4">
          <div>
            <h3 class="text-section-title text-primary">Audit Findings Register</h3>
            <p id="auditCounter" class="text-helper text-muted mt-0.5">${auditCounterText()}</p>
          </div>
          <button type="button" id="auditNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Audit Finding</button>
        </div>
        <div id="auditResults">${auditResultsHtml()}</div>
      </section>
    </div>`;
  auditBindEvents(container);
}

function auditRefresh(container, withSummary) {
  container.querySelector('#auditResults').innerHTML = auditResultsHtml();
  container.querySelector('#auditCounter').textContent = auditCounterText();
  if (withSummary) container.querySelector('#auditSummary').innerHTML = auditSummaryCards();
  // The findings summary report reads this same list, so keep it current once generated.
  if (withSummary && auditReport.generated) container.querySelector('#auditReportOut').innerHTML = auditReportHtml();
}

function auditBindEvents(container) {
  const bind = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { auditFilter[key] = e.target.value; auditFilter.page = 1; auditRefresh(container); });
  bind('auditSearch', 'q', 'input');
  bind('auditAreaFilter', 'area', 'change');
  bind('auditRiskFilter', 'risk', 'change');
  bind('auditStatusFilter', 'status', 'change');

  container.querySelector('#auditNew').addEventListener('click', () => auditOpenNewModal(container));

  container.querySelector('#auditReportGenerate').addEventListener('click', () => {
    auditReport.type = container.querySelector('#auditReportType').value;
    auditReport.from = container.querySelector('#auditReportFrom').value;
    auditReport.to = container.querySelector('#auditReportTo').value;
    auditReport.generated = true;
    container.querySelector('#auditReportOut').innerHTML = auditReportHtml();
  });

  const results = container.querySelector('#auditResults');
  results.addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-auditpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(auditFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.auditpage;
      auditFilter.page = p === 'prev' ? Math.max(1, auditFilter.page - 1) : p === 'next' ? Math.min(totalPages, auditFilter.page + 1) : +p;
      auditRefresh(container);
      return;
    }
    const removeBtn = e.target.closest('[data-audit-remove]');
    if (removeBtn) {
      const i = auditFindings.findIndex(a => a.auditRef === removeBtn.dataset.auditRemove);
      if (i > -1) auditFindings.splice(i, 1);
      auditRefresh(container, true);
    }
  });
  results.addEventListener('change', (e) => {
    if (!e.target.dataset.auditStatus) return;
    const a = auditFindings.find(x => x.auditRef === e.target.dataset.auditStatus);
    if (a) a.status = e.target.value;
    auditRefresh(container, true);
  });
}

function auditOpenNewModal(container) {
  const today = new Date().toISOString().slice(0, 10);
  finOpenModal({
    id: 'auditNewModal', title: 'New Audit Finding', icon: 'doc', wide: true, submitLabel: 'Save Finding',
    body: [
      finFormField('Audit Ref.', 'ref', { value: auditNextRef(), readonly: true }),
      finFormField('Area', 'area', { options: AUDIT_AREAS }),
      finFormField('Audit Type', 'auditType', { options: AUDIT_TYPES }),
      finFormField('Auditor Name', 'auditor', { req: true, placeholder: 'e.g. Internal Audit Dept.' }),
      finFormField('Date', 'date', { type: 'date', value: today }),
      finFormField('Risk Level', 'risk', { options: AUDIT_RISK_LEVELS }),
      finFormField('Status', 'status', { options: AUDIT_STATUSES }),
      finFormField('Follow-up Date (optional)', 'followUp', { type: 'date' }),
      finFormField('Observation / Finding', 'observation', { textarea: true, span: true, req: true, placeholder: 'What was found during the audit' }),
      finFormField('Recommendation (optional)', 'recommendation', { textarea: true, span: true, placeholder: 'Corrective action recommended' }),
    ].join(''),
    onSubmit(form) {
      const v = (n) => finFormVal(form, n);
      if (!v('auditor')) return 'Enter the auditor name.';
      if (!v('date')) return 'Enter the audit date.';
      if (!v('observation')) return 'Describe what was found.';
      if (v('followUp') && v('followUp') < v('date')) return 'Follow-up date cannot be before the audit date.';
      auditFindings.push({
        auditRef: auditNextRef(), area: v('area'), auditType: v('auditType'), auditorName: v('auditor'), date: v('date'),
        observation: v('observation'), riskLevel: v('risk'), status: v('status'), recommendation: v('recommendation'), followUpDate: v('followUp'),
      });
      auditFilter.page = Math.ceil(auditFiltered().length / COA_PAGE_SIZE);
      auditRefresh(container, true);
    },
  });
}

// ---------- Financial Statements ----------
// Content ported from the Finance reference build: Trial Balance, General Ledger, Profit & Loss
// and Balance Sheet, all computed from the account lines saved by every posted Journal Entry and
// voucher (coaJournalEntries). Nothing here is stored — each tab is recomputed from the ledger.
const FS_TABS = ['Trial Balance', 'General Ledger', 'Profit & Loss', 'Balance Sheet'];
const fsState = { ledgerAccount: '' };

function fsBalances() {
  const by = {};
  coaJournalEntries.forEach(e => e.lines.forEach(l => {
    const x = by[l.account] || (by[l.account] = { debit: 0, credit: 0 });
    x.debit += l.debit; x.credit += l.credit;
  }));
  return by;
}

// Net balance on the account's normal side (debit-normal: Dr − Cr; credit-normal: Cr − Dr). A
// contra account (e.g. Accumulated Depreciation) simply comes out negative.
function fsNet(acc, by) {
  const x = by[acc.code] || { debit: 0, credit: 0 };
  return acc.normal === 'debit' ? x.debit - x.credit : x.credit - x.debit;
}

function fsSection(catKey, by) {
  const rows = coaAllAccounts().filter(a => a.cat === catKey).map(a => ({ code: a.code, name: a.name, amount: fsNet(a, by) })).filter(r => Math.abs(r.amount) > 0.004);
  return { rows, total: rows.reduce((s, r) => s + r.amount, 0) };
}

// Signed BDT amount with a true minus sign, used wherever a total can go negative.
function fsMoney(n) { return `${n < -0.004 ? '−' : ''}${coaMoney(Math.abs(n))}`; }

function fsBalancedPill(ok) { return finPill(ok ? 'Balanced' : 'Not balanced', ok ? 'success' : 'danger'); }

function fsEmptyCard(what) {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow px-6 py-12 text-center">
      <p class="text-body text-muted">No journal entries yet — post a voucher from Voucher Management to see ${what} here.</p>
    </section>`;
}

function fsTableHead(cols) {
  return `<thead><tr class="border-b border-side-line">${cols.map(([h, right], i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === cols.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${right ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}</tr></thead>`;
}

function fsAmountRows(rows, emptyText) {
  return rows.length ? rows.map(r => `
    <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
      <td class="pl-4 pr-2 py-2 fs-base text-secondary whitespace-nowrap tabular">${escapeHtml(r.code)}</td>
      <td class="px-3 py-2 fs-base text-primary">${escapeHtml(r.name)}</td>
      <td class="pr-4 pl-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${fsMoney(r.amount)}</td>
    </tr>`).join('') : `<tr><td colspan="3" class="px-4 py-6 text-center fs-base text-muted">${emptyText}</td></tr>`;
}

function fsSectionCard(title, section, totalLabel, emptyText) {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="p-4"><h3 class="text-section-title text-primary">${escapeHtml(title)}</h3></div>
      <div class="overflow-x-auto border-t border-side-line">
        <table class="w-full">${fsTableHead([['Code'], ['Account'], ['Amount (BDT)', true]])}<tbody>${fsAmountRows(section.rows, emptyText)}</tbody></table>
      </div>
      <div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
        <p class="text-body-medium text-secondary">${escapeHtml(totalLabel)}</p>
        <p class="fs-title font-semibold text-primary tabular">BDT ${fsMoney(section.total)}</p>
      </div>
    </section>`;
}

function fsTrialHtml() {
  const by = fsBalances();
  let totalDr = 0, totalCr = 0;
  const rows = [];
  coaAllAccounts().forEach(a => {
    const x = by[a.code];
    if (!x) return;
    const net = x.debit - x.credit;
    if (Math.abs(net) < 0.005) return;
    const dr = net > 0 ? net : 0, cr = net < 0 ? -net : 0;
    totalDr += dr; totalCr += cr;
    rows.push(`
      <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
        <td class="pl-4 pr-2 py-2 fs-base text-secondary whitespace-nowrap tabular">${escapeHtml(a.code)}</td>
        <td class="px-3 py-2 fs-base text-primary">${escapeHtml(a.name)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap">${escapeHtml(a.catLabel)}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${dr ? coaMoney(dr) : ''}</td>
        <td class="pr-4 pl-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${cr ? coaMoney(cr) : ''}</td>
      </tr>`);
  });
  if (!rows.length) return fsEmptyCard('balances');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="p-4">
        <h3 class="text-section-title text-primary">Trial Balance</h3>
        <p class="text-helper text-muted mt-0.5">${rows.length} account${rows.length === 1 ? '' : 's'} with a balance</p>
      </div>
      <div class="overflow-x-auto border-t border-side-line">
        <table class="w-full min-w-[640px]">${fsTableHead([['Code'], ['Account'], ['Category'], ['Debit (BDT)', true], ['Credit (BDT)', true]])}<tbody>${rows.join('')}</tbody></table>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-8 px-4 py-3.5 border-t border-side-line">
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Debit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalDr)}</p></div>
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Credit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalCr)}</p></div>
        ${fsBalancedPill(Math.abs(totalDr - totalCr) < 0.005)}
      </div>
    </section>`;
}

function fsLedgerHtml() {
  const selected = fsState.ledgerAccount || coaAccountList()[0];
  const acc = coaFindAccount(selected);
  const lines = [];
  coaJournalEntries.forEach((e, idx) => e.lines.forEach(l => { if (acc && l.account === acc.code) lines.push({ e, l, idx }); }));
  lines.sort((a, b) => (a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.idx - b.idx));
  let running = 0, totalDr = 0, totalCr = 0;
  const rows = lines.map(({ e, l }) => {
    running += acc.normal === 'debit' ? l.debit - l.credit : l.credit - l.debit;
    totalDr += l.debit; totalCr += l.credit;
    return `
      <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
        <td class="pl-4 pr-2 py-2 fs-base text-secondary whitespace-nowrap tabular">${coaFormatDateDisplay(e.date)}</td>
        <td class="px-3 py-2 fs-base font-medium text-primary whitespace-nowrap tabular">${escapeHtml(e.ref)}</td>
        <td class="px-3 py-2 fs-base text-secondary">${escapeHtml(e.memo)}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${l.debit ? coaMoney(l.debit) : ''}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${l.credit ? coaMoney(l.credit) : ''}</td>
        <td class="pr-4 pl-3 py-2 fs-base font-semibold text-primary whitespace-nowrap tabular text-right">${fsMoney(running)}</td>
      </tr>`;
  });
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="max-w-sm">${coaField('Account', `<select id="fsLedgerAccount" class="${COA_INPUT}">${coaAccountOptionsHtml(selected)}</select>`)}</div>
    </section>
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="p-4">
        <h3 class="text-section-title text-primary">General Ledger — ${escapeHtml(selected)}</h3>
        <p class="text-helper text-muted mt-0.5">${lines.length} entr${lines.length === 1 ? 'y' : 'ies'} · normal balance: ${acc ? acc.normal : 'debit'}</p>
      </div>
      <div class="overflow-x-auto border-t border-side-line">
        <table class="w-full min-w-[760px]">${fsTableHead([['Date'], ['Voucher'], ['Memo'], ['Debit (BDT)', true], ['Credit (BDT)', true], ['Balance (BDT)', true]])}
          <tbody>${rows.length ? rows.join('') : `<tr><td colspan="6" class="px-4 py-10 text-center fs-base text-muted">No entries posted to ${escapeHtml(selected)} yet.</td></tr>`}</tbody>
        </table>
      </div>
      ${rows.length ? `
      <div class="flex flex-wrap items-center justify-end gap-8 px-4 py-3.5 border-t border-side-line">
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Debit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalDr)}</p></div>
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Credit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalCr)}</p></div>
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Closing Balance</p><p class="fs-title font-semibold text-primary tabular">BDT ${fsMoney(running)}</p></div>
      </div>` : ''}
    </section>`;
}

function fsIncome(by) {
  const rev = fsSection('revenue', by), exp = fsSection('expense', by);
  return { rev, exp, net: rev.total - exp.total };
}

function fsPlHtml() {
  const by = fsBalances();
  const { rev, exp, net } = fsIncome(by);
  if (!rev.rows.length && !exp.rows.length) return fsEmptyCard('the Profit & Loss statement');
  return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, coaMoney(rev.total), 'Total Revenue (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaMoney(exp.total), 'Total Expenses (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, fsMoney(net), net >= 0 ? 'Net Profit (BDT)' : 'Net Loss (BDT)')}
    </div>
    ${fsSectionCard('Revenue', rev, 'Total Revenue', 'No revenue posted yet.')}
    ${fsSectionCard('Expenses', exp, 'Total Expenses', 'No expenses posted yet.')}`;
}

function fsBsHtml() {
  const by = fsBalances();
  const assets = fsSection('asset', by), liab = fsSection('liability', by), eq = fsSection('equity', by);
  if (!assets.rows.length && !liab.rows.length && !eq.rows.length && !fsIncome(by).rev.rows.length && !fsIncome(by).exp.rows.length) return fsEmptyCard('the Balance Sheet');
  const earnings = fsIncome(by).net;
  const totalEquity = eq.total + earnings;
  const balanced = Math.abs(assets.total - (liab.total + totalEquity)) < 0.005;
  const equityWithEarnings = { rows: [...eq.rows, { code: '—', name: 'Current Year Earnings', amount: earnings }], total: totalEquity };
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, fsMoney(assets.total), 'Total Assets (BDT)')}
      ${coaCashBankStatCard(AP_AR_ICON_OUTSTANDING, fsMoney(liab.total), 'Total Liabilities (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, fsMoney(totalEquity), 'Total Equity (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, balanced ? 'Balanced' : 'Not balanced', 'Assets = Liabilities + Equity')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">

// Content ported from the Finance reference build: a requisition is raised against an already
// confirmed purchase order, carrying the PO's style, supplier and value forward so procurement
// never has to retype them. The PO list itself is Procurement > Purchase Order's confirmed
// records (procurementPOs, defined further down) — both screens share the one source of truth.
const PR_INVENTORY_ITEMS = [
  'Cotton Jersey Fabric (180 GSM)', 'Woven Twill Fabric', 'Denim Fabric', 'Dyeing & Finishing Service',
  'Sewing Thread', 'Button & Trims Set', 'Elastic Tape', 'Poly Bag & Packaging',
];

const purchaseRequisitions = [];

const prFilter = { q: '', supplier: 'All Suppliers', method: 'All Payment Methods', style: 'All Styles', po: 'All POs', from: '', to: '' };

function prSupplierFilterOptions() { return Array.from(new Set(purchaseRequisitions.map(r => r.supplier))).sort(); }
function prMethodFilterOptions() { return Array.from(new Set(purchaseRequisitions.map(r => r.paymentMethod))).sort(); }
function prStyleFilterOptions() { return Array.from(new Set(purchaseRequisitions.map(r => r.styleNo))).sort(); }
function prPoFilterOptions() { return Array.from(new Set(purchaseRequisitions.map(r => r.poNo))).sort(); }

function prFiltered() {
  const q = prFilter.q.trim().toLowerCase();
  return purchaseRequisitions.filter(r => {
    if (q && !(r.prNo.toLowerCase().includes(q) || r.poNo.toLowerCase().includes(q) || r.supplier.toLowerCase().includes(q) || r.styleNo.toLowerCase().includes(q) || r.inventoryItem.toLowerCase().includes(q))) return false;
    if (prFilter.supplier !== 'All Suppliers' && r.supplier !== prFilter.supplier) return false;
    if (prFilter.method !== 'All Payment Methods' && r.paymentMethod !== prFilter.method) return false;
    if (prFilter.style !== 'All Styles' && r.styleNo !== prFilter.style) return false;
    if (prFilter.po !== 'All POs' && r.poNo !== prFilter.po) return false;
    if (prFilter.from && r.date < prFilter.from) return false;
    if (prFilter.to && r.date > prFilter.to) return false;
    return true;
  });
}

  poId: '', supplier: '', expectedDate: '', inventoryItem: '', remarks: '',

function prNextNo() {
  const max = purchaseRequisitions.reduce((m, r) => Math.max(m, parseInt(r.prNo.split('-').pop(), 10) || 0), 0);
  return `PR-${String(max + 1).padStart(6, '0')}`;

function prConfirmedPOs() {
  return procurementPOs.filter(p => p.status === 'Confirmed');

function prFindPO(id) {
  return procurementPOs.find(p => String(p.id) === String(id) && p.status === 'Confirmed') || null;

function prSupplierOptions() {
  return Array.from(new Set(procurementSuppliers.map(s => s.name).concat(procurementPOs.map(p => p.supplier)).concat(apArPartyOptions('payable')))).sort();
}

function prSetMsg(text, tone) {
  prForm.msg = text || '';

function renderPurchaseRequisition(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${prOrderCard()}
      ${prDetailsCard()}
      ${prFooterButtons()}
      ${prFilterBar()}
      ${prRecentCard()}
    </div>`;
  prBindEvents(container);
}

function prRefreshResults(container) {
  container.querySelector('#prResults').innerHTML = prResultsHtml();
  container.querySelector('#prCounter').textContent = prCounterText();
}

function prBindEvents(container) {
  container.querySelectorAll('[data-prf]').forEach(el => {
    const handler = () => {
      prForm[el.dataset.prf] = el.value;
      if (el.dataset.prf === 'poId') {
        const po = prFindPO(el.value);
        prForm.supplier = po ? po.supplier : '';
        prForm.expectedDate = po ? poEarliestExpected(po) : '';
        renderPurchaseRequisition(container);
      }
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { prForm[el.dataset.prf] = el.value; });
  });

  container.querySelector('#prResetBtn').addEventListener('click', () => {
    prResetForm();
    renderPurchaseRequisition(container);
  });

  container.querySelector('#prSaveBtn').addEventListener('click', () => {
    const po = prFindPO(prForm.poId);
    if (!po) return prSetMsg('Select a confirmed purchase order before saving.', 'danger');
    if (!prForm.supplier) return prSetMsg('Select a supplier before saving.', 'danger');
    if (!prForm.expectedDate) return prSetMsg('Select an expected date before saving.', 'danger');
    if (!prForm.inventoryItem) return prSetMsg('Select an inventory item before saving.', 'danger');

    const prNo = prNextNo();
    purchaseRequisitions.unshift({
      prNo,
      date: new Date().toISOString().slice(0, 10),
      poNo: po.poNo,
      styleNo: po.styleNo,
      supplier: prForm.supplier,
      inventoryItem: prForm.inventoryItem,
      amount: poGrandTotal(po),
      paymentMethod: po.method,
      expectedDate: prForm.expectedDate,
      remarks: prForm.remarks.trim(),
    });
    prResetForm();
    renderPurchaseRequisition(container);
    prSetMsg(`Purchase requisition ${prNo} saved.`, 'success');
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { prFilter[key] = e.target.value; prRefreshResults(container); });
  bindFilter('prSearch', 'q', 'input');
  bindFilter('prSupplierFilter', 'supplier', 'change');
  bindFilter('prMethodFilter', 'method', 'change');
  bindFilter('prStyleFilter', 'style', 'change');
  bindFilter('prPoFilter', 'po', 'change');
  bindFilter('prFromFilter', 'from', 'change');
  bindFilter('prToFilter', 'to', 'change');
}

function supRecentCard() {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">

        <h3 class="text-section-title text-primary">Suppliers</h3>
        <p id="supCounter" class="text-helper text-muted">${supCounterText()}</p>
      </div>
      <div id="supResults">${supResultsHtml()}</div>
    </section>`;
}

function renderSupplierManagement(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${supFormCard()}
      ${supFilterBar()}
      ${supRecentCard()}
    </div>`;
  supBindEvents(container);
}

function supRefreshResults(container) {
  container.querySelector('#supResults').innerHTML = supResultsHtml();
  container.querySelector('#supCounter').textContent = supCounterText();
}

function supBindEvents(container) {
  container.querySelectorAll('[data-supf]').forEach(el => {
    const handler = () => { supForm[el.dataset.supf] = el.value; };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });

  container.querySelector('#supResetBtn').addEventListener('click', () => {
    supResetForm();
    renderSupplierManagement(container);
  });

  container.querySelector('#supSaveBtn').addEventListener('click', () => {
    if (!supForm.name.trim()) return supSetMsg('Supplier name is required.', 'danger');
    if (supForm.editId) {
      const s = procurementSuppliers.find(x => x.id === supForm.editId);
      Object.assign(s, {
        name: supForm.name.trim(), contactPerson: supForm.contactPerson.trim(), phone: supForm.phone.trim(),
        email: supForm.email.trim(), address: supForm.address.trim(), country: supForm.country,
        paymentTerms: supForm.paymentTerms.trim(), status: supForm.status, remarks: supForm.remarks.trim(),
      });
      supResetForm();
      renderSupplierManagement(container);
      supSetMsg(`Supplier ${s.code} updated.`, 'success');
    } else {
      const code = supNextCode();
      procurementSuppliers.push({
        id: procurementSuppliers.reduce((m, x) => Math.max(m, x.id), 0) + 1,
        code, name: supForm.name.trim(), contactPerson: supForm.contactPerson.trim(), phone: supForm.phone.trim(),
        email: supForm.email.trim(), address: supForm.address.trim(), country: supForm.country,
        paymentTerms: supForm.paymentTerms.trim(), status: supForm.status, remarks: supForm.remarks.trim(),
      });
      supResetForm();
      renderSupplierManagement(container);
      supSetMsg(`Supplier ${code} saved.`, 'success');
    }
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { supFilter[key] = e.target.value; supRefreshResults(container); });
  bindFilter('supSearch', 'q', 'input');
  bindFilter('supStatusFilter', 'status', 'change');

  container.querySelector('#supResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-sup-edit]');
    if (editBtn) {
      const s = procurementSuppliers.find(x => x.id === +editBtn.dataset.supEdit);
      if (s) {
        Object.assign(supForm, { editId: s.id, code: s.code, name: s.name, contactPerson: s.contactPerson, phone: s.phone, email: s.email, address: s.address, country: s.country, paymentTerms: s.paymentTerms, status: s.status, remarks: s.remarks, msg: '', msgTone: 'muted' });
        renderSupplierManagement(container);
      }
      return;
    }
    const toggleBtn = e.target.closest('[data-sup-toggle]');
    if (toggleBtn) {
      const s = procurementSuppliers.find(x => x.id === +toggleBtn.dataset.supToggle);
      if (s) { s.status = s.status === 'Active' ? 'Inactive' : 'Active'; supRefreshResults(container); }
    }
  });
}

// ---------- Purchase Order (Procurement) ----------
// Content ported from the Finance reference build's Purchase Order page: a raw-material order
// placed with a general supplier against a confirmed style, with one or more raw product lines.
// Only Confirmed orders here are offered as source documents by Purchase Requisition and Goods
// Receipt further down.
const PROC_PM = ['Due', 'Cash', 'Bank', 'Partial Payment', 'LC', 'BtB LC'];
const PROC_PARTIAL = ['Allowed', 'Denied'];
const PROC_STATUSES = ['Draft', 'Confirmed', 'Cancelled'];
const PROC_ROUTE_TXT = {
  Due: 'Available for a Debit / Credit Voucher in Finance, Voucher Management, and in General Entry.',
  Cash: 'Goes to a Purchase Voucher. A cash posting account is chosen at posting time.',
  Bank: 'Goes to a Purchase Voucher. A bank posting account is chosen at posting time.',
  'Partial Payment': 'Total, paid and remaining are tracked from posted payments.',
  LC: 'Available under Import Management / LC & Export Finance, for LC Management.',
  'BtB LC': 'Available under Import Management / LC & Export Finance, for BtB LC Management.',
};
const PROC_RAW_PRODUCTS = [
  { name: 'Cotton Jersey Fabric (180 GSM)', unit: 'Kg' },
  { name: 'Woven Twill Fabric', unit: 'Yds' },
  { name: 'Denim Fabric', unit: 'Yds' },
  { name: 'Dyeing & Finishing Service', unit: 'Kg' },
  { name: 'Sewing Thread', unit: 'Cone' },
  { name: 'Button & Trims Set', unit: 'Set' },
  { name: 'Elastic Tape', unit: 'Yds' },
  { name: 'Poly Bag & Packaging', unit: 'Pcs' },
];

function procRawUnit(product) {
  const p = PROC_RAW_PRODUCTS.find(x => x.name === product);
  return p ? p.unit : '';
}

const procurementPOs = [
  { id: 1, poNo: 'PO-2031', styleNo: 'AB-4587', product: "Men's Basic T-Shirt", supplier: 'ABC Textiles Ltd.', date: '2026-08-20', partial: 'Allowed', method: 'LC', status: 'Confirmed', remarks: '',
    lines: [{ product: 'Cotton Jersey Fabric (180 GSM)', spec: '180 GSM, Black', unit: 'Kg', qty: 5000, price: 175, expectedDate: '2026-10-15', remarks: '' }] },
  { id: 2, poNo: 'PO-2044', styleNo: 'STY-118', product: 'Knit T-Shirt', supplier: 'Prime Dyeing & Finishing', date: '2026-08-25', partial: 'Denied', method: 'Bank', status: 'Confirmed', remarks: '',
    lines: [{ product: 'Dyeing & Finishing Service', spec: 'Reactive dyeing, Navy', unit: 'Kg', qty: 3300, price: 125, expectedDate: '2026-09-30', remarks: '' }] },
  { id: 3, poNo: 'PO-2052', styleNo: 'AB-4599', product: "Women's Denim Jacket", supplier: 'Golden Fiber Trims', date: '2026-09-05', partial: 'Allowed', method: 'LC', status: 'Confirmed', remarks: '',
    lines: [{ product: 'Denim Fabric', spec: '12 oz, Indigo', unit: 'Yds', qty: 2600, price: 100, expectedDate: '2026-11-05', remarks: '' }] },
];

function poGrandTotal(po) {
  return po.lines.reduce((s, l) => s + coaNum(l.qty) * coaNum(l.price), 0);
}

function poOrderedQty(po) {
  return po.lines.reduce((s, l) => s + coaNum(l.qty), 0);
}

function poReceivedQty(po) {
  return goodsReceipts.filter(g => g.poNo === po.poNo).reduce((s, g) => s + g.lines.reduce((a, l) => a + coaNum(l.qty), 0), 0);
}

function poDeliveryStatus(po) {
  const rec = poReceivedQty(po), ord = poOrderedQty(po);
  if (rec <= 0) return 'Not Received';
  return rec >= ord - 0.0005 ? 'Fully Received' : 'Partially Received';
}

function poEarliestExpected(po) {
  return po.lines.reduce((min, l) => (!min || (l.expectedDate && l.expectedDate < min)) ? l.expectedDate : min, '');
}

function poBlankLine() {
  return { product: '', spec: '', unit: '', qty: '', price: '', expectedDate: '', remarks: '' };
}

const poForm = {
  editId: null, styleNo: '', supplier: '', date: new Date().toISOString().slice(0, 10),
  partial: PROC_PARTIAL[0], method: '', remarks: '', lines: [poBlankLine()],
  msg: '', msgTone: 'muted',
};

const poFilter = { q: '', status: 'All Statuses', method: 'All Payment Methods', supplier: 'All Suppliers', style: 'All Styles' };

function poResetForm() {
  poForm.editId = null;
  poForm.styleNo = ''; poForm.supplier = ''; poForm.date = new Date().toISOString().slice(0, 10);
  poForm.partial = PROC_PARTIAL[0]; poForm.method = ''; poForm.remarks = ''; poForm.lines = [poBlankLine()];

}

function poNextNo() {
  const max = procurementPOs.reduce((m, p) => Math.max(m, parseInt(p.poNo.split('-').pop(), 10) || 0), 0);

}

function poSetMsg(text, tone) {
  poForm.msg = text || '';

function poFiltered() {
  const q = poFilter.q.trim().toLowerCase();
  return procurementPOs.filter(p => {
    if (q && !(p.poNo.toLowerCase().includes(q) || p.styleNo.toLowerCase().includes(q) || p.supplier.toLowerCase().includes(q))) return false;
    if (poFilter.status !== 'All Statuses' && p.status !== poFilter.status) return false;
    if (poFilter.method !== 'All Payment Methods' && p.method !== poFilter.method) return false;
    if (poFilter.supplier !== 'All Suppliers' && p.supplier !== poFilter.supplier) return false;
    return true;
  });
}

function poCounterText() {
  return `${poFiltered().length} of ${procurementPOs.length} order${procurementPOs.length === 1 ? '' : 's'}`;

function poStatusPill(status) {
