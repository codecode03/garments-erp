<style>
  /* ================================================================
     Theme tokens — sourced from ERP_Color.html (GarmentsERP Color System)
     ================================================================ */
  :root,
  html[data-theme="light"] {
    color-scheme: light;   /* native controls (date picker) follow the theme */
    --bg: #EAEFEE;
    --surface: #F1F3F4;
    --card-bg: #F7F9F8;
    --hover: #E1E5E8;
    --active-tint: rgba(13, 148, 136, 0.09);   /* selected row / list option */
    --border: #AEB5BB;                       /* controls only: inputs, selects, tables */
    --border-panel: rgba(16, 21, 27, 0.07);  /* panels lean on fill + shadow */
    --border-inner: #E2E8F0;

    --text-primary: #10151B;
    --text-secondary: #3B4450;
    --text-muted: #5B6572;
    --text-disabled: #94A3B8;
    --text-inverse: #FFFFFF;

    --accent: #0D9488;
    --accent-hover: #0F766E;
    --accent-light: #D7F5F0;
    --accent-soft: #E6FFFB;
    --accent-ring: rgba(13, 148, 136, 0.28);

    --success: #16A34A;
    --warning: #F59E0B;
    --danger: #EF4444;
    --info: #3B82F6;
    --neutral: #64748B;
    --success-soft: #DCFCE7;
    --warning-soft: #FEF3C7;
    --danger-soft: #FEE2E2;
    --info-soft: #DBEAFE;
    --neutral-soft: #E2E8F0;
    --violet: #8B5CF6;
    --violet-soft: #EDE9FE;

    --nav-active-bg: #0D9488;       /* unchanged — solid brand fill */
    --nav-active-text: #FFFFFF;
    --nav-active-icon: #FFFFFF;
    --nav-active-border: transparent;
    --nav-sub-active-bg: #99F6E4;   /* teal-200: sits between the loud teal-300 and the invisible teal-50 */
    --nav-sub-active-text: #115E59;
    --nav-sub-active-dot: #0D9488;
    --nav-sub-active-bar: transparent;
    --nav-hover-bg: #E1E5E8;
    --nav-hover-text: #1F2937;
    --nav-text: #3B4450;
    --nav-sub-text: #4B5563;

    --nav-dot: #9CA3AF;

    --chart-1: #0D9488; --chart-2: #3B82F6; --chart-3: #F59E0B; --chart-4: #EF4444; --chart-5: #8B5CF6;
    --chart-6: #06B6D4; --chart-7: #84CC16; --chart-8: #F97316; --chart-9: #EC4899; --chart-10: #64748B;

    --scrollbar-track: #E7E9EB;
    --scrollbar-thumb: #A8AEB5;
    --overlay: rgba(16, 21, 27, 0.45);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F172A;
    --surface: #141B2E;
    --card-bg: #1E293B;
    --hover: #273449;
    --active-tint: rgba(45, 212, 191, 0.13);   /* selected row / list option */
    --border: #334155;
    --border-panel: #334155;                 /* no usable shadow on dark, border does the work */
    --border-inner: #334155;

    --text-primary: #F8FAFC;
    --text-secondary: #CBD5E1;
    --text-muted: #94A3B8;
    --text-disabled: #64748B;
    --text-inverse: #0F172A;

    --accent: #2DD4BF;
    --accent-hover: #5EEAD4;
    --accent-light: #134E4A;
    --accent-soft: #0F766E;
    --accent-ring: rgba(45, 212, 191, 0.30);

    --success: #22C55E;
    --warning: #FBBF24;
    --danger: #F87171;
    --info: #60A5FA;
    --neutral: #94A3B8;
    --success-soft: rgba(34, 197, 94, 0.16);
    --warning-soft: rgba(251, 191, 36, 0.16);
    --danger-soft: rgba(248, 113, 113, 0.16);
    --info-soft: rgba(96, 165, 250, 0.16);
    --neutral-soft: rgba(148, 163, 184, 0.16);
    --violet: #A78BFA;
    --violet-soft: rgba(167, 139, 250, 0.18);

    --nav-active-bg: rgba(20, 184, 166, 0.15);
    --nav-active-text: #5EEAD4;
    --nav-active-icon: #5EEAD4;
    --nav-active-border: #2DD4BF;
    --nav-sub-active-bg: rgba(45, 212, 191, 0.22);
    --nav-sub-active-text: #99F6E4;
    --nav-sub-active-dot: #5EEAD4;
    --nav-sub-active-bar: transparent;
    --nav-hover-bg: #273449;

    --scrollbar-track: #1E293B;
    --scrollbar-thumb: #475569;
    --overlay: rgba(0, 0, 0, 0.6);
  }

  /* ---------- Radius scale ---------- */
  :root { --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px; }

  /* ---------- Motion ---------- */
  :root { --ease: cubic-bezier(0.2, 0, 0, 1); --dur-fast: 120ms; --dur: 160ms; }

  /* Specific properties only — never `all`, which animates layout and janks. */
  button, a, input, .cmdk-row {
    transition: background-color var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease);
  }
  body { transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ---------- Focus ---------- */
  :where(button, a, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  :where(button, a, [tabindex]):focus:not(:focus-visible) { outline: none; }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--r-xs); }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }

  #nav { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  #nav::-webkit-scrollbar { width: 4px; }
  #nav::-webkit-scrollbar-track { background: transparent; }
  #nav::-webkit-scrollbar-thumb { background: transparent; border-radius: var(--r-xs); }
  #nav:hover { scrollbar-color: var(--scrollbar-thumb) transparent; }
  #nav:hover::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); }

  .submenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease); }
  .submenu.open { grid-template-rows: 1fr; }
  .submenu > div { overflow: hidden; }
  .chev { transition: transform 180ms var(--ease); }
  .chev.open { transform: rotate(180deg); }

  /* ---------- Elevation ---------- */
  .premium-shadow { box-shadow: 0 1px 3px rgba(16, 21, 27, 0.11), 0 1px 1px rgba(16, 21, 27, 0.05); }
  html[data-theme="dark"] .premium-shadow { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25); }

  .card-shadow { box-shadow: 0 1px 3px rgba(16, 21, 27, 0.13), 0 4px 10px -4px rgba(16, 21, 27, 0.10); }
  html[data-theme="dark"] .card-shadow { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3); }

  .overlay-shadow { box-shadow: 0 16px 48px -12px rgba(16, 21, 27, 0.28), 0 4px 12px -4px rgba(16, 21, 27, 0.14); }
  html[data-theme="dark"] .overlay-shadow { box-shadow: 0 16px 48px -12px rgba(0, 0, 0, 0.7), 0 4px 12px -4px rgba(0, 0, 0, 0.5); }

  /* ---------- Typography scale ----------
     Large numbers get lighter weight + tighter tracking, not heavier weight.
     That is the difference between an enterprise figure and a marketing figure. */
  .text-display       { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .text-page-title    { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .text-section-title { font-size: 15px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .text-body          { font-size: 13.5px; line-height: 20px; font-weight: 400; }
  .text-body-medium   { font-size: 13.5px; line-height: 20px; font-weight: 500; }
  .text-label         { font-size: 12.5px; line-height: 18px; font-weight: 500; }
  .text-table-header  { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.045em; text-transform: uppercase; }
  .text-table-body    { font-size: 13px; line-height: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .text-helper        { font-size: 11.5px; line-height: 17px; font-weight: 400; }
  .text-micro         { font-size: 10.5px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  .num, input[type="number"], input[type="date"], .tabular { font-variant-numeric: tabular-nums; }
</style>

function escapeHtml(s) {

// ---------- Recently visited ----------
let recent = [];
try { recent = JSON.parse(localStorage.getItem('erp-recent') || '[]'); } catch (e) { recent = []; }

function pushRecent(moduleKey, subIndex) {
  if (moduleKey === 'dashboard') return;   // already pinned at the top of the nav
  recent = recent.filter(r => !(r.m === moduleKey && r.s === subIndex));
  recent.unshift({ m: moduleKey, s: subIndex });
  recent = recent.slice(0, 3);
  try { localStorage.setItem('erp-recent', JSON.stringify(recent)); } catch (e) { /* ignore */ }
}

function lookup(moduleKey, subIndex) {
  const mod = modules.find(m => m.key === moduleKey);
  if (!mod) return null;
  const sm = mod.submodules[subIndex];
  if (!sm) return null;
  return { mod, sm, single: mod.submodules.length === 1 };
}

// ---------- Single navigation entry point ----------
function goTo(moduleKey, subIndex) {
  state.moduleKey = moduleKey;
  state.subIndex = subIndex;
  state.tabIndex = 0;
  state.editingId = null;
  state.editingBomId = null;
  pushRecent(moduleKey, subIndex);
  renderNav();
  renderContent();
}

// Active top-level item: solid accent fill in light, teal tint + inset bar in dark.
const NAV_ACTIVE_CLASS = 'bg-side-navActiveBg text-side-navActiveText font-semibold shadow-[inset_2px_0_0_0_var(--nav-active-border)]';
const NAV_IDLE_CLASS = 'font-medium text-side-navText hover:bg-side-navHoverBg hover:text-side-navHoverText';

function renderNav() {
  nav.innerHTML = '';

  // --- Recent section ---
  const validRecent = recent.map(r => ({ r, hit: lookup(r.m, r.s) })).filter(x => x.hit);
  if (validRecent.length) {
    const head = document.createElement('p');
    head.className = 'text-micro text-disabled px-3 pt-1 pb-1.5';
    head.textContent = 'Recent';
    nav.appendChild(head);

    validRecent.forEach(({ r, hit }) => {
      const isHere = state.moduleKey === r.m && state.subIndex === r.s;
      const b = document.createElement('button');
      b.className = `w-full flex items-center gap-2.5 px-3 py-1.5 rounded-md text-label text-left ${isHere ? 'text-side-accent font-semibold' : 'text-side-navSubText hover:bg-side-navHoverBg hover:text-side-navHoverText'}`;
      b.innerHTML = `${iconSvg(hit.mod.icon, 'w-3.5 h-3.5 shrink-0 opacity-70')}<span class="truncate">${escapeHtml(hit.sm.name)}</span>`;
      b.addEventListener('click', () => goTo(r.m, r.s));
      nav.appendChild(b);
    });

    const rule = document.createElement('div');
    rule.className = 'h-px bg-side-line mx-3 my-2.5';
    nav.appendChild(rule);
  }

  // --- Modules ---
  modules.forEach(mod => {
    const isModuleOpen = state.moduleKey === mod.key;

    if (mod.submodules.length === 1) {
      const flatBtn = document.createElement('button');
      flatBtn.className = `w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-label ${isModuleOpen ? NAV_ACTIVE_CLASS : NAV_IDLE_CLASS}`;
      flatBtn.innerHTML = `${iconSvg(mod.icon, 'w-4 h-4 shrink-0')}<span class="flex-1 text-left">${escapeHtml(mod.name)}</span>`;
      flatBtn.addEventListener('click', () => goTo(mod.key, 0));
      nav.appendChild(flatBtn);
      return;
    }

    const wrap = document.createElement('div');

    const btn = document.createElement('button');
    btn.className = `w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-label ${isModuleOpen ? NAV_ACTIVE_CLASS : NAV_IDLE_CLASS}`;
    btn.setAttribute('aria-expanded', String(isModuleOpen));
    btn.innerHTML = `
      ${iconSvg(mod.icon, 'w-4 h-4 shrink-0')}
      <span class="flex-1 text-left">${escapeHtml(mod.name)}</span>
      <svg class="chev ${isModuleOpen ? 'open' : ''} w-3 h-3 shrink-0 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    `;
    btn.addEventListener('click', () => {
      if (state.moduleKey === mod.key) { state.moduleKey = null; renderNav(); renderContent(); }
      else { goTo(mod.key, 0); }
    });

    const sub = document.createElement('div');
    sub.className = `submenu ${isModuleOpen ? 'open' : ''}`;
    const subInner = document.createElement('div');
    const list = document.createElement('div');
    list.className = 'pt-0.5 pb-1 pl-[22px] flex flex-col gap-px';

    mod.submodules.forEach((sm, i) => {
      const active = isModuleOpen && state.subIndex === i;
      const item = document.createElement('button');
      item.className = `flex items-center gap-2 text-left px-2.5 py-1.5 text-[12.5px] rounded ${active ? 'bg-side-navSubActiveBg text-side-navSubActiveText font-semibold shadow-[inset_2px_0_0_0_var(--nav-sub-active-bar)]' : 'text-side-navSubText hover:bg-side-navHoverBg hover:text-side-navHoverText'}`;
      item.setAttribute('aria-current', active ? 'page' : 'false');
      item.innerHTML = `<span class="w-1 h-1 rounded-full shrink-0 ${active ? 'bg-side-navSubActiveDot' : 'bg-side-navDot'}"></span><span>${escapeHtml(sm.name)}</span>`;
      item.addEventListener('click', (e) => { e.stopPropagation(); goTo(mod.key, i); });
      list.appendChild(item);
    });

    subInner.appendChild(list);
    sub.appendChild(subInner);
    wrap.appendChild(btn);
    wrap.appendChild(sub);
    nav.appendChild(wrap);
  });

/* Sparkline: a trend arrow tells you the sign, a sparkline tells you the shape. */
function sparkline(points, colorVar) {
  const w = 68, h = 24, pad = 2;
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max - min) || 1;
  const step = w / (points.length - 1);
  const d = points.map((p, i) => {
    const x = (i * step).toFixed(1);
    const y = (h - pad - ((p - min) / range) * (h - pad * 2)).toFixed(1);
    return `${i === 0 ? 'M' : 'L'}${x},${y}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" fill="none" preserveAspectRatio="none" aria-hidden="true" class="shrink-0">
    <path d="${d}" stroke="var(${colorVar})" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function statCard(s) {
  const up = s.delta.startsWith('+');
  return `
    <div class="bg-cardBg border border-side-panel rounded-lg card-shadow px-4 py-3.5">
      <div class="flex items-start justify-between gap-3 mb-2.5">
        <p class="text-micro text-muted">${escapeHtml(s.label)}</p>
        ${sparkline(s.series, s.color)}
      </div>
      <p class="text-display text-primary">${escapeHtml(s.value)}</p>
      <div class="flex items-baseline gap-1.5 mt-1.5">
        <span class="text-helper font-semibold ${up ? 'text-success' : 'text-danger'} tabular">${escapeHtml(s.delta)}</span>
        <span class="text-helper text-muted truncate">${escapeHtml(s.note)}</span>
      </div>
    </div>
  `;
}

/* ---------- form state ---------- */
const BI_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function biToday() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, '0')}-${BI_MONTHS[d.getMonth()]}-${d.getFullYear()}`;
}

/* <input type="date"> only speaks YYYY-MM-DD, so the form holds ISO and the
   table keeps the DD-Mon-YYYY the rest of the app already uses. */
function biTodayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function biToISO(display) {
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec(String(display || '').trim());
  if (!m) return '';
  const i = BI_MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
  return i < 0 ? '' : `${m[3]}-${String(i + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
}

function biFromISO(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
  return m ? `${m[3]}-${BI_MONTHS[Number(m[2]) - 1]}-${m[1]}` : '';
}

/* Auto number: highest existing serial + 1, stamped with the current year. */
function biNextNo() {
  const max = biInquiries.reduce((m, i) => Math.max(m, parseInt(i.no.split('-').pop(), 10) || 0), 0);
  return `INQ-${new Date().getFullYear()}-${String(max + 1).padStart(5, '0')}`;
}

function biFmtQty(v) {
  const digits = String(v == null ? '' : v).replace(/\D/g, '');
  return digits ? Number(digits).toLocaleString('en-US') : '';
}

/* Card A stands on its own — nothing in the inquiry writes to it, and it
   survives New, row clicks and saves. Typed by hand, start to finish. */
const biBuyerForm = { beneficiary: '', name: '', address: '', bank: '' };

const biForm = {
  no: '', date: '',
  buyerId: '', buyerText: '',
  contact: '', season: '', country: '',
  style: '', qty: '',
  msg: '', msgTone: 'muted',
};

const biCombo = { open: false, cursor: 0, items: [] };
let biOutsideClick = null;   // one document listener, re-bound on each render

function biBuyerById(id) { return biBuyers.find(b => b.id === id) || null; }

function biResetForm() {
  Object.assign(biForm, {
    no: biNextNo(), date: biTodayISO(),
    buyerId: '', buyerText: '',
    contact: '', season: '', country: '', style: '', qty: '', msg: '', msgTone: 'muted',
  });
  state.inqSel = null;
}

/* Buyer chosen -> Contact Person, Season, Country and the previous-order card.
   Nothing else, and all three stay editable afterwards. */
function biApplyBuyer(id) {
  const b = biBuyerById(id);
  if (!b) return;
  Object.assign(biForm, {
    buyerId: b.id, buyerText: b.name,
    contact: b.contact, season: b.season, country: b.country,
  });
}

/* Row click copies that inquiry's details into the form as a starting point.
   The number stays newly generated, so saving never overwrites the row. */
function biLoadInquiry(no) {
  const inq = biInquiries.find(i => i.no === no);
  if (!inq) return;
  const b = biBuyers.find(x => x.name === inq.buyer);
  biResetForm();
  state.inqSel = inq.no;
  biForm.date = biToISO(inq.date);
  biForm.buyerText = inq.buyer;
  if (b) biApplyBuyer(b.id);
  /* The row may have been edited away from the buyer default — it wins. */
  biForm.contact = inq.contact;
  biForm.season = inq.season;
  biForm.country = inq.country;
  biForm.style = inq.style;
  biForm.qty = inq.qty;
}

/* ---------- shared bits ---------- */
const BI_INPUT = 'w-full h-9 px-3 rounded border border-side-border bg-canvas text-[13px] font-medium text-primary placeholder-muted focus:outline-none focus:ring-2 focus:ring-[var(--accent-ring)] focus:border-side-accent';
const BI_AUTO  = 'w-full h-9 px-3 rounded border border-side-line bg-side-hover text-[13px] font-medium text-secondary cursor-default focus:outline-none';
const BI_BTN   = 'h-9 px-3.5 rounded border border-side-border text-label font-semibold text-secondary hover:bg-side-hover inline-flex items-center gap-1.5';
const BI_BTN_PRIMARY = 'h-9 px-3.5 rounded bg-side-accent text-white text-label font-semibold hover:bg-side-accentHover inline-flex items-center gap-1.5';
const BI_SAVE_ICON = '<svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>';

/* A filled pill says the same thing twice (colour + word). A dot is quieter. */
function biStatus(text, strong) {
  return `<span class="inline-flex items-center gap-1.5 whitespace-nowrap">
    <span class="w-[7px] h-[7px] rounded-full shrink-0" style="background:var(${BI_STATUS_VAR[text] || '--neutral'})"></span>
    <span class="text-[13px] ${strong ? 'font-medium text-primary' : 'text-secondary'}">${escapeHtml(text)}</span>
  </span>`;
}

/* Label recedes, value leads. No standalone colon column — alignment does that job. */
function biRow(label, value) {
  const empty = value === null || value === undefined || value === '';
  return `
    <div class="flex items-baseline gap-3 py-[5px]">
      <span class="text-[13px] text-muted w-[106px] shrink-0">${escapeHtml(label)}</span>
      <span class="text-[13px] ${empty ? 'text-disabled' : 'font-medium text-primary'} min-w-0">${empty ? '&mdash;' : escapeHtml(String(value))}</span>
    </div>`;
}

function biCard(icon, title, body, opts) {
  const o = opts || {};
  return `
    <section class="${o.span || ''} bg-cardBg border border-side-panel rounded-lg card-shadow p-4 flex flex-col">
      <div class="flex items-center gap-2 pb-2.5 mb-2.5 border-b border-side-line">
        <span class="text-side-accent shrink-0">${iconSvg(icon, 'w-4 h-4')}</span>
        <h3 class="text-[13px] font-semibold text-primary">${escapeHtml(title)}</h3>
        ${o.right ? `<div class="ml-auto shrink-0">${o.right}</div>` : ''}
      </div>
      <div class="flex-1">${body}</div>
    </section>`;
}

function biLabel(text, opts) {
  const o = opts || {};
  return `<span class="flex items-center gap-1.5 mb-1">
    <span class="text-[12px] font-medium text-muted">${escapeHtml(text)}</span>
    ${o.req ? '<span class="text-[12px] font-medium text-danger">*</span>' : ''}
  </span>`;
}

function biField(label, inner, opts) {
  return `<label class="block min-w-0">${biLabel(label, opts)}${inner}</label>`;
}

function biTextInput(key, placeholder, opts) {
  const o = opts || {};
  return `<input id="biF_${key}" data-bif="${key}" type="text" autocomplete="off"
    value="${escapeHtml(biForm[key] || '')}" placeholder="${escapeHtml(placeholder)}"
    class="${BI_INPUT} ${o.extra || ''}" />`;
}

/* Same control, bound to the standalone buyer card instead of the inquiry. */
function biBuyerFormInput(key, placeholder) {
  return `<input id="biB_${key}" data-bib="${key}" type="text" autocomplete="off"
    value="${escapeHtml(biBuyerForm[key] || '')}" placeholder="${escapeHtml(placeholder)}"
    class="${BI_INPUT}" />`;
}

function biAutoInput(id, value, placeholder) {
  return `<input id="${id}" type="text" readonly tabindex="-1" value="${escapeHtml(value || '')}"
    placeholder="${escapeHtml(placeholder)}" class="${BI_AUTO}" />`;
}

/* ---------- card A: buyer / beneficiary ---------- */

/* ---------- card C: previous order ---------- */
function biPreviousCard() {
  const b = biBuyerById(biForm.buyerId);
  let body;
  /* Cards share a height, so an empty state centres instead of clinging to the top. */
  const empty = (text) => `<div class="h-full flex items-center"><p class="text-body text-disabled">${text}</p></div>`;
  if (!b) {
    body = empty('Select a buyer to see their last order.');
  } else if (!b.prev) {
    body = empty(`No previous order &mdash; ${escapeHtml(b.name)} is a first-time buyer.`);
  } else {
    const p = b.prev;
    body = [
      biRow('Style', p.style),
      biRow('Quantity', p.qty + ' PCS'),
      biRow('Price', p.price),
      biRow('Bank Details', p.bank),
      biRow('LC Date', p.lc),
      biRow('Port Of Loading', p.port),
    ].join('');
  }
  return biCard('clipboard', 'Previous Order', `<div id="biPrevBody" class="h-full">${body}</div>`, {
    span: 'lg:col-span-12 xl:col-span-3',
    right: b ? `<span class="text-helper text-muted truncate max-w-[160px]">${escapeHtml(b.name)}</span>` : '',
  });
}

function biRenderCards() {
  const el = document.getElementById('biCards');
  if (!el) return;
  biCombo.open = false;
  el.innerHTML = biBuyerCard() + biInquiryCard() + biPreviousCard();
}

/* ---------- buyer combobox ---------- */
function biMatchBuyers(q) {
  const s = (q || '').trim().toLowerCase();
  if (!s) return biBuyers.slice();
  return biBuyers.filter(b => (b.name + ' ' + b.contact + ' ' + b.country + ' ' + b.season).toLowerCase().includes(s));
}

function biPaintList() {
  const list = document.getElementById('biBuyerList');
  if (!list) return;
  const items = biCombo.items;
  list.innerHTML = items.length ? items.map((b, i) => `
    <li role="option" data-id="${b.id}" aria-selected="${i === biCombo.cursor}"
      class="px-3 py-2 cursor-pointer flex items-center gap-2 ${i === biCombo.cursor ? 'bg-side-active' : ''}">
      <span class="w-[7px] h-[7px] rounded-full shrink-0" style="background:var(${BI_STATUS_VAR[b.quality] || '--neutral'})"></span>
      <span class="text-[13px] font-medium text-primary truncate">${escapeHtml(b.name)}</span>
      <span class="text-helper text-muted ml-auto shrink-0">${escapeHtml(b.country)}</span>
    </li>`).join('') : `
    <li class="px-3 py-2.5">
      <p class="text-helper text-muted">No buyer matches.</p>
      <button type="button" id="biAddFromList" class="text-helper font-semibold text-side-accent hover:text-side-accentHover mt-1">Add as a new buyer</button>
    </li>`;
}

function biOpenList(q) {
  const list = document.getElementById('biBuyerList');
  const input = document.getElementById('biBuyerInput');
  if (!list || !input) return;
  biCombo.items = biMatchBuyers(q);
  biCombo.cursor = 0;
  biCombo.open = true;
  list.classList.remove('hidden');
  input.setAttribute('aria-expanded', 'true');
  biPaintList();
}

function biCloseList() {
  const list = document.getElementById('biBuyerList');
  const input = document.getElementById('biBuyerInput');
  biCombo.open = false;
  if (list) list.classList.add('hidden');
  if (input) input.setAttribute('aria-expanded', 'false');
}

/* Targeted repaint — a full innerHTML rebuild here would steal focus mid-typing. */
function biPaintBuyer() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };
  set('biBuyerInput', biForm.buyerText);
  set('biF_contact', biForm.contact);
  set('biF_season', biForm.season);
  set('biF_country', biForm.country);

  const prev = document.getElementById('biPrevBody');
  if (prev) prev.parentElement.parentElement.outerHTML = biPreviousCard();
}

function biSetMsg(text, tone) {
  biForm.msg = text || '';
  biForm.msgTone = tone || 'muted';
  const el = document.getElementById('biFormMsg');
  if (el) {
    el.textContent = biForm.msg;
    el.className = `${biForm.msg ? '' : 'hidden '}text-helper text-${biForm.msgTone} mb-2.5`;
  }
}

function biSelectBuyer(id) {
  biApplyBuyer(id);
  biCloseList();
  biPaintBuyer();
  biSetMsg('');   /* the fields filling in is the feedback — also clears a stale error */
}

/* ---------- add new buyer ---------- */
function biOpenBuyerModal(prefillName) {
  if (document.getElementById('biModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  const wrap = document.createElement('div');

  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new buyer');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[580px] px-4">
      <form id="biBuyerForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">

          <h3 class="text-[13px] font-semibold text-primary">Add New Buyer</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0">${biLabel('Buyer Name', { req: true })}
            <input name="name" type="text" autocomplete="off" value="${escapeHtml(prefillName || '')}" placeholder="Company name" class="${BI_INPUT}" /></label>
          <label class="block min-w-0">${biLabel('First Beneficiary')}
            <input name="beneficiary" type="text" autocomplete="off" placeholder="Beneficiary name" class="${BI_INPUT}" /></label>
          <label class="block min-w-0">${biLabel('Contact Person', { req: true })}
            <input name="contact" type="text" autocomplete="off" placeholder="Contact name" class="${BI_INPUT}" /></label>
          <label class="block min-w-0">${biLabel('Buyer Quality')}
            <select name="quality" class="${BI_INPUT}">${opts(BI_QUALITY, 'New')}</select></label>
          <label class="block min-w-0">${biLabel('Season')}
            <select name="season" class="${BI_INPUT}">${opts(BI_SEASONS, BI_SEASONS[0])}</select></label>
          <label class="block min-w-0">${biLabel('Country')}
            <select name="country" class="${BI_INPUT}">${opts(BI_COUNTRIES, BI_COUNTRIES[0])}</select></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Address')}
            <input name="address" type="text" autocomplete="off" placeholder="Street, city, country" class="${BI_INPUT}" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Bank Details')}
            <input name="bank" type="text" autocomplete="off" placeholder="Country - bank name" class="${BI_INPUT}" /></label>
          <p id="biModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${BI_BTN}">Cancel</button>
          <button type="submit" class="${BI_BTN_PRIMARY}">Save Buyer</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#biBuyerForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();

  if (first) first.focus();
}

/* ---------- save ---------- */
function biSaveInquiry() {
  const b = biBuyerById(biForm.buyerId);
  if (!b) { biSetMsg('Pick a buyer before saving.', 'danger'); document.getElementById('biBuyerInput')?.focus(); return; }
  const qty = biFmtQty(biForm.qty);
  if (!qty) { biSetMsg('Style Quantity is required.', 'danger'); document.getElementById('biF_qty')?.focus(); return; }

  const rec = {
    no: biForm.no,
    date: biFromISO(biForm.date) || biToday(),
    buyer: b.name,
    contact: biForm.contact.trim() || b.contact,
    style: biForm.style.trim() || '—',
    qty,
    season: biForm.season.trim() || b.season,
    country: biForm.country.trim() || b.country,
    status: b.quality,
  };

  biInquiries.unshift(rec);

  /* Cleared and ready for the next one — the saved row is highlighted below. */
  biResetForm();
  state.inqSel = rec.no;
  state.inqQuery = '';
  const search = document.getElementById('biSearch');
  if (search) search.value = '';
  biRenderCards();
  refreshBiTable();
  biSetMsg(`Inquiry ${rec.no} saved.`, 'success');
}

/* ---------- table ---------- */
function biFiltered() {
  const q = (state.inqQuery || '').trim().toLowerCase();
  if (!q) return biInquiries;
  return biInquiries.filter(i =>
    (i.no + ' ' + i.buyer + ' ' + i.style + ' ' + i.season + ' ' + i.country + ' ' + i.status).toLowerCase().includes(q));
}

function refreshBiTable() {
  const body = document.getElementById('biTableBody');
  const count = document.getElementById('biCount');
  if (!body) return;
  const rows = biFiltered();

  body.innerHTML = rows.length ? rows.map((i, n) => {

/* ---------- page ---------- */
function renderBuyerInquiry(container) {
  if (state.inqQuery === undefined) state.inqQuery = '';
  /* First visit: a blank inquiry with a buyer already picked, so the auto-filled
     fields and the previous-order card have something to show. */
  if (!biForm.no) { biResetForm(); biApplyBuyer(biBuyers[0].id); }

  // Numeric columns are right-aligned so the digits stack and can be scanned.
  const headers = [
    ['#', 'left'], ['Inquiry No.', 'left'], ['Inquiry Date', 'left'], ['Buyer', 'left'],
    ['Style', 'left'], ['Quantity', 'right'], ['Season', 'left'], ['Country', 'left'],
    ['Status', 'left'], ['Action', 'left'],
  ];

  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="biCards" class="grid grid-cols-1 lg:grid-cols-12 gap-4"></div>

      <div class="flex justify-end">
        <button id="biPageSave" class="${BI_BTN_PRIMARY}">${BI_SAVE_ICON}Save Inquiry</button>

            <span class="text-side-accent shrink-0">${iconSvg('list', 'w-4 h-4')}</span>

          </div>
          <div class="flex items-center gap-2">
            <div class="relative">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
              <input id="biSearch" type="text" value="${escapeHtml(state.inqQuery)}" placeholder="Search by Inquiry No, Buyer, Style..."
                class="w-72 h-9 pl-9 pr-3 rounded border border-side-border bg-canvas text-[13px] font-medium text-primary placeholder-muted focus:outline-none focus:ring-2 focus:ring-[var(--accent-ring)] focus:border-side-accent" />
            </div>
            <button class="${BI_BTN}">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
              Filter
            </button>
          </div>
        </div>

        <div class="overflow-x-auto border-t border-side-line">
          <table class="w-full min-w-[900px]">
            <thead>
              <tr class="border-b border-side-line">
                ${headers.map(([h, align], idx) => `<th class="${idx === 0 ? 'pl-4 pr-2' : idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 text-[12px] font-semibold text-muted text-${align} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
              </tr>
            </thead>
            <tbody id="biTableBody"></tbody>
          </table>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
          <p id="biCount" class="text-helper text-muted tabular"></p>
          <div class="flex items-center gap-1.5">
            <button class="w-8 h-8 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:pointer-events-none" disabled aria-label="Previous page">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="w-8 h-8 rounded bg-side-accent text-white text-label font-semibold tabular">1</button>
            <button class="w-8 h-8 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:pointer-events-none" disabled aria-label="Next page">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </section>
    </div>
  `;

  biRenderCards();
  refreshBiTable();

  const cards = document.getElementById('biCards');

  /* Text fields just mirror into biForm — no repaint, so focus is never stolen. */
  cards.addEventListener('input', (e) => {
    const key = e.target.dataset.bif;
    if (key) { biForm[key] = e.target.value; return; }
    const bKey = e.target.dataset.bib;
    if (bKey) { biBuyerForm[bKey] = e.target.value; return; }
    if (e.target.id === 'biBuyerInput') {
      biForm.buyerText = e.target.value;
      const exact = biBuyers.find(b => b.name.toLowerCase() === e.target.value.trim().toLowerCase());
      biForm.buyerId = exact ? exact.id : '';
      biOpenList(e.target.value);
    }
  });

  cards.addEventListener('change', (e) => {
    if (e.target.id === 'biF_qty') { biForm.qty = biFmtQty(e.target.value); e.target.value = biForm.qty; }
  });

  cards.addEventListener('click', (e) => {
    if (e.target.closest('#biBuyerToggle')) {
      const input = document.getElementById('biBuyerInput');
      if (biCombo.open) biCloseList(); else { biOpenList(''); input.focus(); }
      return;
    }
    if (e.target.closest('#biBuyerAdd')) { biOpenBuyerModal(''); return; }
    if (e.target.closest('#biAddFromList')) { biOpenBuyerModal(biForm.buyerText); return; }
    const opt = e.target.closest('li[data-id]');
    if (opt) biSelectBuyer(opt.dataset.id);
  });

  cards.addEventListener('mousemove', (e) => {
    const opt = e.target.closest('li[data-id]');
    if (!opt || !biCombo.open) return;
    const i = biCombo.items.findIndex(b => b.id === opt.dataset.id);
    if (i > -1 && i !== biCombo.cursor) { biCombo.cursor = i; biPaintList(); }
  });

  cards.addEventListener('keydown', (e) => {
    if (e.target.id !== 'biBuyerInput') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      /* A buyer already picked? Open the full list, like the chevron does —
         filtering by their exact name would leave nothing to arrow through. */
      if (!biCombo.open) { biOpenList(biForm.buyerId ? '' : e.target.value); return; }
      const n = biCombo.items.length;
      if (!n) return;
      biCombo.cursor = (biCombo.cursor + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      biPaintList();
      document.querySelector(`#biBuyerList li[aria-selected="true"]`)?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (!biCombo.open) return;
      e.preventDefault();
      const pick = biCombo.items[biCombo.cursor];
      if (pick) biSelectBuyer(pick.id);
    } else if (e.key === 'Escape') {
      if (biCombo.open) { e.preventDefault(); biCloseList(); }
    }
  });

  /* One document listener, re-bound per render so they never stack up. */
  if (biOutsideClick) document.removeEventListener('click', biOutsideClick);
  biOutsideClick = (e) => {
    if (!biCombo.open) return;
    if (!e.target.closest('#biBuyerInput, #biBuyerList, #biBuyerToggle')) biCloseList();
  };
  document.addEventListener('click', biOutsideClick);

  document.getElementById('biPageSave').addEventListener('click', biSaveInquiry);

  const tbody = document.getElementById('biTableBody');
  /* No early-out on the current row: after editing the form, clicking the row
     again is how you reload it and discard those edits. */
  const select = (no) => {
    if (!no) return;
    biLoadInquiry(no);
    biRenderCards();
    refreshBiTable();
  };
  tbody.addEventListener('click', (e) => {
    if (e.target.closest('#biClear')) { state.inqQuery = ''; document.getElementById('biSearch').value = ''; refreshBiTable(); return; }
    select(e.target.closest('tr[data-no]')?.dataset.no);
  });
  tbody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('tr[data-no]');
    if (row) { e.preventDefault(); select(row.dataset.no); }
  });
  document.getElementById('biSearch').addEventListener('input', (e) => {
    state.inqQuery = e.target.value;
    refreshBiTable();
  });
}

// ---------- Generic search combobox ----------
/* Replaces the old "readonly input + magnifying-glass button that opens a
   modal" picker pattern used for Inquiry/Style lookups: a typeable field
   that filters a dropdown of matches live, underneath it — the same
   interaction as the Buyer combobox above. One instance per field; each
   host page wires the returned handlers into its own delegated
   input/click/mousemove/keydown listeners and registers a document-level
   outside-click via `isOutside`, the same way biBuyerCombo already does. */
function createCombo(opts) {
  const state = { open: false, cursor: 0, items: [] };

  function paint() {
    const list = document.getElementById(opts.id + 'List');
    if (!list) return;
    list.innerHTML = state.items.length
      ? state.items.map((it, i) => opts.renderItem(it, i === state.cursor)).join('')
      : `<li class="px-3 py-2.5"><p class="text-helper text-muted">${escapeHtml(opts.emptyText || 'No matches.')}</p></li>`;
  }

  function open(q) {
    const list = document.getElementById(opts.id + 'List');
    const input = document.getElementById(opts.id + 'Input');
    if (!list || !input) return;
    state.items = opts.match(q || '');
    state.cursor = 0;
    state.open = true;
    list.classList.remove('hidden');
    input.setAttribute('aria-expanded', 'true');
    paint();
  }

  function close() {
    const list = document.getElementById(opts.id + 'List');
    const input = document.getElementById(opts.id + 'Input');
    state.open = false;
    if (list) list.classList.add('hidden');
    if (input) input.setAttribute('aria-expanded', 'false');
  }

  function select(item) {
    close();
    opts.onSelect(item);
  }

  function handleInput(e) {
    if (e.target.id !== opts.id + 'Input') return false;
    open(e.target.value);
    return true;
  }

  function handleClick(e) {
    if (e.target.closest('#' + opts.id + 'Toggle')) {
      const input = document.getElementById(opts.id + 'Input');
      if (state.open) close(); else { open(''); input.focus(); }
      return true;
    }
    const li = e.target.closest('#' + opts.id + 'List li[data-combo-key]');
    if (li) {
      const item = state.items.find(it => opts.key(it) === li.dataset.comboKey);
      if (item) select(item);
      return true;
    }
    return false;
  }

  function handleMousemove(e) {
    const li = e.target.closest('#' + opts.id + 'List li[data-combo-key]');
    if (!li || !state.open) return false;
    const i = state.items.findIndex(it => opts.key(it) === li.dataset.comboKey);
    if (i > -1 && i !== state.cursor) { state.cursor = i; paint(); }
    return true;
  }

  function handleKeydown(e) {
    if (e.target.id !== opts.id + 'Input') return false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!state.open) { open(e.target.value); return true; }
      const n = state.items.length;
      if (!n) return true;
      state.cursor = (state.cursor + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      paint();
      document.querySelector(`#${opts.id}List li[aria-selected="true"]`)?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (!state.open) return true;
      e.preventDefault();
      const pick = state.items[state.cursor];
      if (pick) select(pick);
    } else if (e.key === 'Escape') {
      if (state.open) { e.preventDefault(); close(); }
    }
    return true;
  }

  function isOutside(target) {
    return !target.closest(`#${opts.id}Input, #${opts.id}List, #${opts.id}Toggle`);
  }

  return { state, open, close, select, handleInput, handleClick, handleMousemove, handleKeydown, isOutside };
}

/* Input + fixed suffix chip, e.g. "220 | GSM" — a compound control instead of
   a placeholder-style overlay label, so the unit reads as part of the value. */
function stySuffix(key, suffix, placeholder) {
  return `<div class="flex h-9 rounded border border-side-border bg-canvas overflow-hidden focus-within:ring-2 focus-within:ring-[var(--accent-ring)] focus-within:border-side-accent">

}

/* Native <select> with a colour dot pinned over its left padding — options
   can't be styled individually, so the dot only reflects the current value. */
function styDotSelect(key, labels, colorOf) {
  const cur = styForm[key];
  return `<div class="relative">
    <span id="styDot_${key}" class="absolute left-3 top-1/2 -translate-y-1/2 w-[9px] h-[9px] rounded-full shrink-0 pointer-events-none" style="background:${colorOf(cur)}"></span>
    <select id="styF_${key}" data-styf="${key}" class="${STY_INPUT} pl-7">
      ${labels.map(v => `<option value="${escapeHtml(v)}" ${v === cur ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}

}

function styRerenderCards() {

function styStartNew() {
  styBlankStyleDetails();
  state.editingId = null;

  styRefreshTable();

  document.getElementById('styCards')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

function styLoadStyle(id) {
  const s = styStyles.find(x => x.id === id);
  if (!s) return;
  Object.assign(styForm, {
    styleNo: s.style, product: s.product, category: s.category, fabric: s.fabric,
    color: s.color, qty: s.qty, targetPrice: (s.price || '').replace(/[^0-9.]/g, ''),
    shipmentDate: biToISO(s.shipDate) || '', status: s.status,
  });
  state.editingId = id;
  styRerenderCards();
  styRefreshTable();
  stySetMsg(`Editing style ${s.style} — update the fields and click Save Style.`, 'muted');
  document.getElementById('styCards')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function styDeleteStyle(id) {
  const s = styStyles.find(x => x.id === id);
  if (!s) return;
  if (!window.confirm(`Delete style ${s.style}?`)) return;
  const idx = styStyles.findIndex(x => x.id === id);
  if (idx > -1) styStyles.splice(idx, 1);
  if (state.editingId === id) styResetForm();
  styRerenderCards();
  styRefreshTable();
}

function stySave() {
  const styleNo = (styForm.styleNo || '').trim();
  if (!styleNo) { stySetMsg('Style No. is required.', 'danger'); document.getElementById('styF_styleNo')?.focus(); return; }
  const qtyDigits = String(styForm.qty || '').replace(/\D/g, '');
  if (!qtyDigits) { stySetMsg('Quantity is required.', 'danger'); document.getElementById('styF_qty')?.focus(); return; }
  const priceNum = parseFloat(String(styForm.targetPrice || '').replace(/[^0-9.]/g, ''));

  const rec = {
    id: state.editingId || ++styStyleSeq,
    style: styleNo,
    product: styForm.product,
    category: styForm.category,
    fabric: styForm.fabric,
    color: styForm.color,
    qty: Number(qtyDigits).toLocaleString('en-US'),
    price: isNaN(priceNum) ? '—' : `$${priceNum.toFixed(2)}`,
    shipDate: biFromISO(styForm.shipmentDate) || '—',
    status: styForm.status,
  };

  if (state.editingId) {
    const idx = styStyles.findIndex(s => s.id === state.editingId);
    if (idx > -1) styStyles[idx] = rec;
  } else {
    styStyles.unshift(rec);
  }

  styResetForm();
  styRerenderCards();
  styRefreshTable();
  stySetMsg(`Style ${rec.style} saved.`, 'success');
}

let styClickHandler = null;

let styOutsideClick = null;

function styBindEvents(container) {
  const cards = document.getElementById('styCards');

  cards.addEventListener('input', (e) => {
    if (styInqCombo.handleInput(e)) return;
    const key = e.target.dataset.styf;
    if (key) styForm[key] = e.target.value;
  });

  cards.addEventListener('mousemove', (e) => { styInqCombo.handleMousemove(e); });
  cards.addEventListener('keydown', (e) => { styInqCombo.handleKeydown(e); });

  cards.addEventListener('change', (e) => {
    const key = e.target.dataset.styf;
    if (!key) return;
    if (key === 'status') {
      const dot = document.getElementById('styDot_status');
      if (dot) dot.style.background = `var(${STY_STATUS_VAR[e.target.value] || '--neutral'})`;
    } else if (key === 'color') {
      const dot = document.getElementById('styDot_color');
      if (dot) dot.style.background = styColorHex(e.target.value);
    } else if (key === 'currency') {
      const suffix = document.getElementById('styS_targetPrice');
      if (suffix) suffix.textContent = e.target.value.split(' ')[0] || 'USD';
    } else if (key === 'buyer') {
      const b = biBuyers.find(x => x.name === e.target.value);
      if (b) {
        styForm.contact = b.contact;
        const c = document.getElementById('styF_contact');
        if (c) c.value = b.contact;
      }
    }
  });

  /* container (page-content) persists across re-renders, so the old listener
     is removed first — otherwise every re-render would stack another. */
  if (styClickHandler) container.removeEventListener('click', styClickHandler);
  styClickHandler = (e) => {
    if (styInqCombo.handleClick(e)) return;
    if (e.target.closest('#styAddRow')) { styStartNew(); return; }
    if (e.target.closest('#stySave')) { stySave(); return; }
    if (e.target.closest('#styReset')) { styResetForm(); styRerenderCards(); styRefreshTable(); stySetMsg('Form reset.', 'muted'); return; }
    const editBtn = e.target.closest('[data-edit]');
    if (editBtn) { styLoadStyle(Number(editBtn.dataset.edit)); return; }
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) { styDeleteStyle(Number(delBtn.dataset.del)); return; }
  };
  container.addEventListener('click', styClickHandler);

  if (styOutsideClick) document.removeEventListener('click', styOutsideClick);
  styOutsideClick = (e) => {
    if (styInqCombo.state.open && styInqCombo.isOutside(e.target)) styInqCombo.close();
  };
  document.addEventListener('click', styOutsideClick);
}

function bomApplyInquiry(no) {

  bomForm.styleNo = s.style;
}

/* First visit only: seed with the demo inquiry + style + costing so the screen
   matches what a filled-in form looks like, instead of opening empty. */
function bomEnsureSeeded() {
  if (bomForm.styleId) return;
  bomApplyInquiry(biInquiries[0].no);
  bomApplyStyle(styStyles[0].id);
  Object.assign(bomForm, {
    fabric: '1.80', items: bomBlankItems(),
    trims: '1.85', accessories: '0.25', cm: '0.18', wash: '0.65', printing: '0.20',
    embroidery: '0.15', packing: '0.10', overhead: '0.12',
    profit: '0.30', qty: '1000',
  });
}

function bomNum(v) {
  const n = parseFloat(String(v || '').replace(/[^0-9.]/g, ''));
  return isNaN(n) ? 0 : n;
}

function bomTotals() {
  const cost = BOM_COST_FIELDS.reduce((sum, f) => sum + bomNum(bomForm[f.key]), 0);
  const profit = bomNum(bomForm.profit);
  const fob = cost + profit;
  const profitPct = cost > 0 ? (profit / cost) * 100 : 0;
  const qty = bomNum(bomForm.qty);
  const total = fob * qty;
  return { cost, profit, fob, profitPct, qty, total };
}

function bomMoney(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  const total = document.getElementById('bomTotalValue');

  if (pct) pct.textContent = t.profitPct.toFixed(1);
  if (fob) fob.textContent = bomMoney(t.fob);

}

/* ---------- actions ---------- */
function bomRerenderCards() {
  const el = document.getElementById('bomCards');
  if (!el) return;
  el.innerHTML = bomBuyerCard() + bomMaterialCard() + bomCostingCard();
}

function bomSave() {
  if (!bomForm.styleId) { bomSetMsg('Pick a style before saving.', 'danger'); document.getElementById('bomStyleInput')?.focus(); return; }
  if (!bomForm.fabric.trim()) { bomSetMsg('Fabric consumption is required.', 'danger'); document.getElementById('bomF_fabric')?.focus(); return; }

  const s = styStyles.find(x => x.id === bomForm.styleId);
  if (!s) { bomSetMsg('Linked style no longer exists.', 'danger'); return; }

  const rec = {
    id: state.editingBomId || ++bomRecordSeq,
    styleId: s.id, style: s.style, product: s.product, category: s.category,
    fabric: s.fabric, color: s.color, qty: s.qty, price: s.price, shipDate: s.shipDate, status: s.status,
  };

  if (state.editingBomId) {
    const idx = bomRecords.findIndex(r => r.id === state.editingBomId);
    if (idx > -1) bomRecords[idx] = rec; else bomRecords.unshift(rec);
  } else {
    bomRecords.unshift(rec);
  }

  bomResetForm();
  bomRerenderCards();
  bomRefreshTable();
  bomSetMsg(`BOM & Costing for ${rec.style} saved.`, 'success');
}

function bomLoadRecord(id) {
  const r = bomRecords.find(x => x.id === id);
  if (!r) return;
  bomApplyStyle(r.styleId);
  state.editingBomId = id;
  bomRerenderCards();
  bomRefreshTable();
  bomSetMsg(`Editing BOM & Costing for ${r.style} — update the fields and click Save BoM & Cost.`, 'muted');
  document.getElementById('bomCards')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function bomDeleteRecord(id) {
  const r = bomRecords.find(x => x.id === id);
  if (!r) return;
  if (!window.confirm(`Delete BOM & Costing for style ${r.style}?`)) return;
  const idx = bomRecords.findIndex(x => x.id === id);
  if (idx > -1) bomRecords.splice(idx, 1);
  if (state.editingBomId === id) { bomResetForm(); bomRerenderCards(); }
  bomRefreshTable();
}

let bomClickHandler = null;

let bomOutsideClick = null;

function bomBindEvents(container) {
  const cards = document.getElementById('bomCards');

  cards.addEventListener('input', (e) => {
    if (bomInqCombo.handleInput(e) || bomStyleCombo.handleInput(e)) return;
    const key = e.target.dataset.bomf;
    if (key) {
      bomForm[key] = e.target.value;
      if (BOM_COST_FIELDS.some(f => f.key === key) || key === 'profit' || key === 'qty') bomRecalc();
      return;
    }
    const idx = e.target.dataset.bomi;
    if (idx !== undefined) bomForm.items[Number(idx)].value = e.target.value;
  });

  cards.addEventListener('mousemove', (e) => { bomInqCombo.handleMousemove(e); bomStyleCombo.handleMousemove(e); });
  cards.addEventListener('keydown', (e) => { bomInqCombo.handleKeydown(e); bomStyleCombo.handleKeydown(e); });

  cards.addEventListener('change', (e) => {
    if (e.target.dataset.bomf === 'buyer') {
      const b = biBuyers.find(x => x.name === e.target.value);
      if (b) {
        bomForm.contact = b.contact;
        const c = document.getElementById('bomF_contact');
        if (c) c.value = b.contact;
      }
      return;
    }
    const idx = e.target.dataset.bomi;
    if (idx !== undefined) bomForm.items[Number(idx)].value = e.target.value;
  });

  /* container (page-content) persists across re-renders, so the old listener
     is removed first — otherwise every re-render would stack another. */
  if (bomClickHandler) container.removeEventListener('click', bomClickHandler);
  bomClickHandler = (e) => {
    if (bomInqCombo.handleClick(e) || bomStyleCombo.handleClick(e)) return;
    if (e.target.closest('#bomSave')) { bomSave(); return; }
    if (e.target.closest('#bomReset')) { bomResetForm(); bomRerenderCards(); bomRefreshTable(); bomSetMsg('Form reset.', 'muted'); return; }
    const editBtn = e.target.closest('[data-bom-edit]');
    if (editBtn) { bomLoadRecord(Number(editBtn.dataset.bomEdit)); return; }
    const delBtn = e.target.closest('[data-bom-del]');
    if (delBtn) { bomDeleteRecord(Number(delBtn.dataset.bomDel)); return; }
  };
  container.addEventListener('click', bomClickHandler);

  if (bomOutsideClick) document.removeEventListener('click', bomOutsideClick);
  bomOutsideClick = (e) => {
    if (bomInqCombo.state.open && bomInqCombo.isOutside(e.target)) bomInqCombo.close();
    if (bomStyleCombo.state.open && bomStyleCombo.isOutside(e.target)) bomStyleCombo.close();
  };
  document.addEventListener('click', bomOutsideClick);
}

/* ---------- page ---------- */
function renderBOM(container) {
  bomEnsureSeeded();

  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="bomCards" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        ${bomBuyerCard() + bomMaterialCard() + bomCostingCard()}
      </div>
      ${bomFooterButtons()}
      ${bomListSection()}
      ${bomInfoBanner()}
    </div>`;

  bomRefreshTable();
  bomBindEvents(container);
}

function popiBlankDetails(type) {

  Object.assign(f, {
    bankName: '', bankAddress: '', accountName: '', accountNo: '', swift: '',
    styleNo: '', product: '', garmentType: '', fabric: '', gsm: '', color: '', sizeRange: '',
    seam: '', stitch: '', needle: '', thread: '', mainLabel: '', careLabel: '', hangtag: '', polybag: '', carton: '',

  });

function popiEnsureSeeded(type) {
  if (popiState[type]) return;
  popiState[type] = {
    form: popiSeedForm(type),
    rows: [type === 'po'
      ? { no: 'AB-4587', product: "Men's Polo Shirt", cat: 'Knit', fabric: '95% Cotton 5% Elastane', color: 'Black', size: 'S - XL', qty: 10000, price: 4.50 }

  };
}

function popiRowsSum(type) {
  return popiState[type].rows.reduce((s, r) => s + r.qty * r.price, 0);
}

function popiGrandTotal(type) {
  const f = popiState[type].form;
  return popiRowsSum(type) - bomNum(f.discount) + bomNum(f.other) + bomNum(f.vat);
}

      <td class="px-3 py-2 text-[13px] text-secondary whitespace-nowrap">${escapeHtml(r.fabric)}</td>
      <td class="px-3 py-2 text-[13px] text-secondary whitespace-nowrap">${escapeHtml(r.color)}</td>
      <td class="px-3 py-2 text-[13px] text-secondary whitespace-nowrap">${escapeHtml(r.size)}</td>
      <td class="px-3 py-2 text-right">
        <input type="text" inputmode="numeric" data-popi-row="${i}" data-popi-cell="qty" value="${r.qty}"
          class="w-20 h-8 px-2 rounded border border-side-border bg-canvas text-[13px] font-medium text-primary text-right tabular focus:outline-none focus:ring-2 focus:ring-[var(--accent-ring)] focus:border-side-accent" />

          <span class="text-[12px] text-muted">$</span>
          <input type="text" inputmode="decimal" data-popi-row="${i}" data-popi-cell="price" value="${r.price.toFixed(2)}"
            class="w-16 h-8 px-2 rounded border border-side-border bg-canvas text-[13px] font-medium text-primary text-right tabular focus:outline-none focus:ring-2 focus:ring-[var(--accent-ring)] focus:border-side-accent" />

function popiTableSection(type) {
  const headers = [
    ['#', 'left'], ['Style No.', 'left'], ['Product', 'left'], ['Category', 'left'], ['Fabric', 'left'],
    ['Color', 'left'], ['Size', 'left'], ['Quantity', 'right'], ['Unit Price', 'right'], ['Amount', 'right'], ['Action', 'left'],
  ];

    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">

/* ---------- actions ---------- */
function popiRerenderCards(type) {
  const el = document.getElementById('popiCards');
  if (!el) return;
  el.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">${popiBuyerCard(type) + popiBankCard(type) + popiStyleCard(type)}</div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">${popiConstructionCard(type) + popiCommercialCard(type) + popiShippingCard(type)}</div>`;

function popiSave(type) {
  const cfg = POPI_CONFIG[type];
  const f = popiState[type].form;
  if (!f.styleNo.trim()) { popiSetMsg(type, 'Style No. is required.', 'danger'); return; }
  if (!popiState[type].rows.length) { popiSetMsg(type, 'Add at least one order item.', 'danger'); return; }
  popiSetMsg(type, `${cfg.saveLabel} saved successfully.`, 'success');
}

let popiInputHandler = null;
let popiChangeHandler = null;
let popiClickHandler = null;

let popiMousemoveHandler = null;
let popiKeydownHandler = null;
let popiOutsideClick = null;

function popiBindEvents(container, type) {
  if (popiInputHandler) container.removeEventListener('input', popiInputHandler);
  popiInputHandler = (e) => {
    if (popiStyleCombo.handleInput(e)) return;
    const key = e.target.dataset.popif;
    if (key) {
      popiState[type].form[key] = e.target.value;
      if (key === 'discount' || key === 'other' || key === 'vat') popiRecalcTotal(type);
      return;
    }
    const rowIdx = e.target.dataset.popiRow;
    const cell = e.target.dataset.popiCell;
    if (rowIdx === undefined || !cell) return;
    const r = popiState[type].rows[Number(rowIdx)];
    if (!r) return;
    r[cell] = cell === 'qty' ? (parseInt(String(e.target.value).replace(/\D/g, ''), 10) || 0) : bomNum(e.target.value);
    const amountEl = document.querySelector(`[data-popi-amount="${rowIdx}"]`);
    if (amountEl) amountEl.textContent = bomMoney(r.qty * r.price);
    popiRecalcTotal(type);
  };
  container.addEventListener('input', popiInputHandler);

  if (popiMousemoveHandler) container.removeEventListener('mousemove', popiMousemoveHandler);
  popiMousemoveHandler = (e) => { popiStyleCombo.handleMousemove(e); };
  container.addEventListener('mousemove', popiMousemoveHandler);

  if (popiKeydownHandler) container.removeEventListener('keydown', popiKeydownHandler);
  popiKeydownHandler = (e) => { popiStyleCombo.handleKeydown(e); };
  container.addEventListener('keydown', popiKeydownHandler);

  if (popiChangeHandler) container.removeEventListener('change', popiChangeHandler);
  popiChangeHandler = (e) => {
    if (e.target.dataset.popif === 'buyer') {
      const b = biBuyers.find(x => x.name === e.target.value);
      if (b) {
        popiState[type].form.contact = b.contact;
        const c = document.querySelector('#popiCards [data-popif="contact"]');
        if (c) c.value = b.contact;
      }
    }
  };
  container.addEventListener('change', popiChangeHandler);

  if (popiClickHandler) container.removeEventListener('click', popiClickHandler);
  popiClickHandler = (e) => {
    if (popiStyleCombo.handleClick(e)) return;
    if (e.target.closest('[data-popi-addrow]')) {
      popiState[type].rows.push({ no: 'AB-NEW', product: 'New Product', cat: 'Knit', fabric: '—', color: '—', size: 'S - XL', qty: 1000, price: 0 });
      popiRefreshTable(type); popiRecalcTotal(type); return;
    }
    const rowDel = e.target.closest('[data-popi-rowdel]');
    if (rowDel) { popiState[type].rows.splice(Number(rowDel.dataset.popiRowdel), 1); popiRefreshTable(type); popiRecalcTotal(type); return; }
    if (e.target.closest('[data-popi-save]')) { popiSave(type); return; }
    if (e.target.closest('[data-popi-reset]')) {
      popiBlankDetails(type);
      popiRerenderCards(type); popiRefreshTable(type); popiRecalcTotal(type);
      popiSetMsg(type, 'Form reset.', 'muted');
      return;
    }
  };
  container.addEventListener('click', popiClickHandler);

  if (popiOutsideClick) document.removeEventListener('click', popiOutsideClick);
  popiOutsideClick = (e) => {
    if (popiStyleCombo.state.open && popiStyleCombo.isOutside(e.target)) popiStyleCombo.close();
  };
  document.addEventListener('click', popiOutsideClick);
}

/* ---------- page ---------- */
function renderPOPI(container, type) {
  popiActiveType = type;

  container.innerHTML = `

      ${popiTableSection(type)}

}

// ---------- Command palette ----------
const cmdk = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const cmdkCount = document.getElementById('cmdkCount');
let cmdkResults = [];
let cmdkCursor = 0;
let lastFocused = null;

function scoreEntry(e, q) {
  const i = e.hay.indexOf(q);
  if (i !== -1) return (i === 0 ? 1000 : e.hay[i - 1] === ' ' ? 800 : 500) - i;
  let qi = 0;                                   // subsequence fallback: "pom" -> "PrOduction Management"
  for (let c = 0; c < e.hay.length && qi < q.length; c++) if (e.hay[c] === q[qi]) qi++;
  return qi === q.length ? 100 - e.hay.length / 10 : -1;
}

function renderCmdkList() {
  if (!cmdkResults.length) {
    cmdkList.innerHTML = `<p class="px-4 py-6 text-center text-body text-muted">No screens match that search.</p>`;
    cmdkCount.textContent = '';
    return;
  }
  cmdkList.innerHTML = cmdkResults.map((e, i) => `
    <button role="option" aria-selected="${i === cmdkCursor}" data-i="${i}"
      class="cmdk-row w-full flex items-center gap-2.5 px-3.5 py-2 text-left ${i === cmdkCursor ? 'bg-side-hover' : ''}">
      ${iconSvg(e.icon, 'w-4 h-4 shrink-0 ' + (i === cmdkCursor ? 'text-side-accent' : 'text-muted'))}
      <span class="text-body-medium text-primary truncate">${escapeHtml(e.title)}</span>
      ${e.context ? `<span class="text-helper text-disabled truncate ml-auto shrink-0">${escapeHtml(e.context)}</span>` : ''}
    </button>
  `).join('');
  cmdkCount.textContent = `${cmdkResults.length} of ${pageIndex.length}`;
  cmdkList.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

function updateCmdk() {
  const q = cmdkInput.value.trim().toLowerCase();
  cmdkResults = !q
    ? pageIndex.slice(0, 40)
    : pageIndex.map(e => ({ e, s: scoreEntry(e, q) })).filter(x => x.s >= 0)
        .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.e);
  cmdkCursor = 0;
  renderCmdkList();
}

function openCmdk() {
  lastFocused = document.activeElement;
  cmdk.classList.remove('hidden');
  cmdkInput.value = '';
  updateCmdk();
  cmdkInput.focus();
}

function closeCmdk() {
  cmdk.classList.add('hidden');
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

function commitCmdk() {
  const pick = cmdkResults[cmdkCursor];
  if (!pick) return;
  closeCmdk();
  goTo(pick.moduleKey, pick.subIndex);
}

cmdkInput.addEventListener('input', updateCmdk);
document.getElementById('cmdkBackdrop').addEventListener('click', closeCmdk);
document.getElementById('searchTrigger').addEventListener('click', openCmdk);

cmdkList.addEventListener('mousemove', (e) => {
  const row = e.target.closest('[data-i]');
  if (row && +row.dataset.i !== cmdkCursor) { cmdkCursor = +row.dataset.i; renderCmdkList(); }
});
cmdkList.addEventListener('click', (e) => {
  const row = e.target.closest('[data-i]');
  if (row) { cmdkCursor = +row.dataset.i; commitCmdk(); }
});

cmdk.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdkCursor = Math.min(cmdkCursor + 1, cmdkResults.length - 1); renderCmdkList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkCursor = Math.max(cmdkCursor - 1, 0); renderCmdkList(); }
  else if (e.key === 'Enter') { e.preventDefault(); commitCmdk(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
});

// ---------- Theme ----------
function applyThemeIcon(theme) {
  document.getElementById('themeIconSun').classList.toggle('hidden', theme === 'dark');
  document.getElementById('themeIconMoon').classList.toggle('hidden', theme !== 'dark');
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('erp-theme'); } catch (e) { /* ignore */ }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeIcon(theme);
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  applyThemeIcon(next);
  try { localStorage.setItem('erp-theme', next); } catch (e) { /* ignore */ }
});

if (/Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
  document.getElementById('searchKbd').textContent = '⌘K';
}

renderNav();
renderContent();
</script>
