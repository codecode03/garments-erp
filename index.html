function hrPayTableCard() {
  const period = hrMonthKey(+hrPayForm.year, +hrPayForm.month);
  return `

      <div id="hrPayResults">${hrPayResultsHtml()}</div>
    </section>`;
}
function renderHRPayroll(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${hrPayFormCard()}
      ${hrPayTableCard()}
    </div>`;
  hrPayBindEvents(container);
}
function hrPayRefresh(container) {
  container.querySelector('#hrPayResults').innerHTML = hrPayResultsHtml();
  container.querySelector('#hrPayCounter').textContent = `${hrPayRows().length} employee${hrPayRows().length === 1 ? '' : 's'}`;
}
function hrPayBindEvents(container) {
  container.querySelector('#hrPayMonth').addEventListener('change', (e) => { hrPayForm.month = e.target.value; renderHRPayroll(container); });
  container.querySelector('#hrPayYear').addEventListener('change', (e) => { hrPayForm.year = e.target.value; renderHRPayroll(container); });
  container.querySelector('#hrPayLoadBtn').addEventListener('click', () => { hrPayLoadEmployees(); renderHRPayroll(container); });
  container.querySelector('#hrPayCalcBtn').addEventListener('click', () => { hrPayRecalc(); renderHRPayroll(container); });
  container.querySelector('#hrPayFinalizeBtn').addEventListener('click', () => {
    const rows = hrPayRows();
    if (!rows.length) return;
    rows.forEach(p => { if (p.status === 'Draft') p.status = 'Finalized'; });
    renderHRPayroll(container);
  });
  container.querySelector('#hrPayPaidBtn').addEventListener('click', () => {
    const rows = hrPayRows();
    if (!rows.length) return;
    rows.forEach(p => { if (p.status === 'Finalized') { p.status = 'Paid'; p.paymentStatus = 'Paid'; } });
    renderHRPayroll(container);
  });
  container.querySelector('#hrPayResults').addEventListener('change', (e) => {
    const ded = e.target.closest('[data-hrpay-deduction]');
    if (!ded) return;
    const p = hrPayrolls.find(x => x.id === +ded.dataset.hrpayDeduction);
    if (p) { p.deduction = coaNum(ded.value); p.net = p.gross - p.deduction; hrPayRefresh(container); }
  });
}

  { id: 'delivery', name: 'Delivery', prefix: 'DL', extra: { label: 'Challan No.' } },
];
const PROD_STAGE_NAMES = PROD_STAGES.map(s => s.name);
const PROD_SHIFTS = ['General', 'Morning', 'Evening', 'Night'];
const PROD_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const PROD_TONES = { Completed: 'success', Accepted: 'success', 'In progress': 'info', 'Rework required': 'warning', Pending: 'warning', 'On hold': 'neutral', Rejected: 'danger' };
const PROD_SEARCH_ICON = '<svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';

function prodISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function prodDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return prodISO(d); }
function prodToday() { return prodDaysAgo(0); }
function prodShortDate(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? `${+p[2]} ${PROD_MONTHS[+p[1] - 1]}` : iso; }
function prodN(v) { const x = parseFloat(v); return isFinite(x) ? x : 0; }
function prodHas(v) { return v !== '' && v != null && isFinite(parseFloat(v)); }
function prodFmt(n) { return (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US'); }
function prodPct(v) { return v == null || !isFinite(v) ? '—' : `${v.toFixed(1)}%`; }
function prodIsNum(f) { return f.type === 'number' || f.type === 'money'; }
function prodTh(label, i, n, right) {
  return `<th class="${i === 0 ? 'pl-4 pr-2' : i === n - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${right ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(label)}</th>`;
}
function prodTile(label, value, note) {
  return `<div class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
    <p class="text-micro text-muted mb-1">${escapeHtml(label)}</p>
    <p class="fs-title font-semibold text-primary tabular">${value}</p>
    ${note ? `<p class="text-helper text-muted mt-1">${escapeHtml(note)}</p>` : ''}
  </div>`;
}
function prodMsgClass(msg, tone) { return `${msg ? '' : 'hidden '}text-helper text-${tone} mr-auto`; }

/* One control renderer for every Production form. Style / Buyer / Employee pickers read the
   Merchandising and HR masters instead of free text, so a style means the same thing everywhere. */
function prodControl(f, val, attr) {
  const v = val == null ? '' : String(val);
  if (f.type === 'auto') return `<input type="text" readonly id="prodAuto-${f.k}" value="${escapeHtml(v)}" class="${COA_AUTO} tabular" />`;
  if (f.type === 'employee') {
    const list = hrEmployees.filter(e => e.status === 'Active' || String(e.id) === v);
    return `<select ${attr} class="${COA_INPUT}"><option value="">Select employee…</option>${list.map(e => `<option value="${e.id}" ${String(e.id) === v ? 'selected' : ''}>${escapeHtml(hrEmpLabel(e))}</option>`).join('')}</select>`;
  }
  const opts = f.type === 'style' ? styStyles.map(s => s.style) : f.type === 'buyer' ? biBuyers.map(b => b.name) : f.options;
  if (opts) {
    const all = v && !opts.includes(v) ? [v, ...opts] : opts;
    return `<select ${attr} class="${COA_INPUT}"><option value="">Select…</option>${all.map(o => `<option value="${escapeHtml(o)}" ${o === v ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}</select>`;
  }
  if (prodIsNum(f)) return `<input ${attr} type="number" min="0" step="any" inputmode="decimal" value="${escapeHtml(v)}" class="${COA_INPUT} tabular" />`;
  if (f.type === 'date') return `<input ${attr} type="date" value="${escapeHtml(v)}" class="${COA_INPUT} tabular" />`;
  return `<input ${attr} type="text" autocomplete="off" value="${escapeHtml(v)}" placeholder="${escapeHtml(f.placeholder || '')}" class="${COA_INPUT}" />`;
}
function prodFieldHtml(f, val, attr) {
  return `<label class="block min-w-0${f.type === 'textarea' ? ' sm:col-span-2 lg:col-span-4' : ''}">${biLabel(f.label, { req: f.req })}${prodControl(f, val, attr)}</label>`;
}

const prodUi = {};
function prodBlank(key) { const v = {}; PROD_SCREENS[key].fields.forEach(f => { v[f.k] = f.k === 'date' ? prodToday() : ''; }); return v; }
function prodUiFor(key) { return prodUi[key] || (prodUi[key] = { editId: null, v: prodBlank(key), msg: '', tone: 'muted', q: '' }); }
function prodFormValues(key, row) { const v = {}; PROD_SCREENS[key].fields.forEach(f => { v[f.k] = row[f.k] == null ? '' : String(row[f.k]); }); return v; }
function prodCompText(c, v) { return v == null || !isFinite(v) ? '—' : c.fmt === 'pct' ? prodPct(v) : prodFmt(v); }
function prodSetMsg(key, text, tone) {
  const u = prodUiFor(key);
  u.msg = text || ''; u.tone = tone || 'muted';
  const el = document.getElementById('prodFormMsg');
  if (el) { el.textContent = u.msg; el.className = prodMsgClass(u.msg, u.tone); }
}
function prodValidate(key, v) {
  const sc = PROD_SCREENS[key];
  for (const f of sc.fields) {
    const val = String(v[f.k] == null ? '' : v[f.k]).trim();
    if (f.req && !val) return `${f.label} is required.`;
    if (prodIsNum(f) && val !== '' && (!isFinite(parseFloat(val)) || parseFloat(val) < 0)) return `${f.label} must be 0 or more.`;
  }
  return sc.validate ? sc.validate(v) : '';
}

function prodFormCard(key) {

  const comp = sc.computed.map((c, i) => `<label class="block min-w-0">${biLabel(c.label)}<input type="text" readonly data-prodcomp="${i}" value="${escapeHtml(prodCompText(c, c.fn(u.v)))}" class="${COA_AUTO} tabular" /></label>`).join('');

      </div>

      </div>

}
function prodFiltered(key) {
  const sc = PROD_SCREENS[key], q = prodUiFor(key).q.trim().toLowerCase();
  return prodRecords[key]
    .filter(r => !q || sc.fields.some(f => String(r[f.k] == null ? '' : r[f.k]).toLowerCase().includes(q)))

function prodBindScreen(container, key) {

    u.editId = null; u.v = prodBlank(key);
    rerender();
    prodSetMsg(key, `${sc.noun} ${wasEdit ? 'updated' : 'saved'}.`, 'success');
  });
  container.querySelector('#prodSearch').addEventListener('input', (e) => { u.q = e.target.value; prodRefreshResults(container, key); });
  container.querySelector('#prodResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-prod-edit]');

  });
}

    else list.push({ id: list.reduce((m, r) => Math.max(m, r.id), 0) + 1, ...rec });
    prodStageDrafts[st.id] = prodBlankDraft();

    if (delBtn) {

/* ---------- Charts (shared by Daily Production and Efficiency & KPI › Chart) ---------- */
function prodNiceScale(max) {
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  return { top: step * Math.ceil(max / step), step };
}
function prodShortNum(v) { return v >= 1e6 ? `${+(v / 1e6).toFixed(1)}M` : v >= 1e3 ? `${+(v / 1e3).toFixed(1)}k` : String(+v.toFixed(2)); }
function prodBarPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
/* Grouped vertical bars: thin marks, 4px rounded data ends on the baseline, 2px gap between
   series, recessive grid. Each band is one hover target whose tooltip names every series. */
function prodBarChart(labels, series, opts) {
  opts = opts || {};
  const max = Math.max(0, ...series.flatMap(s => s.values));
  if (!labels.length || max <= 0) return `<div class="h-[220px] flex items-center justify-center text-center fs-base text-muted px-4">${escapeHtml(opts.empty || 'No data for the selected filters.')}</div>`;
  const W = 520, H = 230, L = 44, R = 6, T = 22, B = 30, iw = W - L - R, ih = H - T - B;
  const { top, step } = prodNiceScale(max);
  let g = '';
  for (let v = 0; v <= top + step / 1000; v += step) {
    const y = T + ih * (1 - v / top);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border-inner)" stroke-width="1"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="13" fill="var(--text-muted)">${prodShortNum(v)}</text>`;
  }
  const band = iw / labels.length, n = series.length, gap = 2;
  const bw = Math.max(4, Math.min(24, (band * 0.62 - gap * (n - 1)) / n)), groupW = bw * n + gap * (n - 1);
  const every = Math.max(1, Math.ceil(labels.length / Math.max(1, Math.floor(iw / 58))));
  labels.forEach((lab, i) => {
    const x0 = L + band * i + (band - groupW) / 2;
    g += `<g><title>${escapeHtml(`${lab}: ${series.map(s => `${s.name} ${prodFmt(s.values[i])}`).join(', ')}`)}</title><rect x="${L + band * i}" y="${T}" width="${band}" height="${ih}" fill="transparent"/>`;
    series.forEach((s, j) => {
      const v = s.values[i] || 0, h = ih * v / top, x = x0 + j * (bw + gap);
      if (h > 0) g += `<path d="${prodBarPath(x, T + ih - h, bw, h)}" fill="var(${s.color})"/>`;
      if (opts.values && v > 0) g += `<text x="${x + bw / 2}" y="${T + ih - h - 6}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-secondary)">${prodFmt(v)}</text>`;
    });
    g += '</g>';
    if (i % every === 0) g += `<text x="${L + band * (i + 0.5)}" y="${H - 9}" text-anchor="middle" font-size="13" fill="var(--text-muted)">${escapeHtml(lab)}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="var(--border)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="${escapeHtml(opts.label || 'Bar chart')}">${g}</svg>`;
}
function prodLegend(items) {
  return `<div class="flex flex-wrap items-center gap-3">${items.map(([name, color]) => `<span class="inline-flex items-center gap-1.5 text-helper text-secondary"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:var(${color})"></span>${escapeHtml(name)}</span>`).join('')}</div>`;

/* ---------- Daily Production (report built from the stage entries) ---------- */
const prodDrFilter = { date: prodToday(), buyer: '', style: '', q: '', zero: true };
function prodReportRows() {
  const sel = prodDrFilter.date || prodToday(), groups = {};
  PROD_STAGES.forEach((st, si) => prodStageRecords[st.id].forEach(rec => {
    const h = rec.header || {};
    if (!h.date || h.date > sel) return;
    const key = `${h.styleNo}||${h.orderNo}`;
    const g = groups[key] || (groups[key] = { style: h.styleNo || '—', order: h.orderNo || '—', buyer: '', gauge: '', ship: '', qty: 0, yarnReq: 0, yarnRec: 0, yarnDate: '', machines: new Set(), stages: PROD_STAGES.map(() => ({ today: 0, total: 0 })) });
    if (h.buyer && !g.buyer) g.buyer = h.buyer;
    if (h.shippingDate && !g.ship) g.ship = h.shippingDate;
    g.qty = Math.max(g.qty, prodN(h.orderQuantity));
    if (st.id === 'knitting') {
      if (h.gauge && !g.gauge) g.gauge = h.gauge;
      if (h.date >= g.yarnDate) { g.yarnDate = h.date; g.yarnReq = prodN(h.yarnReq); g.yarnRec = prodN(h.yarnRec); }
      if (h.date === sel && h.machineNo) g.machines.add(h.machineNo);
    }
    const produced = prodStageSums(st.id, rec).produced;
    g.stages[si].total += produced;
    if (h.date === sel) g.stages[si].today += produced;
  }));
  return Object.values(groups).map(g => ({
    ...g, buyer: g.buyer || '—', yarnRem: Math.max(0, g.yarnReq - g.yarnRec),
    stages: g.stages.map(s => ({ ...s, balance: Math.max(0, g.qty - s.total) })),
  })).sort((a, b) => a.style.localeCompare(b.style) || a.order.localeCompare(b.order));
}

function prodKpiCards() {

  prodRecords.kpi.forEach(r => { const mp = prodN(r.manpower), h = prodN(r.hours), s = prodN(r.sam); if (mp > 0 && h > 0 && s > 0 && prodHas(r.produced)) { eN += prodN(r.produced) * s; eD += mp * h * 60; eC++; } });
  PROD_STAGES.forEach(st => prodStageRecords[st.id].forEach(rec => { const s = prodStageSums(st.id, rec); if (s.target > 0) { tT += s.target; tP += s.produced; tC++; } }));
  prodRecords.qc.forEach(r => { if (prodN(r.inspected) > 0 && prodHas(r.passed)) { qI += prodN(r.inspected); qP += prodN(r.passed); qC++; } });
  prodRecords.defect.forEach(r => { if (prodN(r.defect) > 0) { dD += prodN(r.defect); dR += prodN(r.reworked); dC++; } });
  const cards = [
    { l: 'Line Efficiency', v: eD > 0 ? eN / eD * 100 : null, f: 'Σ(produced × SAM) ÷ Σ(manpower × hours × 60)', c: eC, s: 'Efficiency & KPI entries' },
    { l: 'Target Achievement', v: tT > 0 ? tP / tT * 100 : null, f: 'Σ actual ÷ Σ target', c: tC, s: 'Production Stage entries' },
    { l: 'QC Pass Rate', v: qI > 0 ? qP / qI * 100 : null, f: 'Σ passed ÷ Σ inspected', c: qC, s: 'Quality Control entries' },
    { l: 'Rework Completion', v: dD > 0 ? dR / dD * 100 : null, f: 'Σ reworked ÷ Σ defect qty', c: dC, s: 'Defect & Rework entries' },
  ];
  return `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${cards.map(k => `
    <div class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <p class="text-micro text-muted mb-1">${escapeHtml(k.l)}</p>
      <p class="text-display ${k.v == null ? 'text-muted' : 'text-primary'}">${prodPct(k.v)}</p>
      <p class="text-helper text-muted mt-1.5">${escapeHtml(k.f)} × 100</p>
      <p class="text-helper text-secondary mt-1">${k.c ? `Based on ${k.c} ${k.c === 1 ? 'entry' : 'entries'} from ${escapeHtml(k.s)}` : `Calculated once ${escapeHtml(k.s)} exist`}</p>
    </div>`).join('')}</div>`;
}

const prodChartFilter = { from: prodDaysAgo(6), to: prodToday(), style: '', stage: '' };
function prodInRange(date) { const f = prodChartFilter; return !!date && (!f.from || date >= f.from) && (!f.to || date <= f.to); }
function prodChartDays(dataDates) {
  const f = prodChartFilter;
  if (f.from && f.to && f.from <= f.to) {
    const out = [], d = new Date(`${f.from}T00:00:00`), end = new Date(`${f.to}T00:00:00`);
    while (d <= end && out.length <= 62) { out.push(prodISO(d)); d.setDate(d.getDate() + 1); }
    if (out.length <= 62) return out;
  }
  return [...new Set(dataDates)].sort();
}
function renderProdChart(container) {
  const f = prodChartFilter;
  const styles = [...new Set([...styStyles.map(s => s.style), ...PROD_STAGES.flatMap(st => prodStageRecords[st.id].map(r => r.header.styleNo)).filter(Boolean)])];
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          ${coaField('From', `<input data-prodcf="from" type="date" value="${escapeHtml(f.from)}" class="${COA_INPUT} tabular" />`)}
          ${coaField('To', `<input data-prodcf="to" type="date" value="${escapeHtml(f.to)}" class="${COA_INPUT} tabular" />`)}
          ${coaField('Style', `<select data-prodcf="style" class="${COA_INPUT}"><option value="">All Styles</option>${styles.map(s => `<option ${s === f.style ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select>`)}
          ${coaField('Stage', `<select data-prodcf="stage" class="${COA_INPUT}"><option value="">All Stages</option>${PROD_STAGE_NAMES.map(s => `<option ${s === f.stage ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select>`)}
        </div>
      </section>
      <div id="prodChartBody">${prodChartBodyHtml()}</div>
    </div>`;
  container.querySelectorAll('[data-prodcf]').forEach(el => el.addEventListener('change', () => {
    f[el.dataset.prodcf] = el.value;
    container.querySelector('#prodChartBody').innerHTML = prodChartBodyHtml();
  }));
}
function prodChartBodyHtml() {
  const f = prodChartFilter;
  const okStyle = s => !f.style || s === f.style, okStage = s => !f.stage || s === f.stage;
  const byDay = {}, dates = [], knitOrders = {};
  const summary = PROD_STAGES.map(st => {
    const t = { name: st.name, target: 0, produced: 0, fail: 0, wip: 0 };
    if (!okStage(st.name)) return null;
    prodStageRecords[st.id].forEach(rec => {
      const h = rec.header;
      if (!prodInRange(h.date) || !okStyle(h.styleNo)) return;
      const s = prodStageSums(st.id, rec), d = byDay[h.date] || (byDay[h.date] = { target: 0, actual: 0, defect: 0, reworked: 0 });
      d.target += s.target; d.actual += s.produced; dates.push(h.date);
      t.target += s.target; t.produced += s.produced; t.fail += s.fail;
      if (st.id === 'knitting') {
        /* Knitting's input is the order quantity, which every entry repeats — count it once per order. */
        const k = `${h.styleNo}||${h.orderNo}`, o = knitOrders[k] || (knitOrders[k] = { qty: 0, out: 0 });
        o.qty = Math.max(o.qty, s.input); o.out += s.produced + s.fail;
      } else t.wip += s.balance;
    });
    if (st.id === 'knitting') t.wip = Object.values(knitOrders).reduce((sum, o) => sum + Math.max(0, o.qty - o.out), 0);
    return t;
  }).filter(Boolean);
  const qc = prodRecords.qc.filter(r => prodInRange(r.date) && okStyle(r.style) && okStage(r.stage));
  const defects = prodRecords.defect.filter(r => prodInRange(r.date) && okStyle(r.style) && okStage(r.stage));
  defects.forEach(r => { const d = byDay[r.date] || (byDay[r.date] = { target: 0, actual: 0, defect: 0, reworked: 0 }); d.defect += prodN(r.defect); d.reworked += prodN(r.reworked); dates.push(r.date); });
  const kpiRows = prodRecords.kpi.filter(r => prodInRange(r.date) && okStyle(r.style));
  const tot = (list, k) => list.reduce((s, r) => s + prodN(r[k]), 0);
  const target = tot(summary, 'target'), actual = tot(summary, 'produced'), wip = tot(summary, 'wip');
  const inspected = tot(qc, 'inspected'), passed = tot(qc, 'passed');
  let eN = 0, eD = 0; const lines = {};
  kpiRows.forEach(r => {
    const mp = prodN(r.manpower), h = prodN(r.hours), s = prodN(r.sam);
    if (!(mp > 0 && h > 0 && s > 0 && prodHas(r.produced))) return;
    eN += prodN(r.produced) * s; eD += mp * h * 60;
    const l = lines[r.section] || (lines[r.section] = { n: 0, d: 0 }); l.n += prodN(r.produced) * s; l.d += mp * h * 60;
  });
  const delivered = (summary.find(s => s.name === 'Delivery') || { produced: 0 }).produced;
  const tiles = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    ${prodTile('Target', prodFmt(target), 'Σ employee targets on stage entries')}
    ${prodTile('Actual Production', prodFmt(actual), 'Σ employee actuals on stage entries')}
    ${prodTile('Target Achievement', target ? prodPct(actual / target * 100) : '—', 'Actual ÷ target')}
    ${prodTile('Total WIP', prodFmt(wip), 'Σ stage balances')}
    ${prodTile('QC Pass Rate', inspected ? prodPct(passed / inspected * 100) : '—', `${prodFmt(inspected)} pieces inspected`)}
    ${prodTile('Line Efficiency', eD ? prodPct(eN / eD * 100) : '—', 'From Efficiency & KPI data')}
    ${prodTile('Rejected Qty', prodFmt(tot(qc, 'rejected')), `Rework ${prodFmt(tot(qc, 'rework'))} at QC`)}
    ${prodTile('Delivered Qty', prodFmt(delivered), 'Delivery stage output')}
  </div>`;
  const days = prodChartDays(dates), labels = days.map(prodShortDate), val = k => days.map(d => (byDay[d] ? byDay[d][k] : 0));
  const prodChart = prodBarChart(labels, [{ name: 'Target', color: '--chart-2', values: val('target') }, { name: 'Actual', color: '--chart-1', values: val('actual') }], { label: 'Production versus target by day' });
  const defectChart = prodBarChart(labels, [{ name: 'Defect', color: '--chart-5', values: val('defect') }, { name: 'Reworked', color: '--chart-8', values: val('reworked') }], { label: 'Defect and rework by day', empty: 'No defects recorded for the selected filters.' });
  const lineItems = Object.keys(lines).sort().map(k => ({ label: k, v: lines[k].d ? lines[k].n / lines[k].d * 100 : 0 }));
  const lineBars = lineItems.length ? `<div class="space-y-3">${lineItems.map(it => `
    <div class="flex items-center gap-3" title="${escapeHtml(`${it.label}: ${prodPct(it.v)}`)}">
      <span class="w-28 shrink-0 fs-base text-secondary truncate">${escapeHtml(it.label)}</span>
      <div class="flex-1 h-2 rounded-full bg-side-line overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100, it.v).toFixed(1)}%;background:var(--chart-1)"></div></div>
      <span class="w-16 text-right fs-base font-medium text-primary tabular">${prodPct(it.v)}</span>
    </div>`).join('')}</div>` : `<div class="py-10 text-center fs-base text-muted">No efficiency entries for the selected filters.</div>`;
  const sHeads = ['Stage', 'Target', 'Produced', 'QC Fail', 'WIP', 'Efficiency'];
  const stageTable = `
    <div class="overflow-x-auto -mx-5 border-t border-side-line">
      <table class="w-full min-w-[520px]">
        <thead><tr class="border-b border-side-line">${sHeads.map((h, i) => prodTh(h, i, sHeads.length, i > 0)).join('')}</tr></thead>
        <tbody>${summary.map(s => `
          <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
            <td class="pl-4 pr-2 py-2 fs-base font-medium text-primary whitespace-nowrap">${escapeHtml(s.name)}</td>
            ${[s.target, s.produced, s.fail, s.wip].map(v => `<td class="px-3 py-2 fs-base text-secondary text-right tabular">${prodFmt(v)}</td>`).join('')}
            <td class="pr-4 pl-3 py-2 fs-base font-medium text-primary text-right tabular">${s.target ? prodPct(s.produced / s.target * 100) : '—'}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
  return `
    <div class="space-y-4">
      ${tiles}
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
        ${prodChartCard('Production vs Target', 'Daily totals from stage entries', [['Target', '--chart-2'], ['Actual', '--chart-1']], prodChart)}
        ${prodChartCard('Defect & Rework Trend', 'Quantity per day from Defect & Rework', [[`Defect ${prodFmt(tot(defects, 'defect'))}`, '--chart-5'], [`Reworked ${prodFmt(tot(defects, 'reworked'))}`, '--chart-8']], defectChart)}
      </div>
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
        ${prodChartCard('Efficiency by Line', 'Produced × SAM ÷ available minutes', null, lineBars)}
        ${prodChartCard('Stage Summary', 'Stage movement in the selected period', null, stageTable)}
      </div>
    </div>`;
}

// ---------- Command palette ----------
const cmdk = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const cmdkCount = document.getElementById('cmdkCount');
let cmdkResults = [];
let cmdkCursor = 0;
let lastFocused = null;

function scoreEntry(e, q) {
  const i = e.hay.indexOf(q);
  if (i !== -1) return (i === 0 ? 1000 : e.hay[i - 1] === ' ' ? 800 : 500) - i;
  let qi = 0;                                   // subsequence fallback: "pom" -> "PrOduction Management"
  for (let c = 0; c < e.hay.length && qi < q.length; c++) if (e.hay[c] === q[qi]) qi++;
  return qi === q.length ? 100 - e.hay.length / 10 : -1;
}

function renderCmdkList() {
  if (!cmdkResults.length) {
    cmdkList.innerHTML = `<p class="px-4 py-6 text-center text-body text-muted">No screens match that search.</p>`;
    cmdkCount.textContent = '';
    return;
  }
  cmdkList.innerHTML = cmdkResults.map((e, i) => `
    <button role="option" aria-selected="${i === cmdkCursor}" data-i="${i}"
      class="cmdk-row w-full flex items-center gap-2.5 px-3.5 py-2 text-left ${i === cmdkCursor ? 'bg-side-hover' : ''}">
      ${iconSvg(e.icon, 'w-4 h-4 shrink-0 ' + (i === cmdkCursor ? 'text-side-accent' : 'text-muted'))}
      <span class="text-body-medium text-primary truncate">${escapeHtml(e.title)}</span>
      ${e.context ? `<span class="text-helper text-disabled truncate ml-auto shrink-0">${escapeHtml(e.context)}</span>` : ''}
    </button>
  `).join('');
  cmdkCount.textContent = `${cmdkResults.length} of ${pageIndex.length}`;
  cmdkList.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

function updateCmdk() {
  const q = cmdkInput.value.trim().toLowerCase();
  cmdkResults = !q
    ? pageIndex.slice(0, 40)
    : pageIndex.map(e => ({ e, s: scoreEntry(e, q) })).filter(x => x.s >= 0)
        .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.e);
  cmdkCursor = 0;
  renderCmdkList();
}

function openCmdk() {
  lastFocused = document.activeElement;
  cmdk.classList.remove('hidden');
  cmdkInput.value = '';
  updateCmdk();
  cmdkInput.focus();
}

function closeCmdk() {
  cmdk.classList.add('hidden');
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

function commitCmdk() {
  const pick = cmdkResults[cmdkCursor];
  if (!pick) return;
  closeCmdk();
  goTo(pick.moduleKey, pick.subIndex);
}

cmdkInput.addEventListener('input', updateCmdk);
document.getElementById('cmdkBackdrop').addEventListener('click', closeCmdk);
document.getElementById('searchTrigger').addEventListener('click', openCmdk);

cmdkList.addEventListener('mousemove', (e) => {
  const row = e.target.closest('[data-i]');
  if (row && +row.dataset.i !== cmdkCursor) { cmdkCursor = +row.dataset.i; renderCmdkList(); }
});
cmdkList.addEventListener('click', (e) => {
  const row = e.target.closest('[data-i]');
  if (row) { cmdkCursor = +row.dataset.i; commitCmdk(); }
});

cmdk.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdkCursor = Math.min(cmdkCursor + 1, cmdkResults.length - 1); renderCmdkList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkCursor = Math.max(cmdkCursor - 1, 0); renderCmdkList(); }
  else if (e.key === 'Enter') { e.preventDefault(); commitCmdk(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
});

// ---------- Theme ----------
function applyThemeIcon(theme) {
  document.getElementById('themeIconSun').classList.toggle('hidden', theme === 'dark');
  document.getElementById('themeIconMoon').classList.toggle('hidden', theme !== 'dark');
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('erp-theme'); } catch (e) { /* ignore */ }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeIcon(theme);
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  applyThemeIcon(next);
  try { localStorage.setItem('erp-theme', next); } catch (e) { /* ignore */ }
});

if (/Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
  document.getElementById('searchKbd').textContent = '⌘K';
}

renderNav();
renderContent();
</script>
