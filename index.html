// Content ported from the Finance reference build's combined Payable/Receivable register
// (the last two tabs of Voucher Management). Styled with the same summary-card / filter-bar /
// paginated-table / modal conventions Chart of Accounts > Cash & Bank already established,
// rather than the voucher-posting form used by the other Voucher Management tabs.
const AP_AR_TYPES = {
  payable: { noun: 'Bill', docLabel: 'Bill No.', dateLabel: 'Bill Date', partyLabel: 'Supplier / Vendor', prefix: 'BILL', actionLabel: 'Pay', actionVerb: 'Record Payment', paidLabel: 'Total Paid' },
  receivable: { noun: 'Invoice', docLabel: 'Invoice No.', dateLabel: 'Invoice Date', partyLabel: 'Customer / Buyer', prefix: 'INV', actionLabel: 'Receive', actionVerb: 'Record Receipt', paidLabel: 'Total Received' },
};

const apArItems = {
  payable: [
    { code: 'BILL-0001', party: 'ABC Textiles Ltd.', docDate: '2026-08-02', dueDate: '2026-09-01', ref: 'PO-2031', amount: 875000, paid: 0, memo: 'Fabric supply — August shipment' },
    { code: 'BILL-0002', party: 'Prime Dyeing & Finishing', docDate: '2026-08-10', dueDate: '2026-08-25', ref: 'PO-2044', amount: 412500, paid: 150000, memo: 'Dyeing charges — Style STY-118' },
    { code: 'BILL-0003', party: 'City Bank PLC', docDate: '2026-07-15', dueDate: '2026-08-15', ref: 'LOAN-INT-08', amount: 65000, paid: 0, memo: 'Loan interest — August' },
  ],
  receivable: [
    { code: 'INV-0001', party: 'Everest Apparels Ltd.', docDate: '2026-08-05', dueDate: '2026-09-04', ref: 'SC-4471', amount: 4500000, paid: 2000000, memo: 'Export shipment SHP-2201' },
    { code: 'INV-0002', party: 'Metro Fashion House', docDate: '2026-08-20', dueDate: '2026-09-05', ref: 'SO-118', amount: 620000, paid: 620000, memo: 'Local sale — Invoice 118' },
    { code: 'INV-0003', party: 'Northline Buying House', docDate: '2026-07-10', dueDate: '2026-07-25', ref: 'SMP-77', amount: 85000, paid: 0, memo: 'Sample order income' },
  ],
};

const apArFilter = {
  payable: { q: '', party: 'All Parties', status: 'All Statuses', period: 'All', page: 1 },
  receivable: { q: '', party: 'All Parties', status: 'All Statuses', period: 'All', page: 1 },
};

const AP_AR_ICON_OUTSTANDING = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
const AP_AR_ICON_OVERDUE = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v4M12 15h.01"/></svg>';
const AP_AR_ICON_DUESOON = '<svg viewBox="0 0 24 24" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';

function apArBalance(it) {
  return Math.max(0, (it.amount || 0) - (it.paid || 0));
}

function apArStatus(it) {
  const bal = apArBalance(it);
  if (bal <= 0) return 'Paid';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(it.dueDate + 'T00:00:00');
  if (due < today) return 'Overdue';
  if (it.paid > 0) return 'Partially Paid';
  return 'Unpaid';
}

function apArStatusPill(status) {
  const map = { Paid: ['successSoft', 'success'], 'Partially Paid': ['infoSoft', 'info'], Unpaid: ['warningSoft', 'warning'], Overdue: ['dangerSoft', 'danger'] };
  const [bg, fg] = map[status] || map.Unpaid;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function apArNextCode(key) {
  const cfg = AP_AR_TYPES[key];
  const max = apArItems[key].reduce((m, it) => Math.max(m, parseInt((it.code.split('-')[1] || '0'), 10) || 0), 0);
  return `${cfg.prefix}-${String(max + 1).padStart(4, '0')}`;
}

function apArPartyOptions(key) {
  return Array.from(new Set(apArItems[key].map(i => i.party))).sort();
}

function apArFiltered(key) {
  const f = apArFilter[key];
  const q = f.q.trim().toLowerCase();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return apArItems[key].filter(it => {
    const status = apArStatus(it);
    if (q && !(it.code.toLowerCase().includes(q) || it.party.toLowerCase().includes(q) || (it.ref || '').toLowerCase().includes(q))) return false;
    if (f.party !== 'All Parties' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && status !== f.status) return false;
    if (f.period !== 'All') {
      const due = new Date(it.dueDate + 'T00:00:00');
      const diffDays = (due - today) / 86400000;
      const bal = apArBalance(it);
      if (f.period === 'Overdue' && !(diffDays < 0 && bal > 0)) return false;
      if (f.period === 'Due in 7 Days' && !(diffDays >= 0 && diffDays <= 7 && bal > 0)) return false;
      if (f.period === 'Due in 30 Days' && !(diffDays >= 0 && diffDays <= 30 && bal > 0)) return false;
    }
    return true;
  });
}

function apArSummaryCards(key) {
  const cfg = AP_AR_TYPES[key];
  const items = apArItems[key];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let outstanding = 0, overdue = 0, dueSoon = 0, paidTotal = 0;
  items.forEach(it => {
    const bal = apArBalance(it);
    paidTotal += (it.paid || 0);
    if (bal > 0) {
      outstanding += bal;
      const due = new Date(it.dueDate + 'T00:00:00');
      const diffDays = (due - today) / 86400000;
      if (diffDays < 0) overdue += bal;
      else if (diffDays <= 7) dueSoon += bal;
    }
  });
  const label = key === 'payable' ? 'Payable' : 'Receivable';
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(AP_AR_ICON_OUTSTANDING, coaInt(outstanding), `Total Outstanding ${label}`)}
      ${coaCashBankStatCard(AP_AR_ICON_OVERDUE, coaInt(overdue), 'Overdue Amount')}
      ${coaCashBankStatCard(AP_AR_ICON_DUESOON, coaInt(dueSoon), 'Due in Next 7 Days')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, coaInt(paidTotal), cfg.paidLabel)}
    </div>`;
}

function apArFilterBar(key) {
  const cfg = AP_AR_TYPES[key];
  const f = apArFilter[key];
  const parties = ['All Parties', ...apArPartyOptions(key)];
  const statuses = ['All Statuses', 'Unpaid', 'Partially Paid', 'Paid', 'Overdue'];
  const periods = ['All', 'Overdue', 'Due in 7 Days', 'Due in 30 Days'];
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="apArSearch" type="text" value="${escapeHtml(f.q)}" placeholder="Search ${cfg.noun.toLowerCase()} no. or party…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField(cfg.partyLabel, `<select id="apArParty" class="${COA_INPUT}">${parties.map(p => `<option value="${escapeHtml(p)}" ${p === f.party ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}</select>`)}
        ${coaField('Status', `<select id="apArStatus" class="${COA_INPUT}">${statuses.map(s => `<option value="${escapeHtml(s)}" ${s === f.status ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select>`)}
        ${coaField('Due', `<select id="apArPeriod" class="${COA_INPUT}">${periods.map(p => `<option value="${escapeHtml(p)}" ${p === f.period ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}</select>`)}
      </div>
    </section>`;
}

function apArRow(key, it, n) {
  const cfg = AP_AR_TYPES[key];
  const bal = apArBalance(it);
  const status = apArStatus(it);
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base font-medium text-primary tabular">${escapeHtml(it.code)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(it.ref || '—')}</p>
      </td>
      <td class="px-3 py-2.5 min-w-[190px]">
        <p class="fs-base text-primary">${escapeHtml(it.party)}</p>
        <div class="mt-1.5">${apArStatusPill(status)}</div>
      </td>
      <td class="px-3 py-2.5 whitespace-nowrap tabular">
        <p class="fs-base text-secondary">${coaFormatDateDisplay(it.docDate)}</p>
        <p class="text-helper text-muted mt-0.5">Due ${coaFormatDateDisplay(it.dueDate)}</p>
      </td>
      <td class="px-3 py-2.5 fs-base text-primary font-semibold whitespace-nowrap tabular text-right">${coaInt(it.amount)}</td>
      <td class="px-3 py-2.5 whitespace-nowrap text-right tabular">
        <p class="fs-base text-secondary">${coaInt(it.paid)} <span class="text-helper text-muted">paid</span></p>
        <p class="fs-base font-semibold mt-0.5 ${bal > 0 ? 'text-danger' : 'text-success'}">${coaInt(bal)} <span class="text-helper font-normal text-muted">due</span></p>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        ${bal > 0 ? `<button type="button" data-apar-pay="${escapeHtml(it.code)}" class="h-7 px-2.5 rounded border border-side-accent/40 text-side-accent fs-small font-semibold hover:bg-side-active mr-1.5">${escapeHtml(cfg.actionLabel)}</button>` : ''}
        <button type="button" data-apar-remove="${escapeHtml(it.code)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>
      </td>
    </tr>`;
}

function apArResultsHtml(key) {
  const cfg = AP_AR_TYPES[key];
  const f = apArFilter[key];
  const all = apArFiltered(key);
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  f.page = Math.min(Math.max(1, f.page), totalPages);
  const start = (f.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', `${cfg.docLabel} / Reference`, `${cfg.partyLabel} / Status`, `${cfg.dateLabel} / Due`, 'Amount (BDT)', 'Paid / Balance (BDT)', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, idx) => `<th class="${idx === 0 ? 'pl-4 pr-2' : idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${idx >= 4 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((it, i) => apArRow(key, it, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No ${cfg.noun.toLowerCase()}s match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      <div class="flex items-center gap-1.5">
        <button data-aparpage="prev" ${f.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-aparpage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === f.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-aparpage="next" ${f.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
      </div>
    </div>`;
}

function apArListCard(key) {
  const cfg = AP_AR_TYPES[key];
  const all = apArFiltered(key);
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex flex-wrap items-start justify-between gap-3 p-4">
        <div>
          <h3 class="text-section-title text-primary">${key === 'payable' ? 'Bills — Accounts Payable' : 'Invoices — Accounts Receivable'}</h3>
          <p id="apArCounter" class="text-helper text-muted mt-0.5">${all.length} of ${apArItems[key].length} ${cfg.noun.toLowerCase()}${apArItems[key].length === 1 ? '' : 's'}</p>
        </div>
        <button type="button" id="apArNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New ${escapeHtml(cfg.noun)}</button>
      </div>
      <div id="apArResults">${apArResultsHtml(key)}</div>
    </section>`;
}

function vmRenderApAr(container, key) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${apArSummaryCards(key)}
      ${apArFilterBar(key)}
      ${apArListCard(key)}
    </div>`;
  apArBindEvents(container, key);
}

function apArRefresh(container, key) {
  const results = container.querySelector('#apArResults');
  if (results) results.innerHTML = apArResultsHtml(key);
  const counter = container.querySelector('#apArCounter');
  if (counter) {
    const cfg = AP_AR_TYPES[key];
    const all = apArFiltered(key);
    counter.textContent = `${all.length} of ${apArItems[key].length} ${cfg.noun.toLowerCase()}${apArItems[key].length === 1 ? '' : 's'}`;
  }
}

function apArBindEvents(container, key) {
  const f = apArFilter[key];

  container.querySelector('#apArSearch').addEventListener('input', (e) => {
    f.q = e.target.value; f.page = 1; apArRefresh(container, key);
  });
  container.querySelector('#apArParty').addEventListener('change', (e) => {
    f.party = e.target.value; f.page = 1; apArRefresh(container, key);
  });
  container.querySelector('#apArStatus').addEventListener('change', (e) => {
    f.status = e.target.value; f.page = 1; apArRefresh(container, key);
  });
  container.querySelector('#apArPeriod').addEventListener('change', (e) => {
    f.period = e.target.value; f.page = 1; apArRefresh(container, key);
  });

  container.querySelector('#apArResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-aparpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(apArFiltered(key).length / COA_PAGE_SIZE));
      if (pageBtn.dataset.aparpage === 'prev') f.page = Math.max(1, f.page - 1);
      else if (pageBtn.dataset.aparpage === 'next') f.page = Math.min(totalPages, f.page + 1);
      else f.page = +pageBtn.dataset.aparpage;
      apArRefresh(container, key);
      return;
    }
    const payBtn = e.target.closest('[data-apar-pay]');
    if (payBtn) { apArOpenPayModal(key, payBtn.dataset.aparPay, container); return; }
    const removeBtn = e.target.closest('[data-apar-remove]');
    if (removeBtn) {
      apArItems[key] = apArItems[key].filter(it => it.code !== removeBtn.dataset.aparRemove);
      apArRefresh(container, key);
    }
  });

  container.querySelector('#apArNew').addEventListener('click', () => apArOpenNewModal(key, container));
}

function apArOpenNewModal(key, listContainer) {
  if (document.getElementById('apArNewModal')) return;
  const cfg = AP_AR_TYPES[key];
  const nextCode = apArNextCode(key);
  const today = new Date().toISOString().slice(0, 10);
  const parties = apArPartyOptions(key);
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  const wrap = document.createElement('div');
  wrap.id = 'apArNewModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', `New ${cfg.noun}`);
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[640px] px-4">
      <form id="apArNewForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('doc', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">New ${escapeHtml(cfg.noun)}</h3>
          <button type="button" data-close aria-label="Close" class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0">${biLabel(cfg.docLabel)}
            <input name="code" type="text" value="${escapeHtml(nextCode)}" readonly class="${COA_INPUT} tabular bg-side-bg/60 text-muted" /></label>
          <label class="block min-w-0">${biLabel(cfg.partyLabel, { req: true })}
            <input name="party" type="text" list="apArPartyList" autocomplete="off" placeholder="e.g. ${escapeHtml(parties[0] || 'Party name')}" class="${COA_INPUT}" />
            <datalist id="apArPartyList">${parties.map(p => `<option value="${escapeHtml(p)}"></option>`).join('')}</datalist>
          </label>
          <label class="block min-w-0">${biLabel(cfg.dateLabel)}
            <input name="docDate" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Due Date')}
            <input name="dueDate" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Reference')}
            <input name="ref" type="text" autocomplete="off" placeholder="e.g. PO-2031" class="${COA_INPUT}" /></label>
          <label class="block min-w-0">${biLabel('Amount', { req: true })}
            <input name="amount" type="number" min="0" step="0.01" placeholder="0.00" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Memo / Description')}
            <input name="memo" type="text" autocomplete="off" placeholder="Short description (optional)" class="${COA_INPUT}" /></label>
          <p id="apArNewModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save ${escapeHtml(cfg.noun)}</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#apArNewForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#apArNewModalMsg');
    if (!val('party') || !val('amount')) {
      msg.textContent = `${cfg.partyLabel} and Amount are required.`;
      return;
    }
    apArItems[key].push({
      code: val('code'),
      party: val('party'),
      docDate: val('docDate'),
      dueDate: val('dueDate'),
      ref: val('ref'),
      amount: Number(val('amount')) || 0,
      paid: 0,
      memo: val('memo'),
    });
    done();
    apArFilter[key].page = 1;
    apArRefresh(listContainer, key);
  });

  const first = form.querySelector('input[name="party"]');
  if (first) first.focus();
}

function apArOpenPayModal(key, code, listContainer) {
  if (document.getElementById('apArPayModal')) return;
  const cfg = AP_AR_TYPES[key];
  const it = apArItems[key].find(x => x.code === code);
  if (!it) return;
  const bal = apArBalance(it);
  const today = new Date().toISOString().slice(0, 10);
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  const wrap = document.createElement('div');
  wrap.id = 'apArPayModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', cfg.actionVerb);
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[14vh] w-full max-w-[440px] px-4">
      <form id="apArPayForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">${escapeHtml(cfg.actionVerb)} — ${escapeHtml(it.code)}</h3>
          <button type="button" data-close aria-label="Close" class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>
        <div class="p-4 grid grid-cols-1 gap-3">
          <p class="text-helper text-muted">${escapeHtml(it.party)} — outstanding balance <span class="text-primary font-semibold tabular">BDT ${coaMoney(bal)}</span></p>
          <label class="block min-w-0">${biLabel(cfg.actionLabel + ' Amount', { req: true })}
            <input name="amount" type="number" min="0" max="${bal}" step="0.01" value="${bal}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel(cfg.actionLabel + ' Date')}
            <input name="payDate" type="date" value="${today}" class="${COA_INPUT} tabular" /></label>
          <p id="apArPayModalMsg" class="text-helper text-danger min-h-[17px]"></p>
        </div>
        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">${escapeHtml(cfg.actionVerb)}</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#apArPayForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const amt = Number(form.elements.amount.value) || 0;
    const msg = form.querySelector('#apArPayModalMsg');
    if (amt <= 0 || amt > bal + 0.005) {
      msg.textContent = `Enter an amount between 0 and BDT ${coaMoney(bal)}.`;
      return;
    }
    it.paid = (it.paid || 0) + amt;
    done();
    apArRefresh(listContainer, key);
  });

  const first = form.querySelector('input[name="amount"]');
  if (first) first.focus();
}

const GE_DIRECTIONS = ['Payment', 'Receive'];

const GE_CHART_GROUPS = () => coaCategoryDefs().map(c => [c.label, c.list]);

// Which accounts need a party picker is read from the control type stored on the account, never
// guessed from its name. Receivable/payable parties come from the AP/AR registers; the rest
// have no register yet, so they use the same fallback lists as the reference build.
const GE_PARTY_CONFIG = {
  receivable: { label: 'Customer / Buyer', parties: () => apArPartyOptions('receivable') },
  payable: { label: 'Supplier / Vendor', parties: () => apArPartyOptions('payable') },
  loan_receivable: { label: 'Borrower', parties: () => ['Everest Apparels Ltd.', 'Northline Buying House'] },

function geResetForm() {

function geNextNo() {
  const year = new Date().getFullYear();
  const max = generalEntries
    .filter(e => e.entryNo.startsWith(`DE-${year}-`))
    .reduce((m, e) => Math.max(m, parseInt(e.entryNo.split('-')[2], 10) || 0), 0);
  return `DE-${year}-${String(max + 1).padStart(4, '0')}`;
}

function geFindAccount(value) {
  const code = String(value || '').split(' — ')[0].trim();
  for (const [, list] of GE_CHART_GROUPS()) {
    const acc = list.find(a => a.code === code);
    if (acc) return acc;
  }
  return null;
}

function gePartyConfig(coaValue) {
  const acc = geFindAccount(coaValue);
  return (acc && acc.controlType && GE_PARTY_CONFIG[acc.controlType]) || null;
}

function geSetMsg(text, tone) {

function renderGeneralEntry(container) {
  container.innerHTML = `

}

// Enables the party picker only when the chosen account's control type defines one, and keeps
// the previously chosen party if it's still valid for that account.
function geRefreshParty(container) {
  const sel = container.querySelector('#gePartySelect');
  if (!sel) return;
  const cfg = gePartyConfig(geForm.coa);
  const parties = cfg ? cfg.parties() : [];
  if (cfg && parties.length) {
    if (!parties.includes(geForm.party)) geForm.party = '';
    sel.innerHTML = `<option value="">Select ${escapeHtml(cfg.label)}</option>${parties.map(p => `<option value="${escapeHtml(p)}" ${p === geForm.party ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}`;
    sel.disabled = false;
  } else {
    geForm.party = '';
    sel.innerHTML = '<option value="">Select Supplier / Customer</option>';
    sel.disabled = true;
  }
  sel.classList.toggle('opacity-60', sel.disabled);
  sel.classList.toggle('cursor-not-allowed', sel.disabled);
  geRefreshDue(container);
}

// Quick context before typing the amount: what is currently outstanding for the picked party
// (or the whole ledger until one is picked). Display only — not an editable value.
function geRefreshDue(container) {
  const acc = geFindAccount(geForm.coa);
  const type = acc ? acc.controlType : null;
  const due = (key) => apArItems[key]
    .filter(b => !geForm.party || b.party === geForm.party)
    .reduce((s, b) => s + apArBalance(b), 0);
  [['gePayableDue', 'payable'], ['geReceivableDue', 'receivable']].forEach(([id, key]) => {
    const el = container.querySelector('#' + id);
    if (!el) return;
    const active = type === key;
    el.textContent = active ? coaMoney(due(key)) : '—';
    el.classList.toggle('text-muted', !active);
    el.classList.toggle('text-primary', active);
    el.classList.toggle('font-semibold', active);
  });
}

function geBindEvents(container) {
  container.querySelectorAll('[data-gef]').forEach(el => {
    const handler = () => {
      geForm[el.dataset.gef] = el.value;
      if (el.dataset.gef === 'coa') { geForm.party = ''; geRefreshParty(container); }
      else if (el.dataset.gef === 'party') geRefreshDue(container);
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { geForm[el.dataset.gef] = el.value; });
  });

  container.querySelector('#geResetBtn').addEventListener('click', () => {
    geResetForm();
    renderGeneralEntry(container);
  });

  container.querySelector('#geSaveBtn').addEventListener('click', () => {
    const cfg = gePartyConfig(geForm.coa);
    const amount = coaNum(geForm.amount);
    if (!geForm.direction) return geSetMsg('Select Payment or Receive before saving.', 'danger');
    if (!geForm.bank) return geSetMsg('Select a Cash / Bank account before saving.', 'danger');
    if (!geForm.coa) return geSetMsg('Select an account from the Chart of Accounts before saving.', 'danger');
    if (cfg && !geForm.party) return geSetMsg(`Select a ${cfg.label} before saving.`, 'danger');
    if (amount <= 0) return geSetMsg('Enter a valid amount before saving.', 'danger');

    const entryNo = geNextNo();
    generalEntries.unshift({
      entryNo,
      type: geForm.direction,
      date: geForm.date,
      bankAccount: geForm.bank,
      coaAccount: geForm.coa + (geForm.party ? ` — ${geForm.party}` : ''),
      amount,
      description: geForm.desc.trim(),
    });
    geResetForm();
    renderGeneralEntry(container);
    geSetMsg(`General entry ${entryNo} posted successfully.`, 'success');
  });
}

function vatNewLine() { return { description: '', unit: 'Pcs', quantity: 1, unitPrice: 0 }; }

// Taka amount in words, using the crore / lakh / thousand grouping Mushak forms use.
function vatNumberToWords(n) {
  n = Math.floor(Math.abs(n));
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
    'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (v) => v < 20 ? ones[v] : tens[Math.floor(v / 10)] + (v % 10 ? ' ' + ones[v % 10] : '');
  const three = (v) => {
    const h = Math.floor(v / 100), r = v % 100;
    return (h ? ones[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? two(r) : '');
  };
  if (n === 0) return 'Zero';
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const parts = [];
  if (crore) parts.push(three(crore) + ' Crore');
  if (lakh) parts.push(two(lakh) + ' Lakh');
  if (thousand) parts.push(two(thousand) + ' Thousand');
  if (n) parts.push(three(n));
  return parts.join(' ').trim();
}

function vatAmountInWords(amount) {
  const taka = Math.floor(amount);
  const poisha = Math.round((amount - taka) * 100);
  return 'Taka ' + vatNumberToWords(taka) + (poisha > 0 ? ' and ' + vatNumberToWords(poisha) + ' Poisha' : '') + ' Only';
}

function vatLineValue(it) { return (Number(it.quantity) || 0) * (Number(it.unitPrice) || 0); }
function vatItemsValue(items) { return (items || []).reduce((s, it) => s + vatLineValue(it), 0); }
function vatCalcFor(items, rate) {
  const taxable = vatItemsValue(items);
  const vatAmount = Math.round(taxable * (rate / 100) * 100) / 100;
  return { taxable, vatAmount, total: taxable + vatAmount };
}
function vatCalc(inv) { return vatCalcFor(inv.items, inv.vatRate); }

function vatNextChallanNo() {
  const max = vatInvoices.reduce((m, v) => Math.max(m, parseInt((v.challanNo.split('-')[1] || '0'), 10) || 0), 0);

}

function vatStatusPill(status) {

}

function vatFiltered() {
  const q = vatFilter.q.trim().toLowerCase();

    if (q && !(v.challanNo.toLowerCase().includes(q) || v.buyerName.toLowerCase().includes(q) || (v.buyerBin || '').toLowerCase().includes(q))) return false;
    if (vatFilter.rate !== 'All Rates' && `${v.vatRate}%` !== vatFilter.rate) return false;
    if (vatFilter.status !== 'All Statuses' && v.status !== vatFilter.status) return false;
    return true;
  });
}

function vatSummaryCards() {
  let taxable = 0, vat = 0, total = 0, issued = 0;
  vatInvoices.forEach(v => {
    if (v.status !== 'Issued') return;
    const c = vatCalc(v);
    taxable += c.taxable; vat += c.vatAmount; total += c.total; issued += 1;
  });

      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaInt(Math.round(vat)), 'Output VAT Collected (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, coaInt(Math.round(total)), 'Total Invoice Value (BDT)')}
    </div>`;
}

function vatRow(v, n) {

      </td>
      <td class="px-3 py-2.5 min-w-[200px]">
        <p class="fs-base text-primary">${escapeHtml(v.buyerName)}</p>
        <p class="text-helper text-muted mt-0.5 tabular">BIN: ${escapeHtml(v.buyerBin || '—')}</p>
      </td>
      <td class="px-3 py-2.5 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(c.taxable)}</td>
      <td class="px-3 py-2.5 whitespace-nowrap text-right">
        <p class="fs-base text-primary font-semibold tabular">${coaMoney(c.vatAmount)}</p>

        ${v.status === 'Issued' ? `<button type="button" data-vat-cancel="${escapeHtml(v.challanNo)}" class="h-7 px-2.5 rounded border border-side-border text-secondary fs-small font-semibold hover:text-danger hover:bg-dangerSoft">Cancel</button>` : ''}

function vatResultsHtml() {
  const all = vatFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  vatFilter.page = Math.min(Math.max(1, vatFilter.page), totalPages);
  const start = (vatFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Challan No. / Date', 'Buyer / BIN', 'Taxable Value (BDT)', 'VAT Amount (BDT)', 'Status', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i === 3 || i === 4 || i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((v, i) => vatRow(v, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No Mushak 6.3 tax invoices match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      <div class="flex items-center gap-1.5">
        <button data-vatpage="prev" ${vatFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-vatpage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === vatFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-vatpage="next" ${vatFilter.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
      </div>
    </div>`;
}

function vatCounterText() {
  return `${vatFiltered().length} of ${vatInvoices.length} tax invoice${vatInvoices.length === 1 ? '' : 's'}`;
}

function vatListCard() {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex flex-wrap items-start justify-between gap-3 p-4">
        <div>
          <h3 class="text-section-title text-primary">VAT &amp; Tax — Mushak 6.3 Register</h3>
          <p id="vatCounter" class="text-helper text-muted mt-0.5">${vatCounterText()}</p>
        </div>
        <button type="button" id="vatNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Mushak 6.3</button>
      </div>
      <div id="vatResults">${vatResultsHtml()}</div>
    </section>`;
}

function renderVatTax(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${vatSummaryCards()}
      ${vatFilterBar()}
      ${vatListCard()}
    </div>`;
  vatBindEvents(container);
}

function vatRefreshResults(container) {
  container.querySelector('#vatResults').innerHTML = vatResultsHtml();
  container.querySelector('#vatCounter').textContent = vatCounterText();
}

function vatBindEvents(container) {
  container.querySelector('#vatSearch').addEventListener('input', (e) => { vatFilter.q = e.target.value; vatFilter.page = 1; vatRefreshResults(container); });
  container.querySelector('#vatRateFilter').addEventListener('change', (e) => { vatFilter.rate = e.target.value; vatFilter.page = 1; vatRefreshResults(container); });
  container.querySelector('#vatStatusFilter').addEventListener('change', (e) => { vatFilter.status = e.target.value; vatFilter.page = 1; vatRefreshResults(container); });

  container.querySelector('#vatNew').addEventListener('click', () => vatOpenNewModal(container));

  container.querySelector('#vatResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-vatpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(vatFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.vatpage;
      vatFilter.page = p === 'prev' ? Math.max(1, vatFilter.page - 1) : p === 'next' ? Math.min(totalPages, vatFilter.page + 1) : +p;
      vatRefreshResults(container);
      return;
    }
    const viewBtn = e.target.closest('[data-vat-view]');
    if (viewBtn) {
      const no = viewBtn.dataset.vatView;
      vatUi.previewNo = vatUi.previewNo === no ? null : no;
      vatRefreshResults(container);
      return;
    }
    const cancelBtn = e.target.closest('[data-vat-cancel]');
    if (cancelBtn) {
      const inv = vatInvoices.find(v => v.challanNo === cancelBtn.dataset.vatCancel);
      if (!inv || !window.confirm(`Cancel ${inv.challanNo}? A cancelled Mushak 6.3 keeps its serial number and cannot be reissued.`)) return;
      inv.status = 'Cancelled';
      renderVatTax(container);
    }
  });
}

function vatOpenNewModal(container) {
  vatResetForm();
  finOpenModal({
    id: 'vatNewModal', title: 'New Mushak 6.3 Tax Invoice', icon: 'wallet', wide: true, width: 'max-w-[940px]',
    submitLabel: 'Save & Issue',
    body: vatFormBodyHtml(),
    onOpen(form) {
      const refreshTotals = () => { form.querySelector('#vatFormTotals').innerHTML = vatFormTotalsInner(); };
      const redrawLines = () => { form.querySelector('#vatFormLines').innerHTML = vatForm.items.map(vatFormLineRow).join(''); refreshTotals(); };

      form.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.vatf && t.dataset.vatf !== 'rate') vatForm[t.dataset.vatf] = t.value;
        if (t.dataset.vitem) {
          const row = t.closest('[data-vrow]');
          const it = vatForm.items[+row.dataset.vrow];
          const numeric = t.dataset.vitem === 'quantity' || t.dataset.vitem === 'unitPrice';
          it[t.dataset.vitem] = numeric ? (parseFloat(t.value) || 0) : t.value;
          if (numeric) {
            row.querySelector('[data-vline-total]').textContent = coaMoney(vatLineValue(it));
            refreshTotals();
          }
        }
      });
      form.addEventListener('change', (e) => {
        if (e.target.dataset.vatf === 'rate') { vatForm.rate = parseFloat(e.target.value); refreshTotals(); }
      });
      form.addEventListener('click', (e) => {
        const del = e.target.closest('[data-vitem-del]');
        if (del && !del.disabled) { vatForm.items.splice(+del.dataset.vitemDel, 1); redrawLines(); return; }
        if (e.target.closest('#vatAddLine')) { vatForm.items.push(vatNewLine()); redrawLines(); }
      });
    },
    onSubmit() {
      const f = vatForm;
      const items = f.items.filter(it => it.description.trim() && (Number(it.quantity) || 0) > 0);
      // A Mushak 6.3 is invalid without buyer name and address, issue date and time, and at least one
      // described, priced line. Buyer BIN stays optional for an unregistered buyer.
      if (!f.buyerName.trim()) return 'Enter the buyer name.';
      if (!f.buyerAddress.trim()) return 'Enter the buyer address.';
      if (!f.issueDate || !f.issueTime) return 'Enter the date and time of issue.';
      if (!items.length) return 'Add at least one line with a description and quantity.';
      vatInvoices.push({
        challanNo: vatNextChallanNo(),
        issueDate: f.issueDate,
        issueTime: f.issueTime,
        buyerName: f.buyerName.trim(),
        buyerBin: f.buyerBin.trim(),
        buyerAddress: f.buyerAddress.trim(),
        vatRate: f.rate,
        status: 'Issued',
        items: items.map(it => ({ description: it.description.trim(), unit: it.unit.trim() || 'Pcs', quantity: Number(it.quantity), unitPrice: Number(it.unitPrice) || 0 })),
      });
      vatFilter.page = Math.ceil(vatFiltered().length / COA_PAGE_SIZE);
      renderVatTax(container);
    },
  });
}

// ---------- Shared modal helpers (Finance pages) ----------
// One small dialog shell for the Finance registers' "New …" / "Record …" forms, matching the
// modal look used by Accounts Payable / Receivable. onSubmit(form) returns an error string to keep
// the dialog open, or nothing to close it.
function finFormField(label, name, o) {
  o = o || {};
  const span = o.span ? ' sm:col-span-2' : '';
  let inner;
  if (o.options) {
    inner = `<select name="${name}" class="${COA_INPUT}">${o.options.map(v => `<option value="${escapeHtml(v)}" ${v === o.value ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}</select>`;
  } else if (o.textarea) {
    inner = `<textarea name="${name}" placeholder="${escapeHtml(o.placeholder || '')}" style="height:72px" class="${COA_INPUT} py-2 resize-none">${escapeHtml(o.value || '')}</textarea>`;
  } else {
    inner = `<input name="${name}" type="${o.type || 'text'}" ${o.type === 'number' ? 'min="0" step="0.01"' : ''} autocomplete="off" value="${escapeHtml(o.value ?? '')}" placeholder="${escapeHtml(o.placeholder || '')}" ${o.readonly ? 'readonly' : ''} class="${o.readonly ? COA_AUTO : COA_INPUT} ${o.type === 'number' || o.type === 'date' || o.readonly ? 'tabular' : ''}" />`;
  }
  return `<label class="block min-w-0${span}">${biLabel(label, { req: o.req })}${inner}</label>`;
}

function finOpenModal(o) {
  if (document.getElementById(o.id)) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const wrap = document.createElement('div');
  wrap.id = o.id;
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', o.title);
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[6vh] w-full ${o.width || (o.wide ? 'max-w-[720px]' : 'max-w-[440px]')} px-4">
      <form class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg(o.icon || 'doc', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">${escapeHtml(o.title)}</h3>
          <button type="button" data-close aria-label="Close" class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>
        ${o.intro ? `<p class="px-4 pt-3 text-helper text-muted">${o.intro}</p>` : ''}
        <div class="p-4 grid grid-cols-1 ${o.wide ? 'sm:grid-cols-2' : ''} gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          ${o.body}
          <p data-msg class="${o.wide ? 'sm:col-span-2 ' : ''}text-helper text-danger min-h-[17px]"></p>
        </div>
        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">${escapeHtml(o.submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const err = o.onSubmit(form);
    if (err) { form.querySelector('[data-msg]').textContent = err; return; }
    done();
  });
  if (o.onOpen) o.onOpen(form);
  const first = form.querySelector('input:not([readonly]), select, textarea');
  if (first) first.focus();
}

function finFormVal(form, name) { return (form.elements[name].value || '').trim(); }

function finPill(text, tone, dot) {
  const [bg, fg] = { success: ['successSoft', 'success'], warning: ['warningSoft', 'warning'], danger: ['dangerSoft', 'danger'], info: ['infoSoft', 'info'], neutral: ['neutralSoft', 'neutral'] }[tone] || ['neutralSoft', 'neutral'];
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold whitespace-nowrap bg-${bg} text-${fg}">${dot ? `<span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>` : ''}${escapeHtml(text)}</span>`;
}

function finPager(attr, page, totalPages) {
  return `
    <div class="flex items-center gap-1.5">
      <button data-${attr}="prev" ${page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
      ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-${attr}="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
      <button data-${attr}="next" ${page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
    </div>`;
}

// ---------- Budget Management ----------
// Content ported from the Finance reference build: departmental / cost-centre budget lines per
// fiscal year, with actual spend recorded against each line so variance and utilization stay
// current. Spend status is derived from the amounts rather than stored, so it can't drift.
const BUDGET_DEPARTMENTS = ['Merchandising', 'Production / Factory', 'Procurement', 'Admin & HR', 'Finance', 'Commercial / Export', 'Quality Assurance', 'Sample Development', 'IT & Systems'];
const BUDGET_CATEGORIES = ['Raw Material Consumption', 'Direct Factory Labor', 'Factory Overhead', 'Admin Salaries', 'Rent Expense', 'Utilities', 'Office Supplies', 'Sample & Development', 'Marketing & Business Promotion', 'Freight & Shipping (Export)', 'Commission Expense', 'Bank Interest & Charges', 'Machinery & CapEx', 'Compliance & Audit', 'Contingency / Miscellaneous'];
const BUDGET_PERIOD_TYPES = ['Annual', 'Quarterly', 'Monthly'];
const BUDGET_APPROVAL_STATUSES = ['Draft', 'Pending Approval', 'Approved', 'Rejected'];

// Bangladesh's fiscal year runs July–June, so offer the previous, current and next FY.
const BUDGET_FISCAL_YEARS = (() => {
  const now = new Date();
  const y = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
  return [`FY${y - 1}-${String(y).slice(-2)}`, `FY${y}-${String(y + 1).slice(-2)}`, `FY${y + 1}-${String(y + 2).slice(-2)}`];
})();

const budgetRecords = (() => {
  const fy = BUDGET_FISCAL_YEARS[1];
  const y1 = fy.slice(2, 6), y2 = `20${fy.slice(-2)}`;
  return [
    { budgetCode: 'BUD-0001', title: 'Woven Fabric & Trims Procurement', department: 'Procurement', category: 'Raw Material Consumption', fiscalYear: fy, periodType: 'Annual', startDate: `${y1}-07-01`, endDate: `${y2}-06-30`, budgetedAmount: 45000000, actualSpent: 28500000, approvalStatus: 'Approved', approvedBy: 'Head of Finance', notes: 'Covers fabric, trims and accessories for confirmed POs this fiscal year.' },
    { budgetCode: 'BUD-0002', title: 'Factory Floor Wages & Overtime', department: 'Production / Factory', category: 'Direct Factory Labor', fiscalYear: fy, periodType: 'Annual', startDate: `${y1}-07-01`, endDate: `${y2}-06-30`, budgetedAmount: 18000000, actualSpent: 17200000, approvalStatus: 'Approved', approvedBy: 'Managing Director', notes: '' },
    { budgetCode: 'BUD-0003', title: 'Sample & Development Costs', department: 'Sample Development', category: 'Sample & Development', fiscalYear: fy, periodType: 'Quarterly', startDate: `${y1}-07-01`, endDate: `${y1}-09-30`, budgetedAmount: 1200000, actualSpent: 1350000, approvalStatus: 'Approved', approvedBy: 'Head of Merchandising', notes: 'Buyer sample requests ran ahead of plan this quarter.' },
    { budgetCode: 'BUD-0004', title: 'Export Freight & Shipping', department: 'Commercial / Export', category: 'Freight & Shipping (Export)', fiscalYear: fy, periodType: 'Annual', startDate: `${y1}-07-01`, endDate: `${y2}-06-30`, budgetedAmount: 9500000, actualSpent: 4100000, approvalStatus: 'Approved', approvedBy: 'Head of Finance', notes: '' },
    { budgetCode: 'BUD-0005', title: 'Head Office Admin & Utilities', department: 'Admin & HR', category: 'Utilities', fiscalYear: fy, periodType: 'Monthly', startDate: `${y1}-07-01`, endDate: `${y1}-07-31`, budgetedAmount: 650000, actualSpent: 0, approvalStatus: 'Pending Approval', approvedBy: '', notes: '' },
  ];
})();

const budgetFilter = { q: '', department: 'All Departments', fiscalYear: 'All Fiscal Years', status: 'All Statuses', page: 1 };

function budgetVariance(b) { return (b.budgetedAmount || 0) - (b.actualSpent || 0); }
function budgetUtilizationPct(b) { return b.budgetedAmount ? ((b.actualSpent || 0) / b.budgetedAmount) * 100 : 0; }
function budgetSpendStatus(b) {
  const pct = budgetUtilizationPct(b);
  if (pct > 100) return 'Over Budget';
  if (pct >= 90) return 'Near Limit';
  return 'On Track';
}
function budgetNextCode() {
  const max = budgetRecords.reduce((m, b) => Math.max(m, parseInt((b.budgetCode.split('-')[1] || '0'), 10) || 0), 0);
  return `BUD-${String(max + 1).padStart(4, '0')}`;
}

function budgetFiltered() {
  const q = budgetFilter.q.trim().toLowerCase();
  return budgetRecords.filter(b => {
    if (q && !(b.budgetCode.toLowerCase().includes(q) || b.title.toLowerCase().includes(q) || b.department.toLowerCase().includes(q))) return false;
    if (budgetFilter.department !== 'All Departments' && b.department !== budgetFilter.department) return false;
    if (budgetFilter.fiscalYear !== 'All Fiscal Years' && b.fiscalYear !== budgetFilter.fiscalYear) return false;
    if (budgetFilter.status !== 'All Statuses' && budgetSpendStatus(b) !== budgetFilter.status) return false;
    return true;
  });
}

function budgetSummaryCards() {
  let budgeted = 0, spent = 0, over = 0;
  budgetRecords.forEach(b => { budgeted += b.budgetedAmount || 0; spent += b.actualSpent || 0; if (budgetSpendStatus(b) === 'Over Budget') over += 1; });
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, coaInt(Math.round(budgeted)), 'Total Budgeted (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, coaInt(Math.round(spent)), 'Total Actual Spend (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaInt(Math.round(budgeted - spent)), 'Remaining Balance (BDT)')}
      ${coaCashBankStatCard(AP_AR_ICON_OVERDUE, over, 'Lines Over Budget')}
    </div>`;
}

function budgetFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="budgetSearch" type="text" value="${escapeHtml(budgetFilter.q)}" placeholder="Search budget lines…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField('Department', `<select id="budgetDept" class="${COA_INPUT}">${opt(['All Departments', ...BUDGET_DEPARTMENTS], budgetFilter.department)}</select>`)}
        ${coaField('Fiscal Year', `<select id="budgetFy" class="${COA_INPUT}">${opt(['All Fiscal Years', ...BUDGET_FISCAL_YEARS], budgetFilter.fiscalYear)}</select>`)}
        ${coaField('Status', `<select id="budgetStatus" class="${COA_INPUT}">${opt(['All Statuses', 'On Track', 'Near Limit', 'Over Budget'], budgetFilter.status)}</select>`)}
      </div>
    </section>`;
}

function budgetRow(b, n) {
  const variance = budgetVariance(b);
  const pct = budgetUtilizationPct(b);
  const status = budgetSpendStatus(b);
  const tone = status === 'Over Budget' ? 'danger' : status === 'Near Limit' ? 'warning' : 'success';
  const barColor = status === 'Over Budget' ? 'bg-danger' : status === 'Near Limit' ? 'bg-warning' : 'bg-side-accent';
  const approvalTone = { 'Pending Approval': 'warning', Rejected: 'danger', Draft: 'neutral' }[b.approvalStatus];
  const canSpend = b.approvalStatus === 'Approved';
  // Approved is the normal state, so only lines that are NOT approved carry an approval pill.
  const meta = [b.department, b.budgetCode, b.fiscalYear].join(' · ');
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 fs-base text-primary min-w-[240px]">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <span class="font-medium" ${canSpend && b.approvedBy ? `title="Approved by ${escapeHtml(b.approvedBy)}"` : ''}>${escapeHtml(b.title)}</span>${canSpend ? '' : finPill(b.approvalStatus, approvalTone)}
        </div>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(meta)}</p>
        ${b.notes ? `<p class="text-helper text-muted mt-0.5">${escapeHtml(b.notes)}</p>` : ''}
      </td>
      <td class="px-3 py-2.5 fs-base text-secondary whitespace-nowrap tabular text-right">${coaInt(b.budgetedAmount)}</td>
      <td class="px-3 py-2.5 fs-base text-secondary whitespace-nowrap tabular text-right">${coaInt(b.actualSpent)}</td>
      <td class="px-3 py-2.5 fs-base font-semibold whitespace-nowrap tabular text-right ${variance >= 0 ? 'text-success' : 'text-danger'}">${variance < 0 ? '−' : ''}${coaInt(Math.abs(variance))}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <div class="flex items-center gap-2">
          <div class="w-20 h-1.5 rounded-full bg-side-line overflow-hidden"><div class="h-full ${barColor}" style="width:${Math.min(100, Math.max(0, pct))}%"></div></div>
          <span class="fs-head tabular text-secondary">${pct.toFixed(0)}%</span>
        </div>
        <div class="mt-1.5">${finPill(status, tone, true)}</div>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        <button type="button" data-budget-spend="${escapeHtml(b.budgetCode)}" ${canSpend ? '' : 'disabled title="Spend can only be recorded against an approved budget line"'} class="h-7 px-2.5 rounded border border-side-accent/40 text-side-accent fs-small font-semibold hover:bg-side-active mr-1.5 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">Record Spend</button>
        <button type="button" data-budget-remove="${escapeHtml(b.budgetCode)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>
      </td>
    </tr>`;
}

function budgetResultsHtml() {
  const all = budgetFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  budgetFilter.page = Math.min(Math.max(1, budgetFilter.page), totalPages);
  const start = (budgetFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Budget', 'Budgeted (BDT)', 'Actual (BDT)', 'Variance (BDT)', 'Utilization', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i >= 2 && i <= 4 || i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((b, i) => budgetRow(b, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No budget lines match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      ${finPager('budgetpage', budgetFilter.page, totalPages)}
    </div>`;
}

function budgetCounterText() {
  return `${budgetFiltered().length} of ${budgetRecords.length} budget line${budgetRecords.length === 1 ? '' : 's'}`;
}

function renderBudgetManagement(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="budgetSummary">${budgetSummaryCards()}</div>
      ${budgetFilterBar()}
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
        <div class="flex flex-wrap items-start justify-between gap-3 p-4">
          <div>
            <h3 class="text-section-title text-primary">Budget Lines</h3>
            <p id="budgetCounter" class="text-helper text-muted mt-0.5">${budgetCounterText()}</p>
          </div>
          <button type="button" id="budgetNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Budget Line</button>
        </div>
        <div id="budgetResults">${budgetResultsHtml()}</div>
      </section>
    </div>`;
  budgetBindEvents(container);
}

// Filters only touch the table and counter; anything that changes the amounts also redraws the
// summary cards.
function budgetRefresh(container, withSummary) {
  container.querySelector('#budgetResults').innerHTML = budgetResultsHtml();
  container.querySelector('#budgetCounter').textContent = budgetCounterText();
  if (withSummary) container.querySelector('#budgetSummary').innerHTML = budgetSummaryCards();
}

function budgetBindEvents(container) {
  const bind = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { budgetFilter[key] = e.target.value; budgetFilter.page = 1; budgetRefresh(container); });
  bind('budgetSearch', 'q', 'input');
  bind('budgetDept', 'department', 'change');
  bind('budgetFy', 'fiscalYear', 'change');
  bind('budgetStatus', 'status', 'change');

  container.querySelector('#budgetNew').addEventListener('click', () => budgetOpenNewModal(container));

  container.querySelector('#budgetResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-budgetpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(budgetFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.budgetpage;
      budgetFilter.page = p === 'prev' ? Math.max(1, budgetFilter.page - 1) : p === 'next' ? Math.min(totalPages, budgetFilter.page + 1) : +p;
      budgetRefresh(container);
      return;
    }
    const spendBtn = e.target.closest('[data-budget-spend]');
    if (spendBtn && !spendBtn.disabled) { budgetOpenSpendModal(spendBtn.dataset.budgetSpend, container); return; }
    const removeBtn = e.target.closest('[data-budget-remove]');
    if (removeBtn) {
      const i = budgetRecords.findIndex(b => b.budgetCode === removeBtn.dataset.budgetRemove);
      if (i > -1) budgetRecords.splice(i, 1);
      budgetRefresh(container, true);
    }
  });
}

function budgetOpenNewModal(container) {
  const today = new Date().toISOString().slice(0, 10);
  finOpenModal({
    id: 'budgetNewModal', title: 'New Budget Line', icon: 'wallet', wide: true, submitLabel: 'Save Budget Line',
    body: [
      finFormField('Budget Code', 'code', { value: budgetNextCode(), readonly: true }),
      finFormField('Budget Title', 'title', { req: true, placeholder: 'e.g. Woven Fabric & Trims Procurement' }),
      finFormField('Department / Cost Centre', 'department', { options: BUDGET_DEPARTMENTS }),
      finFormField('Category', 'category', { options: BUDGET_CATEGORIES }),
      finFormField('Fiscal Year', 'fiscalYear', { options: BUDGET_FISCAL_YEARS, value: BUDGET_FISCAL_YEARS[1] }),
      finFormField('Period Type', 'periodType', { options: BUDGET_PERIOD_TYPES }),
      finFormField('Start Date', 'startDate', { type: 'date', value: today }),
      finFormField('End Date', 'endDate', { type: 'date', value: today }),
      finFormField('Budgeted Amount (BDT)', 'amount', { type: 'number', req: true, placeholder: '0.00' }),
      finFormField('Approval Status', 'approvalStatus', { options: BUDGET_APPROVAL_STATUSES }),
      finFormField('Approved By (optional)', 'approvedBy', { placeholder: 'e.g. Head of Finance' }),
      finFormField('Notes (optional)', 'notes', { textarea: true, span: true, placeholder: 'Any context for this budget line' }),
    ].join(''),
    onSubmit(form) {
      const v = (n) => finFormVal(form, n);
      const amount = Number(v('amount')) || 0;
      if (!v('title')) return 'Enter a budget title.';
      if (amount <= 0) return 'Enter a budgeted amount greater than zero.';
      if (!v('startDate') || !v('endDate')) return 'Enter both start and end dates.';
      if (v('endDate') < v('startDate')) return 'End date cannot be before the start date.';
      budgetRecords.push({
        budgetCode: budgetNextCode(), title: v('title'), department: v('department'), category: v('category'),
        fiscalYear: v('fiscalYear'), periodType: v('periodType'), startDate: v('startDate'), endDate: v('endDate'),
        budgetedAmount: amount, actualSpent: 0, approvalStatus: v('approvalStatus'), approvedBy: v('approvedBy'), notes: v('notes'),
      });
      budgetFilter.page = Math.ceil(budgetFiltered().length / COA_PAGE_SIZE);
      budgetRefresh(container, true);
    },
  });
}

function budgetOpenSpendModal(code, container) {
  const b = budgetRecords.find(x => x.budgetCode === code);
  if (!b) return;
  finOpenModal({
    id: 'budgetSpendModal', title: `Record Spend — ${b.budgetCode}`, icon: 'wallet', submitLabel: 'Record Spend',
    intro: `${escapeHtml(b.title)} — <span class="text-primary font-semibold tabular">BDT ${coaMoney(Math.max(0, budgetVariance(b)))}</span> remaining of BDT ${coaMoney(b.budgetedAmount)}`,
    body: finFormField('Spend Amount (BDT)', 'amount', { type: 'number', req: true, placeholder: '0.00' }),
    onSubmit(form) {
      const amount = Number(finFormVal(form, 'amount')) || 0;
      if (amount <= 0) return 'Enter a spend amount greater than zero.';
      b.actualSpent = (b.actualSpent || 0) + amount;
      budgetRefresh(container, true);
    },
  });
}
