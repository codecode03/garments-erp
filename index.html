<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Obsidian ERP — Dashboard (v4: refined tables)</title>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          primary: 'var(--text-primary)',
          secondary: 'var(--text-secondary)',
          muted: 'var(--text-muted)',
          disabled: 'var(--text-disabled)',
          side: {
            bg: 'var(--surface)',
            hover: 'var(--hover)',
            active: 'var(--active-tint)',
            border: 'var(--border)',
            panel: 'var(--border-panel)',
            line: 'var(--border-inner)',
            text: 'var(--text-secondary)',
            textbright: 'var(--text-primary)',
            accent: 'var(--accent)',
            accentHover: 'var(--accent-hover)',
            accentLight: 'var(--accent-light)',
            navActiveBg: 'var(--nav-active-bg)',
            navActiveText: 'var(--nav-active-text)',
            navSubActiveBg: 'var(--nav-sub-active-bg)',
            navSubActiveText: 'var(--nav-sub-active-text)',
            navSubActiveDot: 'var(--nav-sub-active-dot)',
            navHoverBg: 'var(--nav-hover-bg)',
            navHoverText: 'var(--nav-hover-text)',
            navText: 'var(--nav-text)',
            navSubText: 'var(--nav-sub-text)',
            navDot: 'var(--nav-dot)',
          },
          canvas: 'var(--bg)',
          cardBg: 'var(--card-bg)',
          success: 'var(--success)',
          warning: 'var(--warning)',
          danger: 'var(--danger)',
          info: 'var(--info)',
          neutral: 'var(--neutral)',
          violet: 'var(--violet)',
          successSoft: 'var(--success-soft)',
          warningSoft: 'var(--warning-soft)',
          dangerSoft: 'var(--danger-soft)',
          infoSoft: 'var(--info-soft)',
          neutralSoft: 'var(--neutral-soft)',
          violetSoft: 'var(--violet-soft)',
        },
        /* Tight enterprise radius scale — 4 / 6 / 8 / 10, nothing larger. */
        borderRadius: {
          none: '0',
          xs: 'var(--r-xs)',
          sm: 'var(--r-sm)',
          DEFAULT: 'var(--r-sm)',
          md: 'var(--r-md)',
          lg: 'var(--r-lg)',
          full: '9999px',
        },
      }
    }
  }
</script>
<style>
  /* ================================================================
     Theme tokens — sourced from ERP_Color.html (Obsidian ERP Color System)
     ================================================================ */
  :root,
  html[data-theme="light"] {
    color-scheme: light;   /* native controls (date picker) follow the theme */
    --bg: #EAEFEE;
    --surface: #F1F3F4;
    --card-bg: #F7F9F8;
    --hover: #E1E5E8;
    --active-tint: rgba(13, 148, 136, 0.09);   /* selected row / list option */
    --border: #AEB5BB;                       /* controls only: inputs, selects, tables */
    --border-panel: rgba(16, 21, 27, 0.07);  /* panels lean on fill + shadow */
    --border-inner: #E2E8F0;

    --text-primary: #10151B;
    --text-secondary: #3B4450;
    --text-muted: #5B6572;
    --text-disabled: #94A3B8;
    --text-inverse: #FFFFFF;

    --accent: #0D9488;
    --accent-hover: #0F766E;
    --accent-light: #D7F5F0;
    --accent-soft: #E6FFFB;
    --accent-ring: rgba(13, 148, 136, 0.28);

    --success: #16A34A;
    --warning: #F59E0B;
    --danger: #EF4444;
    --info: #3B82F6;
    --neutral: #64748B;
    --success-soft: #DCFCE7;
    --warning-soft: #FEF3C7;
    --danger-soft: #FEE2E2;
    --info-soft: #DBEAFE;
    --neutral-soft: #E2E8F0;
    --violet: #8B5CF6;
    --violet-soft: #EDE9FE;

    --nav-active-bg: #0D9488;       /* unchanged — solid brand fill */
    --nav-active-text: #FFFFFF;
    --nav-active-icon: #FFFFFF;
    --nav-active-border: transparent;
    --nav-sub-active-bg: #99F6E4;   /* teal-200: sits between the loud teal-300 and the invisible teal-50 */
    --nav-sub-active-text: #115E59;
    --nav-sub-active-dot: #0D9488;
    --nav-sub-active-bar: transparent;
    --nav-hover-bg: #E1E5E8;
    --nav-hover-text: #1F2937;
    --nav-text: #3B4450;
    --nav-sub-text: #4B5563;
    --nav-icon: #6B7480;
    --nav-dot: #9CA3AF;

    --chart-1: #0D9488; --chart-2: #3B82F6; --chart-3: #F59E0B; --chart-4: #EF4444; --chart-5: #8B5CF6;
    --chart-6: #06B6D4; --chart-7: #84CC16; --chart-8: #F97316; --chart-9: #EC4899; --chart-10: #64748B;

    --scrollbar-track: #E7E9EB;
    --scrollbar-thumb: #A8AEB5;
    --overlay: rgba(16, 21, 27, 0.45);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F172A;
    --surface: #141B2E;
    --card-bg: #1E293B;
    --hover: #273449;
    --active-tint: rgba(45, 212, 191, 0.13);   /* selected row / list option */
    --border: #334155;
    --border-panel: #334155;                 /* no usable shadow on dark, border does the work */
    --border-inner: #334155;

    --text-primary: #F8FAFC;
    --text-secondary: #CBD5E1;
    --text-muted: #94A3B8;
    --text-disabled: #64748B;
    --text-inverse: #0F172A;

    --accent: #2DD4BF;
    --accent-hover: #5EEAD4;
    --accent-light: #134E4A;
    --accent-soft: #0F766E;
    --accent-ring: rgba(45, 212, 191, 0.30);

    --success: #22C55E;
    --warning: #FBBF24;
    --danger: #F87171;
    --info: #60A5FA;
    --neutral: #94A3B8;
    --success-soft: rgba(34, 197, 94, 0.16);
    --warning-soft: rgba(251, 191, 36, 0.16);
    --danger-soft: rgba(248, 113, 113, 0.16);
    --info-soft: rgba(96, 165, 250, 0.16);
    --neutral-soft: rgba(148, 163, 184, 0.16);
    --violet: #A78BFA;
    --violet-soft: rgba(167, 139, 250, 0.18);

    --nav-active-bg: rgba(20, 184, 166, 0.15);
    --nav-active-text: #5EEAD4;
    --nav-active-icon: #5EEAD4;
    --nav-active-border: #2DD4BF;
    --nav-sub-active-bg: rgba(45, 212, 191, 0.22);
    --nav-sub-active-text: #99F6E4;
    --nav-sub-active-dot: #5EEAD4;
    --nav-sub-active-bar: transparent;
    --nav-hover-bg: #273449;
    --nav-hover-text: #F8FAFC;
    --nav-text: #CBD5E1;
    --nav-sub-text: #94A3B8;
    --nav-icon: #64748B;
    --nav-dot: #475569;

    --chart-1: #2DD4BF; --chart-2: #60A5FA; --chart-3: #FBBF24; --chart-4: #F87171; --chart-5: #A78BFA;
    --chart-6: #22D3EE; --chart-7: #A3E635; --chart-8: #FB923C; --chart-9: #F472B6; --chart-10: #94A3B8;

    --scrollbar-track: #1E293B;
    --scrollbar-thumb: #475569;
    --overlay: rgba(0, 0, 0, 0.6);
  }

  /* ---------- Radius scale ---------- */
  :root { --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px; }

  /* ---------- Motion ---------- */
  :root { --ease: cubic-bezier(0.2, 0, 0, 1); --dur-fast: 120ms; --dur: 160ms; }

  /* Specific properties only — never `all`, which animates layout and janks. */
  button, a, input, .cmdk-row {
    transition: background-color var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease);
  }
  body { transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ---------- Focus ---------- */
  :where(button, a, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  :where(button, a, [tabindex]):focus:not(:focus-visible) { outline: none; }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--r-xs); }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }

  #nav { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  #nav::-webkit-scrollbar { width: 4px; }
  #nav::-webkit-scrollbar-track { background: transparent; }
  #nav::-webkit-scrollbar-thumb { background: transparent; border-radius: var(--r-xs); }
  #nav:hover { scrollbar-color: var(--scrollbar-thumb) transparent; }
  #nav:hover::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); }

  .submenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease); }
  .submenu.open { grid-template-rows: 1fr; }
  .submenu > div { overflow: hidden; }
  .chev { transition: transform 180ms var(--ease); }
  .chev.open { transform: rotate(180deg); }

  /* ---------- Elevation ---------- */
  .premium-shadow { box-shadow: 0 1px 3px rgba(16, 21, 27, 0.11), 0 1px 1px rgba(16, 21, 27, 0.05); }
  html[data-theme="dark"] .premium-shadow { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25); }

  .card-shadow { box-shadow: 0 1px 3px rgba(16, 21, 27, 0.13), 0 4px 10px -4px rgba(16, 21, 27, 0.10); }
  html[data-theme="dark"] .card-shadow { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3); }

  .overlay-shadow { box-shadow: 0 16px 48px -12px rgba(16, 21, 27, 0.28), 0 4px 12px -4px rgba(16, 21, 27, 0.14); }
  html[data-theme="dark"] .overlay-shadow { box-shadow: 0 16px 48px -12px rgba(0, 0, 0, 0.7), 0 4px 12px -4px rgba(0, 0, 0, 0.5); }

  /* ---------- Typography scale ----------
     Large numbers get lighter weight + tighter tracking, not heavier weight.
     That is the difference between an enterprise figure and a marketing figure.
     Every font size in the app comes from these tokens, so one edit here resizes the whole UI.
     Nothing readable sits below 12px: this is a data-dense screen used all day by all ages. */
  :root {
    --fs-caps:  12px;    /* UPPERCASE labels: table headers, micro labels */
    --fs-small: 12.5px;  /* helper text, pills, small buttons */
    --fs-head:  13.5px;  /* column headings */
    --fs-base:  14px;    /* body, table cells, form fields, labels */
    --fs-lead:  15px;    /* dialog titles */
    --fs-title: 16px;    /* card titles, key totals */
  }
  .fs-caps  { font-size: var(--fs-caps); }
  .fs-small { font-size: var(--fs-small); }
  .fs-head  { font-size: var(--fs-head); }
  .fs-base  { font-size: var(--fs-base); }
  .fs-lead  { font-size: var(--fs-lead); }
  .fs-title { font-size: var(--fs-title); }

  .text-display       { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .text-page-title    { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .text-section-title { font-size: var(--fs-title); line-height: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .text-body          { font-size: var(--fs-base); line-height: 21px; font-weight: 400; }
  .text-body-medium   { font-size: var(--fs-base); line-height: 21px; font-weight: 500; }
  .text-label         { font-size: var(--fs-base); line-height: 20px; font-weight: 500; }
  .text-table-header  { font-size: var(--fs-caps); line-height: 16px; font-weight: 600; letter-spacing: 0.045em; text-transform: uppercase; }
  .text-table-body    { font-size: var(--fs-base); line-height: 21px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .text-helper        { font-size: var(--fs-small); line-height: 18px; font-weight: 400; }
  .text-micro         { font-size: var(--fs-caps); line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  .num, input[type="number"], input[type="date"], .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>

function escapeHtml(s) {

const NAV_ACTIVE_CLASS = 'bg-side-navActiveBg text-side-navActiveText font-semibold shadow-[inset_2px_0_0_0_var(--nav-active-border)]';
const NAV_IDLE_CLASS = 'font-medium text-side-navText hover:bg-side-navHoverBg hover:text-side-navHoverText';

function renderNav() {
  nav.innerHTML = '';

  // --- Modules ---
  modules.forEach(mod => {
    const isActive = state.moduleKey === mod.key;

    if (mod.submodules.length === 1) {
      const flatBtn = document.createElement('button');
      flatBtn.className = `w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-label ${sidebarCollapsed ? 'justify-center' : ''} ${isActive ? NAV_ACTIVE_CLASS : NAV_IDLE_CLASS}`;
      if (sidebarCollapsed) flatBtn.title = mod.name;
      flatBtn.innerHTML = `${iconSvg(mod.icon, 'w-4 h-4 shrink-0')}${sidebarCollapsed ? '' : `<span class="flex-1 text-left">${escapeHtml(mod.name)}</span>`}`;
      flatBtn.addEventListener('click', () => goTo(mod.key, 0));
      nav.appendChild(flatBtn);
      return;
    }

    const isExpanded = !sidebarCollapsed && state.openKey === mod.key;

    const wrap = document.createElement('div');

    const btn = document.createElement('button');
    btn.className = `w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-label ${sidebarCollapsed ? 'justify-center' : ''} ${isActive ? NAV_ACTIVE_CLASS : NAV_IDLE_CLASS}`;
    btn.setAttribute('aria-expanded', String(isExpanded));
    if (sidebarCollapsed) btn.title = mod.name;
    btn.innerHTML = sidebarCollapsed ? iconSvg(mod.icon, 'w-4 h-4 shrink-0') : `
      ${iconSvg(mod.icon, 'w-4 h-4 shrink-0')}
      <span class="flex-1 text-left">${escapeHtml(mod.name)}</span>
      <svg class="chev ${isExpanded ? 'open' : ''} w-3 h-3 shrink-0 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    `;
    btn.addEventListener('click', () => {
      if (sidebarCollapsed) { state.openKey = mod.key; setSidebarCollapsed(false); return; }
      state.openKey = isExpanded ? null : mod.key;
      renderNav();
    });

    if (sidebarCollapsed) { wrap.appendChild(btn); nav.appendChild(wrap); return; }

    const sub = document.createElement('div');
    sub.className = `submenu ${isExpanded ? 'open' : ''}`;
    const subInner = document.createElement('div');
    const list = document.createElement('div');
    list.className = 'pt-0.5 pb-1 pl-[22px] flex flex-col gap-px';

    mod.submodules.forEach((sm, i) => {
      const active = isActive && state.subIndex === i;
      const item = document.createElement('button');
      item.className = `flex items-center gap-2 text-left px-2.5 py-1.5 fs-head rounded ${active ? 'bg-side-navSubActiveBg text-side-navSubActiveText font-semibold shadow-[inset_2px_0_0_0_var(--nav-sub-active-bar)]' : 'text-side-navSubText hover:bg-side-navHoverBg hover:text-side-navHoverText'}`;
      item.setAttribute('aria-current', active ? 'page' : 'false');
      item.innerHTML = `<span class="w-1 h-1 rounded-full shrink-0 ${active ? 'bg-side-navSubActiveDot' : 'bg-side-navDot'}"></span><span>${escapeHtml(sm.name)}</span>`;
      item.addEventListener('click', (e) => { e.stopPropagation(); goTo(mod.key, i); });
      list.appendChild(item);
    });

    subInner.appendChild(list);
    sub.appendChild(subInner);
    wrap.appendChild(btn);
    wrap.appendChild(sub);
    nav.appendChild(wrap);
  });
}

/* Sparkline: a trend arrow tells you the sign, a sparkline tells you the shape. */
function sparkline(points, colorVar) {
  const w = 68, h = 24, pad = 2;
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max - min) || 1;
  const step = w / (points.length - 1);
  const d = points.map((p, i) => {
    const x = (i * step).toFixed(1);
    const y = (h - pad - ((p - min) / range) * (h - pad * 2)).toFixed(1);
    return `${i === 0 ? 'M' : 'L'}${x},${y}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" fill="none" preserveAspectRatio="none" aria-hidden="true" class="shrink-0">
    <path d="${d}" stroke="var(${colorVar})" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function statCard(s) {
  const up = s.delta.startsWith('+');
  return `
    <div class="bg-cardBg border border-side-panel rounded-lg card-shadow px-4 py-3.5">
      <div class="flex items-start justify-between gap-3 mb-2.5">
        <p class="text-micro text-muted">${escapeHtml(s.label)}</p>
        ${sparkline(s.series, s.color)}
      </div>
      <p class="text-display text-primary">${escapeHtml(s.value)}</p>
      <div class="flex items-baseline gap-1.5 mt-1.5">
        <span class="text-helper font-semibold ${up ? 'text-success' : 'text-danger'} tabular">${escapeHtml(s.delta)}</span>
        <span class="text-helper text-muted truncate">${escapeHtml(s.note)}</span>
      </div>
    </div>
  `;
}

// Pulled live from the Accounts Receivable register (apArItems.receivable) instead of a
// hardcoded figure, so it reflects whatever is actually on the books when the Dashboard renders.
function pendingReceivablesStat() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let outstanding = 0, overdueCount = 0;
  apArItems.receivable.forEach(it => {
    const bal = apArBalance(it);
    if (bal > 0) {
      outstanding += bal;
      if (new Date(it.dueDate + 'T00:00:00') < today) overdueCount += 1;
    }
  });
  return {
    label: 'Pending Receivables', value: `BDT ${coaInt(outstanding)}`,
    delta: overdueCount > 0 ? `-${overdueCount}` : '+0',
    note: overdueCount > 0 ? `${overdueCount} invoice${overdueCount === 1 ? '' : 's'} overdue` : 'All invoices current',
    color: '--chart-4',
    series: [162, 158, 149, 152, 144, 140, 137, 133, 130, Math.max(1, Math.round(outstanding / 1000))],
  };
}

/* ---------- form state ---------- */
const BI_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function biToday() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, '0')}-${BI_MONTHS[d.getMonth()]}-${d.getFullYear()}`;
}

/* <input type="date"> only speaks YYYY-MM-DD, so the form holds ISO and the
   table keeps the DD-Mon-YYYY the rest of the app already uses. */
function biTodayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function biToISO(display) {
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec(String(display || '').trim());
  if (!m) return '';
  const i = BI_MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
  return i < 0 ? '' : `${m[3]}-${String(i + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
}

function biFromISO(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
  return m ? `${m[3]}-${BI_MONTHS[Number(m[2]) - 1]}-${m[1]}` : '';
}

/* Auto number: highest existing serial + 1, stamped with the current year. */
function biNextNo() {
  const max = biInquiries.reduce((m, i) => Math.max(m, parseInt(i.no.split('-').pop(), 10) || 0), 0);
  return `INQ-${new Date().getFullYear()}-${String(max + 1).padStart(5, '0')}`;
}

function biFmtQty(v) {
  const digits = String(v == null ? '' : v).replace(/\D/g, '');
  return digits ? Number(digits).toLocaleString('en-US') : '';
}

/* Card A stands on its own — nothing in the inquiry writes to it, and it
   survives New, row clicks and saves. Typed by hand, start to finish. */

function biBuyerById(id) { return biBuyers.find(b => b.id === id) || null; }

function biResetForm() {
  Object.assign(biForm, {
    no: biNextNo(), date: biTodayISO(),
    buyerId: '', buyerText: '',
    contact: '', season: '', country: '', style: '', qty: '', msg: '', msgTone: 'muted',
  });
  state.inqSel = null;
}

/* Buyer chosen -> Contact Person, Season, Country and the previous-order card.
   Nothing else, and all three stay editable afterwards. */
function biApplyBuyer(id) {
  const b = biBuyerById(id);
  if (!b) return;
  Object.assign(biForm, {
    buyerId: b.id, buyerText: b.name,
    contact: b.contact, season: b.season, country: b.country,
  });
}

/* Row click copies that inquiry's details into the form as a starting point.
   The number stays newly generated, so saving never overwrites the row. */
function biLoadInquiry(no) {
  const inq = biInquiries.find(i => i.no === no);
  if (!inq) return;
  const b = biBuyers.find(x => x.name === inq.buyer);
  biResetForm();
  state.inqSel = inq.no;
  biForm.date = biToISO(inq.date);
  biForm.buyerText = inq.buyer;
  if (b) biApplyBuyer(b.id);
  /* The row may have been edited away from the buyer default — it wins. */
  biForm.contact = inq.contact;
  biForm.season = inq.season;
  biForm.country = inq.country;
  biForm.style = inq.style;
  biForm.qty = inq.qty;
}

/* Label recedes, value leads. No standalone colon column — alignment does that job. */

      <span class="fs-head text-muted w-[106px] shrink-0">${escapeHtml(label)}</span>
      <span class="fs-head ${empty ? 'text-disabled' : 'font-medium text-primary'} min-w-0">${empty ? '&mdash;' : escapeHtml(String(value))}</span>

function biCard(icon, title, body, opts) {

}

function biLabel(text, opts) {

}

function biField(label, inner, opts) {

/* ---------- card C: previous order ---------- */
function biPreviousCard() {
  const b = biBuyerById(biForm.buyerId);
  let body;
  /* Cards share a height, so an empty state centres instead of clinging to the top. */
  const empty = (text) => `<div class="h-full flex items-center"><p class="text-body text-disabled">${text}</p></div>`;
  if (!b) {
    body = empty('Select a buyer to see their last order.');
  } else if (!b.prev) {
    body = empty(`No previous order &mdash; ${escapeHtml(b.name)} is a first-time buyer.`);
  } else {
    const p = b.prev;
    body = [
      biRow('Style', p.style),
      biRow('Quantity', p.qty + ' PCS'),
      biRow('Price', p.price),
      biRow('Bank Details', p.bank),
      biRow('LC Date', p.lc),
      biRow('Port Of Loading', p.port),
    ].join('');
  }
  return biCard('clipboard', 'Previous Order', `<div id="biPrevBody" class="h-full">${body}</div>`, {
    span: 'lg:col-span-12 xl:col-span-3',
    right: b ? `<span class="text-helper text-muted truncate max-w-[160px]">${escapeHtml(b.name)}</span>` : '',
  });
}

  biCombo.open = false;

/* ---------- buyer combobox ---------- */
function biMatchBuyers(q) {
  const s = (q || '').trim().toLowerCase();
  if (!s) return biBuyers.slice();
  return biBuyers.filter(b => (b.name + ' ' + b.contact + ' ' + b.country + ' ' + b.season).toLowerCase().includes(s));
}

function biPaintList() {
  const list = document.getElementById('biBuyerList');
  if (!list) return;
  const items = biCombo.items;
  list.innerHTML = items.length ? items.map((b, i) => `
    <li role="option" data-id="${b.id}" aria-selected="${i === biCombo.cursor}"
      class="px-3 py-2 cursor-pointer flex items-center gap-2 ${i === biCombo.cursor ? 'bg-side-active' : ''}">
      <span class="w-[7px] h-[7px] rounded-full shrink-0" style="background:var(${BI_STATUS_VAR[b.quality] || '--neutral'})"></span>
      <span class="fs-head font-medium text-primary truncate">${escapeHtml(b.name)}</span>
      <span class="text-helper text-muted ml-auto shrink-0">${escapeHtml(b.country)}</span>
    </li>`).join('') : `
    <li class="px-3 py-2.5">
      <p class="text-helper text-muted">No buyer matches.</p>
      <button type="button" id="biAddFromList" class="text-helper font-semibold text-side-accent hover:text-side-accentHover mt-1">Add as a new buyer</button>
    </li>`;
}

function biOpenList(q) {
  const list = document.getElementById('biBuyerList');
  const input = document.getElementById('biBuyerInput');
  if (!list || !input) return;
  biCombo.items = biMatchBuyers(q);
  biCombo.cursor = 0;
  biCombo.open = true;
  list.classList.remove('hidden');
  input.setAttribute('aria-expanded', 'true');
  biPaintList();
}

function biCloseList() {
  const list = document.getElementById('biBuyerList');
  const input = document.getElementById('biBuyerInput');
  biCombo.open = false;
  if (list) list.classList.add('hidden');
  if (input) input.setAttribute('aria-expanded', 'false');
}

  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };

  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#biModalMsg');
    if (!val('name') || !val('contact')) {
      msg.textContent = 'Buyer Name and Contact Person are required.';
      return;
    }
    const buyer = {
      id: 'BUY-' + String(biBuyers.length + 1).padStart(3, '0'),
      name: val('name'),
      beneficiary: val('beneficiary') || val('name'),
      contact: val('contact'),
      address: val('address'),
      bank: val('bank'),
      season: val('season'),
      country: val('country'),
      quality: val('quality'),
      prev: null,
    };
    biBuyers.push(buyer);
    done();
    biApplyBuyer(buyer.id);
    biRenderCards();
    biSetMsg(`${buyer.name} added and selected.`, 'success');
  });

  const first = form.querySelector('input[name="name"]');
  if (first) first.focus();
}

/* ---------- save ---------- */
function biSaveInquiry() {
  const b = biBuyerById(biForm.buyerId);
  if (!b) { biSetMsg('Pick a buyer before saving.', 'danger'); document.getElementById('biBuyerInput')?.focus(); return; }
  const qty = biFmtQty(biForm.qty);
  if (!qty) { biSetMsg('Style Quantity is required.', 'danger'); document.getElementById('biF_qty')?.focus(); return; }

  const rec = {
    no: biForm.no,
    date: biFromISO(biForm.date) || biToday(),
    buyer: b.name,
    contact: biForm.contact.trim() || b.contact,
    style: biForm.style.trim() || '—',
    qty,
    season: biForm.season.trim() || b.season,
    country: biForm.country.trim() || b.country,
    status: b.quality,
  };

  biInquiries.unshift(rec);

  /* Cleared and ready for the next one — the saved row is highlighted below. */
  biResetForm();
  state.inqSel = rec.no;
  state.inqQuery = '';
  const search = document.getElementById('biSearch');
  if (search) search.value = '';
  biRenderCards();
  refreshBiTable();
  biSetMsg(`Inquiry ${rec.no} saved.`, 'success');
}

/* ---------- table ---------- */

  const q = (state.inqQuery || '').trim().toLowerCase();
  if (!q) return biInquiries;
  return biInquiries.filter(i =>
    (i.no + ' ' + i.buyer + ' ' + i.style + ' ' + i.season + ' ' + i.country + ' ' + i.status).toLowerCase().includes(q));
}

              <input id="biSearch" type="text" value="${escapeHtml(state.inqQuery)}" placeholder="Search by Inquiry No, Buyer, Style..."

              </tr>
            </thead>
            <tbody id="biTableBody"></tbody>

        <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
          <p id="biCount" class="text-helper text-muted tabular"></p>
          <div class="flex items-center gap-1.5">
            <button class="w-8 h-8 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:pointer-events-none" disabled aria-label="Previous page">
              <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

  biRenderCards();
  refreshBiTable();

  const cards = document.getElementById('biCards');

  /* Text fields just mirror into biForm — no repaint, so focus is never stolen. */
  cards.addEventListener('input', (e) => {
    const key = e.target.dataset.bif;
    if (key) { biForm[key] = e.target.value; return; }
    const bKey = e.target.dataset.bib;
    if (bKey) { biBuyerForm[bKey] = e.target.value; return; }
    if (e.target.id === 'biBuyerInput') {
      biForm.buyerText = e.target.value;
      const exact = biBuyers.find(b => b.name.toLowerCase() === e.target.value.trim().toLowerCase());
      biForm.buyerId = exact ? exact.id : '';
      biOpenList(e.target.value);
    }
  });

  cards.addEventListener('change', (e) => {
    if (e.target.id === 'biF_qty') { biForm.qty = biFmtQty(e.target.value); e.target.value = biForm.qty; }
  });

  cards.addEventListener('click', (e) => {
    if (e.target.closest('#biBuyerToggle')) {
      const input = document.getElementById('biBuyerInput');
      if (biCombo.open) biCloseList(); else { biOpenList(''); input.focus(); }
      return;
    }
    if (e.target.closest('#biBuyerAdd')) { biOpenBuyerModal(''); return; }
    if (e.target.closest('#biAddFromList')) { biOpenBuyerModal(biForm.buyerText); return; }
    const opt = e.target.closest('li[data-id]');
    if (opt) biSelectBuyer(opt.dataset.id);
  });

  cards.addEventListener('mousemove', (e) => {
    const opt = e.target.closest('li[data-id]');
    if (!opt || !biCombo.open) return;
    const i = biCombo.items.findIndex(b => b.id === opt.dataset.id);
    if (i > -1 && i !== biCombo.cursor) { biCombo.cursor = i; biPaintList(); }
  });

  cards.addEventListener('keydown', (e) => {
    if (e.target.id !== 'biBuyerInput') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      /* A buyer already picked? Open the full list, like the chevron does —
         filtering by their exact name would leave nothing to arrow through. */
      if (!biCombo.open) { biOpenList(biForm.buyerId ? '' : e.target.value); return; }
      const n = biCombo.items.length;
      if (!n) return;
      biCombo.cursor = (biCombo.cursor + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      biPaintList();
      document.querySelector(`#biBuyerList li[aria-selected="true"]`)?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (!biCombo.open) return;
      e.preventDefault();
      const pick = biCombo.items[biCombo.cursor];
      if (pick) biSelectBuyer(pick.id);
    } else if (e.key === 'Escape') {
      if (biCombo.open) { e.preventDefault(); biCloseList(); }
    }
  });

  /* One document listener, re-bound per render so they never stack up. */
  if (biOutsideClick) document.removeEventListener('click', biOutsideClick);
  biOutsideClick = (e) => {
    if (!biCombo.open) return;
    if (!e.target.closest('#biBuyerInput, #biBuyerList, #biBuyerToggle')) biCloseList();
  };
  document.addEventListener('click', biOutsideClick);

  document.getElementById('biPageSave').addEventListener('click', biSaveInquiry);

  const tbody = document.getElementById('biTableBody');
  /* No early-out on the current row: after editing the form, clicking the row
     again is how you reload it and discard those edits. */
  const select = (no) => {
    if (!no) return;
    biLoadInquiry(no);
    biRenderCards();
    refreshBiTable();
  };
  tbody.addEventListener('click', (e) => {
    if (e.target.closest('#biClear')) { state.inqQuery = ''; document.getElementById('biSearch').value = ''; refreshBiTable(); return; }
    select(e.target.closest('tr[data-no]')?.dataset.no);
  });
  tbody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('tr[data-no]');
    if (row) { e.preventDefault(); select(row.dataset.no); }
  });
  document.getElementById('biSearch').addEventListener('input', (e) => {
    state.inqQuery = e.target.value;
    refreshBiTable();
  });
}

// ---------- Generic search combobox ----------
/* Replaces the old "readonly input + magnifying-glass button that opens a
   modal" picker pattern used for Inquiry/Style lookups: a typeable field
   that filters a dropdown of matches live, underneath it — the same
   interaction as the Buyer combobox above. One instance per field; each
   host page wires the returned handlers into its own delegated
   input/click/mousemove/keydown listeners and registers a document-level
   outside-click via `isOutside`, the same way biBuyerCombo already does. */
function createCombo(opts) {
  const state = { open: false, cursor: 0, items: [] };

  function paint() {
    const list = document.getElementById(opts.id + 'List');
    if (!list) return;
    list.innerHTML = state.items.length
      ? state.items.map((it, i) => opts.renderItem(it, i === state.cursor)).join('')
      : `<li class="px-3 py-2.5"><p class="text-helper text-muted">${escapeHtml(opts.emptyText || 'No matches.')}</p></li>`;
  }

  function open(q) {
    const list = document.getElementById(opts.id + 'List');
    const input = document.getElementById(opts.id + 'Input');
    if (!list || !input) return;
    state.items = opts.match(q || '');
    state.cursor = 0;
    state.open = true;
    list.classList.remove('hidden');
    input.setAttribute('aria-expanded', 'true');
    paint();
  }

  function close() {
    const list = document.getElementById(opts.id + 'List');
    const input = document.getElementById(opts.id + 'Input');
    state.open = false;
    if (list) list.classList.add('hidden');
    if (input) input.setAttribute('aria-expanded', 'false');
  }

  function select(item) {
    close();
    opts.onSelect(item);
  }

  function handleInput(e) {
    if (e.target.id !== opts.id + 'Input') return false;
    open(e.target.value);
    return true;
  }

  function handleClick(e) {
    if (e.target.closest('#' + opts.id + 'Toggle')) {
      const input = document.getElementById(opts.id + 'Input');
      if (state.open) close(); else { open(''); input.focus(); }
      return true;
    }
    const li = e.target.closest('#' + opts.id + 'List li[data-combo-key]');
    if (li) {
      const item = state.items.find(it => opts.key(it) === li.dataset.comboKey);
      if (item) select(item);
      return true;
    }
    return false;
  }

  function handleMousemove(e) {
    const li = e.target.closest('#' + opts.id + 'List li[data-combo-key]');
    if (!li || !state.open) return false;
    const i = state.items.findIndex(it => opts.key(it) === li.dataset.comboKey);
    if (i > -1 && i !== state.cursor) { state.cursor = i; paint(); }
    return true;
  }

  function handleKeydown(e) {
    if (e.target.id !== opts.id + 'Input') return false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!state.open) { open(e.target.value); return true; }
      const n = state.items.length;
      if (!n) return true;
      state.cursor = (state.cursor + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      paint();
      document.querySelector(`#${opts.id}List li[aria-selected="true"]`)?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (!state.open) return true;
      e.preventDefault();
      const pick = state.items[state.cursor];
      if (pick) select(pick);
    } else if (e.key === 'Escape') {
      if (state.open) { e.preventDefault(); close(); }
    }
    return true;
  }

  function isOutside(target) {
    return !target.closest(`#${opts.id}Input, #${opts.id}List, #${opts.id}Toggle`);
  }

  return { state, open, close, select, handleInput, handleClick, handleMousemove, handleKeydown, isOutside };
}

/* ---------- actions ---------- */
function styRerenderCards() {
  const el = document.getElementById('styCards');
  if (!el) return;
  el.innerHTML = styBuyerCard() + styDetailsCard();

function styStartNew() {
  styBlankStyleDetails();
  state.editingId = null;
  styRerenderCards();
  styRefreshTable();
  stySetMsg('Ready for a new style.', 'muted');
  document.getElementById('styCards')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function styLoadStyle(id) {
  const s = styStyles.find(x => x.id === id);
  if (!s) return;
  Object.assign(styForm, {
    styleNo: s.style, product: s.product, category: s.category, fabric: s.fabric,
    color: s.color, qty: s.qty, targetPrice: (s.price || '').replace(/[^0-9.]/g, ''),
    shipmentDate: biToISO(s.shipDate) || '', status: s.status,
  });
  state.editingId = id;
  styRerenderCards();
  styRefreshTable();
  stySetMsg(`Editing style ${s.style} — update the fields and click Save Style.`, 'muted');
  document.getElementById('styCards')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function styDeleteStyle(id) {
  const s = styStyles.find(x => x.id === id);
  if (!s) return;
  if (!window.confirm(`Delete style ${s.style}?`)) return;
  const idx = styStyles.findIndex(x => x.id === id);
  if (idx > -1) styStyles.splice(idx, 1);
  if (state.editingId === id) styResetForm();
  styRerenderCards();
  styRefreshTable();
}

function stySave() {
  const styleNo = (styForm.styleNo || '').trim();
  if (!styleNo) { stySetMsg('Style No. is required.', 'danger'); document.getElementById('styF_styleNo')?.focus(); return; }
  const qtyDigits = String(styForm.qty || '').replace(/\D/g, '');
  if (!qtyDigits) { stySetMsg('Quantity is required.', 'danger'); document.getElementById('styF_qty')?.focus(); return; }
  const priceNum = parseFloat(String(styForm.targetPrice || '').replace(/[^0-9.]/g, ''));

  const rec = {
    id: state.editingId || ++styStyleSeq,
    style: styleNo,
    product: styForm.product,
    category: styForm.category,
    fabric: styForm.fabric,
    color: styForm.color,
    qty: Number(qtyDigits).toLocaleString('en-US'),
    price: isNaN(priceNum) ? '—' : `$${priceNum.toFixed(2)}`,
    shipDate: biFromISO(styForm.shipmentDate) || '—',
    status: styForm.status,
  };

  if (state.editingId) {
    const idx = styStyles.findIndex(s => s.id === state.editingId);
    if (idx > -1) styStyles[idx] = rec;
  } else {
    styStyles.unshift(rec);
  }

  styResetForm();
  styRerenderCards();
  styRefreshTable();
  stySetMsg(`Style ${rec.style} saved.`, 'success');
}

let styClickHandler = null;

let styOutsideClick = null;

function styBindEvents(container) {
  const cards = document.getElementById('styCards');

  cards.addEventListener('input', (e) => {
    if (styInqCombo.handleInput(e)) return;
    const key = e.target.dataset.styf;
    if (key) styForm[key] = e.target.value;
  });

  cards.addEventListener('mousemove', (e) => { styInqCombo.handleMousemove(e); });
  cards.addEventListener('keydown', (e) => { styInqCombo.handleKeydown(e); });

  cards.addEventListener('change', (e) => {
    const key = e.target.dataset.styf;
    if (!key) return;
    if (key === 'status') {
      const dot = document.getElementById('styDot_status');
      if (dot) dot.style.background = `var(${STY_STATUS_VAR[e.target.value] || '--neutral'})`;
    } else if (key === 'color') {
      const dot = document.getElementById('styDot_color');
      if (dot) dot.style.background = styColorHex(e.target.value);
    } else if (key === 'currency') {
      const suffix = document.getElementById('styS_targetPrice');
      if (suffix) suffix.textContent = e.target.value.split(' ')[0] || 'USD';
    } else if (key === 'buyer') {
      const b = biBuyers.find(x => x.name === e.target.value);
      if (b) {
        styForm.contact = b.contact;
        const c = document.getElementById('styF_contact');
        if (c) c.value = b.contact;
      }
    }
  });

  /* container (page-content) persists across re-renders, so the old listener
     is removed first — otherwise every re-render would stack another. */
  if (styClickHandler) container.removeEventListener('click', styClickHandler);
  styClickHandler = (e) => {
    if (styInqCombo.handleClick(e)) return;
    if (e.target.closest('#styAddRow')) { styStartNew(); return; }
    if (e.target.closest('#stySave')) { stySave(); return; }
    if (e.target.closest('#styReset')) { styResetForm(); styRerenderCards(); styRefreshTable(); stySetMsg('Form reset.', 'muted'); return; }
    const editBtn = e.target.closest('[data-edit]');
    if (editBtn) { styLoadStyle(Number(editBtn.dataset.edit)); return; }
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) { styDeleteStyle(Number(delBtn.dataset.del)); return; }
  };
  container.addEventListener('click', styClickHandler);

  if (styOutsideClick) document.removeEventListener('click', styOutsideClick);
  styOutsideClick = (e) => {
    if (styInqCombo.state.open && styInqCombo.isOutside(e.target)) styInqCombo.close();
  };
  document.addEventListener('click', styOutsideClick);
}

/* First visit only: seed with the demo inquiry + style + costing so the screen
   matches what a filled-in form looks like, instead of opening empty. */
function bomEnsureSeeded() {
  if (bomForm.styleId) return;
  bomApplyInquiry(biInquiries[0].no);
  bomApplyStyle(styStyles[0].id);
  Object.assign(bomForm, {
    fabric: '1.80', items: bomBlankItems(),
    trims: '1.85', accessories: '0.25', cm: '0.18', wash: '0.65', printing: '0.20',

    profit: '0.30', qty: '1000',
  });

function bomNum(v) {
  const n = parseFloat(String(v || '').replace(/[^0-9.]/g, ''));
  return isNaN(n) ? 0 : n;
}

function bomTotals() {
  const cost = BOM_COST_FIELDS.reduce((sum, f) => sum + bomNum(bomForm[f.key]), 0);
  const profit = bomNum(bomForm.profit);
  const fob = cost + profit;
  const profitPct = cost > 0 ? (profit / cost) * 100 : 0;
  const qty = bomNum(bomForm.qty);
  const total = fob * qty;
  return { cost, profit, fob, profitPct, qty, total };
}

function bomMoney(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function bomRecalc() {
  const t = bomTotals();
  const cost = document.getElementById('bomTotalCost');
  const pct = document.getElementById('bomProfitPct');
  const fob = document.getElementById('bomFobPrice');
  const total = document.getElementById('bomTotalValue');
  if (cost) cost.textContent = bomMoney(t.cost);
  if (pct) pct.textContent = t.profitPct.toFixed(1);
  if (fob) fob.textContent = bomMoney(t.fob);
  if (total) total.textContent = bomMoney(t.total);
}

/* ---------- actions ---------- */
function bomRerenderCards() {
  const el = document.getElementById('bomCards');
  if (!el) return;
  el.innerHTML = bomBuyerCard() + bomMaterialCard() + bomCostingCard();
}

function bomSave() {
  if (!bomForm.styleId) { bomSetMsg('Pick a style before saving.', 'danger'); document.getElementById('bomStyleInput')?.focus(); return; }
  if (!bomForm.fabric.trim()) { bomSetMsg('Fabric consumption is required.', 'danger'); document.getElementById('bomF_fabric')?.focus(); return; }

  const s = styStyles.find(x => x.id === bomForm.styleId);
  if (!s) { bomSetMsg('Linked style no longer exists.', 'danger'); return; }

  const rec = {
    id: state.editingBomId || ++bomRecordSeq,
    styleId: s.id, style: s.style, product: s.product, category: s.category,
    fabric: s.fabric, color: s.color, qty: s.qty, price: s.price, shipDate: s.shipDate, status: s.status,
  };

  if (state.editingBomId) {
    const idx = bomRecords.findIndex(r => r.id === state.editingBomId);
    if (idx > -1) bomRecords[idx] = rec; else bomRecords.unshift(rec);
  } else {
    bomRecords.unshift(rec);
  }

  bomResetForm();
  bomRerenderCards();
  bomRefreshTable();
  bomSetMsg(`BOM & Costing for ${rec.style} saved.`, 'success');
}

function bomLoadRecord(id) {
  const r = bomRecords.find(x => x.id === id);
  if (!r) return;
  bomApplyStyle(r.styleId);
  state.editingBomId = id;
  bomRerenderCards();
  bomRefreshTable();
  bomSetMsg(`Editing BOM & Costing for ${r.style} — update the fields and click Save BoM & Cost.`, 'muted');
  document.getElementById('bomCards')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function bomDeleteRecord(id) {
  const r = bomRecords.find(x => x.id === id);
  if (!r) return;
  if (!window.confirm(`Delete BOM & Costing for style ${r.style}?`)) return;
  const idx = bomRecords.findIndex(x => x.id === id);
  if (idx > -1) bomRecords.splice(idx, 1);
  if (state.editingBomId === id) { bomResetForm(); bomRerenderCards(); }
  bomRefreshTable();
}

let bomClickHandler = null;

let bomOutsideClick = null;

function bomBindEvents(container) {
  const cards = document.getElementById('bomCards');

  cards.addEventListener('input', (e) => {
    if (bomInqCombo.handleInput(e) || bomStyleCombo.handleInput(e)) return;
    const key = e.target.dataset.bomf;
    if (key) {
      bomForm[key] = e.target.value;
      if (BOM_COST_FIELDS.some(f => f.key === key) || key === 'profit' || key === 'qty') bomRecalc();
      return;
    }
    const idx = e.target.dataset.bomi;
    if (idx !== undefined) bomForm.items[Number(idx)].value = e.target.value;
  });

  cards.addEventListener('mousemove', (e) => { bomInqCombo.handleMousemove(e); bomStyleCombo.handleMousemove(e); });
  cards.addEventListener('keydown', (e) => { bomInqCombo.handleKeydown(e); bomStyleCombo.handleKeydown(e); });

  cards.addEventListener('change', (e) => {
    if (e.target.dataset.bomf === 'buyer') {
      const b = biBuyers.find(x => x.name === e.target.value);
      if (b) {
        bomForm.contact = b.contact;
        const c = document.getElementById('bomF_contact');
        if (c) c.value = b.contact;
      }
      return;
    }
    const idx = e.target.dataset.bomi;
    if (idx !== undefined) bomForm.items[Number(idx)].value = e.target.value;
  });

  /* container (page-content) persists across re-renders, so the old listener
     is removed first — otherwise every re-render would stack another. */
  if (bomClickHandler) container.removeEventListener('click', bomClickHandler);
  bomClickHandler = (e) => {
    if (bomInqCombo.handleClick(e) || bomStyleCombo.handleClick(e)) return;
    if (e.target.closest('#bomSave')) { bomSave(); return; }
    if (e.target.closest('#bomReset')) { bomResetForm(); bomRerenderCards(); bomRefreshTable(); bomSetMsg('Form reset.', 'muted'); return; }
    const editBtn = e.target.closest('[data-bom-edit]');
    if (editBtn) { bomLoadRecord(Number(editBtn.dataset.bomEdit)); return; }
    const delBtn = e.target.closest('[data-bom-del]');
    if (delBtn) { bomDeleteRecord(Number(delBtn.dataset.bomDel)); return; }
  };
  container.addEventListener('click', bomClickHandler);

  if (bomOutsideClick) document.removeEventListener('click', bomOutsideClick);
  bomOutsideClick = (e) => {
    if (bomInqCombo.state.open && bomInqCombo.isOutside(e.target)) bomInqCombo.close();
    if (bomStyleCombo.state.open && bomStyleCombo.isOutside(e.target)) bomStyleCombo.close();
  };
  document.addEventListener('click', bomOutsideClick);
}

/* ---------- page ---------- */
function renderBOM(container) {
  bomEnsureSeeded();

  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="bomCards" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        ${bomBuyerCard() + bomMaterialCard() + bomCostingCard()}
      </div>
      ${bomFooterButtons()}
      ${bomListSection()}
      ${bomInfoBanner()}
    </div>`;

  bomRefreshTable();
  bomBindEvents(container);
}

/* Reset blanks the style/bank/construction/commercial/shipping details but
   leaves the document header and buyer/inquiry link alone — same convention
   as Style Management's Reset. */
function popiBlankDetails(type) {
  const f = popiState[type].form;
  Object.assign(f, {
    bankName: '', bankAddress: '', accountName: '', accountNo: '', swift: '',
    styleNo: '', product: '', garmentType: '', fabric: '', gsm: '', color: '', sizeRange: '',
    seam: '', stitch: '', needle: '', thread: '', mainLabel: '', careLabel: '', hangtag: '', polybag: '', carton: '',
    priceTerm: POPI_PRICE_TERMS[0], currency: POPI_CURRENCIES[0], unitPrice: '',
    paymentTerms: '', creditTerms: '', incoterms: POPI_PRICE_TERMS[0],
    discount: '0.00', other: '0.00', vat: '0.00',
    shipMode: POPI_SHIP_MODES[0], portLoading: '', portDest: '', finalDest: '', shipDate: '', deliveryDate: '',
    partial: POPI_YESNO[0], transship: POPI_YESNO[0], shippingMarks: '', instructions: '',
  });
  popiState[type].rows = [];
}

function popiEnsureSeeded(type) {
  if (popiState[type]) return;
  popiState[type] = {
    form: popiSeedForm(type),
    rows: [type === 'po'
      ? { no: 'AB-4587', product: "Men's Polo Shirt", cat: 'Knit', fabric: '95% Cotton 5% Elastane', color: 'Black', size: 'S - XL', qty: 10000, price: 4.50 }
      : { no: 'AB-4587', product: "Men's Basic T-Shirt", cat: 'Knit', fabric: '100% Cotton Jersey 180 GSM', color: 'Black', size: 'S - XL', qty: 10000, price: 4.50 }],
  };
}

function popiRowsSum(type) {
  return popiState[type].rows.reduce((s, r) => s + r.qty * r.price, 0);
}

function popiGrandTotal(type) {
  const f = popiState[type].form;
  return popiRowsSum(type) - bomNum(f.discount) + bomNum(f.other) + bomNum(f.vat);
}

/* ---------- shared bits ---------- */
function popiText(type, key, placeholder) {
  const f = popiState[type].form;
  return `<input data-popif="${key}" type="text" autocomplete="off"
    value="${escapeHtml(f[key] || '')}" placeholder="${escapeHtml(placeholder || '')}" class="${POPI_INPUT}" />`;
}

function popiSelect(type, key, options) {
  const f = popiState[type].form;
  return `<select data-popif="${key}" class="${POPI_INPUT}">
    ${options.map(v => `<option value="${escapeHtml(v)}" ${v === f[key] ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}
  </select>`;
}

function popiDateInput(type, key) {
  const f = popiState[type].form;
  return `<input data-popif="${key}" type="date" value="${escapeHtml(f[key] || '')}" class="${POPI_INPUT} tabular" />`;
}

/* ---------- header strip ---------- */
function popiHeaderStrip(type) {
  const cfg = POPI_CONFIG[type];
  const f = popiState[type].form;
  const chip = (k, v, opts) => {
    const o = opts || {};
    return `<div class="flex flex-col gap-1 min-w-[128px]">
      <span class="fs-caps font-medium text-muted whitespace-nowrap">${escapeHtml(k)}</span>
      <span class="fs-head font-semibold ${o.link ? 'text-side-accent' : 'text-primary'} whitespace-nowrap">${o.html || escapeHtml(v)}</span>
    </div>`;
  };
  const dateChip = `<div class="flex flex-col gap-1 min-w-[128px]">
    <span class="fs-caps font-medium text-muted whitespace-nowrap">${escapeHtml(cfg.dateLabel)}</span>
    <input data-popif="date" type="date" value="${escapeHtml(f.date)}"
      class="fs-head font-semibold text-primary bg-transparent border-none p-0 h-auto focus:outline-none tabular" />
  </div>`;
  const statusChip = `<div class="flex flex-col gap-1 min-w-[170px]">
    <span class="fs-caps font-medium text-muted whitespace-nowrap">${escapeHtml(cfg.statusLabel)}</span>
    <div class="flex items-center gap-2">
      <span class="fs-head font-semibold text-side-accent whitespace-nowrap">${escapeHtml(f.bomNo)}</span>
      <span class="inline-flex items-center px-2 py-0.5 rounded-full fs-small font-semibold bg-successSoft text-success w-fit">Confirmed</span>
    </div>
  </div>`;
  const fields = [
    chip(cfg.noLabel, f.no),
    dateChip,
    chip('Buyer PO No.', f.buyerPoNo, { link: true }),
    chip('Inquiry No.', f.inquiryNo, { link: true }),
    type === 'pi' ? chip('Costing No.', f.costingNo, { link: true }) : '',
    chip('Sample No.', f.sampleNo, { link: true }),
    statusChip,
  ].join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="flex flex-wrap items-start gap-x-8 gap-y-3">${fields}</div>
    </section>`;
}

function popiRerenderCards(type) {
  const el = document.getElementById('popiCards');
  if (!el) return;
  el.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">${popiBuyerCard(type) + popiBankCard(type) + popiStyleCard(type)}</div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">${popiConstructionCard(type) + popiCommercialCard(type) + popiShippingCard(type)}</div>`;

function popiSave(type) {
  const cfg = POPI_CONFIG[type];
  const f = popiState[type].form;
  if (!f.styleNo.trim()) { popiSetMsg(type, 'Style No. is required.', 'danger'); return; }
  if (!popiState[type].rows.length) { popiSetMsg(type, 'Add at least one order item.', 'danger'); return; }
  popiSetMsg(type, `${cfg.saveLabel} saved successfully.`, 'success');
}

let popiInputHandler = null;
let popiChangeHandler = null;
let popiClickHandler = null;

let popiMousemoveHandler = null;
let popiKeydownHandler = null;
let popiOutsideClick = null;

function popiBindEvents(container, type) {
  if (popiInputHandler) container.removeEventListener('input', popiInputHandler);
  popiInputHandler = (e) => {
    if (popiStyleCombo.handleInput(e)) return;
    const key = e.target.dataset.popif;
    if (key) {
      popiState[type].form[key] = e.target.value;
      if (key === 'discount' || key === 'other' || key === 'vat') popiRecalcTotal(type);
      return;
    }
    const rowIdx = e.target.dataset.popiRow;
    const cell = e.target.dataset.popiCell;
    if (rowIdx === undefined || !cell) return;
    const r = popiState[type].rows[Number(rowIdx)];
    if (!r) return;
    r[cell] = cell === 'qty' ? (parseInt(String(e.target.value).replace(/\D/g, ''), 10) || 0) : bomNum(e.target.value);
    const amountEl = document.querySelector(`[data-popi-amount="${rowIdx}"]`);
    if (amountEl) amountEl.textContent = bomMoney(r.qty * r.price);
    popiRecalcTotal(type);
  };
  container.addEventListener('input', popiInputHandler);

  if (popiMousemoveHandler) container.removeEventListener('mousemove', popiMousemoveHandler);
  popiMousemoveHandler = (e) => { popiStyleCombo.handleMousemove(e); };
  container.addEventListener('mousemove', popiMousemoveHandler);

  if (popiKeydownHandler) container.removeEventListener('keydown', popiKeydownHandler);
  popiKeydownHandler = (e) => { popiStyleCombo.handleKeydown(e); };
  container.addEventListener('keydown', popiKeydownHandler);

  if (popiChangeHandler) container.removeEventListener('change', popiChangeHandler);
  popiChangeHandler = (e) => {
    if (e.target.dataset.popif === 'buyer') {
      const b = biBuyers.find(x => x.name === e.target.value);
      if (b) {
        popiState[type].form.contact = b.contact;
        const c = document.querySelector('#popiCards [data-popif="contact"]');
        if (c) c.value = b.contact;
      }
    }
  };
  container.addEventListener('change', popiChangeHandler);

  if (popiClickHandler) container.removeEventListener('click', popiClickHandler);
  popiClickHandler = (e) => {
    if (popiStyleCombo.handleClick(e)) return;
    if (e.target.closest('[data-popi-addrow]')) {
      popiState[type].rows.push({ no: 'AB-NEW', product: 'New Product', cat: 'Knit', fabric: '—', color: '—', size: 'S - XL', qty: 1000, price: 0 });
      popiRefreshTable(type); popiRecalcTotal(type); return;
    }
    const rowDel = e.target.closest('[data-popi-rowdel]');
    if (rowDel) { popiState[type].rows.splice(Number(rowDel.dataset.popiRowdel), 1); popiRefreshTable(type); popiRecalcTotal(type); return; }
    if (e.target.closest('[data-popi-save]')) { popiSave(type); return; }
    if (e.target.closest('[data-popi-reset]')) {
      popiBlankDetails(type);
      popiRerenderCards(type); popiRefreshTable(type); popiRecalcTotal(type);
      popiSetMsg(type, 'Form reset.', 'muted');
      return;
    }
  };
  container.addEventListener('click', popiClickHandler);

  if (popiOutsideClick) document.removeEventListener('click', popiOutsideClick);
  popiOutsideClick = (e) => {
    if (popiStyleCombo.state.open && popiStyleCombo.isOutside(e.target)) popiStyleCombo.close();
  };
  document.addEventListener('click', popiOutsideClick);
}

// ---------- Chart of Accounts ----------
const COA_TABS = ['Journal Entry', 'Assets', 'Liabilities', 'Equity', 'Revenue', 'Expenses', 'Cash & Bank'];
const COA_INPUT = BI_INPUT;
const COA_AUTO = BI_AUTO;
const COA_BTN = BI_BTN;
const COA_BTN_PRIMARY = BI_BTN_PRIMARY;
const COA_DELETE_ICON = STY_DELETE_ICON;
const COA_PLUS_ICON = STY_PLUS_ICON;
const COA_CHECK_ICON = '<svg viewBox="0 0 24 24" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const COA_HISTORY_ICON = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg>';
const COA_ARROW_ICON = '<svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* Every account picker reads the real Chart of Accounts tabs (Assets … Expenses), so a code always
   means the same account everywhere. Functions, not constants, because the chart arrays are
   declared further down and can still be edited at runtime. */
function coaCategoryDefs() {
  return [
    { key: 'asset', label: 'Assets', normal: 'debit', list: coaChartAssetAccounts },
    { key: 'liability', label: 'Liabilities', normal: 'credit', list: coaChartLiabilityAccounts },
    { key: 'equity', label: 'Equity', normal: 'credit', list: coaChartEquityAccounts },
    { key: 'revenue', label: 'Revenue', normal: 'credit', list: coaChartRevenueAccounts },
    { key: 'expense', label: 'Expenses', normal: 'debit', list: coaChartExpenseAccounts },
  ];
}
function coaAllAccounts() {
  return coaCategoryDefs().flatMap(c => c.list.map(a => ({ ...a, cat: c.key, catLabel: c.label, normal: c.normal, label: `${a.code} — ${a.name}` })));
}
function coaAccountList() { return coaAllAccounts().map(a => a.label); }
function coaFindAccount(codeOrLabel) {
  const code = String(codeOrLabel || '').split(' — ')[0].trim();
  return coaAllAccounts().find(a => a.code === code) || null;
}
function coaAccountOptionsHtml(selected) {
  return coaCategoryDefs().map(c => `<optgroup label="${escapeHtml(c.label)}">${c.list.map(a => {
    const v = `${a.code} — ${a.name}`;
    return `<option value="${escapeHtml(v)}" ${v === selected ? 'selected' : ''}>${escapeHtml(v)}</option>`;
  }).join('')}</optgroup>`).join('');
}

/* The general ledger: one entry per posted Journal Entry / voucher, each carrying its account
   lines. Trial Balance, General Ledger, Profit & Loss and Balance Sheet are all computed from it. */
const coaJournalEntries = [];
function coaPostToLedger(entry) {
  const lines = entry.lines
    .map(l => ({ account: (coaFindAccount(l.account) || {}).code, debit: coaNum(l.debit), credit: coaNum(l.credit) }))
    .filter(l => l.account && (l.debit > 0 || l.credit > 0));
  coaJournalEntries.push({ date: entry.date, ref: entry.ref, memo: entry.memo, lines });
}
// Sample ledger so the statements aren't empty before anything new is posted: an opening-balance
// entry (so cash has something to pay out of), plus the three sample journal entries already
// listed under Journal Entry with the account lines their descriptions imply.
coaJournalEntries.push(

  const max = jeEntries.reduce((m, e) => Math.max(m, parseInt(e.voucherNo.split('-').pop(), 10) || 0), 0);

function coaMoney(n) {
  return (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function coaNum(v) {
  const n = parseFloat(String(v || '').replace(/[^0-9.]/g, ''));
  return isNaN(n) ? 0 : n;
}

function coaTotals() {
  const debit = jeForm.lines.reduce((s, l) => s + coaNum(l.debit), 0);
  const credit = jeForm.lines.reduce((s, l) => s + coaNum(l.credit), 0);
  return { debit, credit, balanced: debit > 0 && Math.abs(debit - credit) < 0.005 };
}

  tabsEl.classList.remove('hidden');

  tabsEl.querySelectorAll('[data-coatab]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tabIndex = +btn.dataset.coatab;
      renderChartOfAccounts(tabsEl, container);

function coaBindEvents(container) {
  container.querySelectorAll('[data-coaf]').forEach(el => {
    el.addEventListener('input', () => { jeForm[el.dataset.coaf] = el.value; });
    el.addEventListener('change', () => { jeForm[el.dataset.coaf] = el.value; });
  });

  const body = container.querySelector('#coaLinesBody');

  function refreshTotals() {
    const bar = container.querySelector('#coaTotalsBar');
    if (bar) bar.innerHTML = coaTotalsInner();
  }

  body.addEventListener('input', (e) => {
    const row = e.target.closest('[data-line]');
    if (!row || !e.target.dataset.coaline) return;
    jeForm.lines[+row.dataset.line][e.target.dataset.coaline] = e.target.value;
    if (e.target.dataset.coaline === 'debit' || e.target.dataset.coaline === 'credit') refreshTotals();
  });
  body.addEventListener('change', (e) => {
    const row = e.target.closest('[data-line]');
    if (!row || !e.target.dataset.coaline) return;
    jeForm.lines[+row.dataset.line][e.target.dataset.coaline] = e.target.value;
  });

  body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coadel]');
    if (!btn) return;
    if (jeForm.lines.length <= 1) return;
    jeForm.lines.splice(+btn.dataset.coadel, 1);
    body.innerHTML = jeForm.lines.map(coaLineRow).join('');
    refreshTotals();
  });

  container.querySelector('#coaAddLine').addEventListener('click', () => {
    jeForm.lines.push({ account: coaAccountList()[0], debit: '0.00', credit: '0.00', narration: '' });
    body.innerHTML = jeForm.lines.map(coaLineRow).join('');
    refreshTotals();
  });

  container.querySelector('#coaSaveEntries').addEventListener('click', () => {
    const t = coaTotals();
    if (!t.balanced) {
      coaSetMsg(t.debit === 0 && t.credit === 0
        ? 'Add at least one entry line before saving.'
        : 'Total debit and credit must be equal before saving.', 'danger');
      return;
    }
    coaPostToLedger({ date: jeForm.date, ref: jeForm.voucherNo, memo: jeForm.memo || '(No description)', lines: jeForm.lines });
    jeEntries.unshift({
      date: biFromISO(jeForm.date) || jeForm.date,
      voucherNo: jeForm.voucherNo,
      description: jeForm.memo || '(No description)',
      debit: t.debit, credit: t.credit, status: 'Posted',
    });
    jeForm.voucherNo = coaNextVoucherNo();
    jeForm.reference = '';
    jeForm.memo = '';
    jeForm.lines = [{ account: coaAccountList()[0], debit: '0.00', credit: '0.00', narration: '' }];
    coaRenderJournalEntry(container);
    coaSetMsg(`Journal entry ${jeEntries[0].voucherNo} saved.`, 'success');
  });
}

function coaInt(n) { return (n || 0).toLocaleString('en-US'); }

function coaAssetStatusPill(status) {
  const map = {
    Active: ['successSoft', 'success'], Inactive: ['neutralSoft', 'neutral'],
    'Under Maintenance': ['warningSoft', 'warning'], Disposed: ['dangerSoft', 'danger'],
  };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}">
    <span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}
  </span>`;
}

function coaFilteredAssets() {
  const f = coaAssetFilter;
  const q = f.q.trim().toLowerCase();
  return coaAssets.filter(a => {
    if (q && !(a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && a.category !== f.category) return false;
    if (f.location !== 'All Locations' && a.location !== f.location) return false;
    if (f.status !== 'All Statuses' && a.status !== f.status) return false;
    return true;
  });
}

function coaOpenNewAccountModal() {
  if (document.getElementById('coaAccountModal')) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const nextCode = coaChartNextCode();

  const wrap = document.createElement('div');
  wrap.id = 'coaAccountModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new account');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[560px] px-4">
      <form id="coaAccountForm" class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg('wallet', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">New Account</h3>
          <button type="button" data-close aria-label="Close"
            class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>

        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          <label class="block min-w-0 sm:col-span-2">${biLabel('Parent Account')}
            <select name="parent" class="${COA_INPUT}">
              <option value="">— None / Root (top-level Assets head) —</option>
              ${coaChartAssetAccounts.map(a => `<option value="${escapeHtml(a.code)}">${escapeHtml(a.code)} — ${escapeHtml(a.name)}</option>`).join('')}
            </select></label>
          <label class="block min-w-0">${biLabel('Account Code', { req: true })}
            <input name="code" type="text" autocomplete="off" value="${escapeHtml(nextCode)}" class="${COA_INPUT} tabular" /></label>
          <label class="block min-w-0">${biLabel('Account Name', { req: true })}
            <input name="name" type="text" autocomplete="off" placeholder="e.g. Debtors — Retail" class="${COA_INPUT}" /></label>
          <label class="block min-w-0 sm:col-span-2">${biLabel('Control Type')}
            <select name="controlType" class="${COA_INPUT}">
              ${COA_CHART_CONTROL_TYPES.slice(1).map(v => `<option value="${escapeHtml(v)}" ${v === 'General' ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}
            </select></label>
          <p id="coaAccountModalMsg" class="sm:col-span-2 text-helper text-danger min-h-[17px]"></p>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaAccountForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaAccountModalMsg');
    if (!val('code') || !val('name')) {

    const controlTypeLabel = val('controlType');

      : controlTypeLabel === 'Accounts Receivable' ? 'receivable'

      : null;
    coaChartAssetAccounts.push({ code: val('code'), name: val('name'), controlType, parent: val('parent') || null });

function coaAssetNextCode() {
  const max = coaAssets.reduce((m, a) => Math.max(m, parseInt((a.code.split('-')[1] || '0'), 10) || 0), 0);
  return `AST-${String(max + 1).padStart(4, '0')}`;
}

function coaFormatDateDisplay(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${String(d.getDate()).padStart(2, '0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
}

  return `LIA-${String(max + 1).padStart(4, '0')}`;
}

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaLiabilityForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });

const coaLiabilityFilter = { q: '', category: 'All Categories', location: 'All Locations', status: 'Active', page: 1 };

function coaLiabilityStatusPill(status) {
  const map = {
    Active: ['successSoft', 'success'], Settled: ['neutralSoft', 'neutral'], Overdue: ['dangerSoft', 'danger'],
  };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}">${COA_LOCK_ICON}${escapeHtml(status)}</span>`;
}

function coaFilteredLiabilities() {
  const f = coaLiabilityFilter;
  const q = f.q.trim().toLowerCase();
  return coaLiabilities.filter(l => {
    if (q && !(l.name.toLowerCase().includes(q) || l.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && l.category !== f.category) return false;
    if (f.location !== 'All Locations' && l.location !== f.location) return false;
    if (f.status !== 'All Statuses' && l.status !== f.status) return false;
    return true;
  });
}

  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Account Code', 'Account Name', 'Category', 'Location', 'Purchase Date', 'Due Date', 'Balance (BDT)', 'Status', 'Actions'];

  return `

      <div class="flex items-center gap-1.5">
        <button data-coapage="prev" ${coaLiabilityFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === coaLiabilityFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}

}

function coaRenderLiabilities(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${coaLiabChartFilterBar()}
      ${coaLiabChartAccountsCard()}
      ${coaLiabilityFilterBar()}
      ${coaLiabilityListCard()}
    </div>`;
  coaLiabChartAccountsBindEvents(container);
  coaLiabilityBindEvents(container);
}

function coaLiabilityRefreshResults() {
  const el = document.getElementById('coaLiabResults');
  if (el) el.innerHTML = coaLiabilitiesResultsHtml();
}

function coaLiabilityBindEvents(container) {
  container.querySelector('#coaLiabSearch').addEventListener('input', (e) => {
    coaLiabilityFilter.q = e.target.value;
    coaLiabilityFilter.page = 1;
    coaLiabilityRefreshResults();
  });
  ['coaLiabCategory', 'coaLiabLocation', 'coaLiabStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaLiabCategory' ? 'category' : id === 'coaLiabLocation' ? 'location' : 'status';
      coaLiabilityFilter[key] = e.target.value;
      coaLiabilityFilter.page = 1;
      coaLiabilityRefreshResults();
    });
  });

  container.querySelector('#coaLiabResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredLiabilities().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaLiabilityFilter.page = Math.max(1, coaLiabilityFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaLiabilityFilter.page = Math.min(totalPages, coaLiabilityFilter.page + 1);
    else coaLiabilityFilter.page = +btn.dataset.coapage;
    coaLiabilityRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaLiabSelectAll') return;
    container.querySelectorAll('#coaLiabResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
  });

  container.querySelector('#coaNewLiability').addEventListener('click', () => coaOpenNewLiabilityModal());
}

function coaEqChartAccountsBindEvents(container) {
  const input = container.querySelector('#coaEqChartSearch');
  if (!input) return;
  input.addEventListener('input', (e) => {
    coaEqChartState.q = e.target.value;
    coaEqChartState.page = 1;
    coaEqChartAccountsRefreshResults();
  });

  container.querySelector('#coaEqChartType').addEventListener('change', (e) => {
    coaEqChartState.type = e.target.value;
    coaEqChartState.page = 1;

  container.querySelector('#coaEqChartControlType').addEventListener('change', (e) => {

    coaEqChartState.page = 1;
    coaEqChartAccountsRefreshResults();

    if (btn.dataset.coaeqchartpage === 'prev') coaEqChartState.page = Math.max(1, coaEqChartState.page - 1);

function coaEqChartNextCode() {

  const nextCode = coaEqChartNextCode();

  const wrap = document.createElement('div');
  wrap.id = 'coaEqAccountModal';
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Add new account');
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[8vh] w-full max-w-[560px] px-4">

              <option value="">— None / Root (top-level Equity head) —</option>
              ${coaChartEquityAccounts.map(a => `<option value="${escapeHtml(a.code)}">${escapeHtml(a.code)} — ${escapeHtml(a.name)}</option>`).join('')}
            </select></label>
          <label class="block min-w-0">${biLabel('Account Code', { req: true })}

        </div>

          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">Save Account</button>
        </div>
      </form>
    </div>`;

  document.body.appendChild(wrap);
  const form = wrap.querySelector('#coaEqAccountForm');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };

  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = (n) => (form.elements[n].value || '').trim();
    const msg = form.querySelector('#coaEqAccountModalMsg');
    if (!val('code') || !val('name')) {
      msg.textContent = 'Account Code and Account Name are required.';
      return;
    }
    if (coaChartEquityAccounts.some(a => a.code === val('code'))) {
      msg.textContent = 'An account with this code already exists.';
      return;
    }
    const controlType = val('controlType') === 'Investor' ? 'investor' : null;
    coaChartEquityAccounts.push({ code: val('code'), name: val('name'), controlType, parent: val('parent') || null });
    coaChartEquityAccounts.sort((a, b) => a.code.localeCompare(b.code));

const COA_EQUITY_CATEGORIES = ['All Categories', 'Owner Capital', 'Retained Earnings', 'Drawings', 'Share Capital'];
const COA_EQUITY_PARTIES = ['All Holders', 'Mr. Karim Rahman', 'Company'];
const COA_EQUITY_STATUSES = ['All Statuses', 'Active', 'Closed'];
const COA_EQUITY_PERIODS = ['Current Period', 'Last Month', 'Last Quarter', 'Last Year'];

const coaEquityItems = [
  { code: 'EQT-0001', name: 'Owner Capital Contribution', category: 'Owner Capital', party: 'Mr. Karim Rahman', date: '01-Jan-2022', amount: 10000000, status: 'Active' },
  { code: 'EQT-0002', name: 'Retained Earnings FY23', category: 'Retained Earnings', party: 'Company', date: '31-Dec-2023', amount: 3200000, status: 'Active' },
  { code: 'EQT-0003', name: 'Owner Drawings — Q2', category: 'Drawings', party: 'Mr. Karim Rahman', date: '15-Jun-2023', amount: 250000, status: 'Closed' },
];

const coaEquityFilter = { q: '', category: 'All Categories', party: 'All Holders', status: 'All Statuses', page: 1 };

function coaEquityStatusPill(status) {
  const map = { Active: ['successSoft', 'success'], Closed: ['neutralSoft', 'neutral'] };
  const [bg, fg] = map[status] || map.Active;
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold bg-${bg} text-${fg}"><span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>${escapeHtml(status)}</span>`;
}

function coaFilteredEquity() {
  const f = coaEquityFilter;
  const q = f.q.trim().toLowerCase();
  return coaEquityItems.filter(it => {
    if (q && !(it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q))) return false;
    if (f.category !== 'All Categories' && it.category !== f.category) return false;
    if (f.party !== 'All Holders' && it.party !== f.party) return false;
    if (f.status !== 'All Statuses' && it.status !== f.status) return false;
    return true;
  });
}

  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Code', 'Name', 'Equity Type', 'Holder / Partner', 'Date', 'Amount (BDT)', 'Status', 'Actions'];

  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[980px]">

          <th class="pl-4 pr-2 py-2.5"><input id="coaEquitySelectAll" type="checkbox" class="w-3.5 h-3.5 rounded border-side-border" /></th>
          ${headers.map((h, idx) => `<th class="${idx === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${idx === 6 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((it, i) => coaEquityRow(it, start + i + 1)).join('') : `<tr><td colspan="10" class="px-4 py-10 text-center"><p class="text-body text-muted">No equity items match your filters.</p></td></tr>`}</tbody>

      <div class="flex items-center gap-1.5">
        <button data-coapage="prev" ${coaEquityFilter.page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
        ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-coapage="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === coaEquityFilter.page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
        <button data-coapage="next" ${coaEquityFilter.page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>

function coaEquityBindEvents(container) {
  container.querySelector('#coaEquitySearch').addEventListener('input', (e) => {
    coaEquityFilter.q = e.target.value;
    coaEquityFilter.page = 1;
    coaEquityRefreshResults();
  });
  ['coaEquityCategory', 'coaEquityParty', 'coaEquityStatus'].forEach(id => {
    container.querySelector(`#${id}`).addEventListener('change', (e) => {
      const key = id === 'coaEquityCategory' ? 'category' : id === 'coaEquityParty' ? 'party' : 'status';
      coaEquityFilter[key] = e.target.value;
      coaEquityFilter.page = 1;
      coaEquityRefreshResults();
    });
  });

  container.querySelector('#coaEquityResults').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-coapage]');
    if (!btn || btn.disabled) return;
    const totalPages = Math.max(1, Math.ceil(coaFilteredEquity().length / COA_PAGE_SIZE));
    if (btn.dataset.coapage === 'prev') coaEquityFilter.page = Math.max(1, coaEquityFilter.page - 1);
    else if (btn.dataset.coapage === 'next') coaEquityFilter.page = Math.min(totalPages, coaEquityFilter.page + 1);
    else coaEquityFilter.page = +btn.dataset.coapage;
    coaEquityRefreshResults();
  });

  container.addEventListener('change', (e) => {
    if (e.target.id !== 'coaEquitySelectAll') return;
    container.querySelectorAll('#coaEquityResults tbody input[type="checkbox"]').forEach(cb => { cb.checked = e.target.checked; });
