          <h3 class="text-section-title text-primary">VAT &amp; Tax — Mushak 6.3 Register</h3>
          <p id="vatCounter" class="text-helper text-muted mt-0.5">${vatCounterText()}</p>
        </div>
        <button type="button" id="vatNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Mushak 6.3</button>
      </div>
      <div id="vatResults">${vatResultsHtml()}</div>
    </section>`;
}

function renderVatTax(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${vatSummaryCards()}
      ${vatFilterBar()}
      ${vatListCard()}
    </div>`;
  vatBindEvents(container);
}

function vatRefreshResults(container) {
  container.querySelector('#vatResults').innerHTML = vatResultsHtml();
  container.querySelector('#vatCounter').textContent = vatCounterText();
}

function vatBindEvents(container) {
  container.querySelector('#vatSearch').addEventListener('input', (e) => { vatFilter.q = e.target.value; vatFilter.page = 1; vatRefreshResults(container); });
  container.querySelector('#vatRateFilter').addEventListener('change', (e) => { vatFilter.rate = e.target.value; vatFilter.page = 1; vatRefreshResults(container); });
  container.querySelector('#vatStatusFilter').addEventListener('change', (e) => { vatFilter.status = e.target.value; vatFilter.page = 1; vatRefreshResults(container); });

  container.querySelector('#vatNew').addEventListener('click', () => vatOpenNewModal(container));

  container.querySelector('#vatResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-vatpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(vatFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.vatpage;
      vatFilter.page = p === 'prev' ? Math.max(1, vatFilter.page - 1) : p === 'next' ? Math.min(totalPages, vatFilter.page + 1) : +p;
      vatRefreshResults(container);
      return;
    }
    const viewBtn = e.target.closest('[data-vat-view]');
    if (viewBtn) {
      const no = viewBtn.dataset.vatView;
      vatUi.previewNo = vatUi.previewNo === no ? null : no;
      vatRefreshResults(container);
      return;
    }
    const cancelBtn = e.target.closest('[data-vat-cancel]');
    if (cancelBtn) {
      const inv = vatInvoices.find(v => v.challanNo === cancelBtn.dataset.vatCancel);
      if (!inv || !window.confirm(`Cancel ${inv.challanNo}? A cancelled Mushak 6.3 keeps its serial number and cannot be reissued.`)) return;
      inv.status = 'Cancelled';
      renderVatTax(container);
    }
  });
}

function vatOpenNewModal(container) {
  vatResetForm();
  finOpenModal({
    id: 'vatNewModal', title: 'New Mushak 6.3 Tax Invoice', icon: 'wallet', wide: true, width: 'max-w-[940px]',
    submitLabel: 'Save & Issue',
    body: vatFormBodyHtml(),
    onOpen(form) {
      const refreshTotals = () => { form.querySelector('#vatFormTotals').innerHTML = vatFormTotalsInner(); };
      const redrawLines = () => { form.querySelector('#vatFormLines').innerHTML = vatForm.items.map(vatFormLineRow).join(''); refreshTotals(); };

      form.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.vatf && t.dataset.vatf !== 'rate') vatForm[t.dataset.vatf] = t.value;
        if (t.dataset.vitem) {
          const row = t.closest('[data-vrow]');
          const it = vatForm.items[+row.dataset.vrow];
          const numeric = t.dataset.vitem === 'quantity' || t.dataset.vitem === 'unitPrice';
          it[t.dataset.vitem] = numeric ? (parseFloat(t.value) || 0) : t.value;
          if (numeric) {
            row.querySelector('[data-vline-total]').textContent = coaMoney(vatLineValue(it));
            refreshTotals();
          }
        }
      });
      form.addEventListener('change', (e) => {
        if (e.target.dataset.vatf === 'rate') { vatForm.rate = parseFloat(e.target.value); refreshTotals(); }
      });
      form.addEventListener('click', (e) => {
        const del = e.target.closest('[data-vitem-del]');
        if (del && !del.disabled) { vatForm.items.splice(+del.dataset.vitemDel, 1); redrawLines(); return; }
        if (e.target.closest('#vatAddLine')) { vatForm.items.push(vatNewLine()); redrawLines(); }
      });
    },
    onSubmit() {
      const f = vatForm;
      const items = f.items.filter(it => it.description.trim() && (Number(it.quantity) || 0) > 0);
      // A Mushak 6.3 is invalid without buyer name and address, issue date and time, and at least one
      // described, priced line. Buyer BIN stays optional for an unregistered buyer.
      if (!f.buyerName.trim()) return 'Enter the buyer name.';
      if (!f.buyerAddress.trim()) return 'Enter the buyer address.';
      if (!f.issueDate || !f.issueTime) return 'Enter the date and time of issue.';
      if (!items.length) return 'Add at least one line with a description and quantity.';
      vatInvoices.push({
        challanNo: vatNextChallanNo(),
        issueDate: f.issueDate,
        issueTime: f.issueTime,
        buyerName: f.buyerName.trim(),
        buyerBin: f.buyerBin.trim(),
        buyerAddress: f.buyerAddress.trim(),
        vatRate: f.rate,
        status: 'Issued',
        items: items.map(it => ({ description: it.description.trim(), unit: it.unit.trim() || 'Pcs', quantity: Number(it.quantity), unitPrice: Number(it.unitPrice) || 0 })),
      });
      vatFilter.page = Math.ceil(vatFiltered().length / COA_PAGE_SIZE);
      renderVatTax(container);
    },
  });
}

// ---------- Shared modal helpers (Finance pages) ----------
// One small dialog shell for the Finance registers' "New …" / "Record …" forms, matching the
// modal look used by Accounts Payable / Receivable. onSubmit(form) returns an error string to keep
// the dialog open, or nothing to close it.
function finFormField(label, name, o) {
  o = o || {};
  const span = o.span ? ' sm:col-span-2' : '';
  let inner;
  if (o.options) {
    inner = `<select name="${name}" class="${COA_INPUT}">${o.options.map(v => `<option value="${escapeHtml(v)}" ${v === o.value ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}</select>`;
  } else if (o.textarea) {
    inner = `<textarea name="${name}" placeholder="${escapeHtml(o.placeholder || '')}" style="height:72px" class="${COA_INPUT} py-2 resize-none">${escapeHtml(o.value || '')}</textarea>`;
  } else {
    inner = `<input name="${name}" type="${o.type || 'text'}" ${o.type === 'number' ? 'min="0" step="0.01"' : ''} autocomplete="off" value="${escapeHtml(o.value ?? '')}" placeholder="${escapeHtml(o.placeholder || '')}" ${o.readonly ? 'readonly' : ''} class="${o.readonly ? COA_AUTO : COA_INPUT} ${o.type === 'number' || o.type === 'date' || o.readonly ? 'tabular' : ''}" />`;
  }
  return `<label class="block min-w-0${span}">${biLabel(label, { req: o.req })}${inner}</label>`;
}

function finOpenModal(o) {
  if (document.getElementById(o.id)) return;
  const close = '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const wrap = document.createElement('div');
  wrap.id = o.id;
  wrap.className = 'fixed inset-0 z-50';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', o.title);
  wrap.innerHTML = `
    <div data-close class="absolute inset-0" style="background: var(--overlay)"></div>
    <div class="relative mx-auto mt-[6vh] w-full ${o.width || (o.wide ? 'max-w-[720px]' : 'max-w-[440px]')} px-4">
      <form class="bg-cardBg border border-side-panel rounded-lg overflow-hidden overlay-shadow">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-side-line">
          <span class="text-side-accent shrink-0">${iconSvg(o.icon || 'doc', 'w-4 h-4')}</span>
          <h3 class="fs-lead font-semibold text-primary">${escapeHtml(o.title)}</h3>
          <button type="button" data-close aria-label="Close" class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-side-hover hover:text-primary">${close}</button>
        </div>
        ${o.intro ? `<p class="px-4 pt-3 text-helper text-muted">${o.intro}</p>` : ''}
        <div class="p-4 grid grid-cols-1 ${o.wide ? 'sm:grid-cols-2' : ''} gap-x-3 gap-y-2.5 max-h-[62vh] overflow-y-auto">
          ${o.body}
          <p data-msg class="${o.wide ? 'sm:col-span-2 ' : ''}text-helper text-danger min-h-[17px]"></p>
        </div>
        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-side-line">
          <button type="button" data-close class="${COA_BTN}">Cancel</button>
          <button type="submit" class="${COA_BTN_PRIMARY}">${escapeHtml(o.submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form');
  const done = () => { document.removeEventListener('keydown', onKey); wrap.remove(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(); } };
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) done(); });
  document.addEventListener('keydown', onKey);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const err = o.onSubmit(form);
    if (err) { form.querySelector('[data-msg]').textContent = err; return; }
    done();
  });
  if (o.onOpen) o.onOpen(form);
  const first = form.querySelector('input:not([readonly]), select, textarea');
  if (first) first.focus();
}

function finFormVal(form, name) { return (form.elements[name].value || '').trim(); }

function finPill(text, tone, dot) {
  const [bg, fg] = { success: ['successSoft', 'success'], warning: ['warningSoft', 'warning'], danger: ['dangerSoft', 'danger'], info: ['infoSoft', 'info'], neutral: ['neutralSoft', 'neutral'] }[tone] || ['neutralSoft', 'neutral'];
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full fs-small font-semibold whitespace-nowrap bg-${bg} text-${fg}">${dot ? `<span class="w-[6px] h-[6px] rounded-full bg-${fg} shrink-0"></span>` : ''}${escapeHtml(text)}</span>`;
}

function finPager(attr, page, totalPages) {
  return `
    <div class="flex items-center gap-1.5">
      <button data-${attr}="prev" ${page <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_LEFT}</button>
      ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button data-${attr}="${p}" class="w-7 h-7 rounded fs-small font-semibold ${p === page ? 'bg-side-accent text-white' : 'border border-side-border text-secondary hover:bg-side-hover'}">${p}</button>`).join('')}
      <button data-${attr}="next" ${page >= totalPages ? 'disabled' : ''} class="w-7 h-7 rounded border border-side-border flex items-center justify-center text-muted hover:bg-side-hover disabled:opacity-40 disabled:cursor-not-allowed">${COA_CHEVRON_RIGHT}</button>
    </div>`;
}

// ---------- Budget Management ----------
// Content ported from the Finance reference build: departmental / cost-centre budget lines per
// fiscal year, with actual spend recorded against each line so variance and utilization stay
// current. Spend status is derived from the amounts rather than stored, so it can't drift.
const BUDGET_DEPARTMENTS = ['Merchandising', 'Production / Factory', 'Procurement', 'Admin & HR', 'Finance', 'Commercial / Export', 'Quality Assurance', 'Sample Development', 'IT & Systems'];
const BUDGET_CATEGORIES = ['Raw Material Consumption', 'Direct Factory Labor', 'Factory Overhead', 'Admin Salaries', 'Rent Expense', 'Utilities', 'Office Supplies', 'Sample & Development', 'Marketing & Business Promotion', 'Freight & Shipping (Export)', 'Commission Expense', 'Bank Interest & Charges', 'Machinery & CapEx', 'Compliance & Audit', 'Contingency / Miscellaneous'];
const BUDGET_PERIOD_TYPES = ['Annual', 'Quarterly', 'Monthly'];
const BUDGET_APPROVAL_STATUSES = ['Draft', 'Pending Approval', 'Approved', 'Rejected'];

// Bangladesh's fiscal year runs July–June, so offer the previous, current and next FY.
const BUDGET_FISCAL_YEARS = (() => {
  const now = new Date();
  const y = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
  return [`FY${y - 1}-${String(y).slice(-2)}`, `FY${y}-${String(y + 1).slice(-2)}`, `FY${y + 1}-${String(y + 2).slice(-2)}`];
})();

const budgetRecords = (() => {
  const fy = BUDGET_FISCAL_YEARS[1];
  const y1 = fy.slice(2, 6), y2 = `20${fy.slice(-2)}`;
  return [
    { budgetCode: 'BUD-0001', title: 'Woven Fabric & Trims Procurement', department: 'Procurement', category: 'Raw Material Consumption', fiscalYear: fy, periodType: 'Annual', startDate: `${y1}-07-01`, endDate: `${y2}-06-30`, budgetedAmount: 45000000, actualSpent: 28500000, approvalStatus: 'Approved', approvedBy: 'Head of Finance', notes: 'Covers fabric, trims and accessories for confirmed POs this fiscal year.' },
    { budgetCode: 'BUD-0002', title: 'Factory Floor Wages & Overtime', department: 'Production / Factory', category: 'Direct Factory Labor', fiscalYear: fy, periodType: 'Annual', startDate: `${y1}-07-01`, endDate: `${y2}-06-30`, budgetedAmount: 18000000, actualSpent: 17200000, approvalStatus: 'Approved', approvedBy: 'Managing Director', notes: '' },
    { budgetCode: 'BUD-0003', title: 'Sample & Development Costs', department: 'Sample Development', category: 'Sample & Development', fiscalYear: fy, periodType: 'Quarterly', startDate: `${y1}-07-01`, endDate: `${y1}-09-30`, budgetedAmount: 1200000, actualSpent: 1350000, approvalStatus: 'Approved', approvedBy: 'Head of Merchandising', notes: 'Buyer sample requests ran ahead of plan this quarter.' },
    { budgetCode: 'BUD-0004', title: 'Export Freight & Shipping', department: 'Commercial / Export', category: 'Freight & Shipping (Export)', fiscalYear: fy, periodType: 'Annual', startDate: `${y1}-07-01`, endDate: `${y2}-06-30`, budgetedAmount: 9500000, actualSpent: 4100000, approvalStatus: 'Approved', approvedBy: 'Head of Finance', notes: '' },
    { budgetCode: 'BUD-0005', title: 'Head Office Admin & Utilities', department: 'Admin & HR', category: 'Utilities', fiscalYear: fy, periodType: 'Monthly', startDate: `${y1}-07-01`, endDate: `${y1}-07-31`, budgetedAmount: 650000, actualSpent: 0, approvalStatus: 'Pending Approval', approvedBy: '', notes: '' },
  ];
})();

const budgetFilter = { q: '', department: 'All Departments', fiscalYear: 'All Fiscal Years', status: 'All Statuses', page: 1 };

function budgetVariance(b) { return (b.budgetedAmount || 0) - (b.actualSpent || 0); }
function budgetUtilizationPct(b) { return b.budgetedAmount ? ((b.actualSpent || 0) / b.budgetedAmount) * 100 : 0; }
function budgetSpendStatus(b) {
  const pct = budgetUtilizationPct(b);
  if (pct > 100) return 'Over Budget';
  if (pct >= 90) return 'Near Limit';
  return 'On Track';
}
function budgetNextCode() {
  const max = budgetRecords.reduce((m, b) => Math.max(m, parseInt((b.budgetCode.split('-')[1] || '0'), 10) || 0), 0);
  return `BUD-${String(max + 1).padStart(4, '0')}`;
}

function budgetFiltered() {
  const q = budgetFilter.q.trim().toLowerCase();
  return budgetRecords.filter(b => {
    if (q && !(b.budgetCode.toLowerCase().includes(q) || b.title.toLowerCase().includes(q) || b.department.toLowerCase().includes(q))) return false;
    if (budgetFilter.department !== 'All Departments' && b.department !== budgetFilter.department) return false;
    if (budgetFilter.fiscalYear !== 'All Fiscal Years' && b.fiscalYear !== budgetFilter.fiscalYear) return false;
    if (budgetFilter.status !== 'All Statuses' && budgetSpendStatus(b) !== budgetFilter.status) return false;
    return true;
  });
}

function budgetSummaryCards() {
  let budgeted = 0, spent = 0, over = 0;
  budgetRecords.forEach(b => { budgeted += b.budgetedAmount || 0; spent += b.actualSpent || 0; if (budgetSpendStatus(b) === 'Over Budget') over += 1; });
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, coaInt(Math.round(budgeted)), 'Total Budgeted (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, coaInt(Math.round(spent)), 'Total Actual Spend (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaInt(Math.round(budgeted - spent)), 'Remaining Balance (BDT)')}
      ${coaCashBankStatCard(AP_AR_ICON_OVERDUE, over, 'Lines Over Budget')}
    </div>`;
}

function budgetFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="budgetSearch" type="text" value="${escapeHtml(budgetFilter.q)}" placeholder="Search budget lines…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField('Department', `<select id="budgetDept" class="${COA_INPUT}">${opt(['All Departments', ...BUDGET_DEPARTMENTS], budgetFilter.department)}</select>`)}
        ${coaField('Fiscal Year', `<select id="budgetFy" class="${COA_INPUT}">${opt(['All Fiscal Years', ...BUDGET_FISCAL_YEARS], budgetFilter.fiscalYear)}</select>`)}
        ${coaField('Status', `<select id="budgetStatus" class="${COA_INPUT}">${opt(['All Statuses', 'On Track', 'Near Limit', 'Over Budget'], budgetFilter.status)}</select>`)}
      </div>
    </section>`;
}

function budgetRow(b, n) {
  const variance = budgetVariance(b);
  const pct = budgetUtilizationPct(b);
  const status = budgetSpendStatus(b);
  const tone = status === 'Over Budget' ? 'danger' : status === 'Near Limit' ? 'warning' : 'success';
  const barColor = status === 'Over Budget' ? 'bg-danger' : status === 'Near Limit' ? 'bg-warning' : 'bg-side-accent';
  const approvalTone = { 'Pending Approval': 'warning', Rejected: 'danger', Draft: 'neutral' }[b.approvalStatus];
  const canSpend = b.approvalStatus === 'Approved';
  // Approved is the normal state, so only lines that are NOT approved carry an approval pill.
  const meta = [b.department, b.budgetCode, b.fiscalYear].join(' · ');
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 fs-base text-primary min-w-[240px]">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <span class="font-medium" ${canSpend && b.approvedBy ? `title="Approved by ${escapeHtml(b.approvedBy)}"` : ''}>${escapeHtml(b.title)}</span>${canSpend ? '' : finPill(b.approvalStatus, approvalTone)}
        </div>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(meta)}</p>
        ${b.notes ? `<p class="text-helper text-muted mt-0.5">${escapeHtml(b.notes)}</p>` : ''}
      </td>
      <td class="px-3 py-2.5 fs-base text-secondary whitespace-nowrap tabular text-right">${coaInt(b.budgetedAmount)}</td>
      <td class="px-3 py-2.5 fs-base text-secondary whitespace-nowrap tabular text-right">${coaInt(b.actualSpent)}</td>
      <td class="px-3 py-2.5 fs-base font-semibold whitespace-nowrap tabular text-right ${variance >= 0 ? 'text-success' : 'text-danger'}">${variance < 0 ? '−' : ''}${coaInt(Math.abs(variance))}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <div class="flex items-center gap-2">
          <div class="w-20 h-1.5 rounded-full bg-side-line overflow-hidden"><div class="h-full ${barColor}" style="width:${Math.min(100, Math.max(0, pct))}%"></div></div>
          <span class="fs-head tabular text-secondary">${pct.toFixed(0)}%</span>
        </div>
        <div class="mt-1.5">${finPill(status, tone, true)}</div>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        <button type="button" data-budget-spend="${escapeHtml(b.budgetCode)}" ${canSpend ? '' : 'disabled title="Spend can only be recorded against an approved budget line"'} class="h-7 px-2.5 rounded border border-side-accent/40 text-side-accent fs-small font-semibold hover:bg-side-active mr-1.5 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">Record Spend</button>
        <button type="button" data-budget-remove="${escapeHtml(b.budgetCode)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>
      </td>
    </tr>`;
}

function budgetResultsHtml() {
  const all = budgetFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  budgetFilter.page = Math.min(Math.max(1, budgetFilter.page), totalPages);
  const start = (budgetFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Budget', 'Budgeted (BDT)', 'Actual (BDT)', 'Variance (BDT)', 'Utilization', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i >= 2 && i <= 4 || i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((b, i) => budgetRow(b, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No budget lines match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      ${finPager('budgetpage', budgetFilter.page, totalPages)}
    </div>`;
}

function budgetCounterText() {
  return `${budgetFiltered().length} of ${budgetRecords.length} budget line${budgetRecords.length === 1 ? '' : 's'}`;
}

function renderBudgetManagement(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="budgetSummary">${budgetSummaryCards()}</div>
      ${budgetFilterBar()}
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
        <div class="flex flex-wrap items-start justify-between gap-3 p-4">
          <div>
            <h3 class="text-section-title text-primary">Budget Lines</h3>
            <p id="budgetCounter" class="text-helper text-muted mt-0.5">${budgetCounterText()}</p>
          </div>
          <button type="button" id="budgetNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Budget Line</button>
        </div>
        <div id="budgetResults">${budgetResultsHtml()}</div>
      </section>
    </div>`;
  budgetBindEvents(container);
}

// Filters only touch the table and counter; anything that changes the amounts also redraws the
// summary cards.
function budgetRefresh(container, withSummary) {
  container.querySelector('#budgetResults').innerHTML = budgetResultsHtml();
  container.querySelector('#budgetCounter').textContent = budgetCounterText();
  if (withSummary) container.querySelector('#budgetSummary').innerHTML = budgetSummaryCards();
}

function budgetBindEvents(container) {
  const bind = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { budgetFilter[key] = e.target.value; budgetFilter.page = 1; budgetRefresh(container); });
  bind('budgetSearch', 'q', 'input');
  bind('budgetDept', 'department', 'change');
  bind('budgetFy', 'fiscalYear', 'change');
  bind('budgetStatus', 'status', 'change');

  container.querySelector('#budgetNew').addEventListener('click', () => budgetOpenNewModal(container));

  container.querySelector('#budgetResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-budgetpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(budgetFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.budgetpage;
      budgetFilter.page = p === 'prev' ? Math.max(1, budgetFilter.page - 1) : p === 'next' ? Math.min(totalPages, budgetFilter.page + 1) : +p;
      budgetRefresh(container);
      return;
    }
    const spendBtn = e.target.closest('[data-budget-spend]');
    if (spendBtn && !spendBtn.disabled) { budgetOpenSpendModal(spendBtn.dataset.budgetSpend, container); return; }
    const removeBtn = e.target.closest('[data-budget-remove]');
    if (removeBtn) {
      const i = budgetRecords.findIndex(b => b.budgetCode === removeBtn.dataset.budgetRemove);
      if (i > -1) budgetRecords.splice(i, 1);
      budgetRefresh(container, true);
    }
  });
}

function budgetOpenNewModal(container) {
  const today = new Date().toISOString().slice(0, 10);
  finOpenModal({
    id: 'budgetNewModal', title: 'New Budget Line', icon: 'wallet', wide: true, submitLabel: 'Save Budget Line',
    body: [
      finFormField('Budget Code', 'code', { value: budgetNextCode(), readonly: true }),
      finFormField('Budget Title', 'title', { req: true, placeholder: 'e.g. Woven Fabric & Trims Procurement' }),
      finFormField('Department / Cost Centre', 'department', { options: BUDGET_DEPARTMENTS }),
      finFormField('Category', 'category', { options: BUDGET_CATEGORIES }),
      finFormField('Fiscal Year', 'fiscalYear', { options: BUDGET_FISCAL_YEARS, value: BUDGET_FISCAL_YEARS[1] }),
      finFormField('Period Type', 'periodType', { options: BUDGET_PERIOD_TYPES }),
      finFormField('Start Date', 'startDate', { type: 'date', value: today }),
      finFormField('End Date', 'endDate', { type: 'date', value: today }),
      finFormField('Budgeted Amount (BDT)', 'amount', { type: 'number', req: true, placeholder: '0.00' }),
      finFormField('Approval Status', 'approvalStatus', { options: BUDGET_APPROVAL_STATUSES }),
      finFormField('Approved By (optional)', 'approvedBy', { placeholder: 'e.g. Head of Finance' }),
      finFormField('Notes (optional)', 'notes', { textarea: true, span: true, placeholder: 'Any context for this budget line' }),
    ].join(''),
    onSubmit(form) {
      const v = (n) => finFormVal(form, n);
      const amount = Number(v('amount')) || 0;
      if (!v('title')) return 'Enter a budget title.';
      if (amount <= 0) return 'Enter a budgeted amount greater than zero.';
      if (!v('startDate') || !v('endDate')) return 'Enter both start and end dates.';
      if (v('endDate') < v('startDate')) return 'End date cannot be before the start date.';
      budgetRecords.push({
        budgetCode: budgetNextCode(), title: v('title'), department: v('department'), category: v('category'),
        fiscalYear: v('fiscalYear'), periodType: v('periodType'), startDate: v('startDate'), endDate: v('endDate'),
        budgetedAmount: amount, actualSpent: 0, approvalStatus: v('approvalStatus'), approvedBy: v('approvedBy'), notes: v('notes'),
      });
      budgetFilter.page = Math.ceil(budgetFiltered().length / COA_PAGE_SIZE);
      budgetRefresh(container, true);
    },
  });
}

function budgetOpenSpendModal(code, container) {
  const b = budgetRecords.find(x => x.budgetCode === code);
  if (!b) return;
  finOpenModal({
    id: 'budgetSpendModal', title: `Record Spend — ${b.budgetCode}`, icon: 'wallet', submitLabel: 'Record Spend',
    intro: `${escapeHtml(b.title)} — <span class="text-primary font-semibold tabular">BDT ${coaMoney(Math.max(0, budgetVariance(b)))}</span> remaining of BDT ${coaMoney(b.budgetedAmount)}`,
    body: finFormField('Spend Amount (BDT)', 'amount', { type: 'number', req: true, placeholder: '0.00' }),
    onSubmit(form) {
      const amount = Number(finFormVal(form, 'amount')) || 0;
      if (amount <= 0) return 'Enter a spend amount greater than zero.';
      b.actualSpent = (b.actualSpent || 0) + amount;
      budgetRefresh(container, true);
    },
  });
}

// ---------- LC & Export Finance ----------
// Content ported from the Finance reference build: a register of Letters of Credit (export LCs
// and the back-to-back / revolving LCs used to finance materials against them), showing how much
// of each LC's value has been utilized and how much headroom is left before expiry. Status is
// derived from amount, utilized total and expiry date so it can't drift out of sync.
const LC_TYPES = ['Export LC - Sight', 'Export LC - Usance', 'Back-to-Back LC', 'Revolving LC'];
const LC_SHIPMENT_OPTIONS = ['Allowed', 'Not Allowed'];
const LC_CURRENCIES = COA_CASHBANK_CURRENCIES.slice(1);
const LC_STATUSES = ['Active', 'Partially Utilized', 'Utilized', 'Expired'];

const lcRecords = [
  { lcNo: '0123456789012001', lcType: 'Export LC - Sight', issuingBank: 'HSBC Bangladesh', advisingBank: 'City Bank PLC', buyer: 'Everest Apparels Ltd.', contractRef: 'SC-4471', amount: 4500000, currency: 'USD', issueDate: '2026-03-01', expiryDate: '2026-09-30', latestShipmentDate: '2026-09-15', portOfLoading: 'Chattogram', portOfDischarge: 'Rotterdam', partialShipment: 'Allowed', utilized: 2000000 },
  { lcNo: '0123456789012002', lcType: 'Export LC - Usance', issuingBank: 'Standard Chartered Bank', advisingBank: 'HSBC Bangladesh', buyer: 'Metro Fashion House', contractRef: 'SO-118', amount: 620000, currency: 'USD', issueDate: '2026-04-10', expiryDate: '2026-08-10', latestShipmentDate: '2026-07-25', portOfLoading: 'Chattogram', portOfDischarge: 'Hamburg', partialShipment: 'Not Allowed', utilized: 620000 },
  { lcNo: '0123456789012003', lcType: 'Back-to-Back LC', issuingBank: 'City Bank PLC', advisingBank: '', buyer: 'ABC Textiles Ltd. (supplier)', contractRef: 'PO-2031', amount: 875000, currency: 'USD', issueDate: '2026-05-01', expiryDate: '2026-11-01', latestShipmentDate: '2026-10-15', portOfLoading: '', portOfDischarge: 'Chattogram', partialShipment: 'Allowed', utilized: 150000 },
  { lcNo: '0123456789012004', lcType: 'Export LC - Sight', issuingBank: 'Northline Buying House Bankers', advisingBank: 'Dutch-Bangla Bank Ltd.', buyer: 'Northline Buying House', contractRef: 'SMP-77', amount: 85000, currency: 'USD', issueDate: '2026-01-05', expiryDate: '2026-04-05', latestShipmentDate: '2026-03-20', portOfLoading: 'Chattogram', portOfDischarge: 'Felixstowe', partialShipment: 'Not Allowed', utilized: 0 },
  { lcNo: '0123456789012005', lcType: 'Revolving LC', issuingBank: 'HSBC Bangladesh', advisingBank: '', buyer: 'Everest Apparels Ltd.', contractRef: 'SC-4502', amount: 3100000, currency: 'USD', issueDate: '2026-06-18', expiryDate: '2027-06-18', latestShipmentDate: '2027-06-01', portOfLoading: 'Chattogram', portOfDischarge: 'Rotterdam', partialShipment: 'Allowed', utilized: 0 },
];

const lcFilter = { q: '', lcType: 'All Types', bank: 'All Banks', status: 'All Statuses', page: 1 };

function lcBalance(l) { return Math.max(0, (l.amount || 0) - (l.utilized || 0)); }

function lcDaysToExpiry(l) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return (new Date(l.expiryDate + 'T00:00:00') - today) / 86400000;
}

function lcStatus(l) {
  if (lcBalance(l) <= 0) return 'Utilized';
  if (lcDaysToExpiry(l) < 0) return 'Expired';
  return l.utilized > 0 ? 'Partially Utilized' : 'Active';
}

function lcStatusPill(status) {
  return finPill(status, { Active: 'success', 'Partially Utilized': 'info', Utilized: 'neutral', Expired: 'danger' }[status], true);
}

// LCs can be in different currencies, so totals are summed per currency, never across them.
function lcTotalsText(valueOf, records) {
  const by = {};
  (records || lcRecords).forEach(l => { by[l.currency] = (by[l.currency] || 0) + valueOf(l); });
  const keys = Object.keys(by);
  return keys.length ? keys.map(c => `${c} ${coaInt(Math.round(by[c]))}`).join(' · ') : '0';
}

function lcBankOptions() {
  return Array.from(new Set(lcRecords.map(l => l.issuingBank).filter(Boolean))).sort();
}

function lcFiltered() {
  const q = lcFilter.q.trim().toLowerCase();
  return lcRecords.filter(l => {
    if (q && !(l.lcNo.toLowerCase().includes(q) || l.buyer.toLowerCase().includes(q) || l.issuingBank.toLowerCase().includes(q) || (l.contractRef || '').toLowerCase().includes(q))) return false;
    if (lcFilter.lcType !== 'All Types' && l.lcType !== lcFilter.lcType) return false;
    if (lcFilter.bank !== 'All Banks' && l.issuingBank !== lcFilter.bank) return false;
    if (lcFilter.status !== 'All Statuses' && lcStatus(l) !== lcFilter.status) return false;
    return true;
  });
}

// Card version of the per-currency totals: the currency is a small label so long figures stay on one line.
function lcTotalsCard(valueOf) {
  const by = {};
  lcRecords.forEach(l => { by[l.currency] = (by[l.currency] || 0) + valueOf(l); });
  const keys = Object.keys(by);
  return keys.length ? keys.map(c => `<span class="block whitespace-nowrap"><span class="fs-small font-medium text-muted mr-1.5">${escapeHtml(c)}</span>${coaInt(Math.round(by[c]))}</span>`).join('') : '0';
}

function lcSummaryCards() {
  const expiring = lcRecords.filter(l => lcBalance(l) > 0 && lcDaysToExpiry(l) >= 0 && lcDaysToExpiry(l) <= 30).length;
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, lcTotalsCard(l => l.amount || 0), 'Total LC Value')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, lcTotalsCard(l => l.utilized || 0), 'Total Utilized')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, lcTotalsCard(lcBalance), 'Available Balance')}
      ${coaCashBankStatCard(AP_AR_ICON_DUESOON, expiring, 'Expiring in 30 Days')}
    </div>`;
}

function lcFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="lcSearch" type="text" value="${escapeHtml(lcFilter.q)}" placeholder="Search LC no. or buyer…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField('LC Type', `<select id="lcTypeFilter" class="${COA_INPUT}">${opt(['All Types', ...LC_TYPES], lcFilter.lcType)}</select>`)}
        ${coaField('Issuing Bank', `<select id="lcBankFilter" class="${COA_INPUT}">${opt(['All Banks', ...lcBankOptions()], lcFilter.bank)}</select>`)}
        ${coaField('Status', `<select id="lcStatusFilter" class="${COA_INPUT}">${opt(['All Statuses', ...LC_STATUSES], lcFilter.status)}</select>`)}
      </div>
    </section>`;
}

function lcRow(l, n) {
  const balance = lcBalance(l);
  const status = lcStatus(l);
  return `
    <tr class="group border-b border-side-line last:border-b-0 hover:bg-side-hover align-top">
      <td class="pl-4 pr-2 py-2.5 fs-base text-muted tabular">${n}</td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base font-medium text-primary tabular">${escapeHtml(l.lcNo)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(l.lcType)}</p>
      </td>
      <td class="px-3 py-2.5 min-w-[180px]">
        <p class="fs-base text-primary">${escapeHtml(l.buyer)}</p>
        <p class="text-helper text-muted mt-0.5">${escapeHtml(l.issuingBank)}</p>
      </td>
      <td class="px-3 py-2.5 whitespace-nowrap">
        <p class="fs-base text-secondary tabular">${coaFormatDateDisplay(l.expiryDate)}</p>
        <div class="mt-1.5">${lcStatusPill(status)}</div>
      </td>
      <td class="px-3 py-2.5 fs-base text-primary font-semibold whitespace-nowrap tabular text-right">${coaInt(l.amount)} ${escapeHtml(l.currency)}</td>
      <td class="px-3 py-2.5 whitespace-nowrap text-right tabular">
        <p class="fs-base text-secondary">${coaInt(l.utilized)} <span class="text-helper text-muted">used</span></p>
        <p class="fs-base font-semibold mt-0.5 ${balance > 0 ? 'text-success' : 'text-secondary'}">${coaInt(balance)} <span class="text-helper font-normal text-muted">left</span></p>
      </td>
      <td class="pr-4 pl-3 py-2.5 text-right whitespace-nowrap">
        ${balance > 0 && status !== 'Expired' ? `<button type="button" data-lc-utilize="${escapeHtml(l.lcNo)}" class="h-7 px-2.5 rounded border border-side-accent/40 text-side-accent fs-small font-semibold hover:bg-side-active mr-1.5">Utilize</button>` : ''}
        <button type="button" data-lc-remove="${escapeHtml(l.lcNo)}" class="w-7 h-7 rounded border border-side-border inline-flex items-center justify-center text-muted hover:text-danger hover:bg-dangerSoft" title="Remove">${COA_DELETE_ICON}</button>
      </td>
    </tr>`;
}

function lcResultsHtml() {
  const all = lcFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  lcFilter.page = Math.min(Math.max(1, lcFilter.page), totalPages);
  const start = (lcFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'LC No. / Type', 'Buyer / Issuing Bank', 'Expiry / Status', 'LC Value', 'Utilized / Balance', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i >= 4 || i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((l, i) => lcRow(l, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No LC records match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
      <p class="text-helper text-muted">${all.length ? `Showing ${start + 1} to ${Math.min(start + COA_PAGE_SIZE, all.length)} of ${all.length} entries` : 'No entries'}</p>
      ${finPager('lcpage', lcFilter.page, totalPages)}
    </div>`;
}

function lcCounterText() {
  return `${lcFiltered().length} of ${lcRecords.length} record${lcRecords.length === 1 ? '' : 's'}`;
}

function renderLcExportFinance(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="lcSummary">${lcSummaryCards()}</div>
      ${lcFilterBar()}
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
        <div class="flex flex-wrap items-start justify-between gap-3 p-4">
          <div>
            <h3 class="text-section-title text-primary">LC &amp; Export Finance Register</h3>
            <p id="lcCounter" class="text-helper text-muted mt-0.5">${lcCounterText()}</p>
          </div>
          <button type="button" id="lcNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New LC Record</button>
        </div>
        <div id="lcResults">${lcResultsHtml()}</div>
      </section>
    </div>`;
  lcBindEvents(container);
}

function lcRefresh(container, withSummary) {
  container.querySelector('#lcResults').innerHTML = lcResultsHtml();
  container.querySelector('#lcCounter').textContent = lcCounterText();
  if (withSummary) {
    container.querySelector('#lcSummary').innerHTML = lcSummaryCards();
    // A new issuing bank may have appeared, or the last LC for one may be gone.
    const bankSel = container.querySelector('#lcBankFilter');
    const banks = lcBankOptions();
    if (lcFilter.bank !== 'All Banks' && !banks.includes(lcFilter.bank)) lcFilter.bank = 'All Banks';
    bankSel.innerHTML = ['All Banks', ...banks].map(v => `<option value="${escapeHtml(v)}" ${v === lcFilter.bank ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  }
}

function lcBindEvents(container) {
  const bind = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { lcFilter[key] = e.target.value; lcFilter.page = 1; lcRefresh(container); });
  bind('lcSearch', 'q', 'input');
  bind('lcTypeFilter', 'lcType', 'change');
  bind('lcBankFilter', 'bank', 'change');
  bind('lcStatusFilter', 'status', 'change');

  container.querySelector('#lcNew').addEventListener('click', () => lcOpenNewModal(container));

  container.querySelector('#lcResults').addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-lcpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(lcFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.lcpage;
      lcFilter.page = p === 'prev' ? Math.max(1, lcFilter.page - 1) : p === 'next' ? Math.min(totalPages, lcFilter.page + 1) : +p;
      lcRefresh(container);
      return;
    }
    const utilBtn = e.target.closest('[data-lc-utilize]');
    if (utilBtn) { lcOpenUtilizeModal(utilBtn.dataset.lcUtilize, container); return; }
    const removeBtn = e.target.closest('[data-lc-remove]');
    if (removeBtn) {
      const i = lcRecords.findIndex(l => l.lcNo === removeBtn.dataset.lcRemove);
      if (i > -1) lcRecords.splice(i, 1);
      lcRefresh(container, true);
    }
  });
}

// LC no., type, issuing bank, buyer, value, currency and the three dates are what a bank or
// auditor expects on file; advising bank, contract ref and ports are supporting detail.
function lcOpenNewModal(container) {
  const today = new Date().toISOString().slice(0, 10);
  finOpenModal({
    id: 'lcNewModal', title: 'New LC / Export Finance Record', icon: 'doc', wide: true, submitLabel: 'Save Record',
    body: [
      finFormField('LC Number', 'lcNo', { req: true, placeholder: 'e.g. 0123456789012006' }),
      finFormField('LC Type', 'lcType', { options: LC_TYPES }),
      finFormField('Issuing Bank', 'issuingBank', { req: true, placeholder: 'e.g. HSBC Bangladesh' }),
      finFormField('Advising Bank (optional)', 'advisingBank', { placeholder: 'e.g. City Bank PLC' }),
      finFormField('Buyer / Applicant', 'buyer', { req: true, placeholder: 'e.g. Everest Apparels Ltd.' }),
      finFormField('Sales Contract / PO Ref. (optional)', 'contractRef', { placeholder: 'e.g. SC-4471' }),
      finFormField('LC Amount', 'amount', { type: 'number', req: true, placeholder: '0.00' }),
      finFormField('Currency', 'currency', { options: LC_CURRENCIES, value: 'USD' }),
      finFormField('Partial Shipment', 'partialShipment', { options: LC_SHIPMENT_OPTIONS }),
      finFormField('Issue Date', 'issueDate', { type: 'date', value: today }),
      finFormField('Expiry Date', 'expiryDate', { type: 'date', value: today }),
      finFormField('Latest Shipment Date', 'latestShipmentDate', { type: 'date', value: today }),
      finFormField('Port of Loading (optional)', 'portOfLoading', { placeholder: 'e.g. Chattogram' }),
      finFormField('Port of Discharge (optional)', 'portOfDischarge', { placeholder: 'e.g. Rotterdam' }),
    ].join(''),
    onSubmit(form) {
      const v = (n) => finFormVal(form, n);
      const amount = Number(v('amount')) || 0;
      if (!v('lcNo')) return 'Enter the LC number.';
      if (lcRecords.some(l => l.lcNo === v('lcNo'))) return `LC ${v('lcNo')} is already on file.`;
      if (!v('issuingBank')) return 'Enter the issuing bank.';
      if (!v('buyer')) return 'Enter the buyer / applicant.';
      if (amount <= 0) return 'Enter an LC amount greater than zero.';
      if (!v('issueDate') || !v('expiryDate') || !v('latestShipmentDate')) return 'Enter the issue, expiry and latest shipment dates.';
      if (v('expiryDate') < v('issueDate')) return 'Expiry date cannot be before the issue date.';
      if (v('latestShipmentDate') > v('expiryDate')) return 'Latest shipment date cannot be after the expiry date.';
      lcRecords.push({
        lcNo: v('lcNo'), lcType: v('lcType'), issuingBank: v('issuingBank'), advisingBank: v('advisingBank'),
        buyer: v('buyer'), contractRef: v('contractRef'), amount, currency: v('currency'),
        issueDate: v('issueDate'), expiryDate: v('expiryDate'), latestShipmentDate: v('latestShipmentDate'),
        portOfLoading: v('portOfLoading'), portOfDischarge: v('portOfDischarge'), partialShipment: v('partialShipment'), utilized: 0,
      });
      lcFilter.page = Math.ceil(lcFiltered().length / COA_PAGE_SIZE);
      lcRefresh(container, true);
    },
  });
}

function lcOpenUtilizeModal(lcNo, container) {
  const l = lcRecords.find(x => x.lcNo === lcNo);
  if (!l) return;
  const balance = lcBalance(l);
  finOpenModal({
    id: 'lcUtilizeModal', title: `Record Utilization — ${l.lcNo}`, icon: 'doc', submitLabel: 'Record Utilization',
    intro: `${escapeHtml(l.buyer)} — available balance <span class="text-primary font-semibold tabular">${escapeHtml(l.currency)} ${coaMoney(balance)}</span>`,
    body: finFormField(`Utilization Amount (${l.currency})`, 'amount', { type: 'number', req: true, value: balance }),
    onSubmit(form) {
      const amount = Number(finFormVal(form, 'amount')) || 0;
      if (amount <= 0 || amount > balance + 0.005) return `Enter an amount between 0 and ${l.currency} ${coaMoney(balance)}.`;
      l.utilized = (l.utilized || 0) + amount;
      lcRefresh(container, true);
    },
  });
}

// ---------- Audit ----------
// Content ported from the Finance reference build: one home for audit findings raised against any
// Finance area (internal, external, statutory, VAT or tax audits), plus an on-demand report
// generator that summarises the live data already on file in VAT & Tax, Budget Management,
// Cash & Bank and LC & Export Finance.
const AUDIT_AREAS = ['Chart of Accounts', 'Voucher Management', 'Accounts Payable & Receivable', 'Cash & Bank', 'VAT & Tax', 'LC & Export Finance', 'Budget Management', 'Financial Statements'];
const AUDIT_TYPES = ['Internal Audit', 'External Audit', 'Statutory Audit', 'VAT Audit', 'Tax Audit'];
const AUDIT_RISK_LEVELS = ['Low', 'Medium', 'High'];
const AUDIT_STATUSES = ['Open', 'In Progress', 'Resolved', 'Closed'];
const AUDIT_REPORT_TYPES = [
  { key: 'vat', label: 'VAT & Tax Summary' },
  { key: 'budget', label: 'Budget Variance Summary' },
  { key: 'cashbank', label: 'Cash & Bank Position' },
  { key: 'lc', label: 'LC & Export Finance Summary' },
  { key: 'findings', label: 'Audit Findings Summary' },
];

const auditFindings = [
  { auditRef: 'AUD-0001', area: 'VAT & Tax', auditType: 'VAT Audit', auditorName: 'NBR VAT Circle Team', date: '2026-06-20', observation: 'Two Mushak 6.3 tax invoices were on file without the buyer’s BIN recorded.', riskLevel: 'Medium', status: 'In Progress', recommendation: 'Make the buyer BIN field mandatory before a Mushak 6.3 can be saved, with an explicit unregistered-buyer override.', followUpDate: '2026-07-15' },
  { auditRef: 'AUD-0002', area: 'Cash & Bank', auditType: 'Internal Audit', auditorName: 'Internal Audit Dept.', date: '2026-05-10', observation: 'Factory Floor Petty Cash account has shown a nil balance for over a month with no replenishment entry.', riskLevel: 'Low', status: 'Resolved', recommendation: 'Replenish the petty cash float and set a minimum-balance alert.', followUpDate: '2026-05-25' },
  { auditRef: 'AUD-0003', area: 'Budget Management', auditType: 'Internal Audit', auditorName: 'Internal Audit Dept.', date: '2026-07-05', observation: 'Sample & Development budget line was exceeded without a prior approval addendum on file.', riskLevel: 'High', status: 'Open', recommendation: 'Require an approval addendum before actual spend can exceed the budgeted amount on a line.', followUpDate: '2026-07-20' },
];

const auditFilter = { q: '', area: 'All Areas', risk: 'All Risk Levels', status: 'All Statuses', page: 1 };
const auditReport = { type: 'vat', from: '', to: '', generated: false };

function auditNextRef() {
  const max = auditFindings.reduce((m, a) => Math.max(m, parseInt((a.auditRef.split('-')[1] || '0'), 10) || 0), 0);
  return `AUD-${String(max + 1).padStart(4, '0')}`;
}

function auditInRange(dateStr, from, to) {
  if (!dateStr) return true;
  if (from && dateStr < from) return false;
  if (to && dateStr > to) return false;
  return true;
}

function auditFiltered() {
  const q = auditFilter.q.trim().toLowerCase();
  return auditFindings.filter(a => {
    if (q && !(a.auditRef.toLowerCase().includes(q) || a.observation.toLowerCase().includes(q) || a.area.toLowerCase().includes(q))) return false;
    if (auditFilter.area !== 'All Areas' && a.area !== auditFilter.area) return false;
    if (auditFilter.risk !== 'All Risk Levels' && a.riskLevel !== auditFilter.risk) return false;
    if (auditFilter.status !== 'All Statuses' && a.status !== auditFilter.status) return false;
    return true;
  });
}

function auditRiskPill(risk) {
  return finPill(risk, { Low: 'success', Medium: 'warning', High: 'danger' }[risk], true);
}

const AUDIT_STATUS_TEXT = { Open: 'text-danger', 'In Progress': 'text-warning', Resolved: 'text-info', Closed: 'text-secondary' };

function auditSummaryCards() {
  const unresolved = (a) => a.status === 'Open' || a.status === 'In Progress';
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(AP_AR_ICON_OUTSTANDING, auditFindings.length, 'Total Findings Logged')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, auditFindings.filter(unresolved).length, 'Open / In Progress')}
      ${coaCashBankStatCard(AP_AR_ICON_OVERDUE, auditFindings.filter(a => a.riskLevel === 'High' && unresolved(a)).length, 'Unresolved High Risk')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, auditFindings.filter(a => !unresolved(a)).length, 'Resolved / Closed')}
    </div>`;
}

// ---- Report Generator: a point-in-time summary computed from each area's live data ----
function auditReportRow(label, value) {
  return `<tr class="border-b border-side-line last:border-b-0"><td class="py-1.5 pr-6 fs-base text-secondary">${escapeHtml(label)}</td><td class="py-1.5 fs-base text-primary font-semibold text-right tabular whitespace-nowrap">${escapeHtml(String(value))}</td></tr>`;
}

function auditReportHtml() {
  const r = auditReport;
  const rangeNote = (r.from || r.to) ? ` for ${r.from ? coaFormatDateDisplay(r.from) : 'the start'} to ${r.to ? coaFormatDateDisplay(r.to) : 'today'}` : ' (all dates on file)';
  const bdt = (n) => `BDT ${coaInt(Math.round(n))}`;
  let title, note, rows;

  if (r.type === 'vat') {
    const list = vatInvoices.filter(v => v.status === 'Issued' && auditInRange(v.issueDate, r.from, r.to));
    let taxable = 0, vat = 0;
    list.forEach(v => { const c = vatCalc(v); taxable += c.taxable; vat += c.vatAmount; });
    title = 'VAT & Tax Summary'; note = `Mushak 6.3 invoices issued${rangeNote}`;
    rows = [['Mushak 6.3 Invoices Issued', list.length], ['Total Taxable Value', bdt(taxable)], ['Total Output VAT', bdt(vat)], ['Total Invoice Value', bdt(taxable + vat)]];
  } else if (r.type === 'budget') {
    const list = budgetRecords.filter(b => (!r.to || b.startDate <= r.to) && (!r.from || b.endDate >= r.from));
    let budgeted = 0, spent = 0, over = 0;
    list.forEach(b => { budgeted += b.budgetedAmount || 0; spent += b.actualSpent || 0; if (budgetSpendStatus(b) === 'Over Budget') over += 1; });
    title = 'Budget Variance Summary'; note = `Budget lines active${rangeNote}`;
    rows = [['Budget Lines', list.length], ['Total Budgeted', bdt(budgeted)], ['Total Actual Spend', bdt(spent)], ['Remaining Balance', bdt(budgeted - spent)], ['Lines Over Budget', over]];
  } else if (r.type === 'cashbank') {
    const by = {};
    coaCashBankAccounts.forEach(c => { by[c.currency] = (by[c.currency] || 0) + (c.currentBalance || 0); });
    title = 'Cash & Bank Position'; note = 'Snapshot as of today — not affected by the date range';
    rows = [['Accounts on File', coaCashBankAccounts.length], ['Active Accounts', coaCashBankAccounts.filter(c => c.status === 'Active').length], ...Object.keys(by).map(cur => [`Balance (${cur})`, coaInt(by[cur])])];
  } else if (r.type === 'lc') {
    const list = lcRecords.filter(l => auditInRange(l.issueDate, r.from, r.to));
    title = 'LC & Export Finance Summary'; note = `Letters of Credit issued${rangeNote}`;
    rows = [['LCs on File', list.length], ['Total LC Value', lcTotalsText(l => l.amount || 0, list)], ['Total Utilized', lcTotalsText(l => l.utilized || 0, list)], ['Available Balance', lcTotalsText(lcBalance, list)], ['Expiring in 30 Days', list.filter(l => lcBalance(l) > 0 && lcDaysToExpiry(l) >= 0 && lcDaysToExpiry(l) <= 30).length]];
  } else {
    const list = auditFindings.filter(a => auditInRange(a.date, r.from, r.to));
    title = 'Audit Findings Summary'; note = `Findings logged${rangeNote}`;
    rows = [['Total Findings', list.length], ...AUDIT_STATUSES.map(s => [s, list.filter(a => a.status === s).length]), ...AUDIT_RISK_LEVELS.map(s => [`${s} Risk`, list.filter(a => a.riskLevel === s).length])];
  }
  return `
    <div class="p-4 border-t border-side-line">
      <h4 class="text-body-medium text-primary">Report: ${escapeHtml(title)}</h4>
      <p class="text-helper text-muted mt-0.5 mb-2.5">${escapeHtml(note)}</p>
      <table class="w-full max-w-md">${rows.map(([l, v]) => auditReportRow(l, v)).join('')}</table>
    </div>`;
}

function auditResultsHtml() {
  const all = auditFiltered();
  const totalPages = Math.max(1, Math.ceil(all.length / COA_PAGE_SIZE));
  auditFilter.page = Math.min(Math.max(1, auditFilter.page), totalPages);
  const start = (auditFilter.page - 1) * COA_PAGE_SIZE;
  const rows = all.slice(start, start + COA_PAGE_SIZE);
  const headers = ['SL', 'Audit Ref. / Date', 'Area / Type', 'Observation', 'Risk / Follow-up', 'Status', 'Actions'];
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[900px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i === headers.length - 1 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.length ? rows.map((a, i) => auditRow(a, start + i + 1)).join('') : `<tr><td colspan="7" class="px-4 py-10 text-center"><p class="text-body text-muted">No audit findings match your filters.</p></td></tr>`}</tbody>
      </table>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-side-line">

}

function auditCounterText() {
  return `${auditFiltered().length} of ${auditFindings.length} finding${auditFindings.length === 1 ? '' : 's'}`;
}

function renderFinanceAudit(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      <div id="auditSummary">${auditSummaryCards()}</div>
      ${auditReportCard()}
      ${auditFilterBar()}
      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
        <div class="flex flex-wrap items-start justify-between gap-3 p-4">
          <div>
            <h3 class="text-section-title text-primary">Audit Findings Register</h3>
            <p id="auditCounter" class="text-helper text-muted mt-0.5">${auditCounterText()}</p>
          </div>
          <button type="button" id="auditNew" class="${COA_BTN_PRIMARY}">${COA_PLUS_ICON}New Audit Finding</button>
        </div>
        <div id="auditResults">${auditResultsHtml()}</div>
      </section>
    </div>`;
  auditBindEvents(container);
}

function auditRefresh(container, withSummary) {
  container.querySelector('#auditResults').innerHTML = auditResultsHtml();
  container.querySelector('#auditCounter').textContent = auditCounterText();
  if (withSummary) container.querySelector('#auditSummary').innerHTML = auditSummaryCards();
  // The findings summary report reads this same list, so keep it current once generated.
  if (withSummary && auditReport.generated) container.querySelector('#auditReportOut').innerHTML = auditReportHtml();
}

function auditBindEvents(container) {
  const bind = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { auditFilter[key] = e.target.value; auditFilter.page = 1; auditRefresh(container); });
  bind('auditSearch', 'q', 'input');
  bind('auditAreaFilter', 'area', 'change');
  bind('auditRiskFilter', 'risk', 'change');
  bind('auditStatusFilter', 'status', 'change');

  container.querySelector('#auditNew').addEventListener('click', () => auditOpenNewModal(container));

  container.querySelector('#auditReportGenerate').addEventListener('click', () => {
    auditReport.type = container.querySelector('#auditReportType').value;
    auditReport.from = container.querySelector('#auditReportFrom').value;
    auditReport.to = container.querySelector('#auditReportTo').value;
    auditReport.generated = true;
    container.querySelector('#auditReportOut').innerHTML = auditReportHtml();
  });

  const results = container.querySelector('#auditResults');
  results.addEventListener('click', (e) => {
    const pageBtn = e.target.closest('[data-auditpage]');
    if (pageBtn && !pageBtn.disabled) {
      const totalPages = Math.max(1, Math.ceil(auditFiltered().length / COA_PAGE_SIZE));
      const p = pageBtn.dataset.auditpage;
      auditFilter.page = p === 'prev' ? Math.max(1, auditFilter.page - 1) : p === 'next' ? Math.min(totalPages, auditFilter.page + 1) : +p;
      auditRefresh(container);
      return;
    }
    const removeBtn = e.target.closest('[data-audit-remove]');
    if (removeBtn) {
      const i = auditFindings.findIndex(a => a.auditRef === removeBtn.dataset.auditRemove);
      if (i > -1) auditFindings.splice(i, 1);
      auditRefresh(container, true);
    }
  });
  results.addEventListener('change', (e) => {
    if (!e.target.dataset.auditStatus) return;
    const a = auditFindings.find(x => x.auditRef === e.target.dataset.auditStatus);
    if (a) a.status = e.target.value;
    auditRefresh(container, true);
  });
}

function auditOpenNewModal(container) {
  const today = new Date().toISOString().slice(0, 10);
  finOpenModal({
    id: 'auditNewModal', title: 'New Audit Finding', icon: 'doc', wide: true, submitLabel: 'Save Finding',
    body: [
      finFormField('Audit Ref.', 'ref', { value: auditNextRef(), readonly: true }),
      finFormField('Area', 'area', { options: AUDIT_AREAS }),
      finFormField('Audit Type', 'auditType', { options: AUDIT_TYPES }),
      finFormField('Auditor Name', 'auditor', { req: true, placeholder: 'e.g. Internal Audit Dept.' }),
      finFormField('Date', 'date', { type: 'date', value: today }),
      finFormField('Risk Level', 'risk', { options: AUDIT_RISK_LEVELS }),
      finFormField('Status', 'status', { options: AUDIT_STATUSES }),
      finFormField('Follow-up Date (optional)', 'followUp', { type: 'date' }),
      finFormField('Observation / Finding', 'observation', { textarea: true, span: true, req: true, placeholder: 'What was found during the audit' }),
      finFormField('Recommendation (optional)', 'recommendation', { textarea: true, span: true, placeholder: 'Corrective action recommended' }),
    ].join(''),
    onSubmit(form) {
      const v = (n) => finFormVal(form, n);
      if (!v('auditor')) return 'Enter the auditor name.';
      if (!v('date')) return 'Enter the audit date.';
      if (!v('observation')) return 'Describe what was found.';
      if (v('followUp') && v('followUp') < v('date')) return 'Follow-up date cannot be before the audit date.';
      auditFindings.push({
        auditRef: auditNextRef(), area: v('area'), auditType: v('auditType'), auditorName: v('auditor'), date: v('date'),
        observation: v('observation'), riskLevel: v('risk'), status: v('status'), recommendation: v('recommendation'), followUpDate: v('followUp'),
      });
      auditFilter.page = Math.ceil(auditFiltered().length / COA_PAGE_SIZE);
      auditRefresh(container, true);
    },
  });
}

// ---------- Financial Statements ----------
// Content ported from the Finance reference build: Trial Balance, General Ledger, Profit & Loss
// and Balance Sheet, all computed from the account lines saved by every posted Journal Entry and
// voucher (coaJournalEntries). Nothing here is stored — each tab is recomputed from the ledger.
const FS_TABS = ['Trial Balance', 'General Ledger', 'Profit & Loss', 'Balance Sheet'];
const fsState = { ledgerAccount: '' };

function fsBalances() {
  const by = {};
  coaJournalEntries.forEach(e => e.lines.forEach(l => {
    const x = by[l.account] || (by[l.account] = { debit: 0, credit: 0 });
    x.debit += l.debit; x.credit += l.credit;
  }));
  return by;
}

// Net balance on the account's normal side (debit-normal: Dr − Cr; credit-normal: Cr − Dr). A
// contra account (e.g. Accumulated Depreciation) simply comes out negative.
function fsNet(acc, by) {
  const x = by[acc.code] || { debit: 0, credit: 0 };
  return acc.normal === 'debit' ? x.debit - x.credit : x.credit - x.debit;
}

function fsSection(catKey, by) {
  const rows = coaAllAccounts().filter(a => a.cat === catKey).map(a => ({ code: a.code, name: a.name, amount: fsNet(a, by) })).filter(r => Math.abs(r.amount) > 0.004);
  return { rows, total: rows.reduce((s, r) => s + r.amount, 0) };
}

// Signed BDT amount with a true minus sign, used wherever a total can go negative.
function fsMoney(n) { return `${n < -0.004 ? '−' : ''}${coaMoney(Math.abs(n))}`; }

function fsBalancedPill(ok) { return finPill(ok ? 'Balanced' : 'Not balanced', ok ? 'success' : 'danger'); }

function fsEmptyCard(what) {

}

function fsTableHead(cols) {

}

function fsAmountRows(rows, emptyText) {

    </tr>`).join('') : `<tr><td colspan="3" class="px-4 py-6 text-center fs-base text-muted">${emptyText}</td></tr>`;
}

function fsSectionCard(title, section, totalLabel, emptyText) {

      </div>
      <div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-side-line">
        <p class="text-body-medium text-secondary">${escapeHtml(totalLabel)}</p>
        <p class="fs-title font-semibold text-primary tabular">BDT ${fsMoney(section.total)}</p>
      </div>
    </section>`;
}

function fsTrialHtml() {
  const by = fsBalances();
  let totalDr = 0, totalCr = 0;
  const rows = [];
  coaAllAccounts().forEach(a => {
    const x = by[a.code];
    if (!x) return;
    const net = x.debit - x.credit;
    if (Math.abs(net) < 0.005) return;
    const dr = net > 0 ? net : 0, cr = net < 0 ? -net : 0;
    totalDr += dr; totalCr += cr;
    rows.push(`
      <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
        <td class="pl-4 pr-2 py-2 fs-base text-secondary whitespace-nowrap tabular">${escapeHtml(a.code)}</td>
        <td class="px-3 py-2 fs-base text-primary">${escapeHtml(a.name)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap">${escapeHtml(a.catLabel)}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${dr ? coaMoney(dr) : ''}</td>
        <td class="pr-4 pl-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${cr ? coaMoney(cr) : ''}</td>
      </tr>`);
  });
  if (!rows.length) return fsEmptyCard('balances');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="p-4">
        <h3 class="text-section-title text-primary">Trial Balance</h3>
        <p class="text-helper text-muted mt-0.5">${rows.length} account${rows.length === 1 ? '' : 's'} with a balance</p>
      </div>
      <div class="overflow-x-auto border-t border-side-line">
        <table class="w-full min-w-[640px]">${fsTableHead([['Code'], ['Account'], ['Category'], ['Debit (BDT)', true], ['Credit (BDT)', true]])}<tbody>${rows.join('')}</tbody></table>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-8 px-4 py-3.5 border-t border-side-line">
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Debit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalDr)}</p></div>
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Credit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalCr)}</p></div>
        ${fsBalancedPill(Math.abs(totalDr - totalCr) < 0.005)}
      </div>
    </section>`;
}

function fsLedgerHtml() {
  const selected = fsState.ledgerAccount || coaAccountList()[0];
  const acc = coaFindAccount(selected);
  const lines = [];
  coaJournalEntries.forEach((e, idx) => e.lines.forEach(l => { if (acc && l.account === acc.code) lines.push({ e, l, idx }); }));
  lines.sort((a, b) => (a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.idx - b.idx));
  let running = 0, totalDr = 0, totalCr = 0;
  const rows = lines.map(({ e, l }) => {
    running += acc.normal === 'debit' ? l.debit - l.credit : l.credit - l.debit;
    totalDr += l.debit; totalCr += l.credit;
    return `
      <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
        <td class="pl-4 pr-2 py-2 fs-base text-secondary whitespace-nowrap tabular">${coaFormatDateDisplay(e.date)}</td>
        <td class="px-3 py-2 fs-base font-medium text-primary whitespace-nowrap tabular">${escapeHtml(e.ref)}</td>
        <td class="px-3 py-2 fs-base text-secondary">${escapeHtml(e.memo)}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${l.debit ? coaMoney(l.debit) : ''}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap tabular text-right">${l.credit ? coaMoney(l.credit) : ''}</td>
        <td class="pr-4 pl-3 py-2 fs-base font-semibold text-primary whitespace-nowrap tabular text-right">${fsMoney(running)}</td>
      </tr>`;
  });
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="max-w-sm">${coaField('Account', `<select id="fsLedgerAccount" class="${COA_INPUT}">${coaAccountOptionsHtml(selected)}</select>`)}</div>
    </section>
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="p-4">
        <h3 class="text-section-title text-primary">General Ledger — ${escapeHtml(selected)}</h3>
        <p class="text-helper text-muted mt-0.5">${lines.length} entr${lines.length === 1 ? 'y' : 'ies'} · normal balance: ${acc ? acc.normal : 'debit'}</p>
      </div>
      <div class="overflow-x-auto border-t border-side-line">
        <table class="w-full min-w-[760px]">${fsTableHead([['Date'], ['Voucher'], ['Memo'], ['Debit (BDT)', true], ['Credit (BDT)', true], ['Balance (BDT)', true]])}
          <tbody>${rows.length ? rows.join('') : `<tr><td colspan="6" class="px-4 py-10 text-center fs-base text-muted">No entries posted to ${escapeHtml(selected)} yet.</td></tr>`}</tbody>
        </table>
      </div>
      ${rows.length ? `
      <div class="flex flex-wrap items-center justify-end gap-8 px-4 py-3.5 border-t border-side-line">
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Debit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalDr)}</p></div>
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Total Credit</p><p class="fs-title font-semibold text-primary tabular">BDT ${coaMoney(totalCr)}</p></div>
        <div class="text-right"><p class="text-micro text-muted mb-0.5">Closing Balance</p><p class="fs-title font-semibold text-primary tabular">BDT ${fsMoney(running)}</p></div>
      </div>` : ''}
    </section>`;
}

function fsIncome(by) {
  const rev = fsSection('revenue', by), exp = fsSection('expense', by);
  return { rev, exp, net: rev.total - exp.total };
}

function fsPlHtml() {
  const by = fsBalances();
  const { rev, exp, net } = fsIncome(by);
  if (!rev.rows.length && !exp.rows.length) return fsEmptyCard('the Profit & Loss statement');
  return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, coaMoney(rev.total), 'Total Revenue (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, coaMoney(exp.total), 'Total Expenses (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, fsMoney(net), net >= 0 ? 'Net Profit (BDT)' : 'Net Loss (BDT)')}
    </div>
    ${fsSectionCard('Revenue', rev, 'Total Revenue', 'No revenue posted yet.')}
    ${fsSectionCard('Expenses', exp, 'Total Expenses', 'No expenses posted yet.')}`;
}

function fsBsHtml() {
  const by = fsBalances();
  const assets = fsSection('asset', by), liab = fsSection('liability', by), eq = fsSection('equity', by);
  if (!assets.rows.length && !liab.rows.length && !eq.rows.length && !fsIncome(by).rev.rows.length && !fsIncome(by).exp.rows.length) return fsEmptyCard('the Balance Sheet');
  const earnings = fsIncome(by).net;
  const totalEquity = eq.total + earnings;
  const balanced = Math.abs(assets.total - (liab.total + totalEquity)) < 0.005;
  const equityWithEarnings = { rows: [...eq.rows, { code: '—', name: 'Current Year Earnings', amount: earnings }], total: totalEquity };
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${coaCashBankStatCard(COA_CASHBANK_STAT_TOTAL_ICON, fsMoney(assets.total), 'Total Assets (BDT)')}
      ${coaCashBankStatCard(AP_AR_ICON_OUTSTANDING, fsMoney(liab.total), 'Total Liabilities (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_CASH_ICON, fsMoney(totalEquity), 'Total Equity (BDT)')}
      ${coaCashBankStatCard(COA_CASHBANK_STAT_ACTIVE_ICON, balanced ? 'Balanced' : 'Not balanced', 'Assets = Liabilities + Equity')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
      ${fsSectionCard('Assets', assets, 'Total Assets', 'No assets posted yet.')}
      <div class="space-y-4">
        ${fsSectionCard('Liabilities', liab, 'Total Liabilities', 'No liabilities posted yet.')}
        ${fsSectionCard('Equity', equityWithEarnings, 'Total Equity', 'No equity posted yet.')}
      </div>
    </div>`;
}

function renderFinancialStatements(tabsEl, container) {
  tabsEl.classList.remove('hidden');
  tabsEl.innerHTML = `
    <div class="flex items-center gap-1 -mb-px pb-px overflow-x-auto overflow-y-hidden">
      ${FS_TABS.map((t, i) => `
        <button type="button" data-fstab="${i}" class="px-3.5 py-2.5 text-label font-semibold border-b-2 whitespace-nowrap -mb-px ${i === state.tabIndex ? 'border-side-accent text-side-accent' : 'border-transparent text-muted hover:text-secondary'}">${escapeHtml(t)}</button>
      `).join('')}
    </div>`;
  tabsEl.querySelectorAll('[data-fstab]').forEach(btn => {
    btn.addEventListener('click', () => { state.tabIndex = +btn.dataset.fstab; renderFinancialStatements(tabsEl, container); });
  });
  document.getElementById('page-actions').innerHTML = '';

  const panels = [fsTrialHtml, fsLedgerHtml, fsPlHtml, fsBsHtml];
  container.innerHTML = `<div class="space-y-4 pb-8">${panels[state.tabIndex]()}</div>`;
  const sel = container.querySelector('#fsLedgerAccount');
  if (sel) sel.addEventListener('change', (e) => { fsState.ledgerAccount = e.target.value; renderFinancialStatements(tabsEl, container); });
}

// ---------- Command palette ----------
const cmdk = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const cmdkCount = document.getElementById('cmdkCount');
let cmdkResults = [];
let cmdkCursor = 0;
let lastFocused = null;

function scoreEntry(e, q) {
  const i = e.hay.indexOf(q);
  if (i !== -1) return (i === 0 ? 1000 : e.hay[i - 1] === ' ' ? 800 : 500) - i;
  let qi = 0;                                   // subsequence fallback: "pom" -> "PrOduction Management"
  for (let c = 0; c < e.hay.length && qi < q.length; c++) if (e.hay[c] === q[qi]) qi++;
  return qi === q.length ? 100 - e.hay.length / 10 : -1;
}

function renderCmdkList() {
  if (!cmdkResults.length) {
    cmdkList.innerHTML = `<p class="px-4 py-6 text-center text-body text-muted">No screens match that search.</p>`;
    cmdkCount.textContent = '';
    return;
  }
  cmdkList.innerHTML = cmdkResults.map((e, i) => `
    <button role="option" aria-selected="${i === cmdkCursor}" data-i="${i}"
      class="cmdk-row w-full flex items-center gap-2.5 px-3.5 py-2 text-left ${i === cmdkCursor ? 'bg-side-hover' : ''}">
      ${iconSvg(e.icon, 'w-4 h-4 shrink-0 ' + (i === cmdkCursor ? 'text-side-accent' : 'text-muted'))}
      <span class="text-body-medium text-primary truncate">${escapeHtml(e.title)}</span>
      ${e.context ? `<span class="text-helper text-disabled truncate ml-auto shrink-0">${escapeHtml(e.context)}</span>` : ''}
    </button>
  `).join('');
  cmdkCount.textContent = `${cmdkResults.length} of ${pageIndex.length}`;
  cmdkList.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

function updateCmdk() {
  const q = cmdkInput.value.trim().toLowerCase();
  cmdkResults = !q
    ? pageIndex.slice(0, 40)
    : pageIndex.map(e => ({ e, s: scoreEntry(e, q) })).filter(x => x.s >= 0)
        .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.e);
  cmdkCursor = 0;
  renderCmdkList();
}

function openCmdk() {
  lastFocused = document.activeElement;
  cmdk.classList.remove('hidden');
  cmdkInput.value = '';
  updateCmdk();
  cmdkInput.focus();
}

function closeCmdk() {
  cmdk.classList.add('hidden');
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

function commitCmdk() {
  const pick = cmdkResults[cmdkCursor];
  if (!pick) return;
  closeCmdk();
  goTo(pick.moduleKey, pick.subIndex);
}

cmdkInput.addEventListener('input', updateCmdk);
document.getElementById('cmdkBackdrop').addEventListener('click', closeCmdk);
document.getElementById('searchTrigger').addEventListener('click', openCmdk);

cmdkList.addEventListener('mousemove', (e) => {
  const row = e.target.closest('[data-i]');
  if (row && +row.dataset.i !== cmdkCursor) { cmdkCursor = +row.dataset.i; renderCmdkList(); }
});
cmdkList.addEventListener('click', (e) => {
  const row = e.target.closest('[data-i]');
  if (row) { cmdkCursor = +row.dataset.i; commitCmdk(); }
});

cmdk.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdkCursor = Math.min(cmdkCursor + 1, cmdkResults.length - 1); renderCmdkList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkCursor = Math.max(cmdkCursor - 1, 0); renderCmdkList(); }
  else if (e.key === 'Enter') { e.preventDefault(); commitCmdk(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
});

// ---------- Theme ----------
function applyThemeIcon(theme) {
  document.getElementById('themeIconSun').classList.toggle('hidden', theme === 'dark');
  document.getElementById('themeIconMoon').classList.toggle('hidden', theme !== 'dark');
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('erp-theme'); } catch (e) { /* ignore */ }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  applyThemeIcon(theme);
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  applyThemeIcon(next);
  try { localStorage.setItem('erp-theme', next); } catch (e) { /* ignore */ }
});

if (/Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
  document.getElementById('searchKbd').textContent = '⌘K';
}

renderNav();
renderContent();
</script>
