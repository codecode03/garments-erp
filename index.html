      <div class="flex items-center justify-between gap-3 p-4">
        <h3 class="text-section-title text-primary">Purchase Orders</h3>
        <p id="poCounter" class="text-helper text-muted">${poCounterText()}</p>
      </div>
      <div id="poResults">${poResultsHtml()}</div>
    </section>`;
}

function renderProcurementPO(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${poStyleCard()}
      ${poSupplierTermsCard()}
      ${poLinesCard()}
      ${poFooterButtons()}
      ${poFilterBar()}
      ${poRecentCard()}
    </div>`;
  poBindEvents(container);
}

function poRefreshResults(container) {
  container.querySelector('#poResults').innerHTML = poResultsHtml();
  container.querySelector('#poCounter').textContent = poCounterText();
}

function poRefreshLines(container) {
  container.querySelector('#poLinesBody').innerHTML = poForm.lines.map(poLineRow).join('');
  container.querySelector('#poGrandTotal').textContent = `BDT ${coaMoney(poGrandTotal(poForm))}`;
}

function poValidateCommon() {
  if (!poForm.styleNo) return 'Select a Style No. before saving.';
  if (!poForm.supplier) return 'Select a supplier before saving.';
  return null;
}

function poBuildRecord() {
  return {
    styleNo: poForm.styleNo,
    product: (styStyles.find(s => s.style === poForm.styleNo) || {}).product || '',
    supplier: poForm.supplier,
    date: poForm.date,
    partial: poForm.partial,
    method: poForm.method,
    remarks: poForm.remarks.trim(),
    lines: poForm.lines
      .filter(l => l.product && coaNum(l.qty) > 0)
      .map(l => ({ product: l.product, spec: l.spec.trim(), unit: l.unit || procRawUnit(l.product), qty: coaNum(l.qty), price: coaNum(l.price), expectedDate: l.expectedDate, remarks: l.remarks.trim() })),
  };
}

function poBindEvents(container) {
  container.querySelectorAll('[data-pof]').forEach(el => {
    const handler = () => {
      poForm[el.dataset.pof] = el.value;
      if (el.dataset.pof === 'styleNo' || el.dataset.pof === 'method') renderProcurementPO(container);
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { poForm[el.dataset.pof] = el.value; });
  });

  const body = container.querySelector('#poLinesBody');
  body.addEventListener('input', (e) => {
    const row = e.target.closest('[data-line]');
    if (!row || !e.target.dataset.poline) return;
    poForm.lines[+row.dataset.line][e.target.dataset.poline] = e.target.value;
    if (e.target.dataset.poline === 'qty' || e.target.dataset.poline === 'price') {
      container.querySelector('#poGrandTotal').textContent = `BDT ${coaMoney(poGrandTotal(poForm))}`;
      row.children[6].textContent = coaMoney(coaNum(poForm.lines[+row.dataset.line].qty) * coaNum(poForm.lines[+row.dataset.line].price));
    }
  });
  body.addEventListener('change', (e) => {
    const row = e.target.closest('[data-line]');
    if (!row || !e.target.dataset.poline) return;
    poForm.lines[+row.dataset.line][e.target.dataset.poline] = e.target.value;
    if (e.target.dataset.poline === 'product') {
      poForm.lines[+row.dataset.line].unit = procRawUnit(e.target.value);
      poRefreshLines(container);
    }
  });
  body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-podel]');
    if (!btn) return;
    if (poForm.lines.length <= 1) return;
    poForm.lines.splice(+btn.dataset.podel, 1);
    poRefreshLines(container);
  });

  container.querySelector('#poAddLine').addEventListener('click', () => {
    poForm.lines.push(poBlankLine());
    poRefreshLines(container);
  });

  container.querySelector('#poResetBtn').addEventListener('click', () => {
    poResetForm();
    renderProcurementPO(container);
  });

  container.querySelector('#poDraftBtn').addEventListener('click', () => {
    const err = poValidateCommon();
    if (err) return poSetMsg(err, 'danger');
    const rec = poBuildRecord();
    if (poForm.editId) {
      const p = procurementPOs.find(x => x.id === poForm.editId);
      Object.assign(p, rec, { status: 'Draft' });
      poSetMsg(`Purchase order ${p.poNo} saved as draft.`, 'success');
    } else {
      const poNo = poNextNo();
      procurementPOs.unshift({ id: procurementPOs.reduce((m, x) => Math.max(m, x.id), 0) + 1, poNo, status: 'Draft', ...rec });
      poSetMsg(`Purchase order ${poNo} saved as draft.`, 'success');
    }
    poResetForm();
    renderProcurementPO(container);
  });

  container.querySelector('#poConfirmBtn').addEventListener('click', () => {
    const err = poValidateCommon();
    if (err) return poSetMsg(err, 'danger');
    if (!poForm.method) return poSetMsg('Select a payment method before confirming.', 'danger');
    const rec = poBuildRecord();
    if (!rec.lines.length) return poSetMsg('Add at least one raw product with a quantity before confirming.', 'danger');
    if (poForm.editId) {
      const p = procurementPOs.find(x => x.id === poForm.editId);
      Object.assign(p, rec, { status: 'Confirmed' });
      poSetMsg(`Purchase order ${p.poNo} confirmed.`, 'success');
    } else {
      const poNo = poNextNo();
      procurementPOs.unshift({ id: procurementPOs.reduce((m, x) => Math.max(m, x.id), 0) + 1, poNo, status: 'Confirmed', ...rec });
      poSetMsg(`Purchase order ${poNo} confirmed.`, 'success');
    }
    poResetForm();
    renderProcurementPO(container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { poFilter[key] = e.target.value; poRefreshResults(container); });
  bindFilter('poSearch', 'q', 'input');
  bindFilter('poStatusFilter', 'status', 'change');
  bindFilter('poMethodFilter', 'method', 'change');
  bindFilter('poSupplierFilter', 'supplier', 'change');

  container.querySelector('#poResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-po-edit]');
    if (editBtn) {
      const p = procurementPOs.find(x => x.id === +editBtn.dataset.poEdit);
      if (p) {
        Object.assign(poForm, {
          editId: p.id, styleNo: p.styleNo, supplier: p.supplier, date: p.date, partial: p.partial, method: p.method,
          remarks: p.remarks, lines: p.lines.map(l => ({ ...l })), msg: '', msgTone: 'muted',
        });
        renderProcurementPO(container);
      }
      return;
    }
    const cancelBtn = e.target.closest('[data-po-cancel]');
    if (cancelBtn) {
      const p = procurementPOs.find(x => x.id === +cancelBtn.dataset.poCancel);
      if (p) { p.status = 'Cancelled'; poRefreshResults(container); }
    }
  });
}

// ---------- Goods Receipt ----------
// Content ported from the Finance reference build's Goods Receipt Note page: receive a confirmed
// Purchase Order's raw products, in one delivery or several, against its remaining quantities.
// The warehouse picker reads from Inventory > Warehouse Management (warehouses, defined further
// down); Material Inventory derives its stock lines from these receipts.
const goodsReceipts = [];

const grnForm = {
  poId: '', date: new Date().toISOString().slice(0, 10), warehouse: '',
  location: '', batch: '', ref: '', remarks: '', receiving: {},
  msg: '', msgTone: 'muted',
};

const grnFilter = { q: '', supplier: 'All Suppliers', po: 'All POs', from: '', to: '' };

function grnOpenPOs() {
  return procurementPOs.filter(p => p.status === 'Confirmed' && poDeliveryStatus(p) !== 'Fully Received');
}

function grnFindPO(id) {
  return procurementPOs.find(p => String(p.id) === String(id)) || null;
}

function grnNextNo() {
  const max = goodsReceipts.reduce((m, g) => Math.max(m, parseInt(g.grnNo.split('-').pop(), 10) || 0), 0);
  return `GRN-${String(max + 1).padStart(6, '0')}`;
}

function grnLineReceivedSoFar(poNo, lineIndex) {
  return goodsReceipts.filter(g => g.poNo === poNo).reduce((s, g) => s + coaNum((g.lines[lineIndex] || {}).qty), 0);
}

function grnResetForm() {
  grnForm.poId = ''; grnForm.date = new Date().toISOString().slice(0, 10); grnForm.warehouse = (whActive()[0] || {}).name || '';
  grnForm.location = ''; grnForm.batch = ''; grnForm.ref = ''; grnForm.remarks = ''; grnForm.receiving = {};
  grnForm.msg = ''; grnForm.msgTone = 'muted';
}

function grnSetMsg(text, tone) {
  grnForm.msg = text || '';
  grnForm.msgTone = tone || 'muted';
  const el = document.getElementById('grnFormMsg');
  if (el) {
    el.textContent = grnForm.msg;
    el.className = `${grnForm.msg ? '' : 'hidden '}text-helper text-${grnForm.msgTone} mr-auto`;
  }
}

function grnItemsTable(po) {
  const rows = po.lines.map((l, i) => {
    const rec = grnLineReceivedSoFar(po.poNo, i);
    const remaining = Math.max(0, coaNum(l.qty) - rec);
    return `
      <tr class="border-b border-side-line last:border-b-0">
        <td class="pl-4 pr-2 py-2 fs-base text-primary">${escapeHtml(l.product)}<div class="text-helper text-muted">${escapeHtml(l.spec || '')}</div></td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(l.qty)} ${escapeHtml(l.unit)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(rec)}</td>
        <td class="px-3 py-2 fs-base font-semibold text-primary whitespace-nowrap tabular text-right">${coaMoney(remaining)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(l.price)}</td>
        <td class="pr-4 pl-3 py-2 min-w-[170px]">
          ${remaining <= 0 ? finPill('Complete', 'success', true) : `
          <div class="flex items-center gap-1.5">
            <input data-grnline="${i}" type="text" inputmode="decimal" value="${escapeHtml(grnForm.receiving[i] || '')}" class="${COA_INPUT} tabular text-right" />
            <button type="button" data-grnfill="${i}" class="h-8 px-2 rounded border border-side-border text-secondary fs-small font-semibold hover:bg-side-hover whitespace-nowrap">All</button>
          </div>`}
        </td>
      </tr>`;
  }).join('');
  return `
    <div class="overflow-x-auto border border-side-line rounded-md mt-3.5">
      <table class="w-full min-w-[760px]">
        <thead><tr class="border-b border-side-line bg-side-hover">
          <th class="pl-4 pr-2 py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">Raw Product</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Ordered</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Previously Received</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Remaining</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Price</th>
          <th class="pr-4 pl-3 py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">Receiving Now</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function grnHistoryTable(po) {
  const hist = goodsReceipts.filter(g => g.poNo === po.poNo);
  if (!hist.length) return `<p class="text-body text-muted mt-3.5">No receipts yet for this PO.</p>`;
  return `
    <div class="overflow-x-auto border border-side-line rounded-md mt-3.5">
      <table class="w-full min-w-[520px]">
        <thead><tr class="border-b border-side-line bg-side-hover">
          <th class="pl-4 pr-2 py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">Date</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">GRN</th>
          <th class="pr-4 pl-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Received</th>
        </tr></thead>
        <tbody>${hist.map(g => `
          <tr class="border-b border-side-line last:border-b-0">
            <td class="pl-4 pr-2 py-2 fs-base text-secondary whitespace-nowrap tabular">${escapeHtml(biFromISO(g.receiptDate) || g.receiptDate)}</td>
            <td class="px-3 py-2 fs-base font-medium text-primary whitespace-nowrap">${escapeHtml(g.grnNo)}</td>
            <td class="pr-4 pl-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(g.lines.reduce((s, l) => s + l.qty, 0))}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function grnFormCard() {
  const po = grnFindPO(grnForm.poId);
  const openPOs = grnOpenPOs();
  const info = po
    ? `<div class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3">
        ${prInfoItem('PO Number', po.poNo)}
        ${prInfoItem('Supplier', po.supplier)}
        ${prInfoItem('Style', po.styleNo)}
        ${prInfoItem('Partial Delivery', po.partial)}
        ${prInfoItem('Delivery Status', poDeliveryStatus(po))}
      </div>
      ${po.partial === 'Denied' ? `<p class="text-helper text-warning mt-3">Partial Delivery is Denied on this PO. Each item must be received in full, in one receipt.</p>` : ''}
      <div class="mt-4"><h4 class="text-label font-semibold text-secondary mb-1">Items to Receive</h4>${grnItemsTable(po)}</div>
      <div class="mt-4"><h4 class="text-label font-semibold text-secondary mb-1">Receipt History for ${escapeHtml(po.poNo)}</h4>${grnHistoryTable(po)}</div>`
    : `<p class="text-body text-muted">Choose a Purchase Order Number to load its items and remaining quantities.</p>`;
  return `
    <section id="grnFormCard" class="bg-cardBg border border-side-panel rounded-lg card-shadow p-5">
      <h3 class="text-section-title text-primary mb-3.5">New Goods Receipt Note<span class="block text-helper text-muted font-normal mt-0.5">Each save creates a separate receipt record</span></h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-3 gap-y-3.5">
        <div class="sm:col-span-2">${coaField('Purchase Order Number', `<select data-grnf="poId" class="${COA_INPUT}">
          <option value="">${openPOs.length ? 'Select an open purchase order…' : 'No purchase orders awaiting receipt'}</option>
          ${openPOs.map(p => `<option value="${p.id}" ${String(p.id) === String(grnForm.poId) ? 'selected' : ''}>${escapeHtml(p.poNo)}, ${escapeHtml(p.supplier)}, ${escapeHtml(p.styleNo)}, ${escapeHtml(poDeliveryStatus(p))}</option>`).join('')}
        </select>`)}</div>
        ${coaField('Receipt Date', `<input data-grnf="date" type="date" value="${escapeHtml(grnForm.date)}" class="${COA_INPUT} tabular" />`)}
        ${coaField('Receiving Warehouse', `<select data-grnf="warehouse" class="${COA_INPUT}">${whActive().map(w => `<option value="${escapeHtml(w.name)}" ${w.name === grnForm.warehouse ? 'selected' : ''}>${escapeHtml(whLabel(w))}</option>`).join('')}</select>`)}
        ${coaField('Bin / Rack', `<input data-grnf="location" type="text" autocomplete="off" value="${escapeHtml(grnForm.location)}" class="${COA_INPUT}" />`)}
        ${coaField('Batch / Lot', `<input data-grnf="batch" type="text" autocomplete="off" value="${escapeHtml(grnForm.batch)}" class="${COA_INPUT}" />`)}
        ${coaField('Challan / Reference', `<input data-grnf="ref" type="text" autocomplete="off" value="${escapeHtml(grnForm.ref)}" class="${COA_INPUT}" />`)}
      </div>
      <div class="rounded-md bg-side-hover border border-side-line p-4 mt-4">${info}</div>
      <div class="mt-3.5">${coaField('Remarks', `<input data-grnf="remarks" type="text" autocomplete="off" value="${escapeHtml(grnForm.remarks)}" class="${COA_INPUT}" />`)}</div>
      <div class="flex items-center justify-end gap-3 mt-4">
        <p id="grnFormMsg" class="${grnForm.msg ? '' : 'hidden '}text-helper text-${grnForm.msgTone} mr-auto">${escapeHtml(grnForm.msg)}</p>
        <button type="button" id="grnResetBtn" class="${COA_BTN}">Reset</button>
        <button type="button" id="grnSaveBtn" class="${COA_BTN_PRIMARY}">${BI_SAVE_ICON}Save Receipt</button>
      </div>
    </section>`;
}

function grnFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <span class="block text-label font-medium text-secondary mb-1">Search</span>
          <div class="relative">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="grnSearch" type="text" value="${escapeHtml(grnFilter.q)}" placeholder="Search GRN no., PO, supplier…" class="${COA_INPUT} pl-9" />
          </div>
        </div>
        ${coaField('Supplier', `<select id="grnSupplierFilter" class="${COA_INPUT}">${opt(['All Suppliers', ...Array.from(new Set(goodsReceipts.map(g => g.supplier))).sort()], grnFilter.supplier)}</select>`)}
        ${coaField('Purchase Order', `<select id="grnPoFilter" class="${COA_INPUT}">${opt(['All POs', ...Array.from(new Set(goodsReceipts.map(g => g.poNo))).sort()], grnFilter.po)}</select>`)}
        ${coaField('From', `<input id="grnFromFilter" type="date" value="${escapeHtml(grnFilter.from)}" class="${COA_INPUT} tabular" />`)}
      </div>
    </section>`;
}

function grnFiltered() {
  const q = grnFilter.q.trim().toLowerCase();
  return goodsReceipts.filter(g => {
    if (q && !(g.grnNo.toLowerCase().includes(q) || g.poNo.toLowerCase().includes(q) || g.supplier.toLowerCase().includes(q))) return false;
    if (grnFilter.supplier !== 'All Suppliers' && g.supplier !== grnFilter.supplier) return false;
    if (grnFilter.po !== 'All POs' && g.poNo !== grnFilter.po) return false;
    if (grnFilter.from && g.receiptDate < grnFilter.from) return false;
    return true;
  });
}

function grnCounterText() {
  return `${grnFiltered().length} of ${goodsReceipts.length} receipt${goodsReceipts.length === 1 ? '' : 's'}`;
}

function grnResultsHtml() {
  const headers = ['GRN No.', 'Date', 'PO No.', 'Supplier', 'Style', 'Received Qty', 'Reference'];
  const rows = grnFiltered();
  const body = rows.length
    ? rows.map(g => `
      <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
        <td class="pl-4 pr-2 py-2 fs-base font-medium text-primary whitespace-nowrap tabular">${escapeHtml(g.grnNo)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular">${escapeHtml(biFromISO(g.receiptDate) || g.receiptDate)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap">${escapeHtml(g.poNo)}</td>
        <td class="px-3 py-2 fs-base text-primary whitespace-nowrap">${escapeHtml(g.supplier)}</td>
        <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap">${escapeHtml(g.styleNo)}</td>
        <td class="px-3 py-2 fs-base font-semibold text-primary whitespace-nowrap tabular text-right">${coaMoney(g.lines.reduce((s, l) => s + l.qty, 0))}</td>
        <td class="pr-4 pl-3 py-2 fs-base text-secondary whitespace-nowrap">${escapeHtml(g.ref || '—')}</td>
      </tr>`).join('')
    : `<tr><td colspan="${headers.length}" class="px-4 py-8 text-center fs-base text-muted">${goodsReceipts.length ? 'No receipts match your filters.' : 'No goods receipts yet.'}</td></tr>`;
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full min-w-[860px]">
        <thead><tr class="border-b border-side-line">
          ${headers.map((h, i) => `<th class="${i === 0 ? 'pl-4 pr-2' : i === headers.length - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${i === 5 ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}

function grnRecentCard() {
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex items-center justify-between gap-3 p-4">
        <h3 class="text-section-title text-primary">Goods Receipts</h3>
        <p id="grnCounter" class="text-helper text-muted">${grnCounterText()}</p>
      </div>
      <div id="grnResults">${grnResultsHtml()}</div>
    </section>`;
}

function renderGoodsReceipt(container) {
  if (!grnForm.warehouse) grnForm.warehouse = (whActive()[0] || {}).name || '';
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${grnFormCard()}
      ${grnFilterBar()}
      ${grnRecentCard()}
    </div>`;
  grnBindEvents(container);
}

function grnRefreshResults(container) {
  container.querySelector('#grnResults').innerHTML = grnResultsHtml();
  container.querySelector('#grnCounter').textContent = grnCounterText();
}

function grnBindEvents(container) {
  container.querySelectorAll('[data-grnf]').forEach(el => {
    const handler = () => {
      grnForm[el.dataset.grnf] = el.value;
      if (el.dataset.grnf === 'poId') { grnForm.receiving = {}; renderGoodsReceipt(container); }
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { grnForm[el.dataset.grnf] = el.value; });
  });

  const formCard = container.querySelector('#grnFormCard');
  formCard.addEventListener('input', (e) => {
    if (e.target.dataset.grnline !== undefined) grnForm.receiving[e.target.dataset.grnline] = e.target.value;
  });
  formCard.addEventListener('click', (e) => {
    const fillBtn = e.target.closest('[data-grnfill]');
    if (!fillBtn) return;
    const po = grnFindPO(grnForm.poId);
    if (!po) return;
    const i = +fillBtn.dataset.grnfill;
    const rec = grnLineReceivedSoFar(po.poNo, i);
    const remaining = Math.max(0, coaNum(po.lines[i].qty) - rec);
    grnForm.receiving[i] = String(remaining);
    renderGoodsReceipt(container);
  });

  container.querySelector('#grnResetBtn').addEventListener('click', () => {
    grnResetForm();
    renderGoodsReceipt(container);
  });

  container.querySelector('#grnSaveBtn').addEventListener('click', () => {
    const po = grnFindPO(grnForm.poId);
    if (!po) return grnSetMsg('Select a purchase order before saving.', 'danger');
    const lines = po.lines
      .map((l, i) => ({ product: l.product, unit: l.unit, price: l.price, qty: coaNum(grnForm.receiving[i]), remaining: Math.max(0, coaNum(l.qty) - grnLineReceivedSoFar(po.poNo, i)) }))
      .filter(l => l.qty > 0);
    if (!lines.length) return grnSetMsg('Enter a receiving quantity for at least one item.', 'danger');
    for (const l of lines) {
      if (l.qty > l.remaining + 0.0005) return grnSetMsg(`Receiving quantity for ${l.product} exceeds the remaining balance.`, 'danger');
    }
    if (po.partial === 'Denied') {
      const allFull = po.lines.every((l, i) => {
        const receiving = coaNum(grnForm.receiving[i]);
        const remaining = Math.max(0, coaNum(l.qty) - grnLineReceivedSoFar(po.poNo, i));
        return receiving <= 0 || receiving >= remaining - 0.0005;
      });
      if (!allFull) return grnSetMsg('Partial Delivery is Denied on this PO — receive the full remaining quantity for each item.', 'danger');
    }

    const grnNo = grnNextNo();
    goodsReceipts.unshift({
      id: goodsReceipts.reduce((m, g) => Math.max(m, g.id), 0) + 1,
      grnNo, poNo: po.poNo, supplier: po.supplier, styleNo: po.styleNo,
      receiptDate: grnForm.date, warehouse: grnForm.warehouse, location: grnForm.location.trim(),
      batch: grnForm.batch.trim(), ref: grnForm.ref.trim(), remarks: grnForm.remarks.trim(),
      lines: lines.map(l => ({ product: l.product, unit: l.unit, price: l.price, qty: l.qty })),
    });
    grnResetForm();
    renderGoodsReceipt(container);
    grnSetMsg(`Goods receipt ${grnNo} saved.`, 'success');
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { grnFilter[key] = e.target.value; grnRefreshResults(container); });
  bindFilter('grnSearch', 'q', 'input');
  bindFilter('grnSupplierFilter', 'supplier', 'change');
  bindFilter('grnPoFilter', 'po', 'change');
  bindFilter('grnFromFilter', 'from', 'change');
}

  const progressRows = confirmed.length ? confirmed.map(p => {

    return `<tr class="border-b border-side-line last:border-b-0">

function whFiltered() {
  const q = whFilter.q.trim().toLowerCase();

    if (whFilter.type !== 'All Types' && w.type !== whFilter.type) return false;
    if (whFilter.status !== 'All Statuses' && w.status !== whFilter.status) return false;
    return true;
  });
}

function renderWarehouseManagement(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${whFormCard()}
      ${whFilterBar()}
      ${whRecentCard()}
    </div>`;
  whBindEvents(container);
}

function whRefreshResults(container) {
  container.querySelector('#whResults').innerHTML = whResultsHtml();
  container.querySelector('#whCounter').textContent = whCounterText();
}

function whBindEvents(container) {
  container.querySelectorAll('[data-whf]').forEach(el => {
    const handler = () => { whForm[el.dataset.whf] = el.value; };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });

  container.querySelector('#whResetBtn').addEventListener('click', () => {
    whResetForm();
    renderWarehouseManagement(container);
  });

  container.querySelector('#whSaveBtn').addEventListener('click', () => {
    if (!whForm.name.trim()) return whSetMsg('Warehouse name is required.', 'danger');
    if (whForm.editId) {
      const w = warehouses.find(x => x.id === whForm.editId);
      Object.assign(w, {
        name: whForm.name.trim(), type: whForm.type, category: whForm.category.trim(), address: whForm.address.trim(),
        contactPerson: whForm.contactPerson.trim(), contactNumber: whForm.contactNumber.trim(), email: whForm.email.trim(),
        capacity: coaNum(whForm.capacity), capacityUnit: whForm.capacityUnit.trim(), responsiblePerson: whForm.responsiblePerson.trim(),
        status: whForm.status, remarks: whForm.remarks.trim(),
      });
      whResetForm();
      renderWarehouseManagement(container);
      whSetMsg(`Warehouse ${w.code} updated.`, 'success');
    } else {
      const code = whNextCode();
      warehouses.push({
        id: warehouses.reduce((m, x) => Math.max(m, x.id), 0) + 1, code,
        name: whForm.name.trim(), type: whForm.type, category: whForm.category.trim(), address: whForm.address.trim(),
        contactPerson: whForm.contactPerson.trim(), contactNumber: whForm.contactNumber.trim(), email: whForm.email.trim(),
        capacity: coaNum(whForm.capacity), capacityUnit: whForm.capacityUnit.trim(), responsiblePerson: whForm.responsiblePerson.trim(),
        status: whForm.status, remarks: whForm.remarks.trim(),
      });
      whResetForm();
      renderWarehouseManagement(container);
      whSetMsg(`Warehouse ${code} saved.`, 'success');
    }
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { whFilter[key] = e.target.value; whRefreshResults(container); });
  bindFilter('whSearch', 'q', 'input');
  bindFilter('whTypeFilter', 'type', 'change');
  bindFilter('whStatusFilter', 'status', 'change');

  container.querySelector('#whResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-wh-edit]');

// ---------- Inventory: shared stock model ----------
// One held-quantity and one transfer ledger cover every stock type (Raw Material, WIP, Finished
// Goods), the way the reference build's S.inventoryRecords / S.qcHolds / S.stockTransfers do, so
// QC Hold Stock and Stock Transfer can work from a single picker across all of them.
function invR3(n) { return Math.round((n || 0) * 1000) / 1000; }

const invQcHolds = [];
const invStockTransfers = [];

function invHeldQty(recordId) {
  return invQcHolds.filter(h => h.recordId === recordId && (h.status === 'On Hold' || h.status === 'Under Inspection')).reduce((s, h) => s + h.quantity, 0);
}

function invAvailableQty(rec) {
  return Math.max(0, invR3(rec.quantity - (rec.reservedQty || 0) - invHeldQty(rec.id)));
}

function invRecordStatus(rec) {
  if (rec.quantity <= 0.0005) return 'Depleted';
  const held = invHeldQty(rec.id);
  const avail = invAvailableQty(rec);
  if (avail <= 0.0005 && held > 0) return 'QC Hold';
  if (avail <= 0.0005 && (rec.reservedQty || 0) > 0) return 'Reserved';
  if (held > 0 || (rec.reservedQty || 0) > 0) return 'Partial';
  return 'Available';
}

function invRecordValue(rec) { return rec.quantity * (rec.unitCost || 0); }

function invStatusTone(status) {
  return { Available: 'success', Partial: 'info', Reserved: 'warning', 'QC Hold': 'danger', Depleted: 'neutral', Blocked: 'danger' }[status] || 'neutral';
}

// ---------- Material Inventory (Raw Material) ----------
// Content ported from the Finance reference build's Raw Material Inventory page. Nothing is
// stored directly here — every line is derived from Procurement > Goods Receipt, the same way
// Chart of Accounts derives its ledger from posted journal entries and vouchers. Stock Transfer
// records for Raw Material apply as adjustments on top of that base.
const materialTransfers = []; // { key: 'product|batch', fromWarehouse, toWarehouse, qty }

function materialBaseMap() {
  const map = new Map();
  goodsReceipts.forEach(g => {
    g.lines.forEach(l => {
      const key = `${l.product}|${g.warehouse}|${g.batch || '—'}`;
      if (!map.has(key)) map.set(key, { product: l.product, unit: l.unit, warehouse: g.warehouse, batch: g.batch || '—', qty: 0, costSum: 0, poNo: g.poNo, supplier: g.supplier, grnNos: new Set() });
      const row = map.get(key);
      row.qty += l.qty;
      row.costSum += l.qty * l.price;
      row.grnNos.add(g.grnNo);
    });
  });
  materialTransfers.forEach(t => {
    const [product, , batch] = t.key.split('|');
    const fromKey = `${product}|${t.fromWarehouse}|${batch}`;
    const toKey = `${product}|${t.toWarehouse}|${batch}`;
    if (map.has(fromKey)) map.get(fromKey).qty -= t.qty;
    if (!map.has(toKey)) {
      const src = map.get(fromKey) || {};
      map.set(toKey, { product, unit: src.unit || '', warehouse: t.toWarehouse, batch, qty: 0, costSum: 0, poNo: src.poNo || '', supplier: src.supplier || '', grnNos: new Set() });
    }
    map.get(toKey).qty += t.qty;
  });
  return map;
}

function materialInventoryRecords() {
  return Array.from(materialBaseMap().entries())
    .filter(([, r]) => r.qty > 0.0005)
    .map(([key, r]) => ({
      id: `RM::${key}`, kind: 'Raw Material', product: r.product, unit: r.unit, warehouse: r.warehouse, batch: r.batch,
      quantity: invR3(r.qty), reservedQty: 0, unitCost: r.qty ? r.costSum / r.qty : 0, poNo: r.poNo, supplier: r.supplier,
      grnRefs: Array.from(r.grnNos).join(', '),
    }));
}

function materialFindRecord(id) { return materialInventoryRecords().find(r => r.id === id) || null; }

const materialFilter = { q: '', warehouse: 'All Warehouses', product: 'All Products', supplier: 'All Suppliers', status: 'All Statuses' };

function materialFiltered() {
  const q = materialFilter.q.trim().toLowerCase();
  return materialInventoryRecords().filter(r => {
    if (q && !(r.product.toLowerCase().includes(q) || r.batch.toLowerCase().includes(q) || r.warehouse.toLowerCase().includes(q) || (r.supplier || '').toLowerCase().includes(q))) return false;
    if (materialFilter.warehouse !== 'All Warehouses' && r.warehouse !== materialFilter.warehouse) return false;
    if (materialFilter.product !== 'All Products' && r.product !== materialFilter.product) return false;
    if (materialFilter.supplier !== 'All Suppliers' && r.supplier !== materialFilter.supplier) return false;
    if (materialFilter.status !== 'All Statuses' && invRecordStatus(r) !== materialFilter.status) return false;
    return true;
  });
}

function materialKpis() {
  const rows = materialInventoryRecords();
  const sum = (f) => invR3(rows.reduce((s, r) => s + f(r), 0));
  const low = rows.filter(r => invAvailableQty(r) > 0 && invAvailableQty(r) < 200).length;
  return `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      ${procKpiCard('Raw Material Items', new Set(rows.map(r => r.product)).size)}
      ${procKpiCard('Total Quantity', coaMoney(sum(r => r.quantity)))}
      ${procKpiCard('Available Stock', coaMoney(sum(invAvailableQty)))}
      ${procKpiCard('QC Hold', coaMoney(sum(r => invHeldQty(r.id))))}
      ${procKpiCard('Low Stock Lines', low)}
      ${procKpiCard('Stock Value (BDT)', coaMoney(sum(invRecordValue)))}
    </div>`;
}

    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex items-center justify-between gap-3 p-4">
        <h3 class="text-section-title text-primary">WIP Stock</h3>
        <p id="wipCounter" class="text-helper text-muted">${wipCounterText()}</p>
      </div>
      <div id="wipResults">${wipResultsHtml()}</div>
    </section>`;
}

function renderWipInventory(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${wipFormCard()}
      ${wipFilterBar()}
      ${wipRecentCard()}
    </div>`;
  wipBindEvents(container);
}

function wipRefreshResults(container) {
  container.querySelector('#wipResults').innerHTML = wipResultsHtml();
  container.querySelector('#wipCounter').textContent = wipCounterText();
}

function wipBindEvents(container) {
  container.querySelectorAll('[data-wipf]').forEach(el => {
    const handler = () => {
      wipForm[el.dataset.wipf] = el.value;
      if (el.dataset.wipf === 'styleNo') renderWipInventory(container);
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { wipForm[el.dataset.wipf] = el.value; });
  });

  container.querySelector('#wipResetBtn').addEventListener('click', () => {
    wipResetForm();
    renderWipInventory(container);
  });

  container.querySelector('#wipSaveBtn').addEventListener('click', () => {
    if (!wipForm.styleNo) return wipSetMsg('Select a Style No. before saving.', 'danger');
    if (coaNum(wipForm.quantity) <= 0) return wipSetMsg('Enter a quantity greater than zero.', 'danger');
    const st = styStyles.find(s => s.style === wipForm.styleNo);
    const rec = {
      styleNo: wipForm.styleNo, product: st ? st.product : '', buyer: wipForm.buyer.trim(), productionRef: wipForm.productionRef.trim(),
      operation: wipForm.operation.trim(), fromDepartment: wipForm.fromDepartment.trim(), toDepartment: wipForm.toDepartment.trim(),
      warehouse: wipForm.warehouse, location: wipForm.location.trim(), batch: wipForm.batch.trim(), unit: wipForm.unit.trim() || 'Pcs',
      quantity: coaNum(wipForm.quantity), reservedQty: coaNum(wipForm.reservedQty), date: wipForm.date, status: wipForm.status, remarks: wipForm.remarks.trim(),
    };
    if (wipForm.editId) {
      Object.assign(wipFind(wipForm.editId), rec);
      wipSetMsg(`WIP record updated.`, 'success');
    } else {
      const wipNo = wipNextNo();
      wipInventory.unshift({ id: wipInventory.reduce((m, w) => Math.max(m, w.id), 0) + 1, wipNo, ...rec });
      wipSetMsg(`WIP record ${wipNo} saved.`, 'success');
    }
    wipResetForm();
    renderWipInventory(container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { wipFilter[key] = e.target.value; wipRefreshResults(container); });
  bindFilter('wipSearch', 'q', 'input');
  bindFilter('wipStyleFilter', 'style', 'change');
  bindFilter('wipDeptFilter', 'department', 'change');
  bindFilter('wipWarehouseFilter', 'warehouse', 'change');
  bindFilter('wipStatusFilter', 'status', 'change');

  container.querySelector('#wipResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-wip-edit]');
    if (!editBtn) return;
    const w = wipFind(+editBtn.dataset.wipEdit);
    if (w) {
      Object.assign(wipForm, { editId: w.id, styleNo: w.styleNo, buyer: w.buyer, productionRef: w.productionRef, operation: w.operation, fromDepartment: w.fromDepartment, toDepartment: w.toDepartment, warehouse: w.warehouse, location: w.location, batch: w.batch, unit: w.unit, quantity: w.quantity, reservedQty: w.reservedQty, date: w.date, status: w.status, remarks: w.remarks, msg: '', msgTone: 'muted' });
      renderWipInventory(container);
    }
  });
}

      ${procKpiCard('Finished Goods SKUs', rows.length)}

function fgFilterBar() {
  const opt = (list, sel) => list.map(v => `<option value="${escapeHtml(v)}" ${v === sel ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">

        ${coaField('Color', `<select id="fgColorFilter" class="${COA_INPUT}">${opt(['All Colors', ...Array.from(new Set(finishedGoods.map(f => f.color).filter(Boolean))).sort()], fgFilter.color)}</select>`)}
        ${coaField('Size', `<select id="fgSizeFilter" class="${COA_INPUT}">${opt(['All Sizes', ...Array.from(new Set(finishedGoods.map(f => f.size).filter(Boolean))).sort()], fgFilter.size)}</select>`)}

function fgFiltered() {
  const q = fgFilter.q.trim().toLowerCase();
  return finishedGoods.filter(f => {
    if (q && !(f.fgNo.toLowerCase().includes(q) || f.styleNo.toLowerCase().includes(q))) return false;
    if (fgFilter.style !== 'All Styles' && f.styleNo !== fgFilter.style) return false;
    if (fgFilter.color !== 'All Colors' && f.color !== fgFilter.color) return false;
    if (fgFilter.size !== 'All Sizes' && f.size !== fgFilter.size) return false;
    if (fgFilter.status !== 'All Statuses' && f.status !== fgFilter.status) return false;
    return true;
  });
}

function fgCounterText() {
  return `${fgFiltered().length} of ${finishedGoods.length} record${finishedGoods.length === 1 ? '' : 's'}`;
}

function fgStatusTone(status) {
  return { Available: 'success', 'Ready for Shipment': 'info', Blocked: 'danger' }[status] || 'neutral';
}

  return `

      <table class="w-full min-w-[1000px]">

        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}

// ---------- Inventory: unified record picker ----------
// Merges Material (derived), WIP and Finished Goods into one list so QC Hold Stock and Stock
// Transfer can work across every stock type, the way the reference build's single
// S.inventoryRecords list does.
function invAllRecords() {
  const material = materialInventoryRecords().map(r => ({ id: r.id, kind: r.kind, product: r.product, style: '', batch: r.batch, warehouse: r.warehouse, location: '', unit: r.unit, quantity: r.quantity, reservedQty: r.reservedQty, unitCost: r.unitCost }));
  const wip = wipInventory.map(w => ({ id: `WIP::${w.id}`, kind: 'WIP', product: w.product, style: w.styleNo, batch: w.batch, warehouse: w.warehouse, location: w.location, unit: w.unit, quantity: w.quantity, reservedQty: w.reservedQty, unitCost: 0 }));
  const fg = finishedGoods.map(f => ({ id: `FG::${f.id}`, kind: 'Finished Goods', product: `${f.product}${f.color ? ' — ' + f.color : ''}${f.size ? ' / ' + f.size : ''}`, style: f.styleNo, batch: f.batch, warehouse: f.warehouse, location: f.location, unit: f.unit, quantity: f.quantity, reservedQty: f.reservedQty, unitCost: f.unitCost }));
  return [...material, ...wip, ...fg];
}

function invFindRecord(id) { return invAllRecords().find(r => r.id === id) || null; }

function invRecordLabel(r) {
  return `${r.kind} · ${r.product}${r.batch && r.batch !== '—' ? ' · ' + r.batch : ''} · ${r.warehouse || 'No warehouse'}`;
}

// ---------- QC Hold Stock ----------
// Content ported from the Finance reference build's QC Hold Stock page: held stock is excluded
// from available quantity (invHeldQty, defined above) until released.
const QC_STATUSES = ['On Hold', 'Under Inspection', 'Released', 'Rejected', 'Rework Required'];

const qcForm = {
  editId: null, recordId: '', quantity: '', reason: '', reference: '',
  holdDate: new Date().toISOString().slice(0, 10), inspectionDate: '', inspector: '',
  status: QC_STATUSES[0], remarks: '', msg: '', msgTone: 'muted',
};

const qcFilter = { q: '', warehouse: 'All Warehouses', status: 'All Statuses' };

function qcNextNo() {
  const max = invQcHolds.reduce((m, h) => Math.max(m, parseInt(h.holdNo.split('-').pop(), 10) || 0), 0);
  return `QC-${String(max + 1).padStart(6, '0')}`;
}

function qcFind(id) { return invQcHolds.find(h => h.id === id) || null; }

function qcEligibleRecords() {
  return invAllRecords().filter(r => invAvailableQty(r) > 0.0005 || (qcForm.editId && qcForm.recordId === r.id));
}

function qcResetForm() {
  qcForm.editId = null;
  qcForm.recordId = ''; qcForm.quantity = ''; qcForm.reason = ''; qcForm.reference = '';
  qcForm.holdDate = new Date().toISOString().slice(0, 10); qcForm.inspectionDate = ''; qcForm.inspector = '';
  qcForm.status = QC_STATUSES[0]; qcForm.remarks = '';
  qcForm.msg = ''; qcForm.msgTone = 'muted';
}

function qcSetMsg(text, tone) {
  qcForm.msg = text || '';
  qcForm.msgTone = tone || 'muted';
  const el = document.getElementById('qcFormMsg');
  if (el) {
    el.textContent = qcForm.msg;
    el.className = `${qcForm.msg ? '' : 'hidden '}text-helper text-${qcForm.msgTone} mr-auto`;
  }
}

function qcFormCard() {
  const rec = invFindRecord(qcForm.recordId);
  const eligible = qcEligibleRecords();
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-5">

    if (qcFilter.warehouse !== 'All Warehouses' && (!rec || rec.warehouse !== qcFilter.warehouse)) return false;
    if (qcFilter.status !== 'All Statuses' && h.status !== qcFilter.status) return false;

function renderQcHoldStock(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${qcFormCard()}
      ${qcFilterBar()}
      ${qcRecentCard()}
    </div>`;
  qcBindEvents(container);
}

function qcRefreshResults(container) {
  container.querySelector('#qcResults').innerHTML = qcResultsHtml();
  container.querySelector('#qcCounter').textContent = qcCounterText();
}

function qcBindEvents(container) {
  container.querySelectorAll('[data-qcf]').forEach(el => {
    const handler = () => {
      qcForm[el.dataset.qcf] = el.value;
      if (el.dataset.qcf === 'recordId') renderQcHoldStock(container);
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { qcForm[el.dataset.qcf] = el.value; });
  });

  container.querySelector('#qcResetBtn').addEventListener('click', () => {
    qcResetForm();
    renderQcHoldStock(container);
  });

  container.querySelector('#qcSaveBtn').addEventListener('click', () => {
    const rec = invFindRecord(qcForm.recordId);
    if (!rec) return qcSetMsg('Select stock to hold before saving.', 'danger');
    if (!qcForm.reason.trim()) return qcSetMsg('Enter a QC reason before saving.', 'danger');
    const qty = coaNum(qcForm.quantity);
    const alreadyHeld = qcForm.editId ? (qcFind(qcForm.editId) || {}).quantity || 0 : 0;
    if (qty <= 0 || qty > invAvailableQty(rec) + alreadyHeld + 0.0005) return qcSetMsg('Enter a hold quantity within the eligible available quantity.', 'danger');

    if (qcForm.editId) {
      Object.assign(qcFind(qcForm.editId), {
        recordId: qcForm.recordId, quantity: qty, reason: qcForm.reason.trim(), reference: qcForm.reference.trim(),
        holdDate: qcForm.holdDate, inspectionDate: qcForm.inspectionDate, inspector: qcForm.inspector.trim(),
        status: qcForm.status, remarks: qcForm.remarks.trim(),
      });
      qcSetMsg('QC hold updated.', 'success');
    } else {
      const holdNo = qcNextNo();
      invQcHolds.unshift({
        id: invQcHolds.reduce((m, h) => Math.max(m, h.id), 0) + 1, holdNo, recordId: qcForm.recordId, quantity: qty,
        reason: qcForm.reason.trim(), reference: qcForm.reference.trim(), holdDate: qcForm.holdDate, inspectionDate: qcForm.inspectionDate,
        inspector: qcForm.inspector.trim(), status: qcForm.status, remarks: qcForm.remarks.trim(),
      });
      qcSetMsg(`QC hold ${holdNo} saved.`, 'success');
    }
    qcResetForm();
    renderQcHoldStock(container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { qcFilter[key] = e.target.value; qcRefreshResults(container); });
  bindFilter('qcSearch', 'q', 'input');
  bindFilter('qcWarehouseFilter', 'warehouse', 'change');
  bindFilter('qcStatusFilter', 'status', 'change');

  container.querySelector('#qcResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-qc-edit]');
    if (editBtn) {
      const h = qcFind(+editBtn.dataset.qcEdit);
      if (h) {
        Object.assign(qcForm, { editId: h.id, recordId: h.recordId, quantity: h.quantity, reason: h.reason, reference: h.reference, holdDate: h.holdDate, inspectionDate: h.inspectionDate, inspector: h.inspector, status: h.status, remarks: h.remarks, msg: '', msgTone: 'muted' });
        renderQcHoldStock(container);
      }
      return;
    }
    const releaseBtn = e.target.closest('[data-qc-release]');
    if (releaseBtn) {
      const h = qcFind(+releaseBtn.dataset.qcRelease);
      if (h) { h.status = 'Released'; qcRefreshResults(container); }
    }
  });
}

// ---------- Stock Transfer ----------
// Content ported from the Finance reference build's Stock Transfer page: a transfer only moves
// stock — creates linked OUT/IN inventory movements — once it is completed. Draft/Pending
// transfers just reserve the intent, matching the reference's own description.
const TRANSFER_TYPES = ['Warehouse Transfer', 'Production Issue', 'WIP Transfer', 'QC Transfer', 'Return', 'Other'];
const TRANSFER_STATUSES = ['Draft', 'Pending', 'Approved', 'In Transit', 'Completed', 'Cancelled'];

const trfForm = {
  editId: null, date: new Date().toISOString().slice(0, 10), type: TRANSFER_TYPES[0], recordId: '',
  toWarehouse: '', toLocation: '', quantity: '', reason: '', reference: '', status: TRANSFER_STATUSES[0],
  remarks: '', msg: '', msgTone: 'muted',
};

const trfFilter = { q: '', warehouse: 'All Warehouses', status: 'All Statuses' };

function trfNextNo() {
  const max = invStockTransfers.reduce((m, t) => Math.max(m, parseInt(t.transferNo.split('-').pop(), 10) || 0), 0);
  return `TRF-${String(max + 1).padStart(6, '0')}`;
}

function trfFind(id) { return invStockTransfers.find(t => t.id === id) || null; }

function trfEligibleRecords() {
  return invAllRecords().filter(r => invAvailableQty(r) > 0.0005 || (trfForm.editId && trfForm.recordId === r.id));
}

function trfResetForm() {
  trfForm.editId = null;
  trfForm.date = new Date().toISOString().slice(0, 10); trfForm.type = TRANSFER_TYPES[0]; trfForm.recordId = '';
  trfForm.toWarehouse = ''; trfForm.toLocation = ''; trfForm.quantity = ''; trfForm.reason = ''; trfForm.reference = '';
  trfForm.status = TRANSFER_STATUSES[0]; trfForm.remarks = '';
  trfForm.msg = ''; trfForm.msgTone = 'muted';
}

function trfSetMsg(text, tone) {
  trfForm.msg = text || '';
  trfForm.msgTone = tone || 'muted';
  const el = document.getElementById('trfFormMsg');
  if (el) {
    el.textContent = trfForm.msg;
    el.className = `${trfForm.msg ? '' : 'hidden '}text-helper text-${trfForm.msgTone} mr-auto`;
  }
}

// Only actually moves stock — a Draft/Pending transfer is just an intent, same as the reference.
function trfApplyMovement(t) {
  const rec = invFindRecord(t.recordId);
  if (!rec) return;
  if (rec.kind === 'Raw Material') {
    materialTransfers.push({ key: `${rec.product}|${rec.batch}`, fromWarehouse: t.fromWarehouse, toWarehouse: t.toWarehouse, qty: t.quantity });
    return;
  }
  const arr = rec.kind === 'WIP' ? wipInventory : finishedGoods;
  const rawId = +t.recordId.split('::')[1];
  const src = arr.find(x => x.id === rawId);
  if (!src) return;
  if (t.quantity >= src.quantity - 0.0005) {
    src.warehouse = t.toWarehouse;
    src.location = t.toLocation;
  } else {
    src.quantity = invR3(src.quantity - t.quantity);
    arr.unshift({ ...src, id: arr.reduce((m, x) => Math.max(m, x.id), 0) + 1, quantity: t.quantity, reservedQty: 0, warehouse: t.toWarehouse, location: t.toLocation });
  }
}

function renderStockTransfer(container) {
  container.innerHTML = `

      ${trfFormCard()}
      ${trfFilterBar()}
      ${trfRecentCard()}
    </div>`;

function trfRefreshResults(container) {
  container.querySelector('#trfResults').innerHTML = trfResultsHtml();
  container.querySelector('#trfCounter').textContent = trfCounterText();
}

function trfBindEvents(container) {
  container.querySelectorAll('[data-trff]').forEach(el => {
    const handler = () => {
      trfForm[el.dataset.trff] = el.value;
      if (el.dataset.trff === 'recordId') renderStockTransfer(container);
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', () => { trfForm[el.dataset.trff] = el.value; });
  });

  container.querySelector('#trfResetBtn').addEventListener('click', () => {
    trfResetForm();
    renderStockTransfer(container);
  });

  container.querySelector('#trfSaveBtn').addEventListener('click', () => {
    const rec = invFindRecord(trfForm.recordId);
    if (!rec) return trfSetMsg('Select stock to transfer before saving.', 'danger');
    if (!trfForm.toWarehouse) return trfSetMsg('Select a destination warehouse before saving.', 'danger');
    if (rec.warehouse === trfForm.toWarehouse) return trfSetMsg('Destination warehouse must be different from the source warehouse.', 'danger');
    const qty = coaNum(trfForm.quantity);
    if (qty <= 0 || qty > invAvailableQty(rec) + 0.0005) return trfSetMsg('Enter a transfer quantity within the available quantity.', 'danger');

    if (trfForm.editId) {
      Object.assign(trfFind(trfForm.editId), {
        date: trfForm.date, type: trfForm.type, recordId: trfForm.recordId, fromWarehouse: rec.warehouse,
        toWarehouse: trfForm.toWarehouse, toLocation: trfForm.toLocation.trim(), quantity: qty,
        reason: trfForm.reason.trim(), reference: trfForm.reference.trim(), status: trfForm.status, remarks: trfForm.remarks.trim(),
      });
      trfSetMsg('Transfer updated.', 'success');
    } else {
      const transferNo = trfNextNo();
      invStockTransfers.unshift({
        id: invStockTransfers.reduce((m, t) => Math.max(m, t.id), 0) + 1, transferNo, date: trfForm.date, type: trfForm.type,
        recordId: trfForm.recordId, fromWarehouse: rec.warehouse, toWarehouse: trfForm.toWarehouse, toLocation: trfForm.toLocation.trim(),
        quantity: qty, reason: trfForm.reason.trim(), reference: trfForm.reference.trim(), requestedBy: 'Alex Johnson',
        status: trfForm.status, remarks: trfForm.remarks.trim(),
      });
      trfSetMsg(`Stock transfer ${transferNo} saved.`, 'success');
    }
    trfResetForm();
    renderStockTransfer(container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { trfFilter[key] = e.target.value; trfRefreshResults(container); });
  bindFilter('trfSearch', 'q', 'input');
  bindFilter('trfWarehouseFilter', 'warehouse', 'change');
  bindFilter('trfStatusFilter', 'status', 'change');

  container.querySelector('#trfResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-trf-edit]');
    if (editBtn) {
      const t = trfFind(+editBtn.dataset.trfEdit);
      if (t) {
        Object.assign(trfForm, { editId: t.id, date: t.date, type: t.type, recordId: t.recordId, toWarehouse: t.toWarehouse, toLocation: t.toLocation, quantity: t.quantity, reason: t.reason, reference: t.reference, status: t.status, remarks: t.remarks, msg: '', msgTone: 'muted' });
        renderStockTransfer(container);
      }
      return;
    }
    const completeBtn = e.target.closest('[data-trf-complete]');
    if (completeBtn) {
      const t = trfFind(+completeBtn.dataset.trfComplete);
      if (t) {
        const rec = invFindRecord(t.recordId);
        if (!rec || invAvailableQty(rec) + 0.0005 < t.quantity) { trfRefreshResults(container); return; }
        trfApplyMovement(t);
        t.status = 'Completed';
        renderStockTransfer(container);
      }
      return;
    }
    const cancelBtn = e.target.closest('[data-trf-cancel]');
    if (cancelBtn) {
      const t = trfFind(+cancelBtn.dataset.trfCancel);
      if (t) { t.status = 'Cancelled'; trfRefreshResults(container); }
    }
  });
}

const INV_REPORT_TABS = ['Stock Summary', 'Raw Material', 'WIP Stock', 'Finished Goods', 'QC Hold', 'Stock Transfer', 'Stock Valuation'];

  const kpis = `
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">

      ${procKpiCard('WIP Records', wip.length)}

      ${procKpiCard('Finished Goods Value (BDT)', coaMoney(fgValue))}
      ${procKpiCard('Total WIP Quantity', coaMoney(wipQty))}
      ${procKpiCard('Quantity on QC Hold', coaMoney(totalHeld))}
    </div>`;
  const byType = [
    { label: 'Raw Material', count: material.length, qty: material.reduce((s, r) => s + r.quantity, 0), value: materialValue },
    { label: 'WIP', count: wip.length, qty: wipQty, value: 0 },
    { label: 'Finished Goods', count: fg.length, qty: fg.reduce((s, r) => s + r.quantity, 0), value: fgValue },
  ];
  const byTypeRows = byType.map(r => `
    <tr class="border-b border-side-line last:border-b-0">
      <td class="pl-4 pr-2 py-2 fs-base text-primary whitespace-nowrap">${escapeHtml(r.label)}</td>
      <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${r.count}</td>

    </tr>`).join('');

    <div class="overflow-x-auto">
      <table class="w-full">
        <thead><tr class="border-b border-side-line">
          <th class="pl-4 pr-2 py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">Type</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Lines</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Quantity</th>
          <th class="pr-4 pl-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Value (BDT)</th>
        </tr></thead>
        <tbody>${byTypeRows}</tbody>

    </div>`)}</div>`;

function invValuationHtml() {
  const whNames = whActive().map(w => w.name);
  const rows = whNames.map(name => {
    const material = materialInventoryRecords().filter(r => r.warehouse === name).reduce((s, r) => s + invRecordValue(r), 0);
    const fg = finishedGoods.filter(r => r.warehouse === name).reduce((s, r) => s + r.quantity * r.unitCost, 0);
    return { name, material, fg, total: material + fg };
  }).filter(r => r.total > 0 || true);
  const body = rows.length ? rows.map(r => `
    <tr class="border-b border-side-line last:border-b-0">
      <td class="pl-4 pr-2 py-2 fs-base text-primary whitespace-nowrap">${escapeHtml(r.name)}</td>
      <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(r.material)}</td>
      <td class="px-3 py-2 fs-base text-secondary whitespace-nowrap tabular text-right">${coaMoney(r.fg)}</td>
      <td class="pr-4 pl-3 py-2 fs-base font-semibold text-primary whitespace-nowrap tabular text-right">${coaMoney(r.total)}</td>
    </tr>`).join('') : `<tr><td colspan="4" class="px-4 py-8 text-center fs-base text-muted">No warehouses yet.</td></tr>`;
  const grandTotal = rows.reduce((s, r) => s + r.total, 0);
  return invReportCard('Stock Valuation by Warehouse', `
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead><tr class="border-b border-side-line">
          <th class="pl-4 pr-2 py-2.5 fs-head font-semibold text-muted text-left whitespace-nowrap">Warehouse</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Raw Material (BDT)</th>
          <th class="px-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Finished Goods (BDT)</th>
          <th class="pr-4 pl-3 py-2.5 fs-head font-semibold text-muted text-right whitespace-nowrap">Total (BDT)</th>
        </tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr class="border-t border-side-line"><td class="pl-4 pr-2 py-2 fs-base font-semibold text-primary">Grand Total</td><td></td><td></td><td class="pr-4 pl-3 py-2 fs-base font-semibold text-primary text-right tabular">${coaMoney(grandTotal)}</td></tr></tfoot>
      </table>
    </div>`);
}

function invReportPanels() {
  return [

    () => invReportCard('Raw Material Stock Report', materialResultsHtml()),

function renderInventoryReports(tabsEl, container) {
  const subEl = document.getElementById('page-subtitle');

function adminLocFiltered() {

  return adminLocations.filter(l => {

    if (adminLocFilter.type !== 'All Types' && l.type !== adminLocFilter.type) return false;
    if (adminLocFilter.status !== 'All Statuses' && l.status !== adminLocFilter.status) return false;
    return true;

function adminLocCounterText() {

      </div>

    </section>`;
}

function renderAdminLocations(container) {
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${adminLocFormCard()}
      ${adminLocFilterBar()}
      ${adminLocRecentCard()}
    </div>`;
  adminLocBindEvents(container);
}

function adminLocRefreshResults(container) {
  container.querySelector('#adminLocResults').innerHTML = adminLocResultsHtml();
  container.querySelector('#adminLocCounter').textContent = adminLocCounterText();
}

function adminLocBindEvents(container) {
  container.querySelectorAll('[data-adminlocf]').forEach(el => {
    const handler = () => { adminLocForm[el.dataset.adminlocf] = el.value; };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });

  container.querySelector('#adminLocResetBtn').addEventListener('click', () => {
    adminLocResetForm();
    renderAdminLocations(container);
  });

  container.querySelector('#adminLocSaveBtn').addEventListener('click', () => {
    if (!adminLocForm.name.trim()) return adminLocSetMsg('Location name is required.', 'danger');
    if (!adminLocForm.code.trim()) return adminLocSetMsg('Location code is required.', 'danger');
    const rec = {
      code: adminLocForm.code.trim(), name: adminLocForm.name.trim(), type: adminLocForm.type,
      parentId: adminLocForm.parentId ? +adminLocForm.parentId : null, address: adminLocForm.address.trim(),
      city: adminLocForm.city.trim(), country: adminLocForm.country.trim(), contactPerson: adminLocForm.contactPerson.trim(),
      phone: adminLocForm.phone.trim(), email: adminLocForm.email.trim(), responsiblePerson: adminLocForm.responsiblePerson.trim(),
      status: adminLocForm.status, remarks: adminLocForm.remarks.trim(),
    };
    if (adminLocForm.editId) {
      Object.assign(adminLocFind(adminLocForm.editId), rec);
      adminLocSetMsg('Location updated.', 'success');
    } else {
      adminLocations.push({ id: adminLocations.reduce((m, l) => Math.max(m, l.id), 0) + 1, ...rec });
      adminLocSetMsg('Location saved.', 'success');
    }
    adminLocResetForm();
    renderAdminLocations(container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { adminLocFilter[key] = e.target.value; adminLocRefreshResults(container); });
  bindFilter('adminLocSearch', 'q', 'input');
  bindFilter('adminLocTypeFilter', 'type', 'change');
  bindFilter('adminLocStatusFilter', 'status', 'change');

  container.querySelector('#adminLocResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-adminloc-edit]');
    if (!editBtn) return;
    const l = adminLocFind(+editBtn.dataset.adminlocEdit);
    if (l) {
      Object.assign(adminLocForm, { editId: l.id, code: l.code, name: l.name, type: l.type, parentId: l.parentId || '', address: l.address, city: l.city, country: l.country, contactPerson: l.contactPerson, phone: l.phone, email: l.email, responsiblePerson: l.responsiblePerson, status: l.status, remarks: l.remarks, msg: '', msgTone: 'muted' });
      renderAdminLocations(container);
    }
  });
}

function adminEntryProductNextCode(type) {

function renderAdminEntry(tabsEl, container) {
  tabsEl.classList.remove('hidden');
  tabsEl.innerHTML = `
    <div class="flex items-center gap-1 -mb-px pb-px overflow-x-auto overflow-y-hidden">
      ${ADMIN_ENTRY_TABS.map((t, i) => `
        <button type="button" data-adminentrytab="${i}" class="px-3.5 py-2.5 text-label font-semibold border-b-2 whitespace-nowrap -mb-px ${i === state.tabIndex ? 'border-side-accent text-side-accent' : 'border-transparent text-muted hover:text-secondary'}">${escapeHtml(t)}</button>
      `).join('')}
    </div>`;
  tabsEl.querySelectorAll('[data-adminentrytab]').forEach(btn => {
    btn.addEventListener('click', () => { state.tabIndex = +btn.dataset.adminentrytab; renderAdminEntry(tabsEl, container); });
  });
  document.getElementById('page-actions').innerHTML = '';

  container.innerHTML = `<div class="space-y-4 pb-8">${state.tabIndex === 0 ? adminEntryCustomerTab(container) : adminEntryProductTab()}</div>`;
  if (state.tabIndex === 0) adminEntryCustomerBindEvents(container); else adminEntryProductBindEvents(container);
}

function adminEntryCustomerBindEvents(container) {
  const f = adminEntryCustomerForm;
  container.querySelectorAll('[data-custf]').forEach(el => {
    const handler = () => { f[el.dataset.custf] = el.value; };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });

  container.querySelector('#custResetBtn').addEventListener('click', () => {
    Object.assign(f, { editId: null, name: '', contactPerson: '', phone: '', email: '', address: '', country: '', paymentTerms: '', currency: 'BDT', status: 'Active', remarks: '', msg: '', msgTone: 'muted' });
    renderAdminEntry(document.getElementById('tabs'), container);
  });

  container.querySelector('#custSaveBtn').addEventListener('click', () => {
    if (!f.name.trim()) return adminEntrySetMsg(f, 'custFormMsg', 'Customer name is required.', 'danger');
    const rec = { name: f.name.trim(), contactPerson: f.contactPerson.trim(), phone: f.phone.trim(), email: f.email.trim(), address: f.address.trim(), country: f.country.trim(), paymentTerms: f.paymentTerms.trim(), currency: f.currency, status: f.status, remarks: f.remarks.trim() };
    if (f.editId) {
      Object.assign(adminEntryCustomerFind(f.editId), rec);
      adminEntrySetMsg(f, 'custFormMsg', 'Customer updated.', 'success');
    } else {
      adminCustomers.push({ id: adminCustomers.reduce((m, c) => Math.max(m, c.id), 0) + 1, code: adminEntryCustomerNextCode(), ...rec });
      adminEntrySetMsg(f, 'custFormMsg', 'Customer saved.', 'success');
    }
    Object.assign(f, { editId: null, name: '', contactPerson: '', phone: '', email: '', address: '', country: '', paymentTerms: '', currency: 'BDT', status: 'Active', remarks: '' });
    renderAdminEntry(document.getElementById('tabs'), container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => {
    adminEntryCustomerFilter[key] = e.target.value;
    container.querySelector('#custResults').innerHTML = adminEntryCustomerResultsHtml();
    container.querySelector('#custCounter').textContent = `${adminEntryCustomerFiltered().length} of ${adminCustomers.length} customer${adminCustomers.length === 1 ? '' : 's'}`;
  });
  bindFilter('custSearch', 'q', 'input');
  bindFilter('custStatusFilter', 'status', 'change');

  container.querySelector('#custResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-cust-edit]');
    if (!editBtn) return;
    const c = adminEntryCustomerFind(+editBtn.dataset.custEdit);
    if (c) {
      Object.assign(f, { editId: c.id, name: c.name, contactPerson: c.contactPerson, phone: c.phone, email: c.email, address: c.address, country: c.country, paymentTerms: c.paymentTerms, currency: c.currency, status: c.status, remarks: c.remarks, msg: '', msgTone: 'muted' });
      renderAdminEntry(document.getElementById('tabs'), container);
    }
  });
}

function adminEntryProductBindEvents(container) {
  const f = adminEntryProductForm;
  container.querySelectorAll('[data-prodf]').forEach(el => {
    const handler = () => { f[el.dataset.prodf] = el.value; };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });

  container.querySelector('#prodResetBtn').addEventListener('click', () => {
    Object.assign(f, { editId: null, code: '', name: '', productType: ADMIN_PRODUCT_TYPES[0], category: '', unit: '', spec: '', defaultPrice: '', opening: '', status: 'Active', remarks: '', msg: '', msgTone: 'muted' });
    renderAdminEntry(document.getElementById('tabs'), container);
  });

  container.querySelector('#prodSaveBtn').addEventListener('click', () => {
    if (!f.name.trim()) return adminEntrySetMsg(f, 'prodFormMsg', 'Product name is required.', 'danger');
    const code = f.code.trim() || adminEntryProductNextCode(f.productType);
    const rec = { code, name: f.name.trim(), productType: f.productType, category: f.category.trim(), unit: f.unit.trim(), spec: f.spec.trim(), defaultPrice: coaNum(f.defaultPrice), opening: coaNum(f.opening), status: f.status, remarks: f.remarks.trim() };
    if (f.editId) {
      Object.assign(adminEntryProductFind(f.editId), rec);
      adminEntrySetMsg(f, 'prodFormMsg', 'Product updated.', 'success');
    } else {
      adminProducts.push({ id: adminProducts.reduce((m, p) => Math.max(m, p.id), 0) + 1, ...rec });
      adminEntrySetMsg(f, 'prodFormMsg', 'Product saved.', 'success');
    }
    Object.assign(f, { editId: null, code: '', name: '', productType: ADMIN_PRODUCT_TYPES[0], category: '', unit: '', spec: '', defaultPrice: '', opening: '', status: 'Active', remarks: '' });
    renderAdminEntry(document.getElementById('tabs'), container);
  });

  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => {
    adminEntryProductFilter[key] = e.target.value;
    container.querySelector('#prodResults').innerHTML = adminEntryProductResultsHtml();
    container.querySelector('#prodCounter').textContent = `${adminEntryProductFiltered().length} of ${adminProducts.length} product${adminProducts.length === 1 ? '' : 's'}`;
  });
  bindFilter('prodSearch', 'q', 'input');
  bindFilter('prodTypeFilter', 'type', 'change');
  bindFilter('prodStatusFilter', 'status', 'change');

  container.querySelector('#prodResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-prod-edit]');
    if (!editBtn) return;
    const p = adminEntryProductFind(+editBtn.dataset.prodEdit);
    if (p) {
      Object.assign(f, { editId: p.id, code: p.code, name: p.name, productType: p.productType, category: p.category, unit: p.unit, spec: p.spec, defaultPrice: p.defaultPrice, opening: p.opening, status: p.status, remarks: p.remarks, msg: '', msgTone: 'muted' });
      renderAdminEntry(document.getElementById('tabs'), container);
    }
  });
}

function adminUsersBindEvents(container) {
  const f = adminUserForm;
  container.querySelectorAll('[data-userf]').forEach(el => {

    el.addEventListener('change', handler);

  });

  container.querySelector('#userResetBtn').addEventListener('click', () => {

  container.querySelector('#userSaveBtn').addEventListener('click', () => {
    if (!f.username.trim()) return adminEntrySetMsg(f, 'userFormMsg', 'Username is required.', 'danger');
    if (!f.fullName.trim()) return adminEntrySetMsg(f, 'userFormMsg', 'Full name is required.', 'danger');
    const rec = { username: f.username.trim(), fullName: f.fullName.trim(), email: f.email.trim(), phone: f.phone.trim(), locationId: f.locationId ? +f.locationId : null, roleId: f.roleId ? +f.roleId : null, status: f.status };

    } else {
      adminUsers.push({ id: adminUsers.reduce((m, u) => Math.max(m, u.id), 0) + 1, userNo: adminUserNextNo(), ...rec });
      adminEntrySetMsg(f, 'userFormMsg', 'User saved.', 'success');

    container.querySelector('#userResults').innerHTML = adminUserResultsHtml();

const BARCODE_C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];

function barcodeSvg(value) {
  value = String(value || '');
  if (!value || ![...value].every(c => c.charCodeAt(0) >= 32 && c.charCodeAt(0) <= 126)) {
    return `<p class="text-helper text-danger">Code 128 supports printable ASCII only.</p>`;
  }
  const codes = [104].concat([...value].map(c => c.charCodeAt(0) - 32));
  let sum = 104;
  for (let i = 1; i < codes.length; i++) sum += codes[i] * i;
  codes.push(sum % 103, 106);
  let x = 10, bars = '';
  codes.forEach(code => {
    const p = BARCODE_C128[code];
    for (let i = 0; i < p.length; i++) {
      const w = +p[i] * 2;
      if (i % 2 === 0) bars += `<rect x="${x}" y="8" width="${w}" height="70" fill="#000"/>`;
      x += w;
    }
  });
  return `<svg viewBox="0 0 ${x + 10} 105" width="${Math.min(520, x + 10)}" role="img" aria-label="Code 128 barcode"><rect width="100%" height="100%" fill="#fff"/>${bars}<text x="${x / 2}" y="96" text-anchor="middle" font-family="monospace" font-size="13" fill="#111">${escapeHtml(value)}</text></svg>`;
}

  return `${barcodeConfig.prefix}${String(max + 1).padStart(coaNum(barcodeConfig.length) || 6, '0')}`;
}

  if (!inT || !outT) return 0;
  const [ih, im] = inT.split(':').map(Number), [oh, om] = outT.split(':').map(Number);
  let mins = (oh * 60 + om) - (ih * 60 + im);
  if (mins < 0) mins += 24 * 60;
  return Math.round((mins / 60) * 100) / 100;
}
function hrHours(n) { return `${(n || 0).toFixed(2)} hrs`; }
function hrAttStatusTone(s) { return { Present: 'success', Absent: 'danger', Late: 'warning', 'Half Day': 'warning', Leave: 'info', Holiday: 'info', 'Off Day': 'neutral' }[s] || 'neutral'; }
function hrApprovalTone(a) { return { Pending: 'warning', Approved: 'success', Rejected: 'danger' }[a] || 'neutral'; }

function hrEmpBindEvents(container) {
  container.querySelectorAll('[data-hrempf]').forEach(el => {
    const handler = () => { hrEmpForm[el.dataset.hrempf] = el.value; };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });
  container.querySelector('#hrEmpResetBtn').addEventListener('click', () => { hrEmpResetForm(); renderHREmployee(container); });
  container.querySelector('#hrEmpSaveBtn').addEventListener('click', () => {
    const f = hrEmpForm;
    if (!f.name.trim()) return hrEmpSetMsg('Employee name is required.', 'danger');
    if (!f.joining) return hrEmpSetMsg('Joining date is required.', 'danger');
    const rec = {
      name: f.name.trim(), gender: f.gender, dob: f.dob, phone: f.phone.trim(), email: f.email.trim(), address: f.address.trim(),
      department: f.department, designation: f.designation, joining: f.joining, employmentType: f.employmentType, shift: f.shift,
      basicSalary: coaNum(f.basicSalary), paymentMethod: f.paymentMethod, paymentAccount: f.paymentAccount.trim(),
      emergencyName: f.emergencyName.trim(), emergencyPhone: f.emergencyPhone.trim(), status: f.status, remarks: f.remarks.trim(),
    };
    if (f.editId) {
      Object.assign(hrEmp(f.editId), rec);
      hrEmpResetForm();
      renderHREmployee(container);
      hrEmpSetMsg('Employee updated.', 'success');

      const empNo = hrNextEmpNo();

      hrEmpResetForm();
      renderHREmployee(container);
      hrEmpSetMsg(`Employee ${empNo} saved.`, 'success');
    }
  });
  const bindFilter = (id, key, ev) => container.querySelector('#' + id).addEventListener(ev, (e) => { hrEmpFilter[key] = e.target.value; hrEmpRefreshResults(container); });
  bindFilter('hrEmpSearch', 'q', 'input');
  bindFilter('hrEmpDeptFilter', 'department', 'change');
  bindFilter('hrEmpStatusFilter', 'status', 'change');
  container.querySelector('#hrEmpResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-hremp-edit]');
    if (editBtn) {
      const emp = hrEmp(+editBtn.dataset.hrempEdit);
      if (emp) {
        Object.assign(hrEmpForm, { editId: emp.id, empNo: emp.empNo, name: emp.name, gender: emp.gender, dob: emp.dob, phone: emp.phone, email: emp.email, address: emp.address, department: emp.department, designation: emp.designation, joining: emp.joining, employmentType: emp.employmentType, shift: emp.shift, basicSalary: emp.basicSalary, paymentMethod: emp.paymentMethod, paymentAccount: emp.paymentAccount, emergencyName: emp.emergencyName, emergencyPhone: emp.emergencyPhone, status: emp.status, remarks: emp.remarks, msg: '', msgTone: 'muted' });

    }

      const emp = hrEmp(+toggleBtn.dataset.hrempToggle);
      if (emp) { emp.status = emp.status === 'Active' ? 'Inactive' : 'Active'; hrEmpRefreshResults(container); }
    }
  });
}

function hrAttMonthlySummary() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1;
  const inMonth = (d) => { const dt = new Date(d); return dt.getFullYear() === y && dt.getMonth() + 1 === m; };
  const byEmp = {};
  hrAttendance.filter(a => inMonth(a.date)).forEach(a => {
    byEmp[a.employeeId] = byEmp[a.employeeId] || { present: 0, absent: 0, late: 0, half: 0, leave: 0, working: 0, hours: 0 };
    const s = byEmp[a.employeeId];
    if (!['Holiday', 'Off Day'].includes(a.status)) s.working++;
    if (a.status === 'Present') s.present++;
    else if (a.status === 'Absent') s.absent++;
    else if (a.status === 'Late') s.late++;
    else if (a.status === 'Half Day') s.half++;
    else if (a.status === 'Leave') s.leave++;
    s.hours += hrWorkedHours(a.checkIn, a.checkOut);
  });
  return Object.keys(byEmp).map(id => ({ e: hrEmp(id), s: byEmp[id] })).filter(x => x.e);
}

function hrAttBindEvents(container) {
  const liveFields = ['employeeId', 'status', 'checkIn', 'checkOut'];
  container.querySelectorAll('[data-hrattf]').forEach(el => {
    const update = () => { hrAttForm[el.dataset.hrattf] = el.value; };
    if (liveFields.includes(el.dataset.hrattf)) {
      el.addEventListener('change', () => { update(); renderHRAttendance(container); });
      if (el.type === 'time') el.addEventListener('input', () => { update(); renderHRAttendance(container); });
    } else {

    }
  });
  container.querySelector('#hrAttResetBtn').addEventListener('click', () => { hrAttResetForm(); renderHRAttendance(container); });
  container.querySelector('#hrAttSaveBtn').addEventListener('click', () => {

    if (f.status === 'Leave' && !f.leaveType) return hrAttSetMsg('Select a leave type.', 'danger');
    const dup = hrAttendance.find(a => a.employeeId === +f.employeeId && a.date === f.date && a.id !== f.editId);
    if (dup) return hrAttSetMsg('An attendance record already exists for this employee on this date.', 'danger');
    const rec = { date: f.date, employeeId: +f.employeeId, status: f.status, leaveType: f.status === 'Leave' ? f.leaveType : '', checkIn: f.checkIn, checkOut: f.checkOut, remarks: f.remarks.trim() };

    } else {
      hrAttendance.push({ id: hrAttendance.reduce((m, a) => Math.max(m, a.id), 0) + 1, ...rec });

    renderHRAttendance(container);

  bindFilter('hrAttSearch', 'q', 'input');

  container.querySelector('#hrAttResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-hratt-edit]');

      const a = hrAttendance.find(x => x.id === +editBtn.dataset.hrattEdit);
      if (a) { Object.assign(hrAttForm, { editId: a.id, date: a.date, employeeId: String(a.employeeId), status: a.status, leaveType: a.leaveType || '', checkIn: a.checkIn, checkOut: a.checkOut, remarks: a.remarks, msg: '', msgTone: 'muted' }); renderHRAttendance(container); }

      if (idx > -1) { hrAttendance.splice(idx, 1); renderHRAttendance(container); }

  });
}

// ---------- HR: Payroll Processing ----------
const hrPayForm = { year: String(new Date().getFullYear()), month: String(new Date().getMonth() + 1) };
function hrMonthKey(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }
function hrApprovedOT(empId, y, m) {
  const period = hrMonthKey(y, m);
  return hrOvertime.filter(o => o.employeeId === +empId && o.approval === 'Approved' && o.date.startsWith(period))
    .reduce((acc, o) => ({ hours: acc.hours + o.hours, amount: acc.amount + o.hours * o.rate }), { hours: 0, amount: 0 });
}
function hrApprovedBonus(empId, y, m) {
  const period = hrMonthKey(y, m);
  return hrBonuses.filter(b => b.employeeId === +empId && b.approval === 'Approved' && b.date.startsWith(period)).reduce((s, b) => s + b.amount, 0);
}
function hrPayFor(empId, period) { return hrPayrolls.find(p => p.employeeId === +empId && p.period === period) || null; }
function hrCalcPayroll(emp, y, m, existingDeduction) {
  const ot = hrApprovedOT(emp.id, y, m), bonus = hrApprovedBonus(emp.id, y, m), basic = coaNum(emp.basicSalary);
  const gross = basic + ot.amount + bonus, deduction = existingDeduction || 0;
  return { basic, otHours: ot.hours, overtime: ot.amount, bonus, gross, deduction, net: gross - deduction };
}
function hrPayLoadEmployees() {
  const y = +hrPayForm.year, m = +hrPayForm.month, period = hrMonthKey(y, m);
  hrActiveEmployees().forEach(emp => {
    if (hrPayFor(emp.id, period)) return;
    const c = hrCalcPayroll(emp, y, m, 0);
    hrPayrolls.push({
      id: hrPayrolls.reduce((mx, p) => Math.max(mx, p.id), 0) + 1, payrollNo: hrNextNo('PAY', hrPayrolls, 'payrollNo'),
      employeeId: emp.id, period, year: y, month: m, basic: c.basic, otHours: c.otHours, overtime: c.overtime,
      bonus: c.bonus, gross: c.gross, deduction: 0, net: c.net, status: 'Draft', paymentStatus: 'Unpaid',
    });
  });
}
function hrPayRecalc() {
  const y = +hrPayForm.year, m = +hrPayForm.month, period = hrMonthKey(y, m);
  hrPayrolls.filter(p => p.period === period && p.status !== 'Paid').forEach(p => {
    const emp = hrEmp(p.employeeId); if (!emp) return;
    const c = hrCalcPayroll(emp, y, m, p.deduction);
    Object.assign(p, { basic: c.basic, otHours: c.otHours, overtime: c.overtime, bonus: c.bonus, gross: c.gross, net: c.net });
  });
}
function hrPayRows() { return hrPayrolls.filter(p => p.period === hrMonthKey(+hrPayForm.year, +hrPayForm.month)); }
function hrPayPeriodStatus() {
  const rows = hrPayRows();
  if (!rows.length) return 'Draft';
  if (rows.every(r => r.status === 'Paid')) return 'Paid';
  if (rows.some(r => r.status === 'Finalized')) return 'Finalized';
  return 'Draft';
}

        ${coaField('Payroll Year', `<input id="hrPayYear" type="number" min="2000" max="2100" value="${escapeHtml(hrPayForm.year)}" class="${COA_INPUT} tabular" />`)}
      </div>
      <div class="flex flex-wrap items-center gap-2">

        <button type="button" id="hrPayPaidBtn" class="${COA_BTN}">Mark as Paid</button>
      </div>
    </section>`;

function hrPayResultsHtml() {
  const headers = ['Employee', 'Department', 'Basic', 'Overtime', 'Bonus', 'Gross', 'Deduction', 'Net', 'Status', 'Payment'];
  const rows = hrPayRows();
  const body = rows.length
    ? rows.map(p => { const e = hrEmp(p.employeeId); return `
      <tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">
